          text: |
            **Solve Sales Tax Applications**

            In the following exercises, find ⓐ the sales tax and ⓑ the total cost.

            The cost of a pair of boots was $\text{\textdollar 84}.$ The sales tax rate is $\text{5\%}$ of the purchase price.

            The cost of a refrigerator was $\text{\textdollar 1,242}.$ The sales tax rate is $\text{8\%}$ of the purchase price.

            The cost of a microwave oven was $\text{\textdollar 129}.$ The sales tax rate is $\text{7.5\%}$ of the purchase price.

            The cost of a tablet computer is $\text{\textdollar 350}.$ The sales tax rate is $\text{8.5\%}$ of the purchase price.

            The cost of a file cabinet is $\text{\textdollar 250}.$ The sales tax rate is $\text{6.85\%}$ of the purchase price.

            The cost of a luggage set $\text{\textdollar 400}.$ The sales tax rate is $\text{5.75\%}$ of the purchase price.

            The cost of a $\text{6 -drawer}$ dresser $\text{\textdollar 1,199}.$ The sales tax rate is $\text{5.125\%}$ of the purchase price.

            The cost of a sofa is $\text{\textdollar 1,350}.$ The sales tax rate is $\text{4.225\%}$ of the purchase price.

            In the following exercises, find the sales tax rate.

            Shawna bought a mixer for $\text{\textdollar 300}.$ The sales tax on the purchase was $\text{\textdollar 19.50}.$

            Orphia bought a coffee table for $\text{\textdollar 400}.$ The sales tax on the purchase was $\text{\textdollar 38}.$

            Bopha bought a bedroom set for $\text{\textdollar 3,600}.$ The sales tax on the purchase was $\text{\textdollar 246.60}.$

            Ruth bought a washer and dryer set for $\text{\textdollar 2,100}.$ The sales tax on the purchase was $\text{\textdollar 152.25}.$

            **Solve Commission Applications**

            In the following exercises, find the commission.

            Christopher sold his dinette set for $\text{\textdollar 225}$ through an online site, which charged him $\text{9\%}$ of the selling price as commission. How much was the commission?

            Michele rented a booth at a craft fair, which charged her $\text{8\%}$ commission on her sales. One day her total sales were $\text{\textdollar 193}.$ How much was the commission?

            Farrah works in a jewelry store and receives $\text{12\%}$ commission when she makes a sale. How much commission will she receive for selling a $\text{\textdollar 8,125}$ ring?

            Jamal works at a car dealership and receives $\text{9\%}$ commission when he sells a car. How much commission will he receive for selling a $\text{\textdollar 32,575}$ car?

            Hector receives $\text{17.5\%}$ commission when he sells an insurance policy. How much commission will he receive for selling a policy for $\text{\textdollar 4,910}?$

            Denise receives $\text{10.5\%}$ commission when she books a tour at the travel agency. How much commission will she receive for booking a tour with total cost $\text{\textdollar 7,420}?$

            In the following exercises, find the rate of commission.

            Dontay is a realtor and earned $\text{\textdollar 11,250}$ commission on the sale of a $\text{\textdollar 375,000}$ house. What is his rate of commission?

            Nevaeh is a cruise specialist and earned $\text{\textdollar 364}$ commission after booking a cruise that cost $\text{\textdollar 5,200}.$ What is her rate of commission?

            As a waitress, Emily earned $\text{\textdollar 420}$ in tips on sales of $\text{\textdollar 2,625}$ last Saturday night. What was her rate of commission?

            Alejandra earned $\text{\textdollar 1,393.74}$ commission on weekly sales of $\text{\textdollar 15,486}$ as a salesperson at the computer store. What is her rate of commission?

            Maureen earned $\text{\textdollar 7,052.50}$ commission when she sold a $\text{\textdollar 45,500}$ car. What was the rate of commission?

            Lucas earned $\text{\textdollar 4,487.50}$ commission when he brought a $\text{\textdollar 35,900}$ job to his office. What was the rate of commission?

            **Solve Discount Applications**

            In the following exercises, find the sale price.

            Perla bought a cellphone that was on sale for $\text{\textdollar 50}$ off. The original price of the cellphone was $\text{\textdollar 189}.$

            Sophie saw a dress she liked on sale for $\text{\textdollar 15}$ off. The original price of the dress was $\text{\textdollar 96}.$

            Rick wants to buy a tool set with original price $\text{\textdollar 165}.$ Next week the tool set will be on sale for $\text{40\%}$ off.

            Angelo's store is having a sale on TV sets. One set, with an original price of $\text{\textdollar 859},$ is selling for $\text{\textdollar 125}$ off.

            In the following exercises, find ⓐ the amount of discount and ⓑ the sale price.

            Janelle bought a beach chair on sale at $\text{60\%}$ off. The original price was $\text{\textdollar 44.95}$

            Errol bought a skateboard helmet on sale at $\text{40\%}$ off. The original price was $\text{\textdollar 49.95}.$

            Kathy wants to buy a camera that lists for $\text{\textdollar 389}.$ The camera is on sale with a $\text{33\%}$ discount.

            Colleen bought a suit that was discounted $\text{25\%}$ from an original price of $\text{\textdollar 245}.$

            Erys bought a treadmill on sale at $\text{35\%}$ off. The original price was $\text{\textdollar 949.95}.$

            Jay bought a guitar on sale at $\text{45\%}$ off. The original price was $\text{\textdollar 514.75}.$

            In the following exercises, find ⓐ the amount of discount and ⓑ the discount rate. (Round to the nearest tenth of a percent if needed.)

            Larry and Donna bought a sofa at the sale price of $\text{\textdollar 1,344}.$ The original price of the sofa was $\text{\textdollar 1,920}.$

            Hiroshi bought a lawnmower at the sale price of $\text{\textdollar 240}.$ The original price of the lawnmower is $\text{\textdollar 300}.$

            Patty bought a baby stroller on sale for $\text{\textdollar 301.75}.$ The original price of the stroller was $\text{\textdollar 355.}$

            Bill found a book he wanted on sale for $\text{\textdollar 20.80}.$ The original price of the book was $\text{\textdollar 32}.$

            Nikki bought a patio set on sale for $\text{\textdollar 480}.$ The original price was $\text{\textdollar 850}.$

            Stella bought a dinette set on sale for $\text{\textdollar 725}.$ The original price was $\text{\textdollar 1,299}.$

            **Solve Mark-up Applications**

            In the following exercises, find ⓐ the amount of the mark-up and ⓑ the list price.

            Daria bought a bracelet at wholesale cost $\text{\textdollar 16}$ to sell in her handicraft store. She marked the price up $\text{45\%}.$

            Regina bought a handmade quilt at wholesale cost $\text{\textdollar 120}$ to sell in her quilt store. She marked the price up $\text{55\%}.$

            Tom paid $\text{\textdollar 0.60}$ a pound for tomatoes to sell at his produce store. He added a $\text{33\%}$ mark-up.

            Flora paid her supplier $\text{\textdollar 0.74}$ a stem for roses to sell at her flower shop. She added an $\text{85\%}$ mark-up.

            Alan bought a used bicycle for $\text{\textdollar 115}.$ After re-conditioning it, he added $\text{225\%}$ mark-up and then advertised it for sale.

            Michael bought a classic car for $\text{\textdollar 8,500}.$ He restored it, then added $\text{150\%}$ mark-up before advertising it for sale.

            **Coupons** Yvonne can use two coupons for the same purchase at her favorite department store. One coupon gives her $\text{\textdollar 20}$ off and the other gives her $\text{25\%}$ off. She wants to buy a bedspread that sells for $\text{\textdollar 195}.$

            - ⓐ Calculate the discount price if Yvonne uses the $\text{\textdollar 20}$ coupon first and then takes $\text{25\%}$ off.
            - ⓑ Calculate the discount price if Yvonne uses the $\text{25\%}$ off coupon first and then uses the $\text{20\%}$ coupon.
            - ⓒ In which order should Yvonne use the coupons?

            **Cash Back** Jason can buy a bag of dog food for $\text{\textdollar 35}$ at two different stores. One store offers $\text{6\%}$ cash back on the purchase plus $\text{\textdollar 5}$ off his next purchase. The other store offers $\text{20\%}$ cash back.

            - ⓐ Calculate the total savings from the first store, including the savings on the next purchase.
            - ⓑ Calculate the total savings from the second store.
            - ⓒ Which store should Jason buy the dog food from? Why?

            Priam bought a jacket that was on sale for $\text{40\%}$ off. The original price of the jacket was $\text{\textdollar 150}.$ While the sales clerk figured the price by calculating the amount of discount and then subtracting that amount from $\text{\textdollar 150},$ Priam found the price faster by calculating $\text{60\%}$ of $\text{\textdollar 150}.$

            - ⓐ Explain why Priam was correct.
            - ⓑ Will Priam's method work for any original price?

            Roxy bought a scarf on sale for $\text{50\%}$ off. The original price of the scarf was $\text{\textdollar 32.90}.$ Roxy claimed that the price she paid for the scarf was the same as the amount she saved. Was Roxy correct? Explain.

            ⓐ After completing the exercises, use this checklist to evaluate your mastery of the objectives of this section.

