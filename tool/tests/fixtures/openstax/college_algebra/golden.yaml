        block_type: markdown
        content:
          text: |
            ### In this section, you will:

            - Evaluate square roots.
            - Use the product rule to simplify square roots.
            - Use the quotient rule to simplify square roots.
            - Add and subtract square roots.
            - Rationalize denominators.
            - Use rational roots.
      - sort_order: 2
        block_type: markdown
        content:
          text: |
            A hardware store sells 16-ft ladders and 24-ft ladders. A window is located 12 feet above the ground. A ladder needs to be purchased that will reach the window from a point on the ground 5 feet from the building. To find out the length of ladder needed, we can draw a right triangle as shown in Figure 1, and use the Pythagorean Theorem.

            _(Figure in the original section.)_

            $$\begin{array}{lll}a^2+b^2 & = & c^2 \\ 5^2+{12}^2 & = & c^2 \\ 169 & = & c^2\end{array}$$

            Now, we need to find out the length that, when squared, is 169, to determine which ladder to choose. In other words, we need to find a square root. In this section, we will investigate methods of finding solutions to problems such as this one.
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Evaluating Square Roots

            When the square root of a number is squared, the result is the original number. Since $\;4^2=16,$ the square root of $\;16\;$ is $\;4.\;$ The square root function is the inverse of the squaring function just as subtraction is the inverse of addition. To undo squaring, we take the square root.

            In general terms, if $\;a\;$ is a positive real number, then the square root of $\;a\;$ is a number that, when multiplied by itself, gives $\;a.\;$ The square root could be positive or negative because multiplying two negative numbers gives a positive number. The **principal square root** is the nonnegative number that when multiplied by itself equals $\;a.\;$ The square root obtained using a calculator is the principal square root.

            The principal square root of $\;a\;$ is written as $\;\sqrt{a}.\;$ The symbol is called a **radical**, the term under the symbol is called the **radicand**, and the entire expression is called a **radical expression**.
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: Principal Square Root
          body: 'The **principal square root** of $\;a\;$ is the nonnegative number that, when multiplied by itself, equals $\;a.\;$ It is written as a **radical expression****,** with a symbol called a **radical** over the term called the **radicand**: $\;\sqrt{a}.$'
      - sort_order: 5
        block_type: callout
        content:
          type: key_concept
          title: Q&A
          body: |
            **Does** $\;\sqrt{25}=\pm 5?$

            *No. Although both* $\;5^2\;$ *and* $\;{(-5)}^2\;$ *are* $\;25,$ *the radical symbol implies only a nonnegative root, the principal square root. The principal square root of 25 is* $\;\sqrt{25}=5.$
      - sort_order: 6
        block_type: markdown
        content:
          text: |
            **Example 1: Evaluating Square Roots**

            Evaluate each expression.

            - ⓐ $\sqrt{100}$
            - ⓑ $\sqrt{\sqrt{16}}$
            - ⓒ $\sqrt{25+144}$
            - ⓓ $\sqrt{49}-\sqrt{81}$

            **Solution**

            - ⓐ $\sqrt{100}=10$ because ${10}^2=100$
            - ⓑ $\sqrt{\sqrt{16}}=\sqrt{4}=2$ because $4^2=16$ and $2^2=4$
            - ⓒ $\sqrt{25+144}=\sqrt{169}=13$ because ${13}^2=169$
            - ⓓ $\sqrt{49}-\sqrt{81}=7-9=-2$ because $7^2=49$ and $9^2=81$
      - sort_order: 7
        block_type: callout
        content:
          type: key_concept
          title: Q&A
          body: |
            **For $\;\sqrt{25+144},$ can we find the square roots before adding?**

            *No.* $\;\sqrt{25}+\sqrt{144}=5+12=17.\;$ *This is not equivalent to* $\;\sqrt{25+144}=13.\;$ *The order of operations requires us to add the terms in the radicand before finding the square root.*
      - sort_order: 8
        block_type: practice_prompt
        content:
          prompt: |
            Evaluate each expression.

            - ⓐ $\sqrt{225}$
            - ⓑ $\sqrt{\sqrt{81}}$
            - ⓒ $\sqrt{25-9}$
            - ⓓ $\sqrt{36}+\sqrt{121}$
          answer: |
            - ⓐ $15$
            - ⓑ $3$
            - ⓒ $4$
            - ⓓ $17$
          explanation: Answer from the book's answer key.
      - sort_order: 9
        block_type: markdown
        content:
          text: |
            ### Using the Product Rule to Simplify Square Roots

            To simplify a square root, we rewrite it such that there are no perfect squares in the radicand. There are several properties of square roots that allow us to simplify complicated radical expressions. The first rule we will look at is the *product rule for simplifying square roots,* which allows us to separate the square root of a product of two numbers into the product of two separate rational expressions. For instance, we can rewrite $\;\sqrt{15}\;$ as $\;\sqrt{3}\cdot \sqrt{5}.\;$ We can also use the product rule to express the product of multiple radical expressions as a single radical expression.
      - sort_order: 10
        block_type: callout
        content:
          type: key_concept
          title: The Product Rule for Simplifying Square Roots
          body: |
            If $\;a\;$ and $\;b\;$ are nonnegative, the square root of the product $\;ab\;$ is equal to the product of the square roots of $\;a\;$ and $\;b.\;$

            $$\sqrt{ab}=\sqrt{a}\cdot \sqrt{b}$$
      - sort_order: 11
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given a square root radical expression, use the product rule to simplify it.**

            - Factor any perfect squares from the radicand.
            - Write the radical expression as a product of radical expressions.
            - Simplify.
      - sort_order: 12
        block_type: markdown
        content:
          text: "**Example 2: Using the Product Rule to Simplify Square Roots**\n\nSimplify the radical expression.\n\n- ⓐ $\\sqrt{300}$\n- ⓑ $\\sqrt{162a^5b^4}$\n\n**Solution**\n\n- ⓐ  \n $\\begin{array}{ll}\\sqrt{100\\cdot 3} & \\;\\text{Factor perfect square from radicand}. \\\\ \\sqrt{100}\\cdot \\sqrt{3} & \\;\\text{Write radical expression as product of radical expressions}. \\\\ 10\\sqrt{3} & \\;\\text{Simplify}.\\end{array}$\n- ⓑ  \n $\\begin{array}{ll}\\sqrt{81a^4b^4\\cdot 2a} & \\;\\text{Factor perfect square from radicand}. \\\\ \\sqrt{81a^4b^4}\\cdot \\sqrt{2a} & \\;\\text{Write radical expression as product of radical expressions}. \\\\ 9a^2b^2\\sqrt{2a} & \\;\\text{Simplify}.\\end{array}$\n"
      - sort_order: 13
        block_type: practice_prompt
        content:
          prompt: Simplify $\;\sqrt{50x^2y^3z}.$
          answer: $5|x||y|\sqrt{2yz}.\;$ Notice the absolute value signs around *x* and *y*? That’s because their value must be positive!
          explanation: Answer from the book's answer key.
      - sort_order: 14
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given the product of multiple radical expressions, use the product rule to combine them into one radical expression.**

            - Express the product of multiple radical expressions as a single radical expression.
            - Simplify.
      - sort_order: 15
        block_type: markdown
        content:
          text: "**Example 3: Using the Product Rule to Simplify the Product of Multiple Square Roots**\n\nSimplify the radical expression.  \n $\\sqrt{12}\\cdot \\sqrt{3}$\n\n**Solution**\n\n$\\begin{array}{ll}\\sqrt{12\\cdot 3} & \\;\\text{Express the product as a single radical expression}. \\\\ \\sqrt{36} & \\;\\text{Simplify}. \\\\ 6 & \\end{array}$\n"
      - sort_order: 16
        block_type: practice_prompt
        content:
          prompt: Simplify $\;\sqrt{50x}\cdot \sqrt{2x}\;$ assuming $\;x>0.$
          answer: $10|x|$
          explanation: Answer from the book's answer key.
      - sort_order: 17
        block_type: markdown
        content:
          text: |
            ### Using the Quotient Rule to Simplify Square Roots

            Just as we can rewrite the square root of a product as a product of square roots, so too can we rewrite the square root of a quotient as a quotient of square roots, using the *quotient rule for simplifying square roots.* It can be helpful to separate the numerator and denominator of a fraction under a radical so that we can take their square roots separately. We can rewrite $\;\sqrt{\frac{5}{2}}\;$ as $\;\frac{\sqrt{5}}{\sqrt{2}}.$
      - sort_order: 18
        block_type: callout
        content:
          type: key_concept
          title: The Quotient Rule for Simplifying Square Roots
          body: |
            The square root of the quotient $\;\frac{a}{b}\;$ is equal to the quotient of the square roots of $\;a\;$ and $\;b,$ where $\;b\ne 0.$

            $$\sqrt{\frac{a}{b}}=\frac{\sqrt{a}}{\sqrt{b}}$$
      - sort_order: 19
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given a radical expression, use the quotient rule to simplify it.**

            - Write the radical expression as the quotient of two radical expressions.
            - Simplify the numerator and denominator.
      - sort_order: 20
        block_type: markdown
        content:
          text: |
            **Example 4: Using the Quotient Rule to Simplify Square Roots**

            Simplify the radical expression.

            $\sqrt{\frac{5}{36}}$

            **Solution**

            $\begin{array}{ll}\frac{\sqrt{5}}{\sqrt{36}} & \;\text{Write as quotient of two radical expressions}. \\ \frac{\sqrt{5}}{6} & \;\text{Simplify denominator}.\end{array}$
      - sort_order: 21
        block_type: practice_prompt
        content:
          prompt: Simplify $\;\sqrt{\frac{2x^2}{9y^4}}.$
          answer: $\frac{x\sqrt{2}}{3y^2}.\;$ We do not need the absolute value signs for $\;y^2\;$ because that term will always be nonnegative.
          explanation: Answer from the book's answer key.
      - sort_order: 22
        block_type: markdown
        content:
          text: |
            **Example 5: Using the Quotient Rule to Simplify an Expression with Two Square Roots**

            Simplify the radical expression.

            $\frac{\sqrt{234x^{11}y}}{\sqrt{26x^7y}}$

            **Solution**

            $\begin{array}{ll}\sqrt{\frac{234x^{11}y}{26x^7y}} & \;\text{Combine numerator and denominator into one radical expression}. \\ \sqrt{9x^4} & \;\text{Simplify fraction}. \\ 3x^2\; & \;\text{Simplify square root}.\end{array}$
      - sort_order: 23
        block_type: practice_prompt
        content:
          prompt: Simplify $\;\frac{\sqrt{9a^5b^{14}}}{\sqrt{3a^4b^5}}.$
          answer: $b^4\sqrt{3ab}$
          explanation: Answer from the book's answer key.
      - sort_order: 24
        block_type: markdown
        content:
          text: |
            ### Adding and Subtracting Square Roots

            We can add or subtract radical expressions only when they have the same radicand and when they have the same radical type such as square roots. For example, the sum of $\;\sqrt{2}\;$ and $\;3\sqrt{2}\;$ is $\;4\sqrt{2}.\;$ However, it is often possible to simplify radical expressions, and that may change the radicand. The radical expression $\;\sqrt{18}\;$ can be written with a $\;2\;$ in the radicand, as $\;3\sqrt{2},$ so $\;\sqrt{2}+\sqrt{18}=\sqrt{2}+3\sqrt{2}=4\sqrt{2}.$
      - sort_order: 25
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given a radical expression requiring addition or subtraction of square roots, simplify.**

            - Simplify each radical expression.
            - Add or subtract expressions with equal radicands.
      - sort_order: 26
        block_type: markdown
        content:
          text: |
            **Example 6: Adding Square Roots**

            Add $\;5\sqrt{12}+2\sqrt{3}.$

            **Solution**

            We can rewrite $\;5\sqrt{12}\;$ as $\;5\sqrt{4\cdot 3}.\;$ According the product rule, this becomes $\;5\sqrt{4}\sqrt{3}.\;$ The square root of $\;\sqrt{4}\;$ is 2, so the expression becomes $\;5(2)\sqrt{3},$ which is $\;10\sqrt{3}.\;$ Now the terms have the same radicand so we can add.

            $10\sqrt{3}+2\sqrt{3}=12\sqrt{3}$
      - sort_order: 27
        block_type: practice_prompt
        content:
          prompt: Add $\;\sqrt{5}+6\sqrt{20}.$
          answer: $13\sqrt{5}$
          explanation: Answer from the book's answer key.
      - sort_order: 28
        block_type: markdown
        content:
          text: |
            **Example 7: Subtracting Square Roots**

            Subtract $\;20\sqrt{72a^3b^4c}\;-14\sqrt{8a^3b^4c}.$

            **Solution**

            Rewrite each term so they have equal radicands.

            $$\begin{array}{lll}20\sqrt{72a^3b^4c} & = & 20\sqrt{9}\sqrt{4}\sqrt{2}\sqrt{a}\sqrt{a^2}\sqrt{{(b^2)}^2}\sqrt{c} \\ & = & 20(3)(2)|a|b^2\sqrt{2ac} \\ & = & 120|a|b^2\sqrt{2ac}\end{array}$$

            $$\begin{array}{lll}14\sqrt{8a^3b^4c} & = & 14\sqrt{2}\sqrt{4}\sqrt{a}\sqrt{a^2}\sqrt{{(b^2)}^2}\sqrt{c} \\ & = & 14(2)|a|b^2\sqrt{2ac} \\ & = & 28|a|b^2\sqrt{2ac}\end{array}$$

            Now the terms have the same radicand so we can subtract.

            $$120|a|b^2\sqrt{2ac}-28|a|b^2\sqrt{2ac}=92|a|b^2\sqrt{2ac}$$
      - sort_order: 29
        block_type: practice_prompt
        content:
          prompt: Subtract $\;3\sqrt{80x}\;-4\sqrt{45x}.$
          answer: $0$
          explanation: Answer from the book's answer key.
      - sort_order: 30
        block_type: markdown
        content:
          text: |
            ### Rationalizing Denominators

            When an expression involving square root radicals is written in simplest form, it will not contain a radical in the denominator. We can remove radicals from the denominators of fractions using a process called *rationalizing the denominator*.

            We know that multiplying by 1 does not change the value of an expression. We use this property of multiplication to change expressions that contain radicals in the denominator. To remove radicals from the denominators of fractions, multiply by the form of 1 that will eliminate the radical.

            For a denominator containing a single term, multiply by the radical in the denominator over itself. In other words, if the denominator is $\;b\sqrt{c},$ multiply by $\;\frac{\sqrt{c}}{\sqrt{c}}.$

            For a denominator containing the sum or difference of a rational and an irrational term, multiply the numerator and denominator by the conjugate of the denominator, which is found by changing the sign of the radical portion of the denominator. If the denominator is $\;a+b\sqrt{c},$ then the conjugate is $\;a-b\sqrt{c}.$
      - sort_order: 31
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given an expression with a single square root radical term in the denominator, rationalize the denominator.**

            - Multiply the numerator and denominator by the radical in the denominator.
            - Simplify.
      - sort_order: 32
        block_type: markdown
        content:
          text: |
            **Example 8: Rationalizing a Denominator Containing a Single Term**

            Write $\;\frac{2\sqrt{3}}{3\sqrt{10}}\;$ in simplest form.

            **Solution**

            The radical in the denominator is $\;\sqrt{10}.\;$ So multiply the fraction by $\;\frac{\sqrt{10}}{\sqrt{10}}.\;$ Then simplify.

            $$\begin{array}{l}\frac{2\sqrt{3}}{3\sqrt{10}}\cdot \frac{\sqrt{10}}{\sqrt{10}}\; \\ \frac{2\sqrt{30}}{30}\; \\ \frac{\sqrt{30}}{15}\end{array}$$
      - sort_order: 33
        block_type: practice_prompt
        content:
          prompt: Write $\;\frac{12\sqrt{3}}{\sqrt{2}}\;$ in simplest form.
          answer: $6\sqrt{6}$
          explanation: Answer from the book's answer key.
      - sort_order: 34
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given an expression with a radical term and a constant in the denominator, rationalize the denominator.**

            - Find the conjugate of the denominator.
            - Multiply the numerator and denominator by the conjugate.
            - Use the distributive property.
            - Simplify.
      - sort_order: 35
        block_type: markdown
        content:
          text: |
            **Example 9: Rationalizing a Denominator Containing Two Terms**

            Write $\;\frac{4}{1+\sqrt{5}}\;$ in simplest form.

            **Solution**

            Begin by finding the conjugate of the denominator by writing the denominator and changing the sign. So the conjugate of $\;1+\sqrt{5}\;$ is $\;1-\sqrt{5}.\;$ Then multiply the fraction by $\;\frac{1-\sqrt{5}}{1-\sqrt{5}}.$

            $$\begin{array}{ll}\frac{4}{1+\sqrt{5}}\cdot \frac{1-\sqrt{5}}{1-\sqrt{5}} & \\ \frac{4-4\sqrt{5}}{-4} & \;\text{Use the distributive property}. \\ \sqrt{5}-1 & \;\text{Simplify}.\end{array}$$
      - sort_order: 36
        block_type: practice_prompt
        content:
          prompt: Write $\;\frac{7}{2+\sqrt{3}}\;$ in simplest form.
          answer: $14-7\sqrt{3}$
          explanation: Answer from the book's answer key.
      - sort_order: 37
        block_type: markdown
        content:
          text: |
            ### Using Rational Roots

            Although square roots are the most common rational roots, we can also find cube roots, 4th roots, 5th roots, and more. Just as the square root function is the inverse of the squaring function, these roots are the inverse of their respective power functions. These functions can be useful when we need to determine the number that, when raised to a certain power, gives a certain number.
      - sort_order: 38
        block_type: markdown
        content:
          text: |
            ### Understanding nth Roots

            Suppose we know that $\;a^3=8.\;$ We want to find what number raised to the 3rd power is equal to 8. Since $\;2^3=8,$ we say that 2 is the cube root of 8.

            The *n*th root of $\;a\;$ is a number that, when raised to the *n*th power, gives $\;a.\;$ For example, $\;-3\;$ is the 5th root of $\;-243\;$ because $\;{(-3)}^5=-243.\;$ If $\;a\;$ is a real number with at least one *n*th root, then the **principal *n*th root** of $\;a\;$ is the number with the same sign as $\;a\;$ that, when raised to the *n*th power, equals $\;a.$

            The principal *n*th root of $\;a\;$ is written as $\;\sqrt[n]{a},$ where $\;n\;$ is a positive integer greater than or equal to 2. In the radical expression, $\;n\;$ is called the **index** of the radical.
      - sort_order: 39
        block_type: callout
        content:
          type: key_concept
          title: Principal n n th Root
          body: If $\;a\;$ is a real number with at least one *n*th root, then the **principal *n*th root** of $\;a,$ written as $\;\sqrt[n]{a},$ is the number with the same sign as $\;a\;$ that, when raised to the *n*th power, equals $\;a.\;$ The **index** of the radical is $\;n.$
      - sort_order: 40
        block_type: markdown
        content:
          text: |
            **Example 10: Simplifying nth Roots**

            Simplify each of the following:

            - ⓐ $\sqrt[5]{-32}$
            - ⓑ $\sqrt[4]{4}\cdot \sqrt[4]{1,024}$
            - ⓒ $-\sqrt[3]{\frac{8x^6}{125}}$
            - ⓓ $8\sqrt[4]{3}-\sqrt[4]{48}$

            **Solution**

            - ⓐ $\sqrt[5]{-32}=-2\;$ because $\;{(-2)}^5=-32$
            - ⓑFirst, express the product as a single radical expression. $\;\sqrt[4]{4,096}=8\;$ because $\;8^4=4,096$
            - ⓒ $\begin{array}{ll}\frac{-\sqrt[3]{8x^6}}{\sqrt[3]{125}} & \;\text{Write as quotient of two radical expressions}. \\ \frac{-2x^2}{5} & \;\text{Simplify}.\end{array}$
            - ⓓ $\begin{array}{ll}8\sqrt[4]{3}-2\sqrt[4]{3} & \;\text{Simplify to get equal radicands}. \\ 6\sqrt[4]{3} & \;\text{Add}.\end{array}$
      - sort_order: 41
        block_type: practice_prompt
        content:
          prompt: |
            Simplify.

            - ⓐ $\sqrt[3]{-216}$
            - ⓑ $\frac{3\sqrt[4]{80}}{\sqrt[4]{5}}$
            - ⓒ $6\sqrt[3]{9,000}+7\sqrt[3]{576}$
          answer: |
            - ⓐ $-6$
            - ⓑ $6$
            - ⓒ $88\sqrt[3]{9}$
          explanation: Answer from the book's answer key.
      - sort_order: 42
        block_type: markdown
        content:
          text: |
            ### Using Rational Exponents

            **Radical expressions** can also be written without using the radical symbol. We can use rational (fractional) exponents. The index must be a positive integer. If the index $\;n\;$ is even, then $\;a\;$ cannot be negative.

            $$a^{\frac{1}{n}}=\sqrt[n]{a}$$

            We can also have rational exponents with numerators other than 1. In these cases, the exponent must be a fraction in lowest terms. We raise the base to a power and take an *n*th root. The numerator tells us the power and the denominator tells us the root.

            $$a^{\frac{m}{n}}={(\sqrt[n]{a})}^m=\sqrt[n]{a^m}$$

            All of the properties of exponents that we learned for integer exponents also hold for rational exponents.
      - sort_order: 43
        block_type: callout
        content:
          type: key_concept
          title: Rational Exponents
          body: |
            Rational exponents are another way to express principal *n*th roots. The general form for converting between a radical expression with a radical symbol and one with a rational exponent is

            $$a^{\frac{m}{n}}={(\sqrt[n]{a})}^m=\sqrt[n]{a^m}$$
      - sort_order: 44
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given an expression with a rational exponent, write the expression as a radical.**

            - Determine the power by looking at the numerator of the exponent.
            - Determine the root by looking at the denominator of the exponent.
            - Using the base as the radicand, raise the radicand to the power and use the root as the index.
      - sort_order: 45
        block_type: markdown
        content:
          text: |
            **Example 11: Writing Rational Exponents as Radicals**

            Write $\;{343}^{\frac{2}{3}}\;$ as a radical. Simplify.

            **Solution**

            The 2 tells us the power and the 3 tells us the root.

            ${343}^{\frac{2}{3}}={(\sqrt[3]{343})}^2=\sqrt[3]{{343}^2}$

            We know that $\;\sqrt[3]{343}=7\;$ because $\;7^3=343.\;$ Because the cube root is easy to find, it is easiest to find the cube root before squaring for this problem. In general, it is easier to find the root first and then raise it to a power.

            ${343}^{\frac{2}{3}}={(\sqrt[3]{343})}^2=7^2=49$
      - sort_order: 46
        block_type: practice_prompt
        content:
          prompt: Write $\;9^{\frac{5}{2}}\;$ as a radical. Simplify.
          answer: ${(\sqrt{9})}^5=3^5=243$
          explanation: Answer from the book's answer key.
      - sort_order: 47
        block_type: markdown
        content:
          text: |
            **Example 12: Writing Radicals as Rational Exponents**

            Write $\;\frac{4}{\sqrt[7]{a^2}}\;$ using a rational exponent.

            **Solution**

            The power is 2 and the root is 7, so the rational exponent will be $\;\frac{2}{7}.\;$ We get $\;\frac{4}{a^{\frac{2}{7}}}.\;$ Using properties of exponents, we get $\;\frac{4}{\sqrt[7]{a^2}}=4a^{\frac{-2}{7}}.$
      - sort_order: 48
        block_type: practice_prompt
        content:
          prompt: Write $\;x\sqrt{{(5y)}^9}\;$ using a rational exponent.
          answer: $x{(5y)}^{\frac{9}{2}}$
          explanation: Answer from the book's answer key.
      - sort_order: 49
        block_type: markdown
        content:
          text: "**Example 13: Simplifying Rational Exponents**\n\nSimplify:\n\n- ⓐ $5(2x^{\\frac{3}{4}})(3x^{\\frac{1}{5}})$\n- ⓑ ${(\\frac{16}{9})}^{-\\frac{1}{2}}$\n\n**Solution**\n\nⓐ  \n $\\begin{array}{ll}30x^{\\frac{3}{4}}x^{\\frac{1}{5}} & \\;\\text{Multiply the coefficients}. \\\\ 30x^{\\frac{3}{4}+\\frac{1}{5}} & \\;\\text{Use properties of exponents}. \\\\ 30x^{\\frac{19}{20}} & \\;\\text{Simplify}.\\end{array}$\n\nⓑ  \n $\\begin{array}{ll}{(\\frac{9}{16})}^{\\frac{1}{2}} & \\; \\text{Use definition of negative exponents}. \\\\ \\sqrt{\\frac{9}{16}} & \\; \\text{Rewrite as a radical}. \\\\ \\frac{\\sqrt{9}}{\\sqrt{16}} & \\; \\text{Use the quotient rule}. \\\\ \\frac{3}{4} & \\; \\text{Simplify}.\\end{array}$\n"
      - sort_order: 50
