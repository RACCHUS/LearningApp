      terms:
      - term: index
        definition: the number above the radical sign indicating the nth root
      - term: radical
        definition: the symbol used to indicate a root
      - term: radical expression
        definition: an expression containing a radical symbol
      - term: radicand
        definition: the number under the radical symbol
      - term: base
        definition: in exponential notation, the expression that is being multiplied
      - term: exponent
        definition: in exponential notation, the raised number or variable that indicates how many times the base is being multiplied
      - term: order of operations
        definition: a set of rules governing how mathematical expressions are to be evaluated, assigning priorities to operations
