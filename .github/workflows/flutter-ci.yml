name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate curriculum manifests (JSON Schema & Quality Linter)
        run: dart run tool/lint_manifest.dart --dir content/

      - name: Dry-run batch curriculum ingestion
        run: dart run tool/ingest_curriculum.dart --dir content/ --dry-run

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release

  verify-database:
    name: Verify clean Supabase migrations from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Verify migrations from scratch
        run: |
          supabase start
          supabase db reset
          supabase test db
          supabase db lint
