name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate catalog source registry and rights review
        run: |
          dart run tool/taxonomy_coverage.dart --registry-only
          dart run tool/verify_taxonomy_source_review.dart

      - name: Validate private credential candidate intake and measured-demand rules
        run: |
          python3 tool/catalog_intake.py validate
          python3 tool/catalog_intake.py rank
          python3 -m unittest discover -s tool/tests -p 'test_catalog_intake.py' -v

      - name: Validate P2 reviewed issuer-link manifest and safe SQL promotion
        run: |
          python3 tool/catalog_verified_pilot.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_verified_pilot.py' -v

      - name: Validate official issuer preparation links and guard against unsourced content
        run: |
          python3 tool/catalog_p2_resources.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2_resources.py' -v

      - name: Validate P2d Florida professional license and checklist identities
        run: |
          python3 tool/catalog_p2d_florida_licenses.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2d_florida_licenses.py' -v

      - name: Validate P2e regulator-sourced conditional pathway manifest
        run: |
          python3 tool/catalog_p2e_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2e_pathways.py' -v

      - name: Validate P2f Florida DFS insurance pathway manifest
        run: |
          python3 tool/catalog_p2f_insurance_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2f_insurance_pathways.py' -v

      - name: Validate P2g Florida DBPR contractor pathway manifest
        run: |
          python3 tool/catalog_p2g_contractor_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2g_contractor_pathways.py' -v

      - name: Test P1 official BLS/IPEDS evidence adapters without network or credentials
        run: |
          python3 -m pip install 'openpyxl==3.1.5'
          python3 -m unittest discover -s tool/tests -p 'test_catalog_official_demand.py' -v

      - name: Parse Windows PowerShell scripts (no database connection)
        shell: pwsh
        run: |
          foreach ($script in @('tool/backup_hosted_learningapp.ps1', 'tool/guarded_supabase_deploy.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }


      - name: Validate curriculum manifests (JSON Schema & Quality Linter)
        run: dart run tool/lint_manifest.dart --dir content/

      - name: Verify append-only migration history & immutability
        run: dart run tool/verify_migration_history.dart --base-ref origin/main

      - name: Dry-run batch curriculum ingestion
        run: dart run tool/ingest_curriculum.dart --dir content/ --dry-run

      - name: Verify migration governance & deployment test suite
        run: flutter test test/services/governance/

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release

      - name: Check Word Learning PWA spelling asset size
        run: python3 tool/measure_word_lexicon.py

  verify-database:
    name: Verify clean Supabase migrations and complete official taxonomy ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Cache cryptographically pinned taxonomy source files
        uses: actions/cache@v4
        with:
          path: build/taxonomy-cache
          key: taxonomy-source-bundle-v1-${{ runner.os }}-${{ hashFiles('lib/services/taxonomy/official_taxonomy_sources.dart') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Verify append-only migration history & immutability
        run: dart run tool/verify_migration_history.dart --base-ref origin/main

      - name: Verify incremental migration upgrade path from main
        run: |
          supabase start
          # 1. Isolate any pending migrations to establish origin/main baseline
          dart run tool/verify_migration_history.dart --base-ref origin/main --isolate-pending build/pending_migrations
          # 2. Reset database with baseline migrations from origin/main
          supabase db reset
          # 3. Restore newly introduced migrations
          dart run tool/verify_migration_history.dart --base-ref origin/main --restore-pending build/pending_migrations
          # 4. Apply new migrations incrementally
          supabase migration up --local
          # 5. Run pgTAP test suite against incrementally upgraded database
          supabase test db

      - name: Verify clean-slate migrations and initial pgTAP tests from scratch
        run: |
          supabase db reset
          supabase test db

      - name: Ingest complete official federal taxonomy bundle into clean Supabase
        run: |
          eval $(supabase status -o env)
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          dart run tool/ingest_official_taxonomies.dart --ingest-all

      - name: Check release-level catalog coverage after local official ingestion
        run: |
          eval $(supabase status -o env)
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          dart run tool/taxonomy_coverage.dart --strict

      - name: Verify post-ingestion database integrity and pgTAP tests
        run: |
          supabase test db
          supabase db lint --fail-on warning
