name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/learning_core && dart pub get)

      - name: Check every tool/tests suite is executed by CI (inventory guard)
        run: |
          python3 tool/ci/check_test_inventory.py --strict
          python3 -m unittest discover -s tool/tests -p 'test_check_test_inventory.py' -v

      - name: Test Flutter JSON report summarizer (report-only)
        run: python3 -m unittest discover -s tool/tests -p 'test_summarize_flutter_test_report.py' -v

      - name: Test the test log-noise guard
        run: python3 -m unittest discover -s tool/tests -p 'test_check_test_log_noise.py' -v

      - name: Validate feature registry contract (no external service)
        run: |
          python3 tool/verify_feature_registry.py
          python3 -m unittest discover -s tool/tests -p 'test_verify_feature_registry.py' -v

      - name: Validate zero-cost public SEO preview and editorial gates
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_public_site_build.py' -v
          python3 tool/build_public_site.py --origin https://www.example.test --app-origin https://app.example.test --preview --out build/public-seo-ci
          test -f build/public-seo-ci/404.html
          test -f build/public-seo-ci/sitemap.xml
          test -f build/public-seo-ci/how-it-works/index.html

      - name: Test guarded database connection routing and redaction
        run: dart tool/tests/guarded_connection_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Validate schema contract (client to migrations)
        run: dart run tool/verify_schema_contract.dart

      - name: Validate catalog source registry and rights review
        run: |
          dart run tool/taxonomy_coverage.dart --registry-only
          dart run tool/verify_taxonomy_source_review.dart

      - name: Validate private credential candidate intake and measured-demand rules
        run: |
          python3 tool/catalog_intake.py validate
          python3 tool/catalog_intake.py rank
          python3 -m unittest discover -s tool/tests -p 'test_catalog_intake.py' -v

      - name: Validate P2 reviewed issuer-link manifest and safe SQL promotion
        run: |
          python3 tool/catalog_verified_pilot.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_verified_pilot.py' -v

      - name: Validate official issuer preparation links and guard against unsourced content
        run: |
          python3 tool/catalog_p2_resources.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2_resources.py' -v

      - name: Validate P2d Florida professional license and checklist identities
        run: |
          python3 tool/catalog_p2d_florida_licenses.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2d_florida_licenses.py' -v

      - name: Validate P2e regulator-sourced conditional pathway manifest
        run: |
          python3 tool/catalog_p2e_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2e_pathways.py' -v

      - name: Validate P2f Florida DFS insurance pathway manifest
        run: |
          python3 tool/catalog_p2f_insurance_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2f_insurance_pathways.py' -v

      - name: Validate P2g Florida DBPR contractor pathway manifest
        run: |
          python3 tool/catalog_p2g_contractor_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2g_contractor_pathways.py' -v

      - name: Validate P2h Florida DBPR real estate pathway manifest
        run: |
          python3 tool/catalog_p2h_real_estate_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2h_real_estate_pathways.py' -v

      - name: Validate P2i Florida DBPR real estate broker pathway manifest
        run: |
          python3 tool/catalog_p2i_broker_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2i_broker_pathways.py' -v

      - name: Validate P2j Florida DBPR residential contractor pathway manifest
        run: |
          python3 tool/catalog_p2j_contractor_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2j_contractor_pathways.py' -v

      - name: Validate P2k Florida DBPR CAM pathway manifest
        run: |
          python3 tool/catalog_p2k_cam_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2k_cam_pathways.py' -v

      - name: Validate P2l Florida DBPR cosmetologist pathway manifest
        run: |
          python3 tool/catalog_p2l_cosmetologist_pathways.py validate
          python3 -m unittest discover -s tool/tests -p 'test_catalog_p2l_cosmetologist_pathways.py' -v

      - name: Test bounded Excel software-learning checker (no files or credentials)
        run: python3 -m unittest discover -s tool/tests -p 'test_software_learning_excel_checker.py' -v

      - name: Test bounded XLSX snapshot reader (no uploads, credentials, or network)
        run: python3 -m unittest discover -s tool/tests -p 'test_xlsx_snapshot.py' -v

      - name: Test provisional XLSX worker envelope (no external services)
        run: python3 -m unittest discover -s tool/tests -p 'test_xlsx_worker.py' -v

      - name: Test Excel workbook-to-provisional-grade pipeline
        run: python3 -m unittest discover -s tool/tests -p 'test_excel_pilot_pipeline.py' -v

      - name: Test Excel Storage API retention coordinator (default-off)
        run: python3 -m unittest discover -s tool/tests -p 'test_storage_retention.py' -v

      - name: Test server-only Excel private workbook handoff
        run: python3 -m unittest discover -s tool/tests -p 'test_private_assessment.py' -v

      - name: Test restricted Supabase private workbook Storage API adapter
        run: python3 -m unittest discover -s tool/tests -p 'test_supabase_private_storage.py' -v

      - name: Test Supabase server-confirmed Excel processing identity
        run: python3 -m unittest discover -s tool/tests -p 'test_supabase_auth_gateway.py' -v

      - name: Test private Excel DB lease adapter
        run: python3 -m unittest discover -s tool/tests -p 'test_private_assessment_db.py' -v

      - name: Test pinned Docker XLSX worker command isolation
        run: python3 -m unittest discover -s tool/tests -p 'test_container_worker_runner.py' -v

      - name: Test DB-backed Excel retention adapter (service-only)
        run: python3 -m unittest discover -s tool/tests -p 'test_private_retention_db.py' -v

      - name: Test bounded Excel expiration sweep (dry run by default)
        run: python3 -m unittest discover -s tool/tests -p 'test_retention_batch.py' -v

      - name: Test private bounded Excel retention job composition (disabled)
        run: python3 -m unittest discover -s tool/tests -p 'test_private_retention_job.py' -v

      - name: Test isolated Excel retention host GET/DELETE-only capability
        run: python3 -m unittest discover -s tool/tests -p 'test_private_retention_host.py' -v

      - name: Test read-only Excel retention backlog and alert signal
        run: python3 -m unittest discover -s tool/tests -p 'test_private_retention_monitor.py' -v

      - name: Test disabled-by-default internal Excel assessment gateway
        run: python3 -m unittest discover -s tool/tests -p 'test_hosted_internal.py' -v

      - name: Test trusted-host Excel assessment composition
        run: python3 -m unittest discover -s tool/tests -p 'test_hosted_runtime.py' -v

      - name: Test unified provisional software/simulation evidence envelope
        run: python3 -m unittest discover -s tool/tests -p 'test_shared_evidence.py' -v

      - name: Test sealed server-brokered Excel upload (prototype only)
        run: python3 -m unittest discover -s tool/tests -p 'test_brokered_upload.py' -v

      - name: Test single-use Excel upload DB transaction lock
        run: python3 -m unittest discover -s tool/tests -p 'test_private_upload_db.py' -v

      - name: Test isolated no-Docker Excel upload host
        run: python3 -m unittest discover -s tool/tests -p 'test_hosted_upload_runtime.py' -v

      - name: Test disabled internal binary Excel upload ingress
        run: python3 -m unittest discover -s tool/tests -p 'test_hosted_upload_ingress.py' -v

      - name: Test guarded Excel account workbook erasure
        run: python3 -m unittest discover -s tool/tests -p 'test_account_erasure.py' -v

      - name: Test read-only Excel owner-prefix Storage inventory
        run: python3 -m unittest discover -s tool/tests -p 'test_private_owner_inventory.py' -v

      - name: Verify brokered Excel migration is identical in self-host bundle
        run: python3 -m unittest discover -s tool/tests -p 'test_excel_bundle_integrity.py' -v

      - name: Test Excel upload-to-provisional-grade integrated lifecycle
        run: python3 -m unittest discover -s tool/tests -p 'test_excel_broker_to_grade_integration.py' -v

      - name: Build and smoke-test isolated Excel worker container (prototype)
        run: |
          docker build -f deploy/software-learning/Dockerfile \
            -t learningapp-xlsx-worker:ci tool/software_learning
          mkdir -p build
          python3 -c "import sys,pathlib; sys.path.insert(0,'tool/tests'); from test_xlsx_snapshot import zip_bytes; pathlib.Path('build/excel-pilot-fixture.xlsx').write_bytes(zip_bytes())"
          docker run --rm -i --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 0.5 \
            --ulimit nofile=64:64 --ulimit fsize=10485760:10485760 \
            learningapp-xlsx-worker:ci budget.xlsx \
            < build/excel-pilot-fixture.xlsx > build/excel-worker-result.json
          python3 -c "import json; r=json.load(open('build/excel-worker-result.json')); assert r['status']=='parsed_unverified'; assert r['cells']['C10']['value']=='=SUM(C2:C9)'; assert r['can_award_skill'] is False"
          if printf 'not a workbook' | docker run --rm -i --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 0.5 \
            learningapp-xlsx-worker:ci budget.xlsx > build/excel-worker-reject.json; then
            echo "Worker incorrectly accepted malformed file" >&2
            exit 1
          fi
          python3 -c "import json; r=json.load(open('build/excel-worker-reject.json')); assert r=={'status':'rejected','reason':'unsupported_or_unsafe_workbook'}"

      - name: Validate official College Board CLEP exam catalog
        run: |
          python3 tool/catalog_clep_exams.py
          python3 -m unittest discover -s tool/tests -p 'test_catalog_clep_exams.py' -v

      - name: Install pinned Python test tooling (pytest, SymPy, PyYAML)
        # Isolated venv: the runner's system Python carries unrelated packages
        # whose own dependency gaps would make `pip check` fail. The venv holds
        # exactly requirements-ci-tests.txt, so `pip check` covers only our set.
        run: |
          venv="$RUNNER_TEMP/ci-tests-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" --version
          "$venv/bin/python" -m pip install --disable-pip-version-check -r requirements-ci-tests.txt
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pip list --format=freeze --disable-pip-version-check
          echo "CI_TEST_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Validate CLEP content production pipeline and psychometric integrity
        run: |
          "$CI_TEST_PYTHON" tool/clep_content_pipeline.py --manifest content/clep_introductory_psychology.yaml --require-simulation
          "$CI_TEST_PYTHON" tool/clep_content_pipeline.py --manifest content/clep_college_algebra.yaml --require-simulation
          "$CI_TEST_PYTHON" -m unittest discover -s tool/tests -p 'test_clep_content_pipeline.py' -v

      - name: Verify College Algebra YAML matches its generator (read-only parity)
        run: |
          "$CI_TEST_PYTHON" tool/ci/check_algebra_manifest_parity.py
          "$CI_TEST_PYTHON" -m unittest discover -s tool/tests -p 'test_check_algebra_manifest_parity.py' -v
          "$CI_TEST_PYTHON" -m unittest discover -s tool/tests -p 'test_generate_clep_algebra_ids.py' -v

      - name: Verify College Algebra mathematical accuracy (pytest + SymPy)
        run: PYTHONPATH=. "$CI_TEST_PYTHON" -m pytest tool/tests/test_clep_algebra_math_accuracy.py -v

      - name: Test P1 official BLS/IPEDS evidence adapters without network or credentials
        run: |
          python3 -m pip install 'openpyxl==3.1.5'
          python3 -m unittest discover -s tool/tests -p 'test_catalog_official_demand.py' -v

      - name: Parse Windows PowerShell scripts (no database connection)
        shell: pwsh
        run: |
          foreach ($script in @('tool/backup_hosted_learningapp.ps1', 'tool/guarded_supabase_deploy.ps1', 'deploy/self-host/bootstrap.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }


      - name: Validate curriculum manifests (JSON Schema & Quality Linter)
        run: dart run tool/lint_manifest.dart --dir content/

      - name: Verify append-only migration history & immutability
        run: dart run tool/verify_migration_history.dart --base-ref origin/main

      - name: Dry-run batch curriculum ingestion
        run: dart run tool/ingest_curriculum.dart --dir content/ --dry-run

      - name: Verify migration governance & deployment test suite
        run: flutter test test/services/governance/

      - name: Test packages/learning_core
        run: |
          cd packages/learning_core
          dart pub get
          dart test

      - name: Run tests
        run: |
          mkdir -p build/reports
          flutter test --reporter expanded --file-reporter json:build/reports/flutter-tests.json

      - name: Summarize Flutter test timing and inventory (report-only)
        if: ${{ always() }}
        run: python3 tool/ci/summarize_flutter_test_report.py build/reports/flutter-tests.json --label "Flutter test suite"

      - name: Reject test-setup gaps logged by passing tests (ratchet)
        # MissingPluginException / MissingStubError / uninitialized Supabase in
        # a green run means a test exercised an error path by accident.
        run: python3 tool/ci/check_test_log_noise.py build/reports/flutter-tests.json

      - name: EXM 50k synthetic JSON export load probe (no user data)
        run: >-
          flutter test
          --dart-define=EXM_STRESS=true
          test/services/assessment/reference_practice_json_load_probe_test.dart
          --reporter expanded

      - name: Build web release
        run: flutter build web --release

      - name: Build opted-in simulation preview web release (CI only)
        run: flutter build web --release --dart-define=ENABLE_SIMULATION_PREVIEW=true

      - name: Check Word Learning PWA spelling asset size
        run: python3 tool/measure_word_lexicon.py

  verify-database:
    name: Verify clean Supabase migrations and complete official taxonomy ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Cache cryptographically pinned taxonomy source files
        uses: actions/cache@v4
        with:
          path: build/taxonomy-cache
          key: taxonomy-source-bundle-v1-${{ runner.os }}-${{ hashFiles('lib/services/taxonomy/official_taxonomy_sources.dart') }}

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/learning_core && dart pub get)

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Verify append-only migration history & immutability
        run: dart run tool/verify_migration_history.dart --base-ref origin/main

      - name: Verify incremental migration upgrade path from main
        run: |
          supabase start
          # 1. Isolate any pending migrations to establish origin/main baseline
          dart run tool/verify_migration_history.dart --base-ref origin/main --isolate-pending build/pending_migrations
          # 2. Reset database with baseline migrations from origin/main
          supabase db reset
          # 3. Restore newly introduced migrations
          dart run tool/verify_migration_history.dart --base-ref origin/main --restore-pending build/pending_migrations
          # 4. Apply new migrations incrementally (--include-all admits registry-approved backdated reconciliations)
          supabase migration up --local --include-all
          # 5. Run pgTAP test suite against incrementally upgraded database
          supabase test db

      - name: Verify local Supabase Storage create-only and cleanup races (synthetic)
        run: |
          eval "$(supabase status -o env)"
          export API_URL SERVICE_ROLE_KEY ANON_KEY
          python3 tool/software_learning/local_storage_race_probe.py

      - name: Verify real local DB broker NOWAIT/Storage race and cleanup (synthetic)
        run: |
          python3 -m pip install 'psycopg[binary]==3.2.10'
          eval "$(supabase status -o env)"
          export API_URL SERVICE_ROLE_KEY ANON_KEY DB_URL
          python3 tool/software_learning/local_broker_db_storage_probe.py

      - name: Rehearse historical backfill in hosted-ledger order
        # Replays production's actual order: reset with only the versions in the
        # hosted ledger snapshot, then apply every never-applied migration out of
        # order (as `--approve-historical-backfill` does) and run pgTAP.
        run: |
          ledger=supabase/rehearsal/production_applied_versions.txt
          mkdir -p build/backfill_rehearsal
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -c1-14)
            grep -qx "$v" "$ledger" || mv "$f" build/backfill_rehearsal/
          done
          echo "Held back for out-of-order application: $(ls build/backfill_rehearsal | wc -l)"
          supabase db reset
          mv build/backfill_rehearsal/*.sql supabase/migrations/
          git diff --exit-code -- supabase/migrations
          supabase migration up --local --include-all
          supabase test db

      - name: Verify clean-slate migrations and initial pgTAP tests from scratch
        run: |
          supabase db reset
          supabase test db

      - name: Verify real lesson import and readback against local Supabase (synthetic)
        # Production import/read code paths against the clean local stack.
        # REQUIRE_LOCAL_SUPABASE makes missing configuration a failure; the
        # test itself refuses non-loopback hosts. .env is copied only because
        # the Flutter asset bundle lists it; the test never reads it.
        run: |
          cp .env.example .env
          eval "$(supabase status -o env)"
          LOCAL_SUPABASE_URL="$API_URL" \
          LOCAL_SUPABASE_ANON_KEY="$ANON_KEY" \
          LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          REQUIRE_LOCAL_SUPABASE=true \
          flutter test test/integration/lesson_import_local_supabase_test.dart --reporter expanded

      - name: Ingest complete official federal taxonomy bundle into clean Supabase
        run: |
          eval $(supabase status -o env)
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          dart run tool/ingest_official_taxonomies.dart --ingest-all

      - name: Check release-level catalog coverage after local official ingestion
        run: |
          eval $(supabase status -o env)
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          dart run tool/taxonomy_coverage.dart --strict

      - name: Verify post-ingestion database integrity and pgTAP tests
        run: |
          supabase test db
          supabase db lint --fail-on warning
