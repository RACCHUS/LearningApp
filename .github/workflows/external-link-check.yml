# Weekly dead-link check for Bridge sources and external companions
# (master plan v2.6 §7.5, §9.3). Fails when a link is dead so the owner is
# notified; no secrets, nothing changes in the app.
name: External link check

on:
  schedule:
    - cron: '40 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    if: ${{ github.repository == 'RACCHUS/LearningApp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every external link
        run: python3 tool/check_external_links.py | tee -a "$GITHUB_STEP_SUMMARY"
