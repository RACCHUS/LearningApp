# Manually run the SAME guarded deployment logic used by the repository.
# This workflow ONLY runs --dry-run. No --include-all, repairs or live pushes.
# Configure the protected 'analytics-preflight' GitHub environment with
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD before running.
name: Analytics guarded Supabase preflight (dry-run only)

on:
  workflow_dispatch:
    inputs:
      acknowledge_read_only:
        description: 'Run protected Supabase migration dry-run (never deploy)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guarded-supabase-production
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.repository == 'RACCHUS/LearningApp' && github.ref == 'refs/heads/main' && inputs.acknowledge_read_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: analytics-preflight
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DEPLOY_CONNECTION: session_pooler
      # The CLI parses local Google OAuth config for remote DB-only commands.
      # Sentinels satisfy env() locally; no local Auth service runs and hosted
      # Google OAuth settings are never changed by these workflows.
      # Do not replace these with real OAuth credentials or run auth/config push.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "ci-db-migration-only"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "ci-db-migration-only"
      EXPECTED_PROJECT_REF: xzvkdwebtbxlrxagtzlv
    steps:
      - name: Checkout full audited migration history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Validate the credentials are supplied without printing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing protected Supabase access token"; exit 1;
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Missing protected Supabase database password"; exit 1;
          }

      - name: Install pinned Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve repository dependencies
        run: flutter pub get

      - name: Install reviewed, pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.67.1

      - name: Link only the approved target project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          test "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF"

      - name: Execute repository guard in DRY RUN mode ONLY
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/guarded_supabase_deploy.dart \
            --dry-run \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --base-ref origin/main \
            --report-dir build/analytics_preflight_reports

      - name: Upload non-secret, reviewed dry-run report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: analytics-guarded-dry-run-report
          path: build/analytics_preflight_reports/
          retention-days: 7
          if-no-files-found: ignore
