<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LearningApp companion</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f1115;
        color: #e8eaed;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      p {
        margin: 0 0 8px;
      }
      .note {
        color: #b4bac4;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>LearningApp companion</h1>
    <p>
      Go to the course, video or article you are studying, then click the
      LearningApp button in the toolbar.
    </p>
    <p class="note">
      The page address is read only when you click the button. It is not sent
      to LearningApp unless you choose to save it.
    </p>
  </body>
</html>
