name: learning_pwa
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.1.2
  flutter_math_fork: ^0.7.2
  go_router: ^14.1.0
  connectivity_plus: ^3.0.3
  path_provider: ^2.0.13
  firebase_core: ^3.15.2
  firebase_messaging: ^15.0.1
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  uuid: ^4.3.3
  intl: ^0.19.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  # Voice correction libraries
  fuzzy: ^0.5.1
  string_similarity: ^2.0.0
  # Concurrency utilities for voice system
  synchronized: ^3.1.0
  # UX Enhancement - celebrations and progress
  confetti: ^0.7.0
  device_info_plus: ^10.1.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.5.4
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  json_serializable: ^6.7.1
  analyzer: ^6.4.1

flutter:
  uses-material-design: true
  
  # The following section is specific to Flutter.
  assets:
    - assets/images/
    - assets/sample_lesson.json
    - .env
    
  # To add assets from your dependencies, use the following syntax:
  #   - package:package_name/
  #     - package:package_name/file.png