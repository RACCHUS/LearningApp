name: learning_pwa
description: A Flutter PWA for discovering, creating, and studying learning content across courses, certifications, licensure, and career pathways.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  learning_core:
    path: packages/learning_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.1.2
  flutter_math_fork: ^0.7.2
  go_router: ^14.1.0
  url_launcher: ^6.3.2
  connectivity_plus: '>=6.0.0 <8.0.0'
  google_fonts: ^6.3.3
  uuid: ^4.3.3
  intl: ^0.20.3
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  web: ^1.1.0
  # Voice correction libraries
  fuzzy: ^0.5.1
  string_similarity: ^2.0.0
  # Concurrency utilities for voice system
  synchronized: ^3.1.0
  # UX Enhancement - celebrations and progress
  confetti: ^0.7.0
  percent_indicator: ^4.2.3
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.6
  json_annotation: ^4.9.0
  timezone: ^0.9.4
  fsrs: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  json_serializable: ^6.7.1
  yaml: ^3.1.4
  json_schema: 5.2.2
  excel: ^4.0.6

  supabase: any
  flutter_local_notifications_platform_interface: any
flutter:
  uses-material-design: true
  generate: true
  
  # The following section is specific to Flutter.
  assets:
    - assets/lexicons/en_us_scowl_roots.txt
    - assets/lexicons/NOTICE.txt
    - assets/lessons/
    - .env
    
  # To add assets from your dependencies, use the following syntax:
  #   - package:package_name/
  #     - package:package_name/file.png