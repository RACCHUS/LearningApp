            description: "Measures of central tendency, skew, the empirical 68-95-99.7 distribution rule, and test standardization."
            emoji: "📊"
            tags: ["statistics", "reliability", "validity"]
            concept_slugs: ["psyc-psychometric-reliability-validity"]
            citation: "College Board CLEP Introductory Psychology Domain 13.0"
            blocks:
              - sort_order: 1
                block_type: "markdown"
                content:
                  text: |
                    ### The Normal Distribution (Bell Curve)
                    In a standard normal distribution:
                    - **68%** of all scores fall within $\pm 1$ standard deviation of the mean.
                    - **95%** of all scores fall within $\pm 2$ standard deviations of the mean.
                    - **99.7%** of all scores fall within $\pm 3$ standard deviations of the mean.
                    - In a positively skewed distribution, the **mean** is pulled toward the high-scoring tail, while the **mode** remains at the peak and the **median** sits in the middle.
            assessment_items:
              - prompt: "On a standardized intelligence test with a mean score of 100 and a standard deviation of 15, approximately what percentage of the general population will score between 85 and 115?"
                interaction_type: "single_choice"
                response_spec:
                  options:
                    - "34%"
                    - "50%"
                    - "68%"
                    - "95%"
                scoring_spec:
                  correct_index: 2
                explanation: "Scores between 85 and 115 represent ±1 standard deviation (100 ± 15). In a normal distribution, approximately 68% of cases fall within one standard deviation of the arithmetic mean."
                difficulty: "beginner"
                cognitive_level: "comprehension"
                citation: "College Board CLEP Introductory Psychology Objective 13.1"
