  - code: '8.2'
    title: Analyze attachment theory, parenting styles, Erikson's psychosocial stages, and Kohlberg's moral development
    description: Evaluate Harlow's monkey study, compare Ainsworth's attachment classifications, contrast Baumrind's parenting styles, and trace Erikson's and Kohlberg's stages.
    sort_order: 2
    importance: core
    citation: College Board Objective 8.2
    concepts:
    - slug: psyc-attachment-parenting
      name: Attachment Bonds and Baumrind Parenting Styles
      short_definition: Emotional bonding in infancy (Harlow's contact comfort, Ainsworth's Strange Situation) and Baumrind's four parenting frameworks.
      description: Harlow disproved nourishment-based bonding; Ainsworth classified secure, avoidant, and resistant attachments; authoritative parenting yields optimal autonomy.
      citation: OpenStax Psychology 2e, Section 9.3
    - slug: psyc-psychosocial-moral-development
      name: Eriksonian Psychosocial and Kohlberg Moral Development
      short_definition: Erikson's eight lifelong psychosocial crises and Kohlberg's preconventional, conventional, and postconventional moral reasoning stages.
      description: Erikson spans Trust vs. Mistrust through Integrity vs. Despair; Kohlberg evaluates moral justice reasoning, contrasted with Gilligan's care ethics.
      citation: OpenStax Psychology 2e, Section 9.3
      prerequisites:
      - psyc-attachment-parenting
    lessons:
    - title: Attachment, Parenting Styles, and Psychosocial Moral Development
      description: Harlow's contact comfort, Ainsworth's Strange Situation, Baumrind's 4 parenting styles, Erikson's 8 crises, and Kohlberg's Heinz dilemma.
      emoji: "\U0001F331"
      tags:
      - attachment
      - harlow
      - ainsworth
      - erikson
      - kohlberg
      - parenting
      concept_slugs:
      - psyc-attachment-parenting
      - psyc-psychosocial-moral-development
      citation: OpenStax Psychology 2e, Section 9.3
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Attachment Foundations: Harlow and Ainsworth\n\n- **Harry Harlow's Surrogate Mother Experiment:** Separated infant rhesus monkeys from biological mothers and provided two artificial surrogates: a wire mother with a feeding bottle and a soft terrycloth mother without food. The monkeys overwhelmingly preferred the cloth mother, demonstrating that **contact comfort**, not feeding nourishment, forms the foundation of attachment.\n- **Mary Ainsworth's Strange Situation Paradigm:** Observed mother-infant interactions across structured separation and reunion episodes:\n  * **Secure Attachment (~65%):** Explores comfortably with mother present; distressed when mother leaves; warmly comforted upon reunion.\n  * **Insecure-Avoidant (~20%):** Shows little outward distress upon separation; actively avoids or ignores mother upon reunion.\n  * **Insecure-Resistant / Ambivalent (~10\u201315%):** Clings anxiously, extremely distressed by separation; seeks contact yet kicks or pushes\
            \ mother away upon reunion."
      - sort_order: 2
        block_type: markdown
        content:
          text: "### Diana Baumrind's Four Parenting Styles\n\n| Parenting Style | Warmth & Responsiveness | Demandingness & Discipline | Long-Term Child Outcomes |\n| :--- | :--- | :--- | :--- |\n| **Authoritative** | High | High (reasonable, democratic rules) | Highest self-esteem, self-reliance, and social competence |\n| **Authoritarian** | Low | High (rigid, coercive, 'because I said so') | Lower self-esteem, higher anxiety, obedient but unhappy |\n| **Permissive** | High | Low (few demands, zero discipline) | Impulsive, demanding, poor academic self-regulation |\n| **Neglectful / Uninvolved** | Low | Low (absent, indifferent) | Poorest outcomes: delinquency, emotional detachment |\n\n### Erik Erikson's Psychosocial Crises Across the Lifespan\n\n- **Infancy (0\u20131 yr):** Trust vs. Mistrust\n- **Toddlerhood (1\u20133 yr):** Autonomy vs. Shame and Doubt\n- **Preschool (3\u20136 yr):** Initiative vs. Guilt\n- **Elementary (6\u201312 yr):** Industry vs. Inferiority\n- **Adolescence (12\u2013\
            18 yr):** **Identity vs. Role Confusion**\n- **Young Adulthood (20s\u201330s):** **Intimacy vs. Isolation**\n- **Middle Adulthood (40s\u201360s):** **Generativity vs. Stagnation**\n- **Late Adulthood (65+ yr):** **Integrity vs. Despair**"
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Lawrence Kohlberg's Levels of Moral Reasoning

            Evaluated through moral dilemmas like the **Heinz Dilemma** (stealing an unaffordable drug to save a dying wife):
            1. **Preconventional Morality (Before age 9):** Governed by self-interest. Morality is judged by avoiding physical punishment (Stage 1) or gaining tangible rewards (Stage 2).
            2. **Conventional Morality (Early adolescence):** Governed by social conformity. Morality is judged by gaining social approval ('good boy/girl', Stage 3) or upholding societal laws and order (Stage 4).
            3. **Postconventional Morality (Adolescence and beyond):** Governed by abstract ethical principles. Morality reflects basic human rights and universal ethical principles (Stages 5 and 6).
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Case: Adolescence Identity Resolution'
          text: A 16-year-old high school student experiments with different peer groups, musical styles, and career ambitions. According to Erikson, the adolescent is actively resolving the **Identity vs. Role Confusion** crisis, synthesizing childhood values with future adult aspirations to forge a coherent self-identity.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Authoritative vs. Authoritarian'
          body: Remember that **AuthoritaTIVE** parents are like a warm, supportive **tent** (democratic and responsive). **AuthoritaRIAN** parents are strict like a **totalitarian** regime (cold and demanding).
      terms:
      - term: Contact Comfort
        definition: The physical and emotional comfort that an infant receives from being in direct physical contact with a warm, soft caregiver.
        example: Harlow's infant monkeys clinging to the cloth mother for hours when terrified by an automated mechanical toy.
      - term: Authoritative Parenting
        definition: A parenting style characterized by high responsiveness and high demands, featuring open communication, clear standards, and warm support.
        example: Setting consistent curfews while discussing the reasons behind them and listening to the teenager's perspective.
      - term: Postconventional Morality
        definition: The third and highest level of Kohlberg's moral reasoning, where decisions are based on self-chosen abstract ethical principles and universal human rights.
        example: Stealing medication because human life possesses greater moral value than corporate property rights.
      assessment_items:
      - prompt: Harry Harlow's classic experiments with infant rhesus monkeys separated from their mothers demonstrated that social attachment is primarily formed through which mechanism?
        interaction_type: single_choice
        response_spec:
          options:
          - Physical contact comfort provided by a soft surface
          - Consistent delivery of primary nutritional reinforcement
          - Imprinting during the first twenty-four hours post-birth
          - Operant conditioning of instinctive maternal vocalizations
        scoring_spec:
          correct_index: 0
        explanation: Harlow showed that infant monkeys clung almost continuously to a soft, terrycloth surrogate mother rather than a wire mother that dispensed milk, demonstrating that contact comfort (not feeding reinforcement) is the primary foundation of infant attachment.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 9.3
        concept_slugs:
        - psyc-attachment-parenting
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In Mary Ainsworth's Strange Situation paradigm, a one-year-old explores the room with their mother present, cries intensely when she departs, but immediately seeks her embrace and is quickly soothed upon her return. What attachment pattern is illustrated?
        interaction_type: single_choice
        response_spec:
          options:
          - Insecure-avoidant attachment
          - Secure attachment
          - Insecure-resistant attachment
          - Disorganized attachment
        scoring_spec:
          correct_index: 1
        explanation: Secure attachment is characterized by using the caregiver as a safe base for exploration, displaying distress upon separation, and actively seeking contact and being readily comforted upon the caregiver's return.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 9.3
        concept_slugs:
        - psyc-attachment-parenting
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: 'When asked why one should not steal merchandise from a store, an individual responds: ''Because stealing violates societal laws, and if everyone broke the rules, society would descend into total disorder.'' At which level of Kohlberg''s moral development is this individual reasoning?'
        interaction_type: single_choice
        response_spec:
          options:
          - Preconventional morality
          - Postconventional morality
          - Conventional morality
          - Universal ethical morality
        scoring_spec:
          correct_index: 2
        explanation: Conventional morality (Kohlberg's second level, Stage 4) emphasizes maintaining social order, respecting authority, and obeying laws for the collective stability of the social system.
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 9.3
        concept_slugs:
        - psyc-psychosocial-moral-development
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: According to Erik Erikson's eight stages of psychosocial development, which core psychological crisis confronts an adolescent transitioning into young adulthood?
        interaction_type: single_choice
        response_spec:
          options:
          - Industry versus inferiority
          - Generativity versus stagnation
          - Autonomy versus shame and doubt
          - Identity versus role confusion
        scoring_spec:
          correct_index: 3
        explanation: "During adolescence (ages 12\u201318), individuals confront Erikson's crisis of Identity vs. Role Confusion, testing and integrating various roles to develop a stable, unified sense of personal self."
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 9.3
        concept_slugs:
        - psyc-psychosocial-moral-development
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: In Mary Ainsworth's Strange Situation, an infant who explores comfortably when the mother is present, shows distress upon separation, and greets her enthusiastically upon reunion exhibits which attachment style?
        options:
        - Insecure-avoidant attachment
        - Insecure-resistant attachment
        - Secure attachment
        - Disorganized attachment
        correct_answer: 2
        explanation: Securely attached infants utilize the caregiver as a safe base for environmental exploration, display appropriate distress when separated, and are readily comforted upon the parent's return.
        concept_slugs:
        - psyc-attachment-parenting
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: At which of Lawrence Kohlberg's levels of moral reasoning does an individual justify actions based on universal ethical principles, human rights, and social justice rather than written laws or punishment?
        options:
        - Preconventional morality
        - Conventional morality
        - Heteronomous morality
        - Postconventional morality
        correct_answer: 3
        explanation: Postconventional moral reasoning evaluates moral dilemmas against abstract ethical principles of justice, individual dignity, and human rights, recognizing that existing civil laws may sometimes be unjust.
        concept_slugs:
        - psyc-psychosocial-moral-development
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What did Harry Harlow's study with rhesus monkeys disprove about attachment?
      back: It disproved that attachment is based merely on who feeds the infant, proving contact comfort is foundational.
      concept_slugs:
      - psyc-attachment-parenting
    - front: What characterizes authoritative parenting?
      back: High warmth paired with clear, firm, democratic standards and rules.
      concept_slugs:
      - psyc-attachment-parenting
- code: '9.0'
  title: Personality
  description: Psychoanalytic and psychodynamic models (id/ego/superego, defense mechanisms), humanistic growth, Big Five trait theory, and personality assessments.
  weight: 0.075
  sort_order: 9
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 9.0 (7\u20138%)"
  objectives:
  - code: '9.1'
    title: Analyze psychodynamic defense mechanisms, psychosexual stages, and humanistic self-actualization
    description: Evaluate Freud's tripartite mind structure, classify ego defense mechanisms, review neo-Freudian perspectives, and explain Rogers's unconditional positive regard.
    sort_order: 1
    importance: core
    citation: College Board Objective 9.1
    concepts:
    - slug: psyc-freudian-psychodynamics
      name: Freudian Personality Structure and Defense Mechanisms
      short_definition: Psychoanalytic personality model balancing the id (pleasure), ego (reality), and superego (morality) via unconscious defense mechanisms.
      description: The ego mediates psychic conflict through defense mechanisms including repression, projection, displacement, reaction formation, and sublimation.
      citation: OpenStax Psychology 2e, Section 11.2
    - slug: psyc-humanistic-personality
      name: Humanistic Self-Concept and Unconditional Regard
      short_definition: Person-centered perspective emphasizing free will, actual vs. ideal self-concept congruence, and unconditional positive regard.
      description: Carl Rogers established that therapeutic growth requires genuineness, empathy, and unconditional positive regard to resolve self-concept incongruence.
      citation: OpenStax Psychology 2e, Section 11.4
      prerequisites:
      - psyc-freudian-psychodynamics
    lessons:
    - title: Psychodynamic and Humanistic Perspectives on Personality
      description: Id, ego, superego, defense mechanisms, Jung's collective unconscious, Rogers's self-concept, and Maslow's self-actualization.
      emoji: "\U0001F3AD"
      tags:
      - personality
      - freud
      - defense-mechanisms
      - humanism
      - rogers
      concept_slugs:
      - psyc-freudian-psychodynamics
      - psyc-humanistic-personality
      citation: OpenStax Psychology 2e, Section 11.2 & 11.4
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Sigmund Freud's Tripartite Personality Architecture

            Freud conceptualized personality as a continuous unconscious conflict among three psychic systems:
            - **The Id:** Resides entirely in the unconscious. Operates on the **pleasure principle**, demanding immediate gratification of primal sexual (libido/Eros) and aggressive (Thanatos) drives.
            - **The Ego:** Operates on the **reality principle**. Acts as the pragmatic, conscious executive mediator balancing the id's impulses against external social constraints.
            - **The Superego:** The internalized moral compass and conscience, representing societal values and ethical ideals. Punishes the ego with feelings of guilt when moral codes are violated.
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Major Ego Defense Mechanisms

            When the ego experiences anxiety from id-superego conflict, it unconsciously distorts reality:

            | Defense Mechanism | Psychological Definition | Clinical Example |
            | :--- | :--- | :--- |
            | **Repression** | Primary defense; banishing anxiety-arousing thoughts to the unconscious | Forgetting traumatic childhood memories of physical abuse |
            | **Projection** | Attributing one's own unacceptable impulses onto others | A deceitful person constantly accusing coworkers of being dishonest |
            | **Reaction Formation** | Switching unacceptable impulses into their exact opposites | Masking unconscious romantic attraction behind exaggerated hostility |
            | **Displacement** | Shifting aggressive/sexual impulses toward a less threatening target | Yelling at your child after receiving a harsh reprimand from your boss |
            | **Sublimation** | Channeling unacceptable impulses into socially constructive pursuits | Channeling aggressive hostility into professional contact sports or surgery |
            | **Regression** | Retreating to an earlier, more infantile psychosexual stage | An adult throwing a screaming temper tantrum when denied a promotion |
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Carl Rogers and Unconditional Positive Regard
          body: "Carl Rogers asserted that psychological health requires **congruence** between an individual's **actual self** (how they see themselves) and their **ideal self** (who they wish to be). Parents and therapists nurture growth through **unconditional positive regard**\u2014an attitude of total, nonjudgmental acceptance."
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Case Illustration: Projection vs. Reaction Formation'
          text: 'An employee harboring unconscious hostility toward a supervisor: If using **projection**, the employee insists: *''My supervisor hates me and is trying to get me fired.''* If using **reaction formation**, the employee acts with effusive, saccharine praise toward the supervisor, overcompensating to conceal the underlying hostility.'
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Sublimation is Uniquely Adaptive'
          body: Unlike other defense mechanisms which are often maladaptive, **sublimation** is considered an adaptive defense mechanism because it channels forbidden primal drives into culturally productive and praised outcomes (e.g., artistic creation or athletic prowess).
      terms:
      - term: Superego
        definition: The component of personality that represents internalized societal ideals, moral standards, and conscience, striving for perfection.
        example: Feeling intense moral guilt after contemplating an unethical shortcut at work.
      - term: Unconditional Positive Regard
        definition: According to Carl Rogers, an attitude of total acceptance, nonjudgmental warmth, and respect toward another person.
        example: A parent affirming their love for a child even while correcting a specific inappropriate behavior.
      - term: Reaction Formation
        definition: A psychoanalytic defense mechanism where the ego unconsciously transforms unacceptable desires into their exact behavioral opposites.
        example: Becoming a vocal anti-gambling crusader to suppress one's own compulsive gambling impulses.
      assessment_items:
      - prompt: An executive who was reprimanded by the board of directors returns home and severely scolds their child for dropping a fork. What psychoanalytic defense mechanism is operating?
        interaction_type: single_choice
        response_spec:
          options:
          - Displacement
          - Reaction formation
          - Projection
          - Sublimation
        scoring_spec:
          correct_index: 0
        explanation: Displacement shifts sexual or aggressive impulses toward a safer, less threatening target when expressing them toward the original instigator (the board of directors) is deemed too dangerous.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 11.2
        concept_slugs:
        - psyc-freudian-psychodynamics
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: According to Carl Rogers, what fundamental interpersonal condition must parents and psychotherapists provide to enable healthy personality development and resolve incongruence?
        interaction_type: single_choice
        response_spec:
          options:
          - Conditional moral contingencies
          - Unconditional positive regard
          - Authoritarian behavioral guidance
          - Objective psychometric analysis
        scoring_spec:
          correct_index: 1
        explanation: "Carl Rogers maintained that people flourish when provided with unconditional positive regard\u2014an attitude of total acceptance and valuing of a person regardless of their specific failures or flaws."
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 11.4
        concept_slugs:
        - psyc-humanistic-personality
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Carl Jung expanded psychoanalytic theory by proposing that all human beings share a reservoir of universal memory traces and archetypes derived from our species' ancestral history. What did Jung call this reservoir?
        interaction_type: single_choice
        response_spec:
          options:
          - The preconscious cognitive buffer
          - The id pleasure reservoir
          - The collective unconscious
          - The reciprocal determinism schema
        scoring_spec:
          correct_index: 2
        explanation: Carl Jung proposed the collective unconscious, an inherited layer of the unconscious mind containing universal evolutionary memories and symbolic archetypes (such as the shadow, anima, and hero) shared across all human cultures.
        difficulty: intermediate
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 11.2
        concept_slugs:
        - psyc-freudian-psychodynamics
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: According to Sigmund Freud, which structural component of personality operates entirely on the pleasure principle, seeking immediate gratification without regard to social reality?
        options:
        - The id
        - The ego
        - The superego
        - The persona
        correct_answer: 0
        explanation: The id is the innate, primitive psychodynamic structure present at birth that contains instinctual sexual and aggressive drives (Eros and Thanatos) driven entirely by the pleasure principle.
        concept_slugs:
        - psyc-freudian-psychodynamics
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Carl Rogers asserted that psychological health and personal growth are fostered when parents and therapists provide which condition without contingencies?
        options:
        - Rational cognitive disputation
        - Unconditional positive regard
        - Systematic behavioral reinforcement
        - Controlled psychoanalytic analysis
        correct_answer: 1
        explanation: Unconditional positive regard is an attitude of total acceptance, empathy, and warmth extended to an individual regardless of their faults or behaviors, promoting congruence between actual and ideal selves.
        concept_slugs:
        - psyc-humanistic-personality
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What principle governs the id versus the ego?
      back: The id operates on the pleasure principle; the ego operates on the reality principle.
      concept_slugs:
      - psyc-freudian-psychodynamics
    - front: What is projection in Freud's defense mechanisms?
      back: Disguising one's own threatening impulses by attributing them to others.
      concept_slugs:
      - psyc-freudian-psychodynamics
  - code: '9.2'
    title: Analyze the Big Five trait taxonomy, social-cognitive theory, and personality assessments
    description: Evaluate the OCEAN trait dimensions, explain Bandura's reciprocal determinism and locus of control, and contrast projective tests with the MMPI-2.
    sort_order: 2
    importance: core
    citation: College Board Objective 9.2
    concepts:
    - slug: psyc-big-five-traits
      name: Big Five Trait Taxonomy (OCEAN)
      short_definition: 'Five broad empirical dimensions of personality: Openness, Conscientiousness, Extraversion, Agreeableness, and Neuroticism.'
      description: Paul Costa and Robert McCrae established the OCEAN five-factor model as the cross-culturally validated standard for describing individual trait differences.
      citation: OpenStax Psychology 2e, Section 11.7
    - slug: psyc-social-cognitive-assessment
      name: Reciprocal Determinism, Locus of Control, and Personality Testing
      short_definition: Interaction of cognition, environment, and behavior (Bandura, Rotter) alongside projective tests (Rorschach, TAT) and objective inventories (MMPI-2).
      description: Reciprocal determinism and locus of control evaluate behavioral agency; personality measurement contrasts subjective projective tests with empirical inventories.
      citation: OpenStax Psychology 2e, Section 11.8 & 11.9
      prerequisites:
      - psyc-big-five-traits
    lessons:
    - title: Trait Perspectives, Social-Cognitive Theory, and Personality Testing
      description: The OCEAN five-factor model, Bandura's reciprocal determinism, internal vs. external locus of control, projective tests, and the MMPI-2.
      emoji: "\U0001F4CA"
      tags:
      - traits
      - ocean
      - big-five
      - bandura
      - mmpi
      - rorschach
      concept_slugs:
      - psyc-big-five-traits
      - psyc-social-cognitive-assessment
      citation: OpenStax Psychology 2e, Section 11.7, 11.8, & 11.9
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Big Five Trait Taxonomy (OCEAN)

            Developed by Paul Costa and Robert McCrae through factor analysis, the **Five-Factor Model (OCEAN)** represents the gold standard of contemporary trait psychology:

            | Dimension | High End Characteristics | Low End Characteristics |
            | :--- | :--- | :--- |
            | **Openness** | Imaginative, intellectually curious, prefers variety | Practical, concrete, prefers routine and familiarity |
            | **Conscientiousness** | Highly organized, dependable, disciplined, goal-oriented | Disorganized, careless, impulsive, prone to procrastination |
            | **Extraversion** | Sociable, talkative, energized by social groups, assertive | Reserved, quiet, reflective, energized by solitude |
            | **Agreeableness** | Trusting, empathetic, cooperative, warm, soft-hearted | Suspicious, antagonistic, competitive, irritable |
            | **Neuroticism** | Emotionally reactive, prone to anxiety, mood swings, insecurity | Calm, emotionally resilient, secure, self-satisfied |
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Social-Cognitive Theory: Bandura and Rotter

            - **Reciprocal Determinism (Albert Bandura):** Personality is shaped by the dynamic, continuous three-way interaction between **cognitive/personal factors** (beliefs, self-efficacy), **behavioral actions**, and **environmental contexts**.
            - **Locus of Control (Julian Rotter):**
              * **Internal Locus of Control:** Belief that one's personal choices, hard work, and actions directly determine life outcomes.
              * **External Locus of Control:** Belief that chance, luck, systemic forces, or powerful others determine one's fate.

            ### Evaluating Personality Assessments

            - **Projective Tests (Rorschach Inkblot, TAT):** Present ambiguous visual stimuli onto which examinees project unconscious conflicts. Subject to scorer subjectivity and low psychometric reliability.
            - **Objective Inventories (MMPI-2):** Standardized 567-item true/false questionnaire developed via **empirical criterion keying**. Features clinical scales and built-in validity/lie scales to detect deception.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: 'The Big Five Mnemonic: OCEAN or CANOE'
          body: |-
            Remember the five dimensions with the acronym **OCEAN**:
            - **O**penness
            - **C**onscientiousness
            - **E**xtraversion
            - **A**greeableness
            - **N**euroticism
      - sort_order: 4
        block_type: example
        content:
          title: 'Applied Workplace Case: Predicting Occupational Performance'
          text: An industrial-organizational psychologist evaluates candidate profiles for an airline pilot position. Research confirms that **Conscientiousness** is the single strongest Big Five predictor of job performance across diverse occupations. For pilots, high Conscientiousness (methodical adherence to preflight checklists) and low Neuroticism (emotional stability during turbulence) are paramount.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Projective vs. Objective Tests'
          body: 'Do not confuse the **Thematic Apperception Test (TAT)** (projective: asking subjects to create stories about ambiguous black-and-white interpersonal drawings) with the **MMPI-2** (objective: standardized true/false inventory scored by computer with empirical validity scales).'
      terms:
      - term: Reciprocal Determinism
        definition: Bandura's concept that cognitive personal factors, observable behavior, and environmental context continuously interact and influence one another.
        example: A student's love of biology (cognition) leads to joining the science club (environment), which reinforces studying habits (behavior).
      - term: Conscientiousness
        definition: A Big Five personality dimension characterized by self-discipline, organization, carefulness, and a strong drive for achievement.
        example: A project manager who consistently completes milestones ahead of deadlines with meticulous documentation.
      - term: Minnesota Multiphasic Personality Inventory (MMPI-2)
        definition: The most widely researched and clinically used objective personality test, originally developed to identify emotional and psychological disorders.
        example: Using MMPI-2 validity scales to detect whether a job applicant is 'faking good' to appear exceptionally virtuous.
      assessment_items:
      - prompt: Which dimension of the Big Five personality taxonomy is characterized by being disciplined, dependable, highly organized, and achievement-oriented?
        interaction_type: single_choice
        response_spec:
          options:
          - Openness to experience
          - Extraversion
          - Agreeableness
          - Conscientiousness
        scoring_spec:
          correct_index: 3
        explanation: Conscientiousness describes an individual's degree of organization, persistence, responsibility, and goal-directed behavior. Individuals high in conscientiousness are reliable, systematic, and self-disciplined.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 11.7
        concept_slugs:
        - psyc-big-five-traits
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Albert Bandura's concept of reciprocal determinism proposes that personality is shaped through the dynamic, ongoing interaction among which three components?
        interaction_type: single_choice
        response_spec:
          options:
          - Cognitive factors, behavioral actions, and environmental context
          - Id impulses, ego reality boundaries, and superego moral ideals
          - Genetic predispositions, neuroendocrine status, and physical traits
          - Sensory iconic inputs, working memory buffers, and long-term storage
        scoring_spec:
          correct_index: 0
        explanation: Reciprocal determinism describes the bidirectional, interacting influences between personal cognitive factors (beliefs, expectations), behavior, and environmental influences, each constantly shaping the other two.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 11.8
        concept_slugs:
        - psyc-social-cognitive-assessment
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A student attributes their high grade on an exam to their diligent study routine and analytical preparation. Julian Rotter would describe this student as possessing which cognitive mindset?
        interaction_type: single_choice
        response_spec:
          options:
          - An external locus of control
          - An internal locus of control
          - An avoidant attachment schema
          - A reaction formation defense
        scoring_spec:
          correct_index: 1
        explanation: An internal locus of control is the perception that one controls their own fate and that life outcomes are determined by personal effort, decisions, and capabilities rather than chance or powerful external forces.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 11.8
        concept_slugs:
        - psyc-social-cognitive-assessment
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In contrast to projective instruments like the Rorschach Inkblot test, the Minnesota Multiphasic Personality Inventory (MMPI-2) is classified as an objective test primarily because it features which psychometric property?
        interaction_type: single_choice
        response_spec:
          options:
          - Empirically keyed standardized questions with objective scoring
          - Open-ended free association prompts interpreted qualitatively
          - Unstructured storytelling about ambiguous interpersonal drawings
          - Neurological functional magnetic resonance imaging validation
        scoring_spec:
          correct_index: 0
        explanation: The MMPI-2 is an objective self-report inventory comprising 567 standardized true/false questions that are scored objectively (often by computer) using empirical criterion keying, minimizing subjective examiner interpretation.
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 11.9
        concept_slugs:
        - psyc-social-cognitive-assessment
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which dimension of the Five-Factor Model (Big Five) describes individuals who are organized, disciplined, dependable, and goal-directed?
        options:
        - Extraversion
        - Agreeableness
        - Conscientiousness
        - Openness to experience
        correct_answer: 2
        explanation: Conscientiousness reflects self-regulation, impulse control, thoroughness, dependability, and persistence in pursuing long-term objectives.
        concept_slugs:
        - psyc-big-five-traits
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Albert Bandura's concept that behavioral patterns, cognitive internal personal factors, and environmental contexts constantly influence and shape one another is called what?
        options:
        - Locus of control
        - Self-serving bias
        - Trait-state interaction
        - Reciprocal determinism
        correct_answer: 3
        explanation: Reciprocal determinism describes the dynamic bidirectional interaction where personal cognitive factors, overt behavior, and environmental events mutually influence one another.
        concept_slugs:
        - psyc-social-cognitive-assessment
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What are the Big Five personality traits in the OCEAN model?
      back: Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism.
      concept_slugs:
      - psyc-big-five-traits
    - front: What does Julian Rotter's internal locus of control mean?
      back: Believing that you are the master of your own destiny and responsible for your outcomes.
