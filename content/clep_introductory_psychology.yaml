- code: '10.0'
  title: Psychological Disorders and Health
  description: DSM-5 classification, biopsychosocial etiology, anxiety disorders, OCD, PTSD, mood and bipolar disorders, schizophrenia spectrum, and personality disorders.
  weight: 0.085
  sort_order: 10
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 10.0 (8\u20139%)"
  objectives:
  - code: '10.1'
    title: Analyze diagnostic classification criteria, the medical/biopsychosocial models, and anxiety/trauma disorders
    description: Evaluate DSM-5 diagnostic frameworks, analyze the Rosenhan labeling study, and contrast generalized anxiety, panic, phobias, OCD, and PTSD.
    sort_order: 1
    importance: core
    citation: College Board Objective 10.1
    concepts:
    - slug: psyc-disorder-classification
      name: Diagnostic Classification and Biopsychosocial Etiology
      short_definition: Defining psychological disorders via deviance, distress, and dysfunction, classified by the DSM-5-TR under the diathesis-stress framework.
      description: The medical model views disorders as illnesses; the diathesis-stress model integrates genetic predisposition with environmental stressors; Rosenhan demonstrated diagnostic labeling bias.
      citation: OpenStax Psychology 2e, Section 15.1 & 15.2
    - slug: psyc-anxiety-ocd-ptsd
      name: Anxiety Disorders, OCD, and PTSD
      short_definition: Pathological anxiety syndromes (GAD, panic, phobias), obsessions/compulsions in OCD, and trauma intrusions in PTSD.
      description: Anxiety involves autonomic hyperarousal; OCD features cognitive obsessions relieved by behavioral compulsions; PTSD involves flashbacks and avoidance.
      citation: OpenStax Psychology 2e, Section 15.3, 15.4, & 15.5
      prerequisites:
      - psyc-disorder-classification
    lessons:
    - title: 'Psychological Disorders: Classification, Anxiety, OCD, and Trauma'
      description: The 4 D's, DSM-5 criteria, Rosenhan's hospital study, GAD, panic disorder, agoraphobia, obsessions vs. compulsions, and PTSD.
      emoji: "\U0001F9E0"
      tags:
      - disorders
      - dsm5
      - anxiety
      - ocd
      - ptsd
      - rosenhan
      concept_slugs:
      - psyc-disorder-classification
      - psyc-anxiety-ocd-ptsd
      citation: OpenStax Psychology 2e, Chapter 15
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Defining Abnormality and the DSM-5 Framework

            Mental health professionals define psychological disorders using the **4 D's**:
            - **Deviance:** Thoughts and behaviors that differ significantly from societal cultural norms.
            - **Distress:** Subjective emotional pain, suffering, or torment experienced by the individual.
            - **Dysfunction:** Interference with daily occupational, social, or academic functioning (the central diagnostic criterion).
            - **Danger:** Substantial risk of harm to oneself or others.

            The American Psychiatric Association's **DSM-5-TR** provides detailed, standardized categorical criteria without endorsing a single theoretical origin. The **Diathesis-Stress Model** posits that disorders result from a pre-existing biological or genetic vulnerability (**diathesis**) activated by severe environmental stress.
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Anxiety, Obsessive-Compulsive, and Trauma Disorders

            | Disorder | Core Symptom Profile | Diagnostic Hallmark |
            | :--- | :--- | :--- |
            | **Generalized Anxiety Disorder (GAD)** | Chronic, diffuse, unfocused apprehension lasting $\ge 6$ months | 'Free-floating' anxiety accompanied by muscle tension and fatigue |
            | **Panic Disorder** | Recurrent sudden surges of terrifying autonomic panic | Anticipatory terror; frequently accompanied by **agoraphobia** |
            | **Specific Phobia** | Persistent, irrational fear and avoidance of a specific object | Disproportionate dread; recognized by adult as irrational |
            | **Obsessive-Compulsive Disorder (OCD)** | Intrusive thoughts paired with repetitive ritualistic acts | **Obsessions** (anxiety-provoking thoughts) drive **Compulsions** (anxiety-reducing behaviors) |
            | **Post-Traumatic Stress Disorder (PTSD)** | Follows severe life-threatening trauma | Intrusive flashbacks, nightmares, hyperarousal, avoidance of trauma cues |
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Obsessions vs. Compulsions in OCD
          body: '**Obsessions are repetitive THOUGHTS** (e.g., persistent terrifying fear of microbial contamination). **Compulsions are repetitive BEHAVIORS or mental rituals** (e.g., washing hands raw for 20 minutes) performed to neutralize the anxiety caused by the obsession via negative reinforcement.'
      - sort_order: 4
        block_type: example
        content:
          title: 'Historical Psychiatric Experiment: David Rosenhan''s Hospital Study'
          text: In 1973, David Rosenhan sent eight sane pseudopatients to various psychiatric hospitals claiming they heard a single auditory voice saying 'empty, hollow, thud.' All were admitted and diagnosed with schizophrenia. Once admitted, they acted completely normal. Hospital staff failed to detect them; normal behaviors (like writing notes in a diary) were documented as pathological 'patient engages in excessive note-taking behavior.' The study demonstrated the profound, persistent biasing power of **diagnostic labels**.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Panic Disorder vs. GAD'
          body: '**Generalized Anxiety Disorder (GAD)** is continuous, persistent, low-to-moderate ''free-floating'' anxiety lasting months. **Panic Disorder** involves sudden, acute, intense attacks of terror lasting minutes that strike unexpectedly.'
      terms:
      - term: Obsessions
        definition: Persistent, intrusive, involuntary thoughts, urges, or mental images that cause marked anxiety or distress.
        example: An unrelenting fear that one will accidentally leave the stove gas on and burn down the house.
      - term: Compulsions
        definition: Repetitive, ritualistic behaviors or mental acts that an individual feels driven to perform to reduce anxiety created by an obsession.
        example: Checking the front door lock exactly sixteen times in a rigid sequence before leaving.
      - term: Diathesis-Stress Model
        definition: A psychological theory explaining that a disorder results from an interaction between an underlying genetic/biological vulnerability and environmental stress.
        example: A person possessing genetic risk for depression becoming clinically depressed only after enduring a severe divorce and job loss.
      assessment_items:
      - prompt: An individual experiences persistent, intrusive thoughts that their hands are covered in lethal bacteria, creating severe anxiety. To relieve this distress, they wash their hands thirty times an hour. In psychiatric terminology, what is the handwashing behavior?
        interaction_type: single_choice
        response_spec:
          options:
          - A compulsion
          - An obsession
          - A delusion
          - A hallucination
        scoring_spec:
          correct_index: 0
        explanation: In obsessive-compulsive disorder, the intrusive thoughts regarding contamination are obsessions, whereas the repetitive behavioral rituals performed to reduce the anxiety generated by those thoughts (handwashing) are compulsions.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 15.4
        concept_slugs:
        - psyc-anxiety-ocd-ptsd
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In David Rosenhan's famous 1973 study 'On Being Sane in Insane Places,' what did the behavior of the hospital staff toward the pseudopatients reveal?
        interaction_type: single_choice
        response_spec:
          options:
          - Psychiatric diagnostic criteria were objective and immune to bias
          - Diagnostic labels strongly influenced how staff interpreted normal behaviors
          - Pseudopatients developed actual psychotic symptoms due to institutionalization
          - Antipsychotic medications produced immediate behavioral remission
        scoring_spec:
          correct_index: 1
        explanation: Rosenhan's study demonstrated that once individuals were labeled with schizophrenia, hospital staff interpreted completely normal, ordinary behaviors (such as pacing out of boredom or taking notes) as pathological manifestations of mental illness.
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 15.1
        concept_slugs:
        - psyc-disorder-classification
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: An individual experiences sudden, unpredictable episodes of intense terror accompanied by heart palpitations, chest pain, dizziness, and a feeling of impending doom, leading them to fear leaving home. What diagnosis is indicated?
        interaction_type: single_choice
        response_spec:
          options:
          - Obsessive-compulsive disorder
          - Bipolar II hypomania
          - Panic disorder with agoraphobia
          - Schizotypal personality disorder
        scoring_spec:
          correct_index: 2
        explanation: Panic disorder is defined by recurrent unexpected panic attacks featuring intense autonomic symptoms. When individuals fear having attacks in public spaces from which escape might be difficult, agoraphobia frequently develops.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 15.3
        concept_slugs:
        - psyc-anxiety-ocd-ptsd
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Six months after surviving a severe industrial chemical explosion, a worker suffers recurrent nightmares, vivid flashbacks, emotional numbing, and severe hypervigilance. What diagnosis is warranted?
        interaction_type: single_choice
        response_spec:
          options:
          - Dissociative fugue
          - Generalized anxiety disorder
          - Acute stress disorder
          - Post-traumatic stress disorder
        scoring_spec:
          correct_index: 3
        explanation: Post-traumatic stress disorder (PTSD) is diagnosed when symptoms of intrusive memories, flashbacks, hyperarousal, avoidance of trauma cues, and negative alterations in mood persist for longer than one month following exposure to a traumatic event.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 15.5
        concept_slugs:
        - psyc-anxiety-ocd-ptsd
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: In obsessive-compulsive disorder (OCD), repetitive behaviors or mental rituals (such as excessive handwashing or checking locks) primarily serve what psychological function?
        options:
        - To temporarily reduce the intense distress caused by intrusive obsessive thoughts
        - To induce pleasant euphoric sensations and reward dopamine release
        - To consciously deceive observers and gain external secondary gain
        - To establish psychotic detachment from stressful physical reality
        correct_answer: 0
        explanation: Compulsions are repetitive behaviors performed according to rigid rules to diminish the severe anxiety or distress evoked by intrusive, uncontrollable obsessive thoughts.
        concept_slugs:
        - psyc-anxiety-ocd-ptsd
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: What is the primary manual published by the American Psychiatric Association used by clinicians in the United States to diagnose psychological disorders?
        options:
        - International Classification of Diseases (ICD-11)
        - Diagnostic and Statistical Manual of Mental Disorders (DSM-5-TR)
        - Physicians' Desk Reference for Neuropsychology (PDR-7)
        - Standardized Psychometric Classification Guide (SPCG-3)
        correct_answer: 1
        explanation: The DSM-5 (and DSM-5-TR) is the standard classification manual in US clinical practice, establishing diagnostic criteria, symptom thresholds, and exclusionary conditions for mental disorders.
        concept_slugs:
        - psyc-disorder-classification
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the difference between an obsession and a compulsion?
      back: An obsession is an intrusive anxiety-provoking thought; a compulsion is a repetitive behavior performed to reduce that anxiety.
      concept_slugs:
      - psyc-anxiety-ocd-ptsd
    - front: What does the diathesis-stress model propose?
      back: A disorder emerges when an underlying biological vulnerability is triggered by environmental stress.
      concept_slugs:
      - psyc-disorder-classification
  - code: '10.2'
    title: Analyze depressive, bipolar, schizophrenia spectrum, and personality disorders
    description: Examine major depressive and bipolar episodes, contrast positive vs. negative symptoms of schizophrenia, and analyze Cluster B antisocial personality disorder.
    sort_order: 2
    importance: core
    citation: College Board Objective 10.2
    concepts:
    - slug: psyc-mood-bipolar-disorders
      name: Depressive and Bipolar Disorders
      short_definition: Mood disturbances spanning Major Depressive Disorder (anhedonia, lethargy) and Bipolar Disorder (alternating depression and mania).
      description: Depression involves monoamine deficits and pessimistic cognitive triads; Bipolar I requires at least one full manic episode.
      citation: OpenStax Psychology 2e, Section 15.6 & 15.7
    - slug: psyc-schizophrenia-personality
      name: Schizophrenia Spectrum and Personality Disorders
      short_definition: Psychotic positive/negative symptoms driven by dopamine dysregulation, and inflexible personality patterns like antisocial disorder.
      description: Schizophrenia features delusions, hallucinations, and flat affect; antisocial personality disorder features lack of remorse and pervasive rights violations.
      citation: OpenStax Psychology 2e, Section 15.8 & 15.9
      prerequisites:
      - psyc-mood-bipolar-disorders
    lessons:
    - title: Depressive, Bipolar, Schizophrenic, and Personality Pathology
      description: MDD, bipolar mania, positive vs. negative symptoms of schizophrenia, the dopamine hypothesis, and antisocial personality disorder.
      emoji: "\U0001F3AD"
      tags:
      - depression
      - bipolar
      - mania
      - schizophrenia
      - dopamine
      - personality-disorders
      concept_slugs:
      - psyc-mood-bipolar-disorders
      - psyc-schizophrenia-personality
      citation: OpenStax Psychology 2e, Section 15.6, 15.7, 15.8, & 15.9
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Mood and Bipolar Disorders\n\n- **Major Depressive Disorder (MDD):** A persistent state of despair and **anhedonia** (inability to experience pleasure) lasting at least **2 weeks**, accompanied by sleep disruptions, feelings of worthlessness, fatigue, and suicidal thoughts.\n- **Bipolar I Disorder:** Mood swings alternating between depressive episodes and full **manic episodes**\u2014hyperactive, euphoric, grandiose states marked by racing thoughts, rapid flight of ideas, decreased need for sleep, and impulsive financial or sexual recklessness.\n- **Cognitive Etiology (Aaron Beck):** Depressive symptoms are reinforced by the **Cognitive Triad**: automatic negative views about **oneself**, the **world**, and the **future**."
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Schizophrenia Spectrum: Positive vs. Negative Symptoms

            Schizophrenia is a severe psychotic disorder characterized by a disintegration of thought, emotion, and perception:

            | Category | Clinical Definition | Symptom Examples |
            | :--- | :--- | :--- |
            | **Positive Symptoms** | Presence of inappropriate or abnormal psychological experiences | **Hallucinations** (sensory perceptions without stimuli, most often auditory voices); **Delusions** (fixed false beliefs of persecution or grandeur); Disorganized speech ('word salad') |
            | **Negative Symptoms** | Absence or deficit of normal psychological functioning | **Flat affect** (monotone voice, blank facial expression); **Avolition** (total lack of initiative); **Alogia** (poverty of speech); Social withdrawal |

            **Biological Etiology:** Linked to the **dopamine hypothesis** (excessive dopamine D2 receptor signaling in subcortical brain pathways), enlarged fluid-filled cerebral ventricles, and prenatal neurodevelopmental insults.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Delusion vs. Hallucination
          body: |-
            - A **delusion is a false BELIEF** (e.g., believing the CIA is transmitting secret messages through the microwave).
            - A **hallucination is a false SENSORY PERCEPTION** (e.g., hearing voices arguing in an empty room).
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Forensic Case: Antisocial Personality Disorder'
          text: 'A 32-year-old con artist defrauds elderly investors out of their life savings. When interrogated, the individual displays no remorse, empathy, or guilt, boasting: ''If they were stupid enough to give me their money, they deserved to lose it.'' This pattern of callous deceit, disregard for the rights of others, and absence of conscience characterizes **Antisocial Personality Disorder** (Cluster B).'
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Schizophrenia is NOT Dissociative Identity Disorder'
          body: Popular media frequently confuses **schizophrenia** (a psychotic disorder involving hallucinations and delusions) with **Dissociative Identity Disorder (DID)** (formerly 'multiple personality disorder,' involving two or more distinct split personalities). They are completely distinct diagnostic entities.
      terms:
      - term: Hallucination
        definition: A false sensory perception occurring in the absence of any external physical stimulus, most frequently auditory in schizophrenia.
        example: Hearing voices commenting on one's actions when no one is speaking.
      - term: Delusion
        definition: A firmly held false belief that persists despite overwhelming contradictory evidence, common in psychotic disorders.
        example: Believing that one is an extraterrestrial royalty tasked with controlling world weather patterns.
      - term: Antisocial Personality Disorder
        definition: A personality disorder characterized by a pervasive pattern of disregard for and violation of the rights of others, lack of empathy, and deceitfulness.
        example: A chronic criminal who repeatedly exploits others without experiencing guilt or moral remorse.
      assessment_items:
      - prompt: A patient diagnosed with schizophrenia firmly believes that television news anchors are broadcasting secret coded messages about their personal thoughts. What psychotic symptom is demonstrated?
        interaction_type: single_choice
        response_spec:
          options:
          - A delusion of reference
          - An auditory hallucination
          - A catatonic motor stupor
          - A dissociative fugue state
        scoring_spec:
          correct_index: 0
        explanation: A delusion is a fixed false belief. Specifically, a delusion of reference involves the mistaken conviction that neutral external events, television broadcasts, or remarks have direct, special personal significance directed at the individual.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 15.8
        concept_slugs:
        - psyc-schizophrenia-personality
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which symptom of schizophrenia is classified by clinical psychiatrists as a negative symptom rather than a positive symptom?
        interaction_type: single_choice
        response_spec:
          options:
          - Persecutory paranoia
          - Flat emotional affect
          - Auditory hallucinations
          - Disorganized speech
        scoring_spec:
          correct_index: 1
        explanation: Negative symptoms represent the reduction or loss of normal functions. Flat affect (expressionless face and monotone voice), avolition, and alogia are negative symptoms. Hallucinations, delusions, and disorganized speech are positive symptoms (the presence of abnormal behaviors).
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 15.8
        concept_slugs:
        - psyc-schizophrenia-personality
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Over the past two weeks, a patient has experienced grandiosity, slept only two hours a night without fatigue, spoken at blinding speed, and maxed out their credit cards on impulsive speculative real estate. What diagnosis is indicated?
        interaction_type: single_choice
        response_spec:
          options:
          - Major depressive disorder
          - Persistent dysthymic disorder
          - Bipolar I manic episode
          - Generalized anxiety disorder
        scoring_spec:
          correct_index: 2
        explanation: A manic episode in Bipolar I Disorder is characterized by an abnormally elevated or irritable mood, grandiosity, decreased need for sleep, pressured speech, racing thoughts, and high-risk impulsive behavior.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 15.7
        concept_slugs:
        - psyc-mood-bipolar-disorders
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: An adult demonstrates a lifelong history of criminal deceit, aggressive impulsivity, chronic manipulation, and a total absence of guilt or empathy toward victims. What diagnostic category does this individual match?
        interaction_type: single_choice
        response_spec:
          options:
          - Borderline personality disorder
          - Narcissistic personality disorder
          - Schizoid personality disorder
          - Antisocial personality disorder
        scoring_spec:
          correct_index: 3
        explanation: Antisocial personality disorder (Cluster B) is characterized by a pervasive pattern of disregard for and violation of the rights of others, deceitfulness, impulsivity, irritability, and a lack of remorse or conscience.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 15.9
        concept_slugs:
        - psyc-schizophrenia-personality
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: A patient exhibiting periods of profound depressive despair alternating with episodes of elevated euphoria, decreased need for sleep, and reckless grandiosity meets criteria for what disorder?
        options:
        - Major depressive disorder
        - Persistent depressive disorder
        - Bipolar I disorder
        - Generalized anxiety disorder
        correct_answer: 2
        explanation: Bipolar I disorder is defined by the occurrence of at least one full manic episode (characterized by inflated self-esteem, grandiosity, reduced sleep, and impulsive spending), typically alternating with major depressive episodes.
        concept_slugs:
        - psyc-mood-bipolar-disorders
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: In schizophrenia, auditory hallucinations and persecutory delusions are classified as which type of symptoms?
        options:
        - Negative symptoms
        - Catatonic motor signs
        - Affective deficits
        - Positive symptoms
        correct_answer: 3
        explanation: Positive symptoms in schizophrenia represent excess or distortion of normal functioning (hallucinations, delusions, disorganized speech), whereas negative symptoms represent deficits (avolition, flat affect).
        concept_slugs:
        - psyc-schizophrenia-personality
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the difference between positive and negative symptoms of schizophrenia?
      back: Positive symptoms are additions to normal behavior (hallucinations, delusions); negative symptoms are deficits (flat affect, avolition).
      concept_slugs:
      - psyc-schizophrenia-personality
    - front: What neurotransmitter is hypothesized to be overactive in schizophrenia?
      back: Dopamine (the dopamine hypothesis).
      concept_slugs:
      - psyc-schizophrenia-personality
- code: '11.0'
  title: Treatment of Psychological Disorders
  description: Psychotherapy modalities (psychodynamic, humanistic, behavioral, cognitive-behavioral), psychopharmacological agents, ECT, and treatment efficacy.
  weight: 0.065
  sort_order: 11
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 11.0 (6\u20137%)"
  objectives:
  - code: '11.1'
    title: Analyze psychological therapies across psychodynamic, humanistic, behavioral, and cognitive orientations
    description: Examine psychoanalytic transference, Rogers's client-centered active listening, Wolpe's systematic desensitization, and Beck/Ellis cognitive restructuring.
    sort_order: 1
    importance: core
    citation: College Board Objective 11.1
    concepts:
    - slug: psyc-psychotherapy-modalities
      name: Psychodynamic, Humanistic, and Behavioral Therapies
      short_definition: Major therapeutic traditions emphasizing unconscious insight (Freud), personal growth (Rogers), and learned counterconditioning (Wolpe).
      description: Techniques include free association, resistance, transference, unconditional positive regard, systematic desensitization, and token economies.
      citation: OpenStax Psychology 2e, Section 16.2
    - slug: psyc-cognitive-behavioral-therapy
      name: Cognitive Restructuring and REBT
      short_definition: Therapies targeting maladaptive, irrational thinking patterns through cognitive reappraisal and behavioral activation.
      description: Beck's cognitive therapy disputes automatic catastrophic assumptions; Ellis's REBT challenges irrational beliefs via the ABC model.
      citation: OpenStax Psychology 2e, Section 16.2
      prerequisites:
      - psyc-psychotherapy-modalities
    lessons:
    - title: 'Psychological Therapies: Insight, Behavior, and Cognitive Approaches'
      description: Psychoanalysis, client-centered therapy, systematic desensitization, token economies, Ellis's REBT, and Beck's CBT.
      emoji: "\U0001F6CB\uFE0F"
      tags:
      - therapy
      - cbt
      - psychoanalysis
      - desensitization
      - beck
      - rogers
      concept_slugs:
      - psyc-psychotherapy-modalities
      - psyc-cognitive-behavioral-therapy
      citation: 'OpenStax Psychology 2e, Section 16.2: Types of Treatment'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Major Psychotherapy Orientations

            | Therapeutic Approach | Founding Theorists | Primary Mechanism of Change | Hallmark Techniques |
            | :--- | :--- | :--- | :--- |
            | **Psychoanalysis** | Sigmund Freud | Bringing repressed unconscious conflicts into conscious awareness | **Free association**, dream analysis, resolving **resistance** and **transference** |
            | **Client-Centered (Humanistic)** | Carl Rogers | Fostering self-actualization by resolving actual/ideal self incongruence | Nondirective **active listening**, empathy, **unconditional positive regard**, genuineness |
            | **Behavior Therapy** | Joseph Wolpe, B. F. Skinner | Replacing maladaptive learned responses with adaptive behaviors via conditioning | **Systematic desensitization**, exposure therapy, flooding, aversive conditioning, **token economy** |
            | **Cognitive Therapy (CBT)** | Aaron Beck, Albert Ellis | Identifying and disputing irrational, catastrophic cognitive distortions | **Cognitive restructuring**, Ellis's **ABC model** (Activating event, Belief, Consequence) |
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Joseph Wolpe's Systematic Desensitization

            Based on **classical counterconditioning** and reciprocal inhibition (one cannot be simultaneously relaxed and terrified):
            1. The client is trained in deep **progressive muscle relaxation**.
            2. The client constructs an **anxiety hierarchy** (ranking fear-evoking scenes from least to most terrifying, e.g., looking at a picture of a spider $\rightarrow$ holding a tarantula).
            3. The client progressively pairs deep relaxation with each scene in the hierarchy until the phobic response is extinguished.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Psychoanalytic Transference
          body: '**Transference** occurs when a patient unconsciously redirects emotions, expectations, and conflicts originally experienced with key childhood figures (such as a parent) onto the therapist. Analyzing transference provides a window into unresolved childhood relational dynamics.'
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Case: Systematic Desensitization for Aviophobia'
          text: A businesswoman with a severe phobia of commercial flight undergoes systematic desensitization. While maintaining deep diaphragmatic relaxation, she visualizes booking a flight, driving to the airport, boarding the plane, and experiencing takeoff. After eight sessions, she boards a real flight without panic.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Flooding vs. Systematic Desensitization'
          body: '**Systematic desensitization** is gradual, pairing progressive relaxation with an anxiety hierarchy. **Flooding** is immediate, continuous exposure to the maximum feared stimulus (e.g., placing the spider directly in the patient''s hands) until the sympathetic nervous response exhausts itself.'
      terms:
      - term: Systematic Desensitization
        definition: A behavior therapy technique that pairs progressive relaxation with gradual exposure to an anxiety hierarchy to extinguish phobias.
        example: Overcoming a fear of heights by relaxing while looking out a first-floor, then fifth-floor, then twentieth-floor window.
      - term: Transference
        definition: In psychoanalysis, the patient's unconscious transfer of intense feelings or desires linked with parents or key figures onto the analyst.
        example: A client becoming irrationally furious at their therapist for rescheduling, mirroring feelings toward an unreliable father.
      - term: Cognitive Restructuring
        definition: A cognitive therapy technique that teaches clients to identify, challenge, and replace irrational, distorted automatic thoughts.
        example: Replacing the catastrophic belief 'If I fail this exam, my life is ruined' with 'A low score is disappointing, but I can study and retake the course.'
      assessment_items:
      - prompt: A therapist helps a client conquer a severe dog phobia by first training the client in deep relaxation, and then gradually exposing them to pictures of dogs, viewing a dog through a window, and finally petting a therapy dog. What therapeutic technique is being used?
        interaction_type: single_choice
        response_spec:
          options:
          - Systematic desensitization
          - Psychoanalytic free association
          - Flooding exposure therapy
          - Aversive counterconditioning
        scoring_spec:
          correct_index: 0
        explanation: Systematic desensitization, developed by Joseph Wolpe, is a classical counterconditioning therapy that pairs progressive relaxation with a graduated hierarchy of anxiety-provoking stimuli to systematically extinguish a phobic reaction.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 16.2
        concept_slugs:
        - psyc-psychotherapy-modalities
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: "During long-term psychoanalysis, a patient begins treating their therapist with intense, bitter anger, accusing the therapist of being cold, distant, and unsupportive\u2014mirroring the patient's unresolved childhood relationship with their father. What clinical phenomenon is occurring?"
        interaction_type: single_choice
        response_spec:
          options:
          - Resistance
          - Transference
          - Sublimation
          - Incongruence
        scoring_spec:
          correct_index: 1
        explanation: Transference occurs in psychoanalysis when a patient unconsciously projects and redirects emotional feelings, conflicts, and expectations originally experienced with important childhood figures (such as parents) onto the therapist.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 16.2
        concept_slugs:
        - psyc-psychotherapy-modalities
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: "Which therapeutic modality focuses specifically on identifying automatic cognitive distortions\u2014such as catastrophizing and all-or-nothing thinking\u2014and replacing them with objective, realistic appraisals?"
        interaction_type: single_choice
        response_spec:
          options:
          - Client-centered humanistic therapy
          - Psychodynamic dream analysis
          - Aaron Beck's cognitive therapy
          - Operant token economy therapy
        scoring_spec:
          correct_index: 2
        explanation: Aaron Beck's cognitive therapy focuses on identifying maladaptive cognitive schemas and automatic negative thoughts (such as arbitrary inference and catastrophizing) and actively restructuring them through collaborative empirical questioning.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 16.2
        concept_slugs:
        - psyc-cognitive-behavioral-therapy
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Aaron Beck's cognitive therapy for major depression focuses primarily on identifying and modifying which psychological mechanism?
        options:
        - Automatic negative thoughts and distorted cognitive schemas (the cognitive triad)
        - Repressed childhood sexual conflicts stored within the dynamic unconscious
        - Conditioned physiological responses using flooding and aversion protocols
        - Incongruence between the client's actual and ideal self-concepts
        correct_answer: 0
        explanation: Beck's cognitive therapy systematically targets cognitive distortions (such as catastrophizing, black-and-white thinking, and negative schemas about self, world, and future) through empirical cognitive restructuring.
        concept_slugs:
        - psyc-cognitive-behavioral-therapy
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Which behavioral exposure therapy technique pairs gradual exposure to an anxiety-provoking hierarchy with progressive muscle relaxation?
        options:
        - Aversive counterconditioning
        - Systematic desensitization
        - Free association therapy
        - Rational emotive behavior
        correct_answer: 1
        explanation: 'Developed by Joseph Wolpe, systematic desensitization utilizes counterconditioning: clients learn progressive relaxation and mentally or in vivo confront a graduated fear hierarchy, replacing anxiety with relaxation.'
        concept_slugs:
        - psyc-psychotherapy-modalities
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the core principle behind Joseph Wolpe's systematic desensitization?
      back: 'Counterconditioning: an individual cannot be simultaneously relaxed and terrified (reciprocal inhibition).'
      concept_slugs:
      - psyc-psychotherapy-modalities
    - front: What does Albert Ellis's ABC model stand for in Rational Emotive Behavior Therapy (REBT)?
      back: A = Activating event, B = Belief, C = emotional Consequence.
      concept_slugs:
