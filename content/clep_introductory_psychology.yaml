stimuli:
- id: stim-experimental-design-sleep
  stimulus_type: scenario
  title: Sleep Deprivation and Memory Consolidation Study
  body: A cognitive psychologist recruits 80 undergraduate participants to study the effect of sleep on declarative memory consolidation. Participants are randomly assigned to either an 8-hour sleep condition or an 8-hour awake condition following a paired-associate word learning task. Memory retention is assessed via cued recall the next morning.
  structured_data:
    sample_size: 80
    independent_variable: Sleep condition (8-hour sleep vs. 8-hour wakefulness)
    dependent_variable: Percentage of paired-associate word pairs correctly recalled
    design_type: Between-subjects randomized experiment
  citation: College Board CLEP Introductory Psychology Objective 1.2 Methodology Blueprint
- id: stim-split-brain-presentation
  stimulus_type: scenario
  title: Split-Brain Visual Chimeric Presentation Experiment
  body: 'A patient whose corpus callosum was severed to treat intractable epilepsy participates in a tachistoscopic visual experiment. The word ''KEY'' is flashed to the left visual field (LVF) for 150 ms, while the word ''RING'' is simultaneously flashed to the right visual field (RVF). The patient is asked: (1) what word they saw, and (2) to retrieve the corresponding object with their left hand beneath an opaque screen.'
  structured_data:
    subject: Severed corpus callosum split-brain patient
    lvf_stimulus: KEY (projects to right cerebral hemisphere)
    rvf_stimulus: RING (projects to left cerebral hemisphere)
    language_hemisphere: Left hemisphere (Broca/Wernicke areas intact)
  citation: College Board Objective 2.3 Sperry & Gazzaniga Split-Brain Paradigm
- id: stim-classical-conditioning-extinction
  stimulus_type: data_table
  title: Conditioned Emotional Response Acquisition and Extinction Data
  body: A laboratory conditioning protocol measures freezing behavior (in seconds per 30-second trial) in response to a 1000 Hz auditory tone paired with a mild foot shock during acquisition, followed by tone-alone trials during extinction.
  structured_data:
    acquisition_trials:
    - 2
    - 8
    - 18
    - 25
    - 28
    extinction_trials:
    - 26
    - 21
    - 14
    - 6
    - 1
    spontaneous_recovery_trial_24h_later: 12
  citation: College Board Objective 5.1 Pavlovian Conditioning Paradigm
domains:
- code: '1.0'
  title: History, Approaches, and Methods
  description: Philosophical foundations, structuralism, functionalism, contemporary psychological perspectives, experimental design, correlational research, and APA ethical standards.
  weight: 0.115
  sort_order: 1
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 1.0 (11\u201312%)"
  objectives:
  - code: '1.1'
    title: Analyze historical foundations, foundational schools of thought, and contemporary perspectives
    description: Trace the transition from philosophy to empirical science, contrasting structuralism and functionalism with modern biological, behavioral, cognitive, humanistic, and psychodynamic perspectives.
    sort_order: 1
    importance: core
    citation: College Board Objective 1.1
    concepts:
    - slug: psyc-structuralism
      name: Structuralism
      short_definition: Early school of thought promoted by Wundt and Titchener using systematic introspection to isolate the basic elements of conscious experience.
      description: Structuralism sought to map the adult human mind by breaking conscious experience down into basic sensation and perception elements through rigorous introspection.
      citation: OpenStax Psychology 2e, Section 1.2
    - slug: psyc-functionalism
      name: Functionalism
      short_definition: Early school of thought influenced by William James and Charles Darwin examining how mental and behavioral processes function to enable adaptation.
      description: Functionalism focused on the practical adaptive utility of consciousness, habits, and mental operations in organisms navigating their environments.
      citation: OpenStax Psychology 2e, Section 1.2
      prerequisites:
      - psyc-structuralism
    - slug: psyc-contemporary-perspectives
      name: Contemporary Psychological Perspectives
      short_definition: Modern frameworks including biological, cognitive, behavioral, psychodynamic, humanistic, social-cultural, and evolutionary approaches to understanding behavior.
      description: Contemporary psychology utilizes multiple complementary levels of analysis (the biopsychosocial model) rather than a single unifying school of thought.
      citation: OpenStax Psychology 2e, Section 1.2
      prerequisites:
      - psyc-functionalism
    lessons:
    - title: Historical Foundations and Modern Perspectives in Psychology
      description: From Wundt's 1879 Leipzig laboratory and James's functionalism to the modern biopsychosocial model.
      emoji: "\U0001F9E0"
      tags:
      - history
      - perspectives
      - foundations
      concept_slugs:
      - psyc-structuralism
      - psyc-functionalism
      - psyc-contemporary-perspectives
      citation: 'OpenStax Psychology 2e, Section 1.2: History of Psychology'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### The Birth of Scientific Psychology\n\nPsychology formally transitioned from philosophical epistemology into an independent empirical science in **1879**, when **Wilhelm Wundt** established the first formal psychological research laboratory at the University of Leipzig in Germany. Wundt and his student **Edward Bradford Titchener** championed **structuralism**, an approach that sought to identify the constituent building blocks of conscious awareness through **introspection**\u2014rigorous, trained self-reports of immediate sensory and emotional reactions.\n\nIn reaction against structuralism's subjective fragility, American psychologist and philosopher **William James** established **functionalism**, heavily influenced by Charles Darwin's evolutionary theory. Functionalists argued that consciousness cannot be frozen into static sensory slices; instead, psychologists must investigate how mental processes operate as a dynamic, continuous stream enabling organisms to adapt,\
            \ survive, and thrive."
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Core Historical Contrast
          body: '**Structuralism** asks *''What are the basic components of the conscious mind?''* using introspective analysis. **Functionalism** asks *''Why did consciousness evolve and how does it help the organism adapt?''*'
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Contemporary Perspectives in Psychology

            Modern psychology avoids dogmatic allegiance to a single school of thought, instead employing the **biopsychosocial model**, which integrates biological, psychological, and social-cultural levels of analysis:

            | Perspective | Primary Focus | Key Historical Figures |
            | :--- | :--- | :--- |
            | **Biological** | Brain structures, neural circuits, neurotransmitters, genetics, and endocrine regulation | Roger Sperry, Michael Gazzaniga |
            | **Behavioral** | Strictly observable behavioral responses shaped by environmental conditioning and reinforcement | John B. Watson, B. F. Skinner |
            | **Cognitive** | Mental operations: encoding, retrieval, problem solving, decision heuristics, and language | Jean Piaget, Noam Chomsky |
            | **Humanistic** | Innate drive for personal growth, self-actualization, free will, and conscious self-concept | Carl Rogers, Abraham Maslow |
            | **Psychodynamic** | Unconscious conflicts, repressed impulses, early childhood attachment, and defense mechanisms | Sigmund Freud, Carl Jung, Alfred Adler |
            | **Evolutionary** | Natural selection of cognitive and behavioral traits promoting reproductive fitness | David Buss, Charles Darwin |
            | **Sociocultural** | Cultural norms, social pressures, ethnic diversity, and group dynamics | Lev Vygotsky, Solomon Asch |
      - sort_order: 4
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Humanism vs. Behaviorism'
          body: Do not confuse **behaviorism** (which views human actions as strictly determined by external environmental rewards and punishments) with **humanism** (which emphasizes free will, subjective agency, and the innate drive toward self-actualization).
      - sort_order: 5
        block_type: example
        content:
          title: 'Applied Clinical Case Scenario: Explaining Anxiety Across Perspectives'
          text: Consider a 24-year-old software engineer experiencing acute public speaking panic. A **biological psychologist** investigates heightened amygdala reactivity and sympathetic norepinephrine surges. A **behavioral therapist** identifies a conditioned fear response paired with negative reinforcement from avoidance. A **cognitive psychologist** identifies catastrophizing beliefs ('I will humiliate myself completely'). A **humanistic counselor** explores incongruence between the client's ideal self and perceived self-worth. The modern biopsychosocial framework synthesizes all these dimensions into an integrated treatment plan.
      terms:
      - term: Introspection
        definition: A systematic research technique where trained observers verbally report their immediate conscious sensations and perceptions in response to controlled stimuli.
        example: Titchener asking observers to describe the exact auditory textures and intensities of a metronome beat.
      - term: Biopsychosocial Model
        definition: An integrated, multidisciplinary approach incorporating biological, psychological, and social-cultural factors to explain behavior and mental health.
        example: Analyzing depression via serotonin receptor genotypes, cognitive rumination habits, and socioeconomic isolation.
      - term: Functionalism
        definition: An early school of psychology championed by William James that examined the adaptive purposes and evolutionary functions of conscious mental activity.
        example: Studying how fear triggers adaptive physiological arousal that promotes fleeing from predators.
      assessment_items:
      - prompt: Which historical school of psychology, influenced by Charles Darwin, focused primarily on how mental processes help organisms adapt and survive in their environments?
        interaction_type: single_choice
        response_spec:
          options:
          - Functionalism
          - Structuralism
          - Behaviorism
          - Psychoanalysis
        scoring_spec:
          correct_index: 0
        explanation: Functionalism, established by William James and influenced by Darwinian evolutionary theory, studied how conscious mental activities enable organisms to adapt and flourish in their environments. Structuralism, by contrast, focused on decomposing consciousness into static sensory elements.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 1.2
        concept_slugs:
        - psyc-functionalism
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Wilhelm Wundt and Edward Titchener utilized which primary experimental technique to analyze the basic elements of conscious awareness?
        interaction_type: single_choice
        response_spec:
          options:
          - Free association
          - Systematic introspection
          - Operant chamber conditioning
          - Naturalistic field observation
        scoring_spec:
          correct_index: 1
        explanation: Wundt and Titchener utilized systematic introspection, training subjects to carefully observe and verbally describe their immediate conscious sensory experiences when exposed to controlled physical stimuli.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 1.2
        concept_slugs:
        - psyc-structuralism
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A clinical psychologist asserts that a client's chronic anxiety stems from an innate conflict between their ideal self and their actual self-concept. Which psychological perspective does this clinician represent?
        interaction_type: single_choice
        response_spec:
          options:
          - Behavioral perspective
          - Biological perspective
          - Humanistic perspective
          - Evolutionary perspective
        scoring_spec:
          correct_index: 2
        explanation: The humanistic perspective, developed by Carl Rogers and Abraham Maslow, focuses on conscious self-concept, personal growth, and emotional distress caused by incongruence between the actual self and the ideal self.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 1.2
        concept_slugs:
        - psyc-contemporary-perspectives
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which theoretical framework within psychology insists that scientific study must be restricted exclusively to directly observable, measurable actions rather than unobservable mental events?
        interaction_type: single_choice
        response_spec:
          options:
          - Cognitive psychology
          - Psychodynamic theory
          - Structuralist introspection
          - Behaviorism
        scoring_spec:
          correct_index: 3
        explanation: Behaviorism, pioneered by John B. Watson and expanded by B. F. Skinner, rejected the study of internal mental states, arguing that objective science must focus entirely on observable behaviors and environmental stimuli.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 1.2
        concept_slugs:
        - psyc-contemporary-perspectives
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A researcher explains aggressive behavior among young adults as an evolved mechanism that historically enhanced reproductive competition and resource acquisition. Which perspective is being applied?
        interaction_type: single_choice
        response_spec:
          options:
          - Evolutionary psychology
          - Sociocultural psychology
          - Humanistic psychology
          - Behavioral psychology
        scoring_spec:
          correct_index: 0
        explanation: Evolutionary psychology applies Darwinian principles of natural selection, asserting that behavioral patterns such as aggression or mate preferences evolved because they conferred survival and reproductive advantages in ancestral environments.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 1.2
        concept_slugs:
        - psyc-contemporary-perspectives
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which early school of psychology utilized trained introspection to break conscious experience into its most basic sensory elements?
        options:
        - Structuralism
        - Functionalism
        - Behaviorism
        - Psychoanalysis
        correct_answer: 0
        explanation: Structuralism, founded by Wilhelm Wundt and expanded by Edward Titchener, attempted to map conscious experience by breaking it down into basic sensations through systematic introspection.
        concept_slugs:
        - psyc-structuralism
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: A researcher who studies how natural selection has shaped human mate preferences is operating primarily from which contemporary perspective?
        options:
        - Behavioral perspective
        - Evolutionary perspective
        - Psychodynamic perspective
        - Humanistic perspective
        correct_answer: 1
        explanation: The evolutionary perspective applies principles of natural selection and Darwinian adaptation to explain mental processes and behavioral patterns across generations.
        concept_slugs:
        - psyc-contemporary-perspectives
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What milestone occurred in 1879 that marks the formal birth of scientific psychology?
      back: Wilhelm Wundt founded the first formal experimental psychology laboratory at the University of Leipzig.
      concept_slugs:
      - psyc-structuralism
    - front: How do structuralism and functionalism differ in their core investigative questions?
      back: Structuralism investigates 'what' the elements of the mind are through introspection; functionalism investigates 'why' mental processes evolved to help organisms adapt.
      concept_slugs:
      - psyc-functionalism
  - code: '1.2'
    title: Evaluate scientific research designs, variables, and ethical standards in psychological inquiry
    description: Distinguish experimental from correlational designs, identify independent/dependent variables, recognize placebo controls, and evaluate APA ethical mandates.
    sort_order: 2
    importance: core
    citation: College Board Objective 1.2
    concepts:
    - slug: psyc-experimental-methodology
      name: Experimental Methodology and Control
      short_definition: Scientific research design establishing cause-and-effect relationships by manipulating independent variables while controlling confounding variables.
      description: Experiments require random assignment to experimental and control conditions to isolate the causal impact of the independent variable on the dependent variable.
      citation: OpenStax Psychology 2e, Chapter 2
    - slug: psyc-correlational-research
      name: Correlational Research and Directionality
      short_definition: Statistical assessment measuring the strength and direction of the relationship between two variables, ranging from -1.0 to +1.0.
      description: Correlations demonstrate co-variation but never prove direct causality due to directionality problems and potential third-variable confounders.
      citation: OpenStax Psychology 2e, Chapter 2
      prerequisites:
      - psyc-experimental-methodology
    lessons:
    - title: 'Scientific Methods: Experiments, Correlations, and Ethical Standards'
      description: Experimental control, variables, random assignment, placebo effects, correlation coefficients, and institutional review board mandates.
      emoji: "\U0001F52C"
      tags:
      - research
      - experiment
      - ethics
      - variables
      concept_slugs:
      - psyc-experimental-methodology
      - psyc-correlational-research
      citation: 'OpenStax Psychology 2e, Chapter 2: Psychological Research'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Establishing Causality: The Experimental Method

            The **experiment** is the only psychological research method capable of establishing definitive **cause-and-effect relationships**. To achieve internal validity, an experiment must incorporate:
            - **Independent Variable (IV):** The factor systematically manipulated by the experimenter.
            - **Dependent Variable (DV):** The behavioral or cognitive outcome measured to assess the effect of the IV.
            - **Random Assignment:** Allocating participants to experimental or control conditions purely by chance, ensuring that preexisting individual differences (e.g., intelligence, motivation) are distributed evenly across groups.
            - **Placebo Control & Double-Blind Protocol:** A procedure in which neither the participants nor the administering researchers know who is receiving the active treatment versus an inert placebo, preventing participant expectations and experimenter bias.
      - sort_order: 2
        block_type: callout
        content:
          type: warning
          title: 'Critical Research Trap: Random Sampling vs. Random Assignment'
          body: '**Random sampling** ensures that a sample fairly represents a broader population (optimizing *external validity*). **Random assignment** assigns members of an existing sample to experimental or control conditions by chance (optimizing *internal validity* and causal inference).'
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Comparing Psychological Research Methodologies

            | Research Design | Primary Purpose | Key Advantage | Critical Limitation |
            | :--- | :--- | :--- | :--- |
            | **Experimental** | Determine cause-and-effect relationships | High internal validity; isolates causal mechanism | Laboratory artificiality; ethical constraints on manipulations |
            | **Correlational** | Assess mathematical association between variables | Identifies relationships and enables prediction | Cannot establish causality (third-variable problem) |
            | **Naturalistic Observation** | Record spontaneous behavior in real-world settings | High ecological validity; unobtrusive | Lacks experimental control; observer bias risk |
            | **Case Study** | In-depth examination of rare individuals or conditions | Rich, exhaustive qualitative detail | Highly vulnerable to idiosyncratic generalization |

            ### Ethical Mandates in Psychological Research

            All research involving human participants must receive prior clearance from an **Institutional Review Board (IRB)** and enforce:
            1. **Informed Consent:** Participants must be informed of the study's procedures, potential risks, and their right to withdraw at any time without penalty.
            2. **Deception Restrictions:** Deception is permitted only when scientifically necessary, and must never involve physical pain or severe emotional distress.
            3. **Debriefing:** Complete explanation of the study's purpose and true nature immediately following participation.
            4. **Confidentiality:** Personal identities and individual participant records must be strictly protected.
      - sort_order: 4
        block_type: example
        content:
          title: 'Experimental Design Case: Memory Consolidation Trial'
          text: An investigator studies whether caffeine enhances memorization of German vocabulary words. Sixty participants are recruited. Using a random number generator, 30 receive 200 mg caffeine pills (experimental group) and 30 receive identical-looking sugar capsules (control group). Neither the administering assistant nor the participants know who received caffeine (double-blind). The IV is caffeine dosage; the DV is the percentage of vocabulary pairs recalled after 2 hours.
      - sort_order: 5
        block_type: callout
        content:
          type: key_concept
          title: Correlation Coefficient Invariant
          body: Correlation coefficients ($r$) range from $-1.00$ to $+1.00$. The sign ($+$ or $-$) indicates direction; the absolute value indicates strength. A correlation of $-0.85$ is mathematically stronger than a correlation of $+0.65$.
      terms:
      - term: Independent Variable
        definition: The experimental factor that is manipulated by the researcher to determine its causal effect on an outcome.
        example: Administering 10 mg of an active medication versus an identical placebo capsule.
      - term: Dependent Variable
        definition: The outcome factor measured by researchers that may change in response to manipulations of the independent variable.
        example: Scores earned on a 50-item reading comprehension test following sleep deprivation.
      - term: Double-Blind Procedure
        definition: An experimental protocol in which neither the research participants nor the data-collecting staff know which participants have received the treatment or the placebo.
        example: A clinical trial evaluating a novel antidepressant where both patients and administering nurses are blind to medication vs. sugar pill allocation.
      assessment_items:
      - prompt: In an experiment testing whether listening to Mozart increases spatial reasoning test performance, what serves as the dependent variable?
        interaction_type: single_choice
        response_spec:
          options:
          - The genre of music played to subjects
          - The spatial reasoning test scores earned
          - The volume level of the auditory stimuli
          - The random assignment of study participants
        scoring_spec:
          correct_index: 1
        explanation: The dependent variable is the measured outcome that researchers hypothesize will change as a result of the independent variable. Here, spatial reasoning test scores represent the dependent variable, while the auditory condition is the independent variable.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Chapter 2
        concept_slugs:
        - psyc-experimental-methodology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Why is random assignment considered a necessary component of an experiment seeking to prove a causal relationship?
        interaction_type: single_choice
        response_spec:
          options:
          - It ensures the sample perfectly mirrors the population
          - It eliminates the necessity of using an inert placebo
          - It evens out preexisting differences between group members
          - It guarantees that statistical significance will be achieved
        scoring_spec:
          correct_index: 2
        explanation: Random assignment minimizes preexisting differences between participants assigned to the experimental and control groups. By ensuring confounding participant variables are distributed evenly, researchers can attribute outcome differences directly to the independent variable.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Chapter 2
        concept_slugs:
        - psyc-experimental-methodology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A researcher discovers a correlation of r = -0.82 between hours spent playing competitive video games and grade point average. What is the most accurate interpretation of this finding?
        interaction_type: single_choice
        response_spec:
          options:
          - Gaming causes a substantial decline in academic scores
          - Academic decline directly causes students to play games
          - Higher gaming time reliably associates with lower GPAs
          - The relationship between gaming and GPA is very weak
        scoring_spec:
          correct_index: 2
        explanation: 'A negative correlation indicates an inverse relationship: as one variable increases, the other tends to decrease. Because correlation does not prove causation, researchers cannot claim that gaming caused lower GPAs, only that the two variables reliably co-vary.'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Chapter 2
        concept_slugs:
        - psyc-correlational-research
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A clinical trial provides half of its participants with an active antidepressant and the other half with an identical starch pill. Neither the prescribing doctors nor the patients know who received which capsule. What experimental technique is illustrated?
        interaction_type: single_choice
        response_spec:
          options:
          - Naturalistic observational design
          - Cross-sectional developmental design
          - Single-subject reversal design
          - Double-blind procedure
        scoring_spec:
          correct_index: 3
        explanation: A double-blind procedure occurs when neither the participants nor the research staff who interact with them know which group received the active treatment versus the placebo, eliminating both participant expectancy and researcher expectancy biases.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Chapter 2
        concept_slugs:
        - psyc-experimental-methodology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Under American Psychological Association (APA) ethical guidelines, what must researchers provide immediately following an experiment that utilized deception?
        interaction_type: single_choice
        response_spec:
          options:
          - A comprehensive debriefing explaining the study
          - Monetary compensation matching minimum wage
          - A formal waiver of all institutional liability
          - Destruction of all raw empirical observation data
        scoring_spec:
          correct_index: 0
        explanation: APA ethical principles mandate that when deception is employed in research, participants must receive a full debriefing as soon as feasible after completion of their participation, explaining the true purpose and hypothesis of the study.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Chapter 2
        concept_slugs:
        - psyc-experimental-methodology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which correlation coefficient demonstrates the strongest predictive relationship between two psychological variables?
        interaction_type: single_choice
        response_spec:
          options:
          - r = +0.55
          - r = +0.78
          - r = -0.15
          - r = -0.89
        scoring_spec:
          correct_index: 3
        explanation: The strength of a correlation coefficient is determined solely by its absolute value, regardless of whether it is positive or negative. The absolute value |-0.89| = 0.89 is greater than |+0.78|, |+0.55|, or |-0.15|, making it the strongest relationship.
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Chapter 2
        concept_slugs:
        - psyc-correlational-research
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Why is random assignment essential in experimental psychological research?
        options:
        - It guarantees that the sample is perfectly representative of the entire population
        - It completely eliminates the possibility of experimental demand characteristics
        - It minimizes pre-existing differences between the experimental and control groups
        - It allows researchers to calculate Pearson correlation coefficients without bias
        correct_answer: 2
        explanation: Random assignment ensures that participant characteristics (such as baseline intelligence or motivation) are equally distributed across conditions, controlling for confounding variables and enabling causal inferences.
        concept_slugs:
        - psyc-experimental-methodology
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: A study finds a correlation of -0.78 between hours spent playing video games and grade point average. What does this statistical correlation indicate?
        options:
        - Playing video games directly causes students to perform poorly on exams
        - Lower grades cause students to spend more time playing video games
        - There is a very weak and negligible relationship between the two variables
        - As gaming hours increase, grade point averages tend to decrease
        correct_answer: 3
        explanation: 'A negative correlation indicates an inverse relationship: as the value of one variable increases, the value of the other tends to decrease. Correlation does not establish causation.'
        concept_slugs:
        - psyc-correlational-research
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the key difference between an independent variable and a dependent variable?
      back: The independent variable is manipulated by the experimenter; the dependent variable is the measured outcome that may change in response.
      concept_slugs:
      - psyc-experimental-methodology
    - front: Why can a strong correlation (e.g., r = +0.91) never establish direct causality?
      back: Because the direction of effect cannot be determined and an unmeasured third variable may account for the co-variation.
      concept_slugs:
      - psyc-correlational-research
- code: '2.0'
  title: Biological Bases of Behavior
  description: Neural transmission, neurotransmitters, nervous system organization, endocrine regulation, brain structures, hemispheric lateralization, and neuroplasticity.
  weight: 0.09
  sort_order: 2
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 2.0 (8\u20139%)"
  objectives:
  - code: '2.1'
    title: Analyze neural anatomy, electrochemical action potentials, and neurotransmitter functions
    description: Describe neuron structures, resting and action potentials, synaptic transmission, and the behavioral roles of major neurotransmitters.
    sort_order: 1
    importance: core
    citation: College Board Objective 2.1
    concepts:
    - slug: psyc-neuron-structure
      name: Neuron Structure and Action Potential Dynamics
      short_definition: Electrochemical signaling mechanism whereby neurons transmit information via all-or-none electrical impulses down the axon.
      description: Neurons maintain a resting potential of -70 mV and fire an all-or-none action potential when depolarization reaches the excitation threshold (-55 mV).
      citation: OpenStax Psychology 2e, Section 3.2
    - slug: psyc-neurotransmitters
      name: Neurotransmitters and Neuromodulation
      short_definition: Chemical messengers released across the synaptic cleft that bind to postsynaptic receptors to produce excitatory or inhibitory potentials.
      description: Key neurotransmitters include acetylcholine, dopamine, serotonin, norepinephrine, GABA, and glutamate, modulated by pharmacological agonists and antagonists.
      citation: OpenStax Psychology 2e, Section 3.2
      prerequisites:
      - psyc-neuron-structure
    lessons:
    - title: The Neuron and Electrochemical Communication
      description: Anatomy of the neuron, resting potential, ionic action potential propagation, and neurotransmitter dynamics.
      emoji: "\u26A1"
      tags:
      - neuroscience
      - neuron
      - action-potential
      - neurotransmitters
      concept_slugs:
      - psyc-neuron-structure
      - psyc-neurotransmitters
      citation: 'OpenStax Psychology 2e, Section 3.2: Cells of the Nervous System'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Electrochemical Architecture of the Neuron

            The **neuron** is the basic operational unit of the nervous system. Signals travel through distinct structural components:
            - **Dendrites:** Branching fibers that receive chemical messages from neighboring neurons.
            - **Soma (Cell Body):** Contains the nucleus and metabolic machinery; integrates incoming electrical inputs.
            - **Axon:** Single elongated fiber that conducts electrical impulses away from the cell body toward target cells.
            - **Myelin Sheath:** Fatty insulation formed by glial cells (Schwann cells in PNS, oligodendrocytes in CNS) that speeds transmission via **saltatory conduction** across the **Nodes of Ranvier**.
            - **Terminal Buttons:** Axon endings that release chemical neurotransmitters into the **synaptic cleft**.

            ### The Action Potential Cycle

            1. **Resting Potential (-70 mV):** The neuron maintains a negative charge relative to the extracellular fluid, governed by the sodium-potassium pump (moving $3 \text{ Na}^+$ out for every $2 \text{ K}^+$ in).
            2. **Threshold of Excitation (-55 mV):** When excitatory postsynaptic potentials (EPSPs) depolarize the membrane to threshold, voltage-gated sodium channels burst open.
            3. **Depolarization (+30 to +40 mV):** Massive influx of positive sodium ions ($\text{Na}^+$) rushes into the axon.
            4. **Repolarization & Hyperpolarization:** Sodium channels inactivate; voltage-gated potassium channels open, allowing $\text{K}^+$ to exit, temporarily dipping below -70 mV (**refractory period**).
            5. **All-or-None Law:** A neuron either fires at full strength or not at all; stimulus intensity is encoded by firing *frequency*, never action potential size.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: The All-or-None Invariant
          body: A stronger stimulus (such as a scalding burn vs. a warm touch) does **not** create a larger action potential. It causes neurons to fire **more frequently** and recruits a greater **number** of sensory neurons.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Major Neurotransmitters and Behavioral Correlations

            | Neurotransmitter | Primary Physiological Role | Associated Clinical Disorders |
            | :--- | :--- | :--- |
            | **Acetylcholine (ACh)** | Muscle contraction, voluntary movement, memory encoding | Alzheimer's disease (severe loss of ACh neurons) |
            | **Dopamine** | Reward reinforcement, voluntary motor control, executive attention | Parkinson's disease (deficit in substantia nigra); Schizophrenia (excess receptor activity) |
            | **Serotonin (5-HT)** | Mood regulation, sleep architecture, appetite, impulsive aggression | Major depressive disorder, anxiety disorders (treated with SSRIs) |
            | **Norepinephrine** | Sympathetic alertness, fight-or-flight arousal, vigilance | Bipolar disorder, depressive episodes, panic disorder |
            | **GABA** | Primary **inhibitory** neurotransmitter in the central nervous system | Severe anxiety, seizures, insomnia (enhanced by benzodiazepines and alcohol) |
            | **Glutamate** | Primary **excitatory** neurotransmitter; synaptic plasticity and LTP | Excitotoxicity during strokes; migraine headaches, seizures |
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Neurological Vignette: Myasthenia Gravis and Botulinum Toxin'
          text: Acetylcholine (ACh) operates at the neuromuscular junction. In **myasthenia gravis**, autoantibodies destroy ACh receptor sites, causing profound muscle fatigue. Conversely, **botulinum toxin** (Botox) blocks ACh release from presynaptic vesicles, causing flaccid paralysis. Black widow spider venom triggers massive ACh release, inducing violent muscular spasms.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Agonist vs. Antagonist'
          body: An **agonist** mimics or increases the activity of a neurotransmitter (e.g., nicotine is an ACh agonist; morphine is an endorphin agonist). An **antagonist** blocks or inhibits neurotransmitter action (e.g., curare is an ACh antagonist that blocks muscle receptors).
      terms:
      - term: Action Potential
        definition: A brief electrochemical impulse that travels down an axon when a neuron's membrane potential depolarizes past the excitation threshold.
        example: Sodium ions rushing into the axon through voltage-gated ion channels when the potential reaches -55 mV.
      - term: Myelin Sheath
        definition: A lipid-rich insulating layer wrapping axons that dramatically accelerates the conduction speed of nerve impulses.
        example: Multiple sclerosis damages the myelin sheath, causing disrupted motor and sensory signaling.
      - term: Refractory Period
        definition: The brief recovery phase following an action potential during which a neuron cannot fire again or requires an exceptionally intense stimulus.
        example: During the absolute refractory period, sodium channel inactivation gates prevent any subsequent action potential.
      assessment_items:
      - prompt: During an action potential, what specific ionic movement is directly responsible for the rapid depolarization of the neuronal membrane?
        interaction_type: single_choice
        response_spec:
          options:
          - Rapid influx of positively charged sodium ions
          - Rapid efflux of positively charged potassium ions
          - Active pumping of negatively charged chloride ions
          - Passive leakage of calcium ions out of the soma
        scoring_spec:
          correct_index: 0
        explanation: Depolarization is caused by the rapid opening of voltage-gated sodium channels once threshold (-55 mV) is reached, allowing positively charged sodium ions (Na+) to flood into the intracellular fluid along both concentration and electrical gradients.
        difficulty: intermediate
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 3.2
        concept_slugs:
        - psyc-neuron-structure
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Degeneration of the myelin sheath surrounding axons in the central nervous system produces which debilitating autoimmune disorder?
        interaction_type: single_choice
        response_spec:
          options:
          - Parkinson's disease
          - Multiple sclerosis
          - Huntington's chorea
          - Alzheimer's dementia
        scoring_spec:
          correct_index: 1
        explanation: Multiple sclerosis is an autoimmune condition in which the body's immune system attacks and degrades the myelin sheath, slowing or halting neural impulse transmission along motor and sensory pathways.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 3.2
        concept_slugs:
        - psyc-neuron-structure
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A patient with Parkinson's disease experiences severe tremors and rigidity due to the selective death of neurons that produce which neurotransmitter?
        interaction_type: single_choice
        response_spec:
          options:
          - Acetylcholine
          - Norepinephrine
          - Dopamine
          - Serotonin
        scoring_spec:
          correct_index: 2
        explanation: Parkinson's disease results from the degeneration of dopamine-producing neurons in the substantia nigra, impairing motor planning and basal ganglia communication. Dopamine precursors (such as L-DOPA) are administered to alleviate motor symptoms.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 3.2
        concept_slugs:
        - psyc-neurotransmitters
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which chemical acts as the primary inhibitory neurotransmitter throughout the human central nervous system, serving to decrease neuronal excitability?
        interaction_type: single_choice
        response_spec:
          options:
          - Glutamate neurotransmitter
          - Norepinephrine hormone
          - Substance P peptide
          - Gamma-aminobutyric acid (GABA)
        scoring_spec:
          correct_index: 3
        explanation: GABA (gamma-aminobutyric acid) is the primary inhibitory neurotransmitter in the brain. By opening chloride ion channels and hyperpolarizing postsynaptic membranes, it reduces the probability that a neuron will fire an action potential.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 3.2
        concept_slugs:
        - psyc-neurotransmitters
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: During the resting potential of a neuron, which ion is concentrated in greater abundance inside the intracellular fluid compared to the extracellular fluid?
        options:
        - Potassium (K+)
        - Sodium (Na+)
        - Chloride (Cl-)
        - Calcium (Ca2+)
        correct_answer: 0
        explanation: At rest (approximately -70 mV), potassium ions (K+) are concentrated inside the cell, while sodium ions (Na+) are concentrated outside, maintained by the sodium-potassium pump.
        concept_slugs:
        - psyc-neuron-structure
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Which neurotransmitter is primarily involved in motor movement, attention, and reward pathways, and is depleted in Parkinson's disease?
        options:
        - Serotonin
        - Dopamine
        - Gamma-aminobutyric acid (GABA)
        - Glutamate
        correct_answer: 1
        explanation: Dopamine governs voluntary movement, motivation, and reward; degeneration of dopamine-producing neurons in the substantia nigra causes the motor tremors of Parkinson's disease.
        concept_slugs:
        - psyc-neurotransmitters
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the resting membrane potential of a typical neuron?
      back: -70 millivolts (mV), maintained by the sodium-potassium pump.
      concept_slugs:
      - psyc-neuron-structure
    - front: Which neurotransmitter is critical for motor movement at the neuromuscular junction and memory consolidation?
      back: Acetylcholine (ACh).
      concept_slugs:
      - psyc-neurotransmitters
  - code: '2.2'
    title: Analyze brain anatomy, cortical localization, autonomic divisions, and split-brain research
    description: Distinguish hindbrain, midbrain, and forebrain structures, evaluate the sympathetic/parasympathetic divisions, and analyze split-brain lateralization findings.
    sort_order: 2
    importance: core
    citation: College Board Objective 2.2
    concepts:
    - slug: psyc-brain-structures
      name: Cerebral Structures and Cortical Lobes
      short_definition: Functional specialization of subcortical centers and the four cerebral cortex lobes (frontal, parietal, occipital, temporal).
      description: Cortical organization localizes motor planning in frontal lobes, somatosensory processing in parietal, visual analysis in occipital, and auditory/language in temporal lobes.
      citation: OpenStax Psychology 2e, Section 3.4
    - slug: psyc-hemispheric-specialization
      name: Hemispheric Lateralization and Autonomic Nervous System
      short_definition: Division of labor between cerebral hemispheres connected by the corpus callosum, alongside sympathetic/parasympathetic autonomic control.
      description: Split-brain experiments reveal left-hemisphere specialization for verbal speech and right-hemisphere specialization for visuospatial processing.
      citation: OpenStax Psychology 2e, Section 3.4
      prerequisites:
      - psyc-brain-structures
    lessons:
    - title: Brain Architecture and Hemispheric Specialization
      description: Limbic system, cortical lobes, autonomic nervous divisions, and split-brain research findings.
      emoji: "\U0001F9E9"
      tags:
      - brain
      - cortex
      - split-brain
      - autonomic
      - limbic
      concept_slugs:
      - psyc-brain-structures
      - psyc-hemispheric-specialization
      citation: 'OpenStax Psychology 2e, Section 3.4: The Brain and Spinal Cord'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Subcortical Structures and the Limbic System

            The brain is organized into evolutionary hierarchical layers:
            - **Hindbrain:** Contains the **medulla** (controls automatic breathing, heartbeat, and blood pressure), the **pons** (coordinates movements and sleep regulation), and the **cerebellum** ('little brain,' governs balance, fine motor coordination, and procedural memory).
            - **Midbrain:** Contains the **reticular formation**, a nerve network regulating arousal, alertness, and sleep-wake transitions.
            - **Forebrain / Limbic System:** Coordinates emotional and motivational drives:
              * **Thalamus:** Sensory switchboard routing all sensory inputs (except olfaction) to higher cortical centers.
              * **Hypothalamus:** Regulates autonomic nervous system, hunger, thirst, body temperature, sexual drives, and directs the pituitary master gland.
              * **Amygdala:** Processes emotional salience, particularly fear conditioning and aggressive responses.
              * **Hippocampus:** Crucial for consolidating new explicit/declarative memories into long-term storage.
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### The Four Cortical Lobes and Autonomic Nervous Control

            | Cortical Lobe | Key Functional Centers | Clinical Deficit Upon Damage |
            | :--- | :--- | :--- |
            | **Frontal** | Prefrontal cortex (executive judgment, impulse control); Primary motor cortex; **Broca's area** (left hemisphere speech production) | Broca's aphasia (non-fluent, halting speech); emotional disinhibition (Phineas Gage) |
            | **Parietal** | Primary somatosensory cortex (processes touch, pain, temperature); spatial orientation | Hemispatial neglect, loss of tactile discrimination |
            | **Occipital** | Primary visual cortex (feature detection, retinotopic processing) | Cortical blindness, visual agnosia |
            | **Temporal** | Primary auditory cortex; **Wernicke's area** (left hemisphere language comprehension); facial recognition | Wernicke's aphasia (fluent but meaningless speech); prosopagnosia (face blindness) |

            ### Autonomic Nervous System Divisions

            - **Sympathetic Division:** Accelerates heart rate, dilates pupils, inhibits digestion, and mobilizes glycogen for **fight-or-flight** action.
            - **Parasympathetic Division:** Constricts pupils, slows heart rate, stimulates digestive peristalsis for **rest-and-digest** recovery.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Broca's vs. Wernicke's Aphasia
          body: '**Broca''s aphasia** impairs speech *production* (the patient knows what they want to say but speaks with great effort in broken words). **Wernicke''s aphasia** impairs language *comprehension* (the patient speaks fluently with normal rhythm, but the words form meaningless ''word salad'').'
      - sort_order: 4
        block_type: example
        content:
          title: 'Experimental Case Study: Roger Sperry''s Split-Brain Patients'
          text: "To alleviate intractable grand mal epilepsy, surgeons severed the **corpus callosum**\u2014the thick bundle of axon fibers connecting the left and right hemispheres. In laboratory tachistoscopic tests, when an image of a spoon was flashed to the patient's **left visual field** (projecting to the right hemisphere), the patient verbally claimed to see nothing (because the left hemisphere controls speech). However, when asked to reach beneath a screen with their **left hand** (controlled by the right hemisphere), they effortlessly selected the spoon."
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Left Visual Field vs. Left Eye'
          body: 'Do not confuse the *left visual field* with the *left eye*. Visual fields project contralateral information from both eyes: the left half of each retina projects to the right hemisphere, and the right half of each retina projects to the left hemisphere.'
      terms:
      - term: Hippocampus
        definition: A limbic system structure vital for processing and consolidating new explicit memories for long-term storage.
        example: Patient H.M. lost the ability to form new episodic memories after bilateral surgical removal of his hippocampi.
      - term: Corpus Callosum
        definition: The large band of neural fibers connecting the two cerebral hemispheres, enabling interhemispheric communication.
        example: Severing the corpus callosum prevents information presented to the right hemisphere from reaching the left hemisphere's language centers.
      - term: Prefrontal Cortex
        definition: The forward part of the frontal lobes responsible for executive functions including working memory, decision making, social planning, and impulse restraint.
        example: Phineas Gage suffered dramatic personality shifts and emotional volatility after an iron rod pierced his prefrontal cortex.
      assessment_items:
      - prompt: A construction foreman survives an accident in which a tamping iron penetrates his skull, destroying extensive portions of his prefrontal cortex. What psychological change is most expected?
        interaction_type: single_choice
        response_spec:
          options:
          - Profound disruption of emotional regulation and planning
          - Total permanent loss of tactile sensation across both arms
          - Complete inability to comprehend spoken or written speech
          - Loss of basic autonomic respiration and heart rate control
        scoring_spec:
          correct_index: 0
        explanation: Damage to the prefrontal cortex (as famously documented in the historical case of Phineas Gage) impairs executive functions, emotional inhibition, foresight, and moral judgment without eliminating primary motor or vital autonomic functions.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 3.4
        concept_slugs:
        - psyc-brain-structures
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which brain structure acts as the central sensory relay station, directing incoming information from all senses except olfaction to the appropriate cortical lobes?
        interaction_type: single_choice
        response_spec:
          options:
          - Hypothalamus
          - Thalamus
          - Hippocampus
          - Cerebellum
        scoring_spec:
          correct_index: 1
        explanation: The thalamus serves as the sensory routing hub of the brain, receiving sensory signals from the visual, auditory, gustatory, and somatosensory systems and relaying them to specialized cortical areas. Olfactory signals bypass the thalamus directly to the olfactory bulb.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 3.4
        concept_slugs:
        - psyc-brain-structures
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A patient suffers a left-hemisphere stroke and can comprehend conversation perfectly but speaks with agonizing slowness, omitting grammatical conjunctions. Where is the damage localized?
        interaction_type: single_choice
        response_spec:
          options:
          - Wernicke's area in the left temporal lobe
          - Primary somatosensory cortex in the parietal lobe
          - Broca's area in the left frontal lobe
          - Primary visual cortex in the occipital lobe
        scoring_spec:
          correct_index: 2
        explanation: Broca's area, located in the frontal lobe of the dominant (usually left) hemisphere, controls speech production and muscle movements involved in articulation. Damage produces expressive aphasia characterized by non-fluent, halting speech.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 3.4
        concept_slugs:
        - psyc-brain-structures
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In a classic split-brain experiment, an image of an apple is flashed exclusively to the patient's left visual field. Which behavioral response can the patient perform?
        interaction_type: single_choice
        response_spec:
          options:
          - Verbally name the apple immediately upon viewing
          - Write the word 'apple' using their right hand
          - Identify the apple by touch using their right hand
          - Retrieve an apple by touch with their left hand
        scoring_spec:
          correct_index: 3
        explanation: Stimuli in the left visual field project to the right cerebral hemisphere, which controls the left hand. Because the severed corpus callosum prevents transmission to the verbal left hemisphere, the patient cannot name the object verbally, but can easily retrieve it with the left hand.
        difficulty: advanced
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 3.4
        concept_slugs:
        - psyc-hemispheric-specialization
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Following a sudden frightening encounter with a snarling dog, an individual's pupils dilate, respiration quickens, and digestion ceases. Which autonomic division is dominant?
        interaction_type: single_choice
        response_spec:
          options:
          - Sympathetic nervous system
          - Parasympathetic nervous system
          - Somatic nervous system
          - Central sensory nervous system
        scoring_spec:
          correct_index: 0
        explanation: The sympathetic division of the autonomic nervous system mobilizes physiological resources during emergency or stress situations (the 'fight-or-flight' response), elevating heart rate, dilating bronchioles, dilating pupils, and inhibiting gastrointestinal motility.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 3.4
        concept_slugs:
        - psyc-hemispheric-specialization
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Damage to which cerebral brain area typically results in expressive aphasia, where a patient understands speech but struggles to produce fluent words?
        options:
        - Wernicke's area in the left temporal lobe
        - The somatosensory cortex in the parietal lobe
        - Broca's area in the left frontal lobe
        - The fusiform face area in the occipitotemporal region
        correct_answer: 2
        explanation: Broca's area, located in the posterior inferior frontal gyrus of the dominant (usually left) hemisphere, controls the motor mechanics of speech production; damage causes non-fluent, expressive aphasia.
        concept_slugs:
        - psyc-brain-structures
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: In a classic split-brain study, when a picture of a fork is flashed exclusively to the patient's left visual field, how can the patient demonstrate recognition?
        options:
        - By immediately verbally stating the word 'fork'
        - By writing the word 'fork' using their right hand
        - By pointing to the fork with their right index finger
        - By selecting a fork with their left hand beneath an opaque screen
        correct_answer: 3
        explanation: Images in the left visual field project to the right hemisphere, which controls the left hand. Because the corpus callosum is severed and speech is left-lateralized, the patient cannot name the object verbally but can identify it haptically with the left hand.
        concept_slugs:
        - psyc-hemispheric-specialization
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: Which brain structure is primary for consolidating new long-term declarative memories?
      back: The hippocampus.
      concept_slugs:
      - psyc-brain-structures
    - front: What is the primary function of Broca's area vs. Wernicke's area?
      back: Broca's area (frontal lobe) directs speech production; Wernicke's area (temporal lobe) governs language comprehension.
      concept_slugs:
      - psyc-brain-structures
- code: '3.0'
  title: Sensation and Perception
  description: Sensory thresholds, signal detection, transduction, visual and auditory anatomy, color vision theories, and Gestalt perceptual organization.
  weight: 0.075
  sort_order: 3
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 3.0 (7\u20138%)"
  objectives:
  - code: '3.1'
    title: Analyze sensory transduction, psychophysical thresholds, and signal detection theory
    description: Define absolute and difference thresholds, apply Weber's law, explain sensory adaptation, and evaluate signal detection matrix outcomes.
    sort_order: 1
    importance: core
    citation: College Board Objective 3.1
    concepts:
    - slug: psyc-sensory-thresholds
      name: Psychophysical Thresholds and Transduction
      short_definition: Conversion of environmental physical energy into neural electrical impulses, governed by absolute thresholds and Weber's law.
      description: Transduction converts physical wavelengths, sound waves, and chemical molecules into neural signals evaluated through absolute and difference thresholds.
      citation: OpenStax Psychology 2e, Section 5.1
    - slug: psyc-signal-detection
      name: Signal Detection Theory and Sensory Adaptation
      short_definition: Framework quantifying the detection of faint sensory stimuli amid background noise as a function of sensitivity and decision bias.
      description: 'Decisions yield four outcomes: hits, misses, false alarms, and correct rejections, mediated by psychological readiness and sensory adaptation.'
      citation: OpenStax Psychology 2e, Section 5.1
      prerequisites:
      - psyc-sensory-thresholds
    lessons:
    - title: Sensory Reception, Transduction, and Thresholds
      description: 'Principles of psychophysics: absolute thresholds, Weber''s law, signal detection matrices, and sensory adaptation.'
      emoji: "\U0001F441\uFE0F"
      tags:
      - sensation
      - thresholds
      - transduction
      - webers-law
      concept_slugs:
      - psyc-sensory-thresholds
      - psyc-signal-detection
      citation: 'OpenStax Psychology 2e, Section 5.1: Sensation versus Perception'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Sensation versus Perception and Transduction

            - **Sensation:** The physical reception of environmental energy by specialized sensory receptor cells.
            - **Perception:** The psychological organization and cognitive interpretation of sensory inputs to create meaningful experiences.
            - **Transduction:** The physical conversion of sensory stimuli (e.g., photons, acoustic pressure waves, dissolved chemicals) into electrochemical neural action potentials.

            ### Psychophysical Thresholds

            - **Absolute Threshold:** The minimum intensity of a stimulus required for a person to detect it **50% of the time**.
            - **Difference Threshold (Just Noticeable Difference / JND):** The minimum difference between two stimuli required for detection 50% of the time.
            - **Weber's Law:** To be perceived as different, two stimuli must differ by a **constant minimum percentage (proportion)** rather than a constant fixed amount:
              $$\frac{\Delta I}{I} = k$$
              *(e.g., adding 1 ounce to a 10-ounce weight is noticeable, but adding 1 ounce to a 100-ounce weight is undetectable because the required proportion is not met.)*
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Signal Detection Theory Matrix

            Signal detection theory assumes there is no single absolute threshold; detection depends on both sensory sensitivity and psychological factors (motivation, fatigue, expectancy):

            | Subject Response | Stimulus Present | Stimulus Absent |
            | :--- | :--- | :--- |
            | **Said 'Yes' (Detected)** | **Hit** (Correct detection) | **False Alarm** (Type I error) |
            | **Said 'No' (Did Not Detect)** | **Miss** (Type II error) | **Correct Rejection** (Accurate dismissal) |

            ### Sensory Adaptation

            **Sensory adaptation** occurs when prolonged exposure to an unchanging stimulus results in diminished neural firing and subjective sensitivity (e.g., no longer noticing the hum of an air conditioner or the scent of perfume after several minutes). Adaptation frees attentional capacity for novel environmental changes.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Sensory Adaptation vs. Habituation
          body: '**Sensory adaptation** is a physiological reduction in sensory receptor responsiveness (e.g., retinal photoreceptors becoming less reactive). **Habituation** is a cognitive/central decrease in attention to a recognized, repeated stimulus (e.g., tuning out clock ticking).'
      - sort_order: 4
        block_type: example
        content:
          title: 'Applied Clinical Context: Radiologist Mammogram Screening'
          text: A radiologist scanning 200 mammograms per day operates under signal detection conditions. If set to a conservative criterion (afraid of false alarms), they risk missing faint malignant tumors (Misses). If set to a liberal criterion (determined never to miss a tumor), they produce more false alarms requiring follow-up biopsies. Signal detection theory models how training and stakes alter this decision threshold.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Weber''s Law Constant Ratio'
          body: Remember that Weber's Law operates on **proportions**, not absolute units. If an individual can just tell the difference between 50 grams and 52 grams (a 4% JND), they will require a difference of 4 grams (not 2 grams) to detect a difference starting from 100 grams.
      terms:
      - term: Transduction
        definition: The biological process by which sensory receptors convert physical energy from the environment into neural electrochemical signals.
        example: Rods and cones converting electromagnetic light waves into action potentials transmitted along the optic nerve.
      - term: Absolute Threshold
        definition: The minimal stimulus energy required to activate a sensory system and be detected at least 50 percent of the time.
        example: Detecting the flame of a candle 30 miles away on a clear, dark night.
      - term: Weber's Law
        definition: The psychophysical principle that the just noticeable difference between two stimuli is a constant minimum proportion of the initial stimulus intensity.
        example: Noticing a 10% increase in brightness whether looking at a dim lamp or a bright chandelier.
      assessment_items:
      - prompt: An audio engineer can just barely detect a volume difference when a 100-decibel tone is raised by 5 decibels. According to Weber's Law, how many decibels must a 200-decibel tone be raised for the engineer to notice a change?
        interaction_type: single_choice
        response_spec:
          options:
          - 10 decibels
          - 5 decibels
          - 20 decibels
          - 2.5 decibels
        scoring_spec:
          correct_index: 0
        explanation: Weber's law states that the difference threshold is a constant proportion of the original stimulus. Since a 5 dB increase on a 100 dB sound represents a 5% difference ratio, a 200 dB sound requires a 5% increase (which equals 10 dB) to produce a just noticeable difference.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 5.1
        concept_slugs:
        - psyc-sensory-thresholds
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: An air traffic controller on night duty detects a faint radar blip on the screen when no aircraft is present. Under signal detection theory, what classification does this outcome represent?
        interaction_type: single_choice
        response_spec:
          options:
          - Signal hit (accurate detection)
          - False alarm (false positive)
          - Signal miss (false negative)
          - Correct rejection (true negative)
        scoring_spec:
          correct_index: 1
        explanation: In signal detection theory, a false alarm occurs when a participant reports detecting a target signal that was not actually present (a Type I error). A hit is detecting a signal present; a miss is failing to detect a signal present; a correct rejection is confirming absence.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 5.1
        concept_slugs:
        - psyc-signal-detection
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: After entering an Italian restaurant, an individual notices a pungent aroma of garlic, but after fifteen minutes, they are completely oblivious to the scent. What physiological phenomenon is illustrated?
        interaction_type: single_choice
        response_spec:
          options:
          - Top-down perceptual framing
          - Selective cognitive inattention
          - Sensory adaptation
          - Subliminal olfactory priming
        scoring_spec:
          correct_index: 2
        explanation: Sensory adaptation is the diminished sensitivity to an unchanging, continuous stimulus that occurs as sensory receptor cells decrease their firing frequency. This allows the nervous system to focus on novel environmental changes.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 5.1
        concept_slugs:
        - psyc-signal-detection
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: What is the minimum physical intensity difference between two stimuli necessary for an observer to detect a difference 50% of the time called?
        options:
        - Difference threshold (just noticeable difference)
        - Absolute sensory threshold (minimum detection)
        - Subliminal sensory priming detection boundary
        - Sensory adaptation physiological baseline level
        correct_answer: 0
        explanation: The difference threshold, or just noticeable difference (JND), is the smallest physical change between two stimuli that an individual can detect 50% of the time, described quantitatively by Weber's law.
        concept_slugs:
        - psyc-sensory-thresholds
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: According to signal detection theory, which psychological and environmental factor directly influences an observer's response bias (criterion)?
        options:
        - The absolute density of retinal photoreceptor cells
        - Expectations, motivation, and consequences of errors
        - The wavelength of incoming electromagnetic radiation
        - The anatomical size of the temporal auditory bulla
        correct_answer: 1
        explanation: Signal detection theory posits that detecting a stimulus depends not just on sensory sensitivity, but on decision criteria influenced by expectations, motivation, alertness, and the payoff/cost of false alarms versus misses.
        concept_slugs:
        - psyc-signal-detection
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is transduction in sensation?
      back: The conversion of environmental physical energy into neural electrical impulses.
      concept_slugs:
      - psyc-sensory-thresholds
    - front: What does a false alarm represent in signal detection theory?
      back: Reporting that a signal was present when no signal actually occurred.
      concept_slugs:
      - psyc-signal-detection
  - code: '3.2'
    title: Analyze visual and auditory anatomy, color vision theories, and Gestalt perceptual principles
    description: Contrast rods and cones, compare trichromatic and opponent-process theories, describe auditory transduction, and apply Gestalt laws of perceptual grouping.
    sort_order: 2
    importance: core
    citation: College Board Objective 3.2
    concepts:
    - slug: psyc-visual-auditory-systems
      name: Visual and Auditory Sensory Anatomy
      short_definition: Anatomical pathways of vision (retina, rods/cones, optic nerve) and audition (eardrum, ossicles, cochlear basilar membrane).
      description: Photoreception occurs in retinal rods (dim light) and cones (color/acuity in fovea); auditory transduction occurs in the cochlea via basilar membrane hair cell deflection.
      citation: OpenStax Psychology 2e, Section 5.2
    - slug: psyc-perceptual-organization
      name: Perceptual Organization and Depth Cues
      short_definition: Gestalt principles of grouping (proximity, similarity, continuity, closure) and depth perception via monocular and binocular cues.
      description: Perception synthesizes bottom-up sensory data with top-down expectations through figure-ground segregation and retinal disparity.
      citation: OpenStax Psychology 2e, Section 5.3
      prerequisites:
      - psyc-visual-auditory-systems
    lessons:
    - title: Visual Anatomy, Color Theories, and Perceptual Organization
      description: Rods and cones, trichromatic vs. opponent-process theory, cochlear mechanics, and Gestalt grouping laws.
      emoji: "\U0001F3A8"
      tags:
      - vision
      - audition
      - gestalt
      - color-theory
      - depth
      concept_slugs:
      - psyc-visual-auditory-systems
      - psyc-perceptual-organization
      citation: OpenStax Psychology 2e, Section 5.2 & 5.3
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Visual System: Photoreception and Processing

            Light enters through the **cornea**, passes through the **pupil** (regulated by the **iris**), is focused by the **lens** (via **accommodation**), and strikes the **retina**:

            | Feature | Rods | Cones |
            | :--- | :--- | :--- |
            | **Total Quantity** | ~120 million | ~6 million |
            | **Retinal Location** | Periphery of retina | Concentrated in central **fovea** |
            | **Light Sensitivity** | High sensitivity; optimal for dim/night vision | Low sensitivity; requires bright daylight |
            | **Color & Acuity** | Monochromatic (shades of gray); low acuity | Color vision; high spatial acuity and detail |

            ### Theories of Color Vision

            1. **Young-Helmholtz Trichromatic Theory:** The retina possesses three distinct cone types maximally sensitive to different wavelengths: **Red (long)**, **Green (medium)**, and **Blue (short)**. Color perception results from additive ratios of stimulation.
            2. **Hering's Opponent-Process Theory:** Neural circuits beyond the retina (in ganglion cells, thalamus, and visual cortex) process color through three opposing channels:
               - **Red vs. Green**
               - **Blue vs. Yellow**
               - **Black vs. White**
               *Explains negative afterimages: fatiguing green receptors causes a white surface to appear red.*
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Gestalt Principles of Perceptual Organization

            The German Gestalt psychologists emphasized that *'the whole is greater than the sum of its parts'*. The mind automatically organizes sensations into coherent forms:
            - **Figure-Ground:** Isolating the primary object (figure) from its surrounding background.
            - **Proximity:** Grouping visual elements that are physically close together.
            - **Similarity:** Grouping elements that share color, shape, or orientation.
            - **Continuity:** Perceiving smooth, continuous paths rather than abrupt, jagged angles.
            - **Closure:** Automatically filling in missing visual gaps to perceive complete, whole objects.

            ### Depth Perception Cues

            - **Binocular Cues:** Require both eyes. Includes **retinal disparity** (different angles seen by each eye, greater for nearby objects) and **convergence** (neuromuscular inward turning of eyes).
            - **Monocular Cues:** Require one eye only. Includes **linear perspective** (parallel lines converge with distance), **interposition** (closer objects block farther objects), **relative size**, **texture gradient**, and **motion parallax**.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Reconciling the Two Color Theories
          body: 'Both color theories are scientifically correct, but describe different stages: **Trichromatic theory** explains photoreceptor function at the *retina/cone* level. **Opponent-process theory** explains subsequent neural coding in *ganglion cells, thalamus, and visual cortex*.'
      - sort_order: 4
        block_type: example
        content:
          title: 'Experimental Case Study: The Visual Cliff Paradigm'
          text: 'Eleanor Gibson and Richard Walk placed 6- to 14-month-old human infants on a visual cliff apparatus: a heavy glass tabletop suspended over an apparent vertical drop. Even when coaxed by their mothers from the ''deep'' side, most infants refused to crawl onto the glass, demonstrating that depth perception and innate avoidance of heights are present by the onset of mobile locomotion.'
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Blind Spot Mechanics'
          body: The **blind spot** exists because there are zero photoreceptors (neither rods nor cones) at the specific point where the optic nerve axons exit the eyeball to travel toward the brain.
      terms:
      - term: Opponent-Process Theory
        definition: The theory that color perception relies on retinal and thalamic ganglion cells that are stimulated by one color and inhibited by its opponent color.
        example: Staring at a green square for 60 seconds and then looking at a blank white wall produces a red afterimage.
      - term: Fovea
        definition: The central focal point of the retina containing a dense concentration of cones and zero rods, providing maximum visual acuity.
        example: When reading fine print, your eyes orient the text directly onto the fovea.
      - term: Retinal Disparity
        definition: A binocular depth cue arising from the horizontal separation between the eyes, resulting in slightly different images cast on each retina.
        example: Holding a finger in front of your face and alternately closing each eye reveals horizontal jumping of the image.
      assessment_items:
      - prompt: An individual stares fixedly at an intense green square for one minute and then immediately shifts their gaze to a blank white card. What afterimage color will they perceive?
        interaction_type: single_choice
        response_spec:
          options:
          - Red
          - Blue
          - Yellow
          - Black
        scoring_spec:
          correct_index: 0
        explanation: According to Hering's opponent-process theory, color vision is governed by opposing neural channels (red-green, blue-yellow, black-white). Staring at green fatigues the green-sensitive receptors, allowing the rebound firing of the opposing red receptors when viewing neutral white light.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 5.2
        concept_slugs:
        - psyc-visual-auditory-systems
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which photoreceptors are primarily concentrated in the central fovea of the retina and are responsible for high-acuity color vision in bright daylight?
        interaction_type: single_choice
        response_spec:
          options:
          - Retinal bipolar cells
          - Cone photoreceptors
          - Rod photoreceptors
          - Retinal ganglion cells
        scoring_spec:
          correct_index: 1
        explanation: Cones are specialized photoreceptors densely clustered in the central fovea that function best in bright illumination, providing fine spatial detail and trichromatic color vision. Rods dominate the periphery and govern dim light vision.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 5.2
        concept_slugs:
        - psyc-visual-auditory-systems
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: When observing railroad tracks that appear to converge in the distance, an artist relies on which monocular depth cue to create the perception of distance?
        interaction_type: single_choice
        response_spec:
          options:
          - Retinal disparity
          - Convergence
          - Linear perspective
          - Motion parallax
        scoring_spec:
          correct_index: 2
        explanation: Linear perspective is a monocular depth cue in which parallel lines appear to converge as distance from the observer increases. Retinal disparity and convergence are binocular cues requiring both eyes.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 5.3
        concept_slugs:
        - psyc-perceptual-organization
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: "A reader effortlessly perceives a series of broken dashes '\u2014 \u2014 \u2014 \u2014' as a single continuous line rather than disconnected individual fragments. Which Gestalt principle explains this tendency?"
        interaction_type: single_choice
        response_spec:
          options:
          - Law of figure-ground
          - Law of proximity
          - Law of closure
          - Law of continuity
        scoring_spec:
          correct_index: 3
        explanation: The Gestalt law of continuity states that observers tend to perceive elements as continuing along an established direction rather than as broken, abrupt fragments. Closure specifically refers to filling in enclosed gaps.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 5.3
        concept_slugs:
        - psyc-perceptual-organization
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which retinal photoreceptor cells are concentrated primarily in the fovea and are responsible for high visual acuity and color vision in bright light?
        options:
        - Rods
        - Bipolar cells
        - Cones
        - Ganglion cells
        correct_answer: 2
        explanation: Cones are densely packed in the central fovea, mediate sharp spatial resolution, operate in photopic (bright) illumination, and contain photopigments responsive to red, green, or blue wavelengths.
        concept_slugs:
        - psyc-visual-auditory-systems
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Which Gestalt principle explains why we perceive individual dots aligned in a smooth, continuous curve as belonging together rather than as separate points?
        options:
        - Principle of proximity
        - Principle of closure
        - Principle of figure-ground
        - Principle of continuity
        correct_answer: 3
        explanation: The Gestalt principle of continuity states that observers perceive elements that follow a smooth vector or continuous line as a unified perceptual figure rather than as disjointed segments.
        concept_slugs:
        - psyc-perceptual-organization
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What anatomical feature creates the visual blind spot?
      back: The exit point where the optic nerve leaves the retina, which lacks photoreceptors.
      concept_slugs:
      - psyc-visual-auditory-systems
    - front: What are the two binocular depth cues?
      back: Retinal disparity (different angles between retinas) and convergence (neuromuscular eye turning).
      concept_slugs:
      - psyc-perceptual-organization
- code: '4.0'
  title: States of Consciousness
  description: Circadian rhythms, sleep architecture and NREM/REM stages, sleep disorders, dream theories, hypnosis, and psychoactive drug classifications.
  weight: 0.055
  sort_order: 4
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 4.0 (5\u20136%)"
  objectives:
  - code: '4.1'
    title: Analyze biological rhythms, sleep stages, and physiological architecture
    description: Examine circadian regulation by the suprachiasmatic nucleus, distinguish NREM-1, NREM-2, NREM-3, and REM sleep, and describe sleep functions.
    sort_order: 1
    importance: core
    citation: College Board Objective 4.1
    concepts:
    - slug: psyc-circadian-rhythms
      name: Circadian Rhythms and Sleep Architecture
      short_definition: Endogenous 24-hour biological cycles governed by the suprachiasmatic nucleus regulating sleep-wake cycles and melatonin secretion.
      description: The suprachiasmatic nucleus (SCN) in the hypothalamus directs the pineal gland to release melatonin during darkness and suppress it in light.
      citation: OpenStax Psychology 2e, Section 4.2
    - slug: psyc-sleep-stages
      name: NREM and REM Sleep Cycles
      short_definition: Sequential 90-minute sleep cycles alternating between non-REM stages (characterized by sleep spindles and delta waves) and REM paradoxical sleep.
      description: Sleep transitions through NREM-1 (theta), NREM-2 (spindles/K-complexes), NREM-3 (slow-wave delta), and REM (rapid eye movement, motor atonia, dreaming).
      citation: OpenStax Psychology 2e, Section 4.2
      prerequisites:
      - psyc-circadian-rhythms
    lessons:
    - title: Sleep Architecture and Biological Rhythms
      description: Circadian regulation, suprachiasmatic nucleus mechanics, EEG waveforms across NREM-1, NREM-2, NREM-3, and REM sleep.
      emoji: "\U0001F319"
      tags:
      - sleep
      - circadian
      - rem
      - delta
      - brainwaves
      concept_slugs:
      - psyc-circadian-rhythms
      - psyc-sleep-stages
      citation: 'OpenStax Psychology 2e, Section 4.2: Sleep and Why We Sleep'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Biological Clocks and Circadian Regulation\n\nHuman physiological arousal, hormone release, and body temperature fluctuate along a **circadian rhythm**\u2014an internal biological clock that repeats approximately every 24 hours. Light-sensitive retinal ganglion cells project to the **suprachiasmatic nucleus (SCN)** in the hypothalamus. In daylight, the SCN suppresses melatonin secretion; in darkness, the SCN signals the **pineal gland** to secrete **melatonin**, inducing drowsiness.\n\n### The Architecture of the 90-Minute Sleep Cycle\n\nSleep progresses through repeating 90-minute ultradian cycles across four distinct stages:\n\n| Sleep Stage | Dominant EEG Waveform | Defining Physiological Characteristics |\n| :--- | :--- | :--- |\n| **Waking (Alert)** | Beta waves (high frequency, low amplitude) | Active mental concentration, desynchronized firing |\n| **Waking (Relaxed)** | Alpha waves (8\u201312 Hz) | Calm, resting state with closed eyes |\n| **NREM-1** | Theta\
            \ waves (4\u20137 Hz) | Light transitional sleep; hypnagogic sensations (falling, jerks) |\n| **NREM-2** | Theta with **Sleep Spindles** & **K-complexes** | Baseline adult sleep (~50% of night); memory consolidation |\n| **NREM-3** | **Delta waves** (slow, large waves $<4$ Hz) | Deep slow-wave sleep; pituitary human growth hormone release |\n| **REM Sleep** | Beta-like fast, desynchronized waves | **Paradoxical sleep:** active brain/eyes, but complete **motor atonia** |"
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Why REM is Termed 'Paradoxical Sleep'
          body: REM sleep is called **paradoxical** because the internal body is physiologically highly aroused (heart rate accelerates, breathing becomes irregular, brain metabolism resembles waking beta activity), yet the external somatic musculature is completely paralyzed by brainstem inhibition (motor atonia).
      - sort_order: 3
        block_type: example
        content:
          title: 'Sleep Lab Case Study: Polysomnographic Shift Across the Night'
          text: An overnight sleep study monitors a 20-year-old college student. During the first four hours of sleep, the patient spends extensive durations in deep NREM-3 slow-wave sleep (delta waves). During the second half of the night, NREM-3 stages virtually disappear, while REM periods lengthen progressively, culminating in an extended 30-minute REM dream episode just before waking.
      - sort_order: 4
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Sleep Spindles vs. Delta Waves'
          body: "Do not confuse **NREM-2** with **NREM-3**. **Sleep spindles** (brief 12\u201314 Hz bursts) definitively mark NREM-2. **Delta waves** (large, high-amplitude slow waves) definitively mark NREM-3 deep sleep."
      terms:
      - term: Suprachiasmatic Nucleus (SCN)
        definition: A pair of cell clusters in the hypothalamus that controls the circadian rhythm by regulating pineal melatonin production.
        example: Light entering the retinas stimulates the SCN to inhibit melatonin synthesis in the morning.
      - term: Sleep Spindles
        definition: Rapid bursts of oscillatory brain electrical activity generated in the thalamus during NREM-2 sleep, aiding memory consolidation.
        example: "An EEG recording displaying brief 12\u201314 Hz spikes against a theta wave background."
      - term: REM Sleep
        definition: A recurring sleep stage characterized by rapid conjugate eye movements, vivid dreaming, and postural muscle atonia.
        example: A sleeper experiencing vivid dream narratives while their skeletal muscles remain completely limp.
      assessment_items:
      - prompt: Which biological structure located in the hypothalamus functions as the body's primary circadian pacemaker by regulating the pineal gland's secretion of melatonin?
        interaction_type: single_choice
        response_spec:
          options:
          - Substantia nigra
          - Suprachiasmatic nucleus
          - Hippocampal formation
          - Nucleus accumbens
        scoring_spec:
          correct_index: 1
        explanation: The suprachiasmatic nucleus (SCN) in the hypothalamus serves as the primary master circadian clock. In response to retinal light input, the SCN directs the pineal gland to suppress melatonin production in the morning and stimulate melatonin synthesis at night.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 4.2
        concept_slugs:
        - psyc-circadian-rhythms
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Why is rapid eye movement (REM) sleep frequently referred to by neuroscientists as 'paradoxical sleep'?
        interaction_type: single_choice
        response_spec:
          options:
          - The brain exhibits slow delta waves while muscles twitch rapidly
          - Sleepers experience no dreams despite intense ocular movement
          - The brain is highly active internally while skeletal muscles are paralyzed
          - Growth hormone secretion peaks while heart rate plummets to near zero
        scoring_spec:
          correct_index: 2
        explanation: REM sleep is called paradoxical because the central nervous system is highly aroused with waking-like beta/theta brainwave activity and rapid eye movements, yet the brainstem actively blocks somatic motor commands, leaving the sleeper in a state of postural muscle paralysis (atonia).
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 4.2
        concept_slugs:
        - psyc-sleep-stages
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which brain structure acts as the master circadian pacemaker by regulating melatonin secretion from the pineal gland in response to light?
        options:
        - Suprachiasmatic nucleus (SCN) of hypothalamus
        - Ventral tegmental area of the midbrain region
        - Substantia nigra of basal ganglia structures
        - Anterior cingulate cortex of the frontal lobe
        correct_answer: 0
        explanation: The suprachiasmatic nucleus (SCN) in the hypothalamus receives photic signals directly from retinal ganglion cells and synchronizes 24-hour biological rhythms by inhibiting melatonin release from the pineal gland during daylight.
        concept_slugs:
        - psyc-circadian-rhythms
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: EEG recordings showing sleep spindles and K-complexes are diagnostic of which stage of the non-REM sleep cycle?
        options:
        - Stage N1 sleep
        - Stage N2 sleep
        - Stage N3 sleep
        - REM state sleep
        correct_answer: 1
        explanation: Stage N2 sleep is characterized electrophysiologically by sleep spindles (brief 12-14 Hz bursts) and K-complexes (high-amplitude biphasic waves), which represent neural mechanisms protecting sleep from sensory arousal.
        concept_slugs:
        - psyc-sleep-stages
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: Which gland releases melatonin in response to signals from the suprachiasmatic nucleus?
      back: The pineal gland.
      concept_slugs:
      - psyc-circadian-rhythms
    - front: What type of EEG wave dominates deep, slow-wave NREM-3 sleep?
      back: Delta waves (large, slow brain waves).
      concept_slugs:
      - psyc-sleep-stages
  - code: '4.2'
    title: Evaluate sleep disorders, theories of dreaming, hypnosis, and psychoactive drugs
    description: Distinguish insomnia, narcolepsy, and sleep apnea, evaluate activation-synthesis vs. psychodynamic dream models, and categorize depressants, stimulants, and hallucinogens.
    sort_order: 2
    importance: core
    citation: College Board Objective 4.2
    concepts:
    - slug: psyc-sleep-disorders-dreams
      name: Sleep Pathology and Dream Theories
      short_definition: Clinical sleep disorders (narcolepsy, sleep apnea, insomnia) and theoretical explanations of dream function (Freud vs. activation-synthesis).
      description: Pathology includes narcoleptic cataplexy and obstructive sleep apnea; dream models contrast Freud's latent wish fulfillment with Hobson's neurobiological synthesis.
      citation: OpenStax Psychology 2e, Section 4.3 & 4.4
    - slug: psyc-psychoactive-drugs
      name: Psychoactive Drugs and Altered Consciousness
      short_definition: Pharmacological classes of consciousness-altering substances (depressants, stimulants, hallucinogens, opioids) and dependence mechanisms.
      description: Depressants enhance GABA inhibition; stimulants elevate monoamines; tolerance and withdrawal characterize physical dependence alongside psychological craving.
      citation: OpenStax Psychology 2e, Section 4.5
      prerequisites:
      - psyc-sleep-disorders-dreams
    lessons:
    - title: Sleep Disorders, Theories of Dreaming, and Psychoactive Drugs
      description: Insomnia, narcolepsy, sleep apnea, Hobson's activation-synthesis, hypnosis dissociation, and psychoactive substance categories.
      emoji: "\U0001F48A"
      tags:
      - disorders
      - narcolepsy
      - apnea
      - activation-synthesis
      - drugs
      concept_slugs:
      - psyc-sleep-disorders-dreams
      - psyc-psychoactive-drugs
      citation: OpenStax Psychology 2e, Section 4.3, 4.4, & 4.5
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Major Clinical Sleep Disorders\n\n- **Insomnia:** Chronic inability to fall asleep or maintain sleep, causing daytime cognitive impairment.\n- **Narcolepsy:** Sudden, uncontrollable sleep attacks where the patient collapses directly into **REM sleep**, often triggered by strong emotional excitement. Associated with a deficit in **hypocretin/orexin** neurons in the hypothalamus.\n- **Sleep Apnea:** Repeated episodes during sleep where the airway collapses, stopping respiration for 10\u201360 seconds hundreds of times per night. Treated with continuous positive airway pressure (**CPAP**).\n- **Night Terrors:** High autonomic arousal and screaming occurring during **NREM-3 deep sleep** (not REM nightmares); patients rarely recall the episode.\n\n### Theoretical Models of Dreaming\n\n| Model | Primary Mechanism | View on Dream Content |\n| :--- | :--- | :--- |\n| **Freud's Psychoanalytic Theory** | Unconscious psychic wish fulfillment | **Manifest content** (apparent storyline)\
            \ masks **Latent content** (hidden sexual/aggressive drives) |\n| **Activation-Synthesis Theory (Hobson)** | Random neural brainstem firing synthesized by cortex | Dreams are cognitive attempts to make sense of spontaneous pontine activity |\n| **Information-Processing Theory** | Memory consolidation and synaptic pruning | Dreams reprocess and organize daytime experiences into long-term storage |"
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Psychoactive Drug Classifications

            - **Depressants (Alcohol, Barbiturates, Benzodiazepines):** Reduce neural activity and slow body functions by enhancing the inhibitory neurotransmitter **GABA**.
            - **Stimulants (Caffeine, Nicotine, Cocaine, Amphetamines):** Excite neural activity, elevate heart rate, and suppress appetite by blocking the reuptake of **dopamine** and **norepinephrine**.
            - **Opioids / Narcotics (Morphine, Heroin, Codeine, Fentanyl):** Depress neural functioning, relieve pain, and produce euphoria by binding to endogenous **endorphin** receptor sites.
            - **Hallucinogens (LSD, Psilocybin, MDMA):** Distort visual and auditory perceptions and evoke sensory images without sensory input, primarily acting as **serotonin** receptor agonists.

            ### Dependence and Tolerance

            - **Tolerance:** Requiring larger and larger drug dosages to achieve the initial physiological effect.
            - **Physical Dependence & Withdrawal:** Physiological adaptation characterized by physical illness, cramping, or tremors upon cessation.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Night Terrors vs. Nightmares
          body: '**Night terrors** occur during **NREM-3 deep sleep**, involve screaming and frantic motor agitation, and are rarely remembered. **Nightmares** are vivid terrifying dreams that occur during **REM sleep**, usually in early morning hours, and are readily recalled upon waking.'
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Vignette: Cataplexy in Narcoleptic Patients'
          text: "A 28-year-old teacher laughs uproariously at a student's joke and instantly collapses to the floor, unable to speak or move while remaining fully conscious for 45 seconds. This symptom\u2014**cataplexy**\u2014is a pathognomonic sign of narcolepsy, where REM-induced muscle atonia is inappropriately triggered during waking consciousness."
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Alcohol Classification'
          body: Even though small amounts of alcohol can cause behavioral disinhibition and an initial sense of euphoria, alcohol is biologically classified as a **depressant** because it systematically suppresses central nervous system functioning by acting as a GABA agonist.
      terms:
      - term: Sleep Apnea
        definition: A serious sleep disorder in which breathing repeatedly stops and starts throughout the night due to upper airway collapse.
        example: A patient with loud snoring who wakes hundreds of times per night gasping for air, suffering chronic daytime fatigue.
      - term: Activation-Synthesis Theory
        definition: The neurobiological theory that dreams are created by the cerebral cortex attempting to synthesize and interpret random neural impulses originating in the brainstem.
        example: Hobson and McCarley proposing that dreams represent cortical sense-making of spontaneous pontine bursts.
      - term: Tolerance
        definition: The diminishing effect with regular use of the same dose of a drug, requiring the user to take larger amounts to experience the drug's effect.
        example: A chronic heroin user requiring ten times their starting dose to achieve pain relief.
      assessment_items:
      - prompt: According to J. Allan Hobson's activation-synthesis hypothesis, what represents the primary biological origin of dreams?
        interaction_type: single_choice
        response_spec:
          options:
          - Random pontine neural activity synthesized by the cerebral cortex
          - Repressed sexual impulses emerging from the unconscious id
          - Systematic sorting and filing of daily declarative memory traces
          - Periodic physiological maintenance of damaged retinal photoreceptors
        scoring_spec:
          correct_index: 0
        explanation: Hobson and McCarley's activation-synthesis model proposes that dreaming results from the cerebral cortex's attempt to synthesize and impose a coherent narrative onto spontaneous, random bursts of neural activity originating in the lower brainstem (pons) during REM sleep.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 4.3
        concept_slugs:
        - psyc-sleep-disorders-dreams
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A sleep clinic patient periodically stops breathing dozens of times each hour, resulting in repeated micro-awakenings and severe daytime somnolence. What diagnosis is indicated?
        interaction_type: single_choice
        response_spec:
          options:
          - Narcoleptic cataplexy
          - Somnambulism
          - Sleep apnea
          - NREM-3 night terrors
        scoring_spec:
          correct_index: 2
        explanation: Sleep apnea is characterized by temporary cessations of breathing during sleep lasting 10 seconds or longer, caused by airway blockage. The resulting blood oxygen drops prompt repeated brief awakenings, disrupting restorative sleep.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 4.4
        concept_slugs:
        - psyc-sleep-disorders-dreams
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Alcohol, barbiturates, and benzodiazepines are grouped together into which pharmacological drug category based on their shared ability to depress central nervous system activity?
        interaction_type: single_choice
        response_spec:
          options:
          - Stimulants
          - Hallucinogens
          - Opiates
          - Depressants
        scoring_spec:
          correct_index: 3
        explanation: Alcohol, barbiturates, and benzodiazepines are depressants. They reduce neural activity and slow autonomic functions, primarily by acting as GABA receptor agonists, which enhances inhibitory neurotransmission across the central nervous system.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 4.5
        concept_slugs:
        - psyc-psychoactive-drugs
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which sleep disorder involves sudden, uncontrollable attacks of overwhelming daytime sleepiness and immediate intrusion into REM sleep?
        options:
        - Sleep apnea
        - Somnambulism
        - Narcolepsy
        - Sleep terror
        correct_answer: 2
        explanation: Narcolepsy is characterized by severe daytime hypersomnolence, cataplexy (sudden loss of muscle tone), and rapid sleep-onset REM episodes, often linked to hypocretin/orexin neuron loss.
        concept_slugs:
        - psyc-sleep-disorders-dreams
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Alcohol, barbiturates, and benzodiazepines are classified under which major category of psychoactive substances because they agonize GABA receptors?
        options:
        - Stimulants
        - Hallucinogens
        - Opiates
        - Depressants
        correct_answer: 3
        explanation: Depressants reduce central nervous system arousal, motor activity, and anxiety by enhancing the inhibitory neurotransmitter GABA.
        concept_slugs:
        - psyc-psychoactive-drugs
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the difference between manifest and latent dream content in Freud's theory?
      back: Manifest content is the remembered storyline; latent content is the underlying, hidden psychological meaning.
      concept_slugs:
      - psyc-sleep-disorders-dreams
    - front: What neurotransmitter system is primarily enhanced by depressant drugs like alcohol and benzodiazepines?
      back: GABA (the primary inhibitory neurotransmitter).
      concept_slugs:
      - psyc-psychoactive-drugs
- code: '5.0'
  title: Learning
  description: Classical conditioning paradigms, operant conditioning principles and schedules of reinforcement, cognitive maps, and observational learning.
  weight: 0.085
  sort_order: 5
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 5.0 (8\u20139%)"
  objectives:
  - code: '5.1'
    title: Analyze classical conditioning mechanisms, acquisition, extinction, and biological preparedness
    description: Identify unconditioned/conditioned stimuli and responses, explain stimulus generalization and discrimination, and evaluate Garcia's taste aversion.
    sort_order: 1
    importance: core
    citation: College Board Objective 5.1
    concepts:
    - slug: psyc-classical-conditioning
      name: Pavlovian Classical Conditioning
      short_definition: Form of associative learning where an organism pairs a neutral stimulus with an unconditioned stimulus to elicit a conditioned response.
      description: Demonstrated by Ivan Pavlov (salivation in dogs) and Watson's Little Albert; governed by acquisition, extinction, spontaneous recovery, and generalization.
      citation: OpenStax Psychology 2e, Section 6.2
    - slug: psyc-biological-constraints
      name: Biological Preparedness and Taste Aversion
      short_definition: Evolutionary predisposition to learn specific associations (e.g., taste and nausea) rapidly across prolonged delays.
      description: John Garcia demonstrated that rats associate novel flavors with sickness even after hours of delay, violating traditional temporal contiguity assumptions.
      citation: OpenStax Psychology 2e, Section 6.2
      prerequisites:
      - psyc-classical-conditioning
    lessons:
    - title: 'Classical Conditioning: Principles and Extinction'
      description: UCS, UCR, CS, CR paradigms, acquisition curves, extinction, spontaneous recovery, and conditioned taste aversions.
      emoji: "\U0001F514"
      tags:
      - classical
      - pavlov
      - conditioning
      - watson
      - extinction
      concept_slugs:
      - psyc-classical-conditioning
      - psyc-biological-constraints
      citation: 'OpenStax Psychology 2e, Section 6.2: Classical Conditioning'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Pavlovian Classical Conditioning Paradigm

            **Classical conditioning** is an associative learning process where an organism learns to link two or more stimuli to anticipate events:
            - **Unconditioned Stimulus (UCS):** A stimulus that naturally and automatically triggers an unlearned response (e.g., meat powder placed on a dog's tongue).
            - **Unconditioned Response (UCR):** The unlearned, naturally occurring response to the UCS (e.g., salivation elicited by food).
            - **Neutral Stimulus (NS):** A stimulus that elicits no response before conditioning (e.g., ringing a bell or metronome).
            - **Conditioned Stimulus (CS):** An originally neutral stimulus that, after repeated pairing with a UCS, triggers a conditioned response (e.g., the bell alone).
            - **Conditioned Response (CR):** The learned response to the previously neutral CS (e.g., salivating to the sound of the bell).
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Stages of Classical Conditioning

            | Conditioning Phase | Operational Definition | Behavioral Manifestation |
            | :--- | :--- | :--- |
            | **Acquisition** | Initial learning phase where NS is repeatedly paired with UCS | CR progressively strengthens as CS-UCS association solidifies |
            | **Extinction** | Diminishing of CR when CS is repeatedly presented **without** UCS | Salivation to the bell drops to zero over repeated trials |
            | **Spontaneous Recovery** | Reappearance of an extinguished CR after an intervening rest interval | After 24 hours of rest, presenting the bell alone triggers salivation again |
            | **Generalization** | Tendency for stimuli similar to the CS to evoke similar responses | Little Albert fearing white rabbits and fur coats after conditioning with a white rat |
            | **Discrimination** | Learned capacity to distinguish between a CS and irrelevant stimuli | A dog salivating only to a 1000 Hz tone, not an 800 Hz tone |
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: UCR vs. CR Distinction
          body: 'The **unconditioned response (UCR)** and the **conditioned response (CR)** typically describe the *same physical behavior* (e.g., salivating or blinking). What differs is the **triggering stimulus**: the UCR is elicited by the UCS; the CR is elicited by the CS.'
      - sort_order: 4
        block_type: example
        content:
          title: 'Experimental Case Study: John Garcia''s Conditioned Taste Aversion'
          text: Behaviorists historically claimed any stimulus could be conditioned to any response with equal ease. John Garcia disproved this by exposing rats to novel flavored water followed hours later by radiation-induced nausea. The rats developed immediate, powerful **taste aversions** after a **single trial**, even with a delay of several hours. Crucially, rats failed to develop aversions to sights or sounds paired with nausea, proving that organisms are **biologically prepared** to associate taste with gastrointestinal illness.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Spontaneous Recovery Does Not Mean Re-learning'
          body: '**Spontaneous recovery** proves that extinction suppresses rather than permanently erases a conditioned association. When an extinguished response reappears following a delay, it occurs without any new pairings with the unconditioned stimulus.'
      terms:
      - term: Conditioned Stimulus (CS)
        definition: An originally neutral stimulus that, after association with an unconditioned stimulus, comes to trigger a conditioned response.
        example: A doctor's white coat triggering a child's crying after being paired with painful vaccine injections.
      - term: Spontaneous Recovery
        definition: The sudden reappearance of an extinguished conditioned response after a period of rest or delay.
        example: A dog salivating to a buzzer 48 hours after the buzzer had been completely extinguished.
      - term: Garcia Effect
        definition: An evolutionary biological predisposition in mammals to readily associate novel tastes with subsequent nausea even across prolonged delays.
        example: Avoiding oysters for years after experiencing food poisoning from an oyster dinner.
      assessment_items:
      - prompt: In Pavlov's classic laboratory experiments with canines, what represented the unconditioned stimulus (UCS)?
        interaction_type: single_choice
        response_spec:
          options:
          - The meat powder placed on the canine's tongue
          - The sound of the ringing auditory metronome
          - The salivation elicited by the auditory tone
          - The sight of the research experimenter entering
        scoring_spec:
          correct_index: 0
        explanation: In Pavlov's experiments, the meat powder is the unconditioned stimulus (UCS) because it naturally, automatically, and reliably triggers salivation without any prior learning or conditioning.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 6.2
        concept_slugs:
        - psyc-classical-conditioning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A young child is conditioned to fear a laboratory white rat. The following week, the child displays intense fear when presented with a white rabbit and a white fur coat. What learning phenomenon is demonstrated?
        interaction_type: single_choice
        response_spec:
          options:
          - Spontaneous recovery
          - Stimulus generalization
          - Stimulus discrimination
          - Higher-order conditioning
        scoring_spec:
          correct_index: 1
        explanation: Stimulus generalization is the tendency for stimuli that resemble the original conditioned stimulus (e.g., other furry white objects resembling the white rat) to evoke similar conditioned responses, as demonstrated in Watson and Rayner's Little Albert experiment.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 6.2
        concept_slugs:
        - psyc-classical-conditioning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: An extinguished conditioned response spontaneously reappears when the conditioned stimulus is presented after a twenty-four-hour delay. What does this observation demonstrate about extinction?
        interaction_type: single_choice
        response_spec:
          options:
          - Extinction permanently erases the neural connection
          - The organism requires immediate reconditioning trials
          - Extinction suppresses rather than completely destroys the association
          - Operant punishment has overridden the classical reflex
        scoring_spec:
          correct_index: 2
        explanation: Spontaneous recovery reveals that extinction is an active inhibitory process that suppresses the conditioned response rather than permanently destroying the underlying associative memory trace.
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 6.2
        concept_slugs:
        - psyc-classical-conditioning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Why did John Garcia's research on conditioned taste aversion challenge the traditional assumptions of behaviorist learning theory?
        interaction_type: single_choice
        response_spec:
          options:
          - Conditioning occurred only after hundreds of repetitive exposures
          - Conditioning required an explicit human verbal cognitive contract
          - Conditioning failed to occur if a secondary reinforcer was withheld
          - Conditioning occurred after a single trial despite hours of delay
        scoring_spec:
          correct_index: 3
        explanation: Traditional behaviorism asserted that conditioning required immediate temporal contiguity (seconds) and many repetitive pairings. Garcia proved that rats formed taste aversions after a single exposure even with hours separating ingestion and sickness, demonstrating evolutionary biological preparedness.
        difficulty: advanced
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 6.2
        concept_slugs:
        - psyc-biological-constraints
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: In Pavlov's original experiments with dogs, the unconditioned stimulus (UCS) was which element?
        options:
        - The food powder presented in the mouth
        - The auditory tone presented by metronome
        - The salivation triggered by tone stimulus
        - The presence of the laboratory assistant
        correct_answer: 0
        explanation: The unconditioned stimulus (UCS) is an environmental stimulus that naturally and reflexively triggers an innate physiological response (the UCR) without prior conditioning; in Pavlov's experiment, this was the food powder.
        concept_slugs:
        - psyc-classical-conditioning
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: John Garcia's experiments with taste aversion conditioning challenged classical behaviorist assumptions by demonstrating what biological principle?
        options:
        - Any neutral conditioned stimulus can be paired equally easily with any unconditioned response
        - Organisms are biologically predisposed to associate novel tastes with illness over long delay intervals
        - Conditioned taste aversion requires continuous immediate reinforcement across dozens of trials
        - Conditioned responses cannot be established without active conscious cognitive appraisal
        correct_answer: 1
        explanation: 'Garcia demonstrated biological preparedness: rats readily formed associations between novel tastes and radiation-induced nausea even after hours-long delays, but could not associate visual or auditory cues with nausea.'
        concept_slugs:
        - psyc-biological-constraints
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the difference between stimulus generalization and stimulus discrimination?
      back: Generalization is responding similarly to resembling stimuli; discrimination is learning to respond exclusively to the specific CS.
      concept_slugs:
      - psyc-classical-conditioning
    - front: What did the Garcia Effect reveal about learning?
      back: Organisms possess biological constraints that make them predisposed to associate taste with illness more readily than visual/auditory cues.
      concept_slugs:
      - psyc-biological-constraints
  - code: '5.2'
    title: Analyze operant conditioning paradigms, reinforcement schedules, and observational learning
    description: Contrast positive/negative reinforcement and punishment, analyze ratio and interval reinforcement schedules, and evaluate Bandura's observational modeling.
    sort_order: 2
    importance: core
    citation: College Board Objective 5.2
    concepts:
    - slug: psyc-operant-conditioning
      name: Operant Conditioning Principles and Schedules
      short_definition: Voluntary behavioral modification where actions are strengthened by reinforcement or weakened by punishment.
      description: B. F. Skinner defined positive/negative reinforcers and punishers along fixed/variable ratio and interval partial reinforcement schedules.
      citation: OpenStax Psychology 2e, Section 6.3
    - slug: psyc-observational-learning
      name: Social Learning and Cognitive Modeling
      short_definition: Learning by observing others' behaviors and consequences, highlighted by Bandura's Bobo doll study and mirror neurons.
      description: Observational learning requires attention, retention, motor reproduction, and motivation, augmented by latent learning and cognitive maps.
      citation: OpenStax Psychology 2e, Section 6.4
      prerequisites:
      - psyc-operant-conditioning
    lessons:
    - title: 'Operant Conditioning: Reinforcement, Schedules, and Observational Learning'
      description: Reinforcement vs. punishment matrix, Skinner box mechanics, schedules of partial reinforcement, and Bandura's Bobo doll experiments.
      emoji: "\U0001F4E6"
      tags:
      - operant
      - skinner
      - reinforcement
      - schedules
      - bandura
      concept_slugs:
      - psyc-operant-conditioning
      - psyc-observational-learning
      citation: OpenStax Psychology 2e, Section 6.3 & 6.4
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Operant Conditioning Matrix

            Whereas classical conditioning pairs two stimuli to elicit involuntary reflexes, **operant conditioning** modifies voluntary behavior via consequences:

            | Contingency | Stimulus Presentation / Removal | Effect on Future Behavior | Practical Clinical Example |
            | :--- | :--- | :--- | :--- |
            | **Positive Reinforcement** | **Add** a pleasant stimulus | **Increases** behavior | Giving a child a gold star for completing homework |
            | **Negative Reinforcement** | **Remove** an aversive stimulus | **Increases** behavior | Fastening your seatbelt to terminate an annoying warning chime |
            | **Positive Punishment** | **Add** an unpleasant stimulus | **Decreases** behavior | Receiving a speeding fine from a traffic officer |
            | **Negative Punishment** | **Remove** a pleasant stimulus | **Decreases** behavior | Revoking a teenager's cell phone privileges for breaking curfew |
      - sort_order: 2
        block_type: callout
        content:
          type: warning
          title: 'The Universal Student Pitfall: Negative Reinforcement is NOT Punishment'
          body: '**Reinforcement always INCREASES behavior.** Negative reinforcement increases behavior by taking away something bad (e.g., taking an aspirin removes a headache, so you take aspirin again). **Punishment always DECREASES behavior.**'
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Schedules of Partial (Intermittent) Reinforcement

            - **Fixed-Ratio (FR):** Reinforces after a set number of responses (e.g., factory worker paid for every 20 garments assembled). High response rate with brief post-reinforcement pause.
            - **Variable-Ratio (VR):** Reinforces after an unpredictable number of responses (e.g., slot machines, scratch-off lottery tickets). Yields the **highest response rate** and greatest resistance to extinction.
            - **Fixed-Interval (FI):** Reinforces the first response after a set time interval (e.g., weekly salary direct-deposited every Friday). Produces a characteristic **scalloped response pattern** (activity surges just prior to deadline).
            - **Variable-Interval (VI):** Reinforces the first response after unpredictable time periods (e.g., checking email or waiting for a fish to bite). Produces slow, steady response rates.

            ### Bandura's Observational Learning Theory

            Albert Bandura demonstrated that organisms learn through **modeling** without direct reinforcement. In his famous **Bobo Doll experiments**, children who watched an adult violently strike an inflated doll were significantly more likely to imitate the specific hostile acts and verbal insults when later frustrated, driven by **vicarious reinforcement**.
      - sort_order: 4
        block_type: example
        content:
          title: 'Real-World Application: Shaping via Successive Approximations'
          text: A service dog trainer wants a retriever to learn how to turn on a light switch. The trainer cannot wait for the dog to spontaneously perform the full action. Using **shaping**, the trainer first reinforces looking at the wall, then walking to the switch, then touching the plate with its nose, and finally flipping the lever upward.
      - sort_order: 5
        block_type: callout
        content:
          type: key_concept
          title: Latent Learning and Cognitive Maps
          body: Edward Tolman demonstrated that rats wandering through a maze formed internal mental representations (**cognitive maps**) without any reward. When food was finally introduced, they navigated the maze just as quickly as rewarded rats, proving **latent learning** occurs without immediate reinforcement.
      terms:
      - term: Negative Reinforcement
        definition: The strengthening of a response by the removal, escape from, or avoidance of an unpleasant or aversive stimulus.
        example: Turning off a loud alarm clock by pressing the snooze button reinforces pressing the button.
      - term: Variable-Ratio Schedule
        definition: A reinforcement schedule that reinforces a response after an unpredictable number of responses.
        example: A gambler continuing to pull the arm of a slot machine because a payout could occur on any pull.
      - term: Shaping
        definition: An operant conditioning procedure in which reinforcers guide behavior toward closer and closer approximations of the desired goal.
        example: Teaching a pigeon to bowl a ball by progressively rewarding orienting, approaching, and rolling.
      assessment_items:
      - prompt: An individual takes an aspirin to eliminate a throbbing tension headache. The pain dissipates, making the individual more likely to take aspirin the next time a headache arises. What conditioning principle explains this increased behavior?
        interaction_type: single_choice
        response_spec:
          options:
          - Negative reinforcement
          - Positive reinforcement
          - Positive punishment
          - Classical counterconditioning
        scoring_spec:
          correct_index: 0
        explanation: Negative reinforcement occurs when a behavior is strengthened and increases in frequency because it successfully removes, terminates, or avoids an aversive stimulus (in this case, the painful headache).
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 6.3
        concept_slugs:
        - psyc-operant-conditioning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which partial reinforcement schedule produces the highest rate of behavioral responding and exhibits the greatest resistance to extinction?
        interaction_type: single_choice
        response_spec:
          options:
          - Fixed-interval schedule
          - Variable-ratio schedule
          - Fixed-ratio schedule
          - Variable-interval schedule
        scoring_spec:
          correct_index: 1
        explanation: A variable-ratio schedule delivers reinforcement after an unpredictable number of responses (like a slot machine or lottery ticket). Because the next response could always yield reward, it generates the highest, steadiest response rates and is remarkably resistant to extinction.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 6.3
        concept_slugs:
        - psyc-operant-conditioning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A college student studies intensively only during the night before each scheduled weekly exam, followed by a total cessation of studying until the eve of the next test. What reinforcement schedule generates this scalloped response pattern?
        interaction_type: single_choice
        response_spec:
          options:
          - Variable-ratio schedule
          - Fixed-ratio schedule
          - Fixed-interval schedule
          - Continuous reinforcement schedule
        scoring_spec:
          correct_index: 2
        explanation: A fixed-interval schedule reinforces the first response only after a specified time interval has elapsed. It characteristically produces a 'scalloped' response curve where activity slows dramatically following reinforcement and surges right before the scheduled deadline.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 6.3
        concept_slugs:
        - psyc-operant-conditioning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In Albert Bandura's classic Bobo Doll experiments, what factor determined whether children spontaneously imitated aggressive behaviors displayed by adult models?
        interaction_type: single_choice
        response_spec:
          options:
          - The gender of the child observing the scenario
          - Direct primary reinforcers delivered immediately to the child
          - The genetic temperament score of the experimental subject
          - Observing vicarious consequences delivered to the model
        scoring_spec:
          correct_index: 3
        explanation: 'Bandura''s experiments demonstrated that observational learning is heavily mediated by vicarious reinforcement and vicarious punishment: children who observed the aggressive adult model being rewarded or experiencing no consequences readily imitated the hostility, whereas observing punishment suppressed imitation.'
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 6.4
        concept_slugs:
        - psyc-observational-learning
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: A student receives praise from an instructor after an unpredictable number of completed homework assignments (e.g., after 3, then 7, then 4 assignments). Which reinforcement schedule is being used?
        options:
        - Fixed-ratio schedule
        - Variable-interval schedule
        - Variable-ratio schedule
        - Fixed-interval schedule
        correct_answer: 2
        explanation: A variable-ratio schedule delivers reinforcement after an unpredictable, varying number of responses; it generates high, steady response rates that are extremely resistant to extinction.
        concept_slugs:
        - psyc-operant-conditioning
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: In Albert Bandura's classic Bobo doll experiments, children who observed an adult model display aggressive behavior toward an inflatable doll subsequently exhibited what behavior?
        options:
        - Showed decreased aggressive play due to cathartic vicarious relief
        - Ignored the doll entirely and preferred neutral drawing activities
        - Exhibited aggression only when an immediate tangible candy reward was offered
        - Imitated the novel aggressive actions and verbalizations of the model
        correct_answer: 3
        explanation: 'Bandura demonstrated observational learning: children exposed to aggressive models imitated specific physical and verbal aggressive behaviors, disproving the claim that observing aggression produces catharsis.'
        concept_slugs:
        - psyc-observational-learning
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the operational definition of negative reinforcement?
      back: Increasing the frequency of a behavior by removing an aversive stimulus.
      concept_slugs:
      - psyc-operant-conditioning
    - front: What schedule of reinforcement governs slot machine gambling?
      back: Variable-ratio schedule.
      concept_slugs:
      - psyc-operant-conditioning
- code: '6.0'
  title: Cognition
  description: Memory models (encoding, storage, retrieval), forgetting mechanisms, problem-solving heuristics and biases, language development, and intelligence.
  weight: 0.09
  sort_order: 6
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 6.0 (8\u20139%)"
  objectives:
  - code: '6.1'
    title: Analyze memory architecture, encoding strategies, storage systems, and forgetting mechanisms
    description: Contrast sensory, working, and long-term memory, evaluate explicit vs. implicit systems, distinguish proactive and retroactive interference, and explain Loftus's memory reconstruction.
    sort_order: 1
    importance: core
    citation: College Board Objective 6.1
    concepts:
    - slug: psyc-memory-models
      name: Atkinson-Shiffrin Model and Working Memory
      short_definition: Three-stage memory processing model comprising sensory registers, short-term/working memory, and permanent long-term storage.
      description: Information passes through iconic/echoic sensory registers into working memory (Baddeley's phonological loop, visuospatial sketchpad, central executive) before LTM encoding.
      citation: OpenStax Psychology 2e, Section 8.1
    - slug: psyc-memory-systems-forgetting
      name: Explicit vs. Implicit Memory and Interference
      short_definition: Subsystems of long-term memory (episodic, semantic, procedural) and forgetting mechanisms (proactive/retroactive interference and amnesia).
      description: Explicit memory requires hippocampus/cortex; implicit memory relies on cerebellum/basal ganglia. Forgetting is driven by interference and constructive distortion.
      citation: OpenStax Psychology 2e, Section 8.2 & 8.3
      prerequisites:
      - psyc-memory-models
    lessons:
    - title: 'Memory Systems: Encoding, Storage, and Retrieval'
      description: Working memory components, levels of processing, explicit vs. implicit memory, serial position effect, and proactive vs. retroactive interference.
      emoji: "\U0001F5C4\uFE0F"
      tags:
      - memory
      - working-memory
      - interference
      - amnesia
      - ebbinghaus
      concept_slugs:
      - psyc-memory-models
      - psyc-memory-systems-forgetting
      citation: 'OpenStax Psychology 2e, Chapter 8: Memory'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### The Atkinson-Shiffrin Three-Stage Memory Model\n\n1. **Sensory Memory:** Immediate, initial recording of sensory data.\n   - **Iconic Memory:** Visual sensory register lasting ~0.5 seconds (tested by George Sperling's partial-report technique).\n   - **Echoic Memory:** Auditory sensory register lasting 3\u20134 seconds.\n2. **Short-Term & Working Memory:** Active conscious workspace with a capacity of $7 \\pm 2$ chunks (Miller) or ~4 chunks (Cowan), lasting ~20\u201330 seconds without maintenance rehearsal. Alan Baddeley's model divides working memory into:\n   - **Central Executive:** Directs focal attention and coordinates slave systems.\n   - **Phonological Loop:** Holds and manipulates acoustic, verbal speech information.\n   - **Visuospatial Sketchpad:** Holds visual mental imagery and spatial coordinates.\n   - **Episodic Buffer:** Synthesizes information across domains into integrated chronological units.\n3. **Long-Term Memory (LTM):** Relatively permanent storage\
            \ system with theoretically limitless capacity."
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Long-Term Memory Subsystems

            | Memory System | Nature of Knowledge | Neural Substrates | Representative Example |
            | :--- | :--- | :--- | :--- |
            | **Explicit / Declarative (Episodic)** | Personally experienced autobiographical life events | Hippocampus, Prefrontal Cortex | Remembering your high school graduation ceremony |
            | **Explicit / Declarative (Semantic)** | General factual knowledge, concepts, vocabulary | Cerebral Cortex | Knowing that Paris is the capital of France |
            | **Implicit / Nondeclarative (Procedural)** | Motor skills, habits, and classical conditioning | Cerebellum, Basal Ganglia | Riding a bicycle; playing a rehearsed piano sonata |

            ### Mechanisms of Forgetting and Interference

            - **Proactive Interference:** Prior (old) learning disrupts the recall of newly acquired information *(e.g., dialing your old landline phone number when attempting to recall your new cell number)*.
            - **Retroactive Interference:** Recent (new) learning disrupts the recall of previously learned information *(e.g., learning Spanish vocabulary causing you to forget French words learned last semester)*.
            - **Serial Position Effect:** Tendency to recall items at the beginning (**primacy effect**, transferred to LTM) and end (**recency effect**, retained in working memory) of a list better than items in the middle.
      - sort_order: 3
        block_type: callout
        content:
          type: warning
          title: 'The Interference Mnemonic: PORN'
          body: |-
            Use the acronym **PORN**:
            - **P**roactive: **O**ld disrupts new.
            - **R**etroactive: **N**ew disrupts old.
      - sort_order: 4
        block_type: example
        content:
          title: 'Historical Neurological Case Study: Patient H.M. (Henry Molaison)'
          text: 'In 1953, surgeon William Scoville performed a bilateral medial temporal lobectomy on 27-year-old Patient H.M. to treat severe epilepsy, removing both hippocampi. H.M. developed profound **anterograde amnesia**: he could never again form new explicit/declarative memories. However, psychologist Brenda Milner proved his **implicit procedural memory remained completely intact**: when trained on a mirror-tracing motor task, H.M. showed flawless day-to-day improvement despite having zero conscious recollection of ever performing the task before.'
      - sort_order: 5
        block_type: callout
        content:
          type: key_concept
          title: Elizabeth Loftus and Memory Reconstruction
          body: 'Memory is **constructive**, not a video recording. Elizabeth Loftus proved the **misinformation effect**: when eyewitnesses viewing a car crash were asked *''How fast were the cars going when they smashed into each other?''* versus *''hit each other?''*, those hearing ''smashed'' falsely remembered seeing broken glass at the scene.'
      terms:
      - term: Anterograde Amnesia
        definition: The inability to encode, consolidate, or store new explicit memories following neurological trauma or surgery.
        example: Meeting your physician every morning and introducing yourself as if meeting a stranger for the first time.
      - term: Proactive Interference
        definition: The disruptive effect of previously learned material on the retention and retrieval of newly acquired information.
        example: Accidentally writing your previous year's calendar date throughout January of the new year.
      - term: Misinformation Effect
        definition: The incorporation of misleading post-event information into one's memory of an event, altering eyewitness recollections.
        example: Eyewitnesses falsely recalling a stop sign after being asked a question containing the premise 'after the yield sign'.
      assessment_items:
      - prompt: A student moves into a new apartment and memorizes their new postal zip code. When attempting to mail a package to their previous residence, they can only remember the new zip code. What cognitive phenomenon explains this forgetting?
        interaction_type: single_choice
        response_spec:
          options:
          - Retroactive interference
          - Proactive interference
          - Anterograde amnesia
          - Sensory decay
        scoring_spec:
          correct_index: 0
        explanation: Retroactive interference occurs when newly acquired information (the new apartment's zip code) impairs and disrupts the retrieval of previously stored older information (the former residence's zip code).
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 8.3
        concept_slugs:
        - psyc-memory-systems-forgetting
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Following surgical bilateral resection of his hippocampi to treat intractable epilepsy, Patient H.M. was able to learn and master mirror-drawing motor skills despite having zero conscious memory of practicing the task. What memory system remained intact?
        interaction_type: single_choice
        response_spec:
          options:
          - Episodic memory
          - Implicit procedural memory
          - Semantic memory
          - Echoic sensory memory
        scoring_spec:
          correct_index: 1
        explanation: Procedural memory is an implicit/nondeclarative memory system governed primarily by the cerebellum and basal ganglia. Because the hippocampus mediates explicit/declarative memory, Patient H.M. could acquire new motor skills (implicit) without any conscious recollection (explicit).
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 8.2
        concept_slugs:
        - psyc-memory-systems-forgetting
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In an experiment conducted by Elizabeth Loftus, participants viewed a film of a traffic accident. Those asked 'How fast were the cars going when they smashed into each other?' gave significantly higher speed estimates and falsely reported broken glass. What psychological principle is demonstrated?
        interaction_type: single_choice
        response_spec:
          options:
          - State-dependent memory retrieval
          - Proactive linguistic interference
          - The misinformation effect
          - Sensory register iconic decay
        scoring_spec:
          correct_index: 2
        explanation: The misinformation effect occurs when misleading post-event information presented in leading questions alters and reconstructs an individual's original memory trace of an observed event.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 8.3
        concept_slugs:
        - psyc-memory-systems-forgetting
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: When presented with a list of twenty vocabulary words, an individual immediately recalls words from the beginning and end of the list far more accurately than words situated in the middle. What memory phenomenon is illustrated?
        interaction_type: single_choice
        response_spec:
          options:
          - Encoding specificity principle
          - Ebbinghaus forgetting asymptote
          - Tip-of-the-tongue phenomenon
          - The serial position effect
        scoring_spec:
          correct_index: 3
        explanation: The serial position effect describes the tendency to recall the first items (primacy effect, transferred to LTM) and last items (recency effect, still in working memory) better than the middle items in a sequence.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 8.1
        concept_slugs:
        - psyc-memory-models
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which component of Alan Baddeley's working memory model is responsible for coordinating attentional focus, switching between cognitive tasks, and integrating inputs from sensory buffers?
        interaction_type: single_choice
        response_spec:
          options:
          - The central executive
          - The phonological loop
          - The visuospatial sketchpad
          - The iconic sensory store
        scoring_spec:
          correct_index: 0
        explanation: In Baddeley's multicomponent model of working memory, the central executive acts as the supervisory attentional controller, allocating cognitive resources and coordinating the phonological loop, visuospatial sketchpad, and episodic buffer.
        difficulty: intermediate
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 8.1
        concept_slugs:
        - psyc-memory-models
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which component of Alan Baddeley's working memory model coordinates cognitive activities, allocates attentional resources, and integrates information across slave systems?
        options:
        - Central executive
        - Phonological loop
        - Visuospatial sketchpad
        - Episodic buffer
        correct_answer: 0
        explanation: The central executive directs cognitive focus, manages attentional switching, suppresses irrelevant information, and coordinates the phonological loop and visuospatial sketchpad.
        concept_slugs:
        - psyc-memory-models
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: An individual who can recall childhood events perfectly but is incapable of forming new conscious declarative memories after bilateral hippocampus surgery exhibits what condition?
        options:
        - Retrograde amnesia
        - Anterograde amnesia
        - Proactive interference
        - Retroactive interference
        correct_answer: 1
        explanation: Anterograde amnesia is the inability to consolidate and transfer new declarative information from short-term to long-term memory following hippocampal trauma (as famously observed in patient H.M.).
        concept_slugs:
        - psyc-memory-systems-forgetting
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the difference between proactive and retroactive interference?
      back: Proactive interference occurs when old memories block new ones; retroactive interference occurs when new learning disrupts old memories.
      concept_slugs:
      - psyc-memory-systems-forgetting
    - front: What brain structure is required for encoding explicit episodic memories?
      back: The hippocampus.
      concept_slugs:
      - psyc-memory-systems-forgetting
  - code: '6.2'
    title: Evaluate problem-solving strategies, cognitive biases, language acquisition, and psycholinguistics
    description: Distinguish heuristics from algorithms, identify availability and representativeness biases, evaluate functional fixedness, and explain Chomsky's universal grammar.
    sort_order: 2
    importance: core
    citation: College Board Objective 6.2
    concepts:
    - slug: psyc-problem-solving-biases
      name: Heuristics, Algorithms, and Cognitive Biases
      short_definition: Decision-making rules-of-thumb (heuristics) vs. step-by-step procedures (algorithms) and systematic cognitive biases.
      description: Heuristics trade speed for accuracy; obstacles include functional fixedness, mental set, confirmation bias, and the availability/representativeness heuristics.
      citation: OpenStax Psychology 2e, Section 7.2 & 7.3
    - slug: psyc-language-development
      name: Language Acquisition and Psycholinguistics
      short_definition: Structure of language (phonemes, morphemes, syntax) and developmental theories (Chomsky's universal grammar vs. Skinner's reinforcement).
      description: Language acquisition unfolds through babbling, one-word, and telegraphic speech stages, supported by innate neural language acquisition mechanisms.
      citation: OpenStax Psychology 2e, Section 7.4
      prerequisites:
      - psyc-problem-solving-biases
    lessons:
    - title: Problem Solving, Cognitive Biases, and Language Acquisition
      description: Algorithms vs. heuristics, confirmation bias, functional fixedness, phonemes vs. morphemes, and Chomsky's universal grammar.
      emoji: "\U0001F4A1"
      tags:
      - heuristics
      - biases
      - chomsky
      - language
      - problem-solving
      concept_slugs:
      - psyc-problem-solving-biases
      - psyc-language-development
      citation: OpenStax Psychology 2e, Section 7.2, 7.3, & 7.4
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Problem-Solving Strategies: Algorithms vs. Heuristics

            - **Algorithm:** A methodical, step-by-step logical rule or procedural formula that **guarantees** a correct solution if followed correctly *(e.g., searching every aisle in a grocery store systematically)*.
            - **Heuristic:** A fast, mental shortcut or 'rule-of-thumb' strategy that allows quick decision making but is prone to systematic cognitive errors *(e.g., checking only the baking aisle for vanilla extract)*.

            ### Common Cognitive Biases and Heuristic Traps

            | Cognitive Phenomenon | Operational Definition | Real-World Manifestation |
            | :--- | :--- | :--- |
            | **Availability Heuristic** | Estimating the likelihood of an event based on how readily vivid examples come to mind | Fearing commercial airline crashes over car accidents due to dramatic media coverage |
            | **Representativeness Heuristic** | Judging the probability of an event by comparing it to an existing mental prototype | Assuming a quiet, bespectacled man reading poetry is an Ivy League classics professor rather than a truck driver |
            | **Confirmation Bias** | Actively seeking and favoring evidence that confirms existing beliefs while ignoring contradictory data | Only reading news columns written by ideologically aligned political pundits |
            | **Functional Fixedness** | The cognitive inability to see that familiar objects can be used for novel, non-traditional functions | Failing to realize that an unbent wire coat hanger can be used to unlock a jammed latch |
            | **Mental Set** | Tendency to approach a problem with a mindset that worked successfully on past problems | Persisting with an algebraic equation when simple arithmetic solves the puzzle |
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### The Structural Architecture of Human Language

            - **Phonemes:** The smallest distinctive sound units in a spoken language *(e.g., the English word 'chat' contains 3 phonemes: /ch/, /a/, /t/)*.
            - **Morphemes:** The smallest units of language that carry semantic meaning, including prefixes and suffixes *(e.g., 'unbreakable' contains 3 morphemes: 'un-', 'break', '-able')*.
            - **Grammar:** System of rules guiding communication:
              * **Semantics:** Rules governing how we derive meaning from sounds and words.
              * **Syntax:** Rules governing the grammatical arrangement of words into meaningful sentences.

            ### Theories of Language Acquisition

            - **B. F. Skinner (Behavioral Model):** Argued language is acquired via environmental operant conditioning, imitation, and reinforcement.
            - **Noam Chomsky (Nativist Model):** Argued human brains are biologically hardwired with an innate **Language Acquisition Device (LAD)** and **Universal Grammar**, explaining why children acquire complex syntax effortlessly during a sensitive developmental window.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Phoneme vs. Morpheme Distinction
          body: '**Phonemes** are speech *sounds* without intrinsic meaning (e.g., the sound /k/). **Morphemes** are the smallest units that carry *meaning* (e.g., words like ''cat'', or prefixes like ''re-'', or suffixes like ''-ed'').'
      - sort_order: 4
        block_type: example
        content:
          title: 'Experimental Cognitive Case: Duncker''s Candle Problem'
          text: 'Karl Duncker presented participants with a candle, a book of matches, and a box of thumbtacks, tasking them to mount the candle on a corkboard so wax wouldn''t drip on the table. Most failed because of **functional fixedness**: they viewed the box solely as a container for tacks. The creative solution required emptying the box, tacking the box to the board, and standing the candle inside it.'
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Availability vs. Representativeness'
          body: |-
            Use this heuristic distinction:
            - **Availability** is about **mental recall ease** (e.g., *'I can easily picture a shark attack on TV, so shark attacks must be frequent'*).
            - **Representativeness** is about **matching a prototype** (e.g., *'He wears a white lab coat, so he must be a doctor'*).
      terms:
      - term: Availability Heuristic
        definition: Estimating the frequency or likelihood of an event based on how easily relevant instances spring to mind from memory.
        example: Overestimating the statistical danger of commercial aviation after watching news footage of an airplane crash.
      - term: Functional Fixedness
        definition: A cognitive block and type of mental set where an individual is unable to perceive an object being utilized for functions other than its customary purpose.
        example: Searching fruitlessly for a screwdriver when a butter knife or coin could easily tighten the loose screw.
      - term: Morpheme
        definition: The smallest unit of language that carries meaning; may be a standalone word or a meaningful prefix/suffix.
        example: 'The word ''prepackaged'' contains three morphemes: ''pre-'', ''package'', and ''-ed''.'
      assessment_items:
      - prompt: An individual refuses to travel by passenger airplane because television news broadcasts recently covered a catastrophic plane crash. What cognitive heuristic is driving this inflated risk assessment?
        interaction_type: single_choice
        response_spec:
          options:
          - Representativeness heuristic
          - Availability heuristic
          - Confirmation bias
          - Anchoring heuristic
        scoring_spec:
          correct_index: 1
        explanation: The availability heuristic operates when individuals evaluate the probability of events based on how readily vivid examples come to mind. Sensationalized media coverage makes plane crashes easily retrievable in memory, causing people to overestimate their frequency relative to automobile accidents.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 7.2
        concept_slugs:
        - psyc-problem-solving-biases
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A handyman needs to secure a picture frame to a wall but has no hammer. Despite having a heavy steel wrench on the workbench, the handyman wastes thirty minutes searching for a hammer. What cognitive obstacle is demonstrated?
        interaction_type: single_choice
        response_spec:
          options:
          - Belief perseverance
          - Framing effect
          - Functional fixedness
          - Overconfidence bias
        scoring_spec:
          correct_index: 2
        explanation: Functional fixedness is the cognitive inability to view familiar tools or objects as having utility beyond their traditional designed purpose (in this case, failing to recognize that a heavy steel wrench can pound a nail just like a hammer).
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 7.2
        concept_slugs:
        - psyc-problem-solving-biases
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: How many morphemes are contained in the English word 'unbreakable'?
        interaction_type: single_choice
        response_spec:
          options:
          - One morpheme
          - Two morphemes
          - Three morphemes
          - Four morphemes
        scoring_spec:
          correct_index: 2
        explanation: 'A morpheme is the smallest unit of language carrying meaning. The word ''unbreakable'' consists of three distinct morphemes: the prefix ''un-'' (meaning not), the root word ''break'', and the suffix ''-able'' (meaning capable of).'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 7.4
        concept_slugs:
        - psyc-language-development
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Linguist Noam Chomsky proposed that children acquire complex grammatical speech rapidly without explicit instruction because the human brain is biologically equipped with which innate mechanism?
        interaction_type: single_choice
        response_spec:
          options:
          - Operant vicarious reinforcement buffer
          - Phonemic sensory decay inhibitor
          - Episodic working memory executive
          - Innate Language Acquisition Device
        scoring_spec:
          correct_index: 3
        explanation: "Noam Chomsky championed the nativist theory of language acquisition, asserting that humans possess an innate biological predisposition\u2014termed the Language Acquisition Device (LAD) and Universal Grammar\u2014that enables children to deduce grammatical rules spontaneously from exposure to speech."
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 7.4
        concept_slugs:
        - psyc-language-development
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Searching for a misplaced item by methodically checking every single room, drawer, and shelf in an entire house exemplifies which problem-solving strategy?
        options:
        - A heuristic
        - Functional fixedness
        - An algorithm
        - Mental incubation
        correct_answer: 2
        explanation: An algorithm is a step-by-step, methodical procedure or formula that guarantees a correct solution if followed correctly, though it may be slow and exhaustive compared to heuristics.
        concept_slugs:
        - psyc-problem-solving-biases
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Noam Chomsky proposed that humans are born with an innate neural mechanism that facilitates language acquisition, termed what?
        options:
        - Operant vocalization apparatus
        - Critical articulatory buffer
        - Universal syntactic transformer
        - Language acquisition device (LAD)
        correct_answer: 3
        explanation: Chomsky posited the Language Acquisition Device (LAD), an innate biological predisposition and universal grammar that enables infants to acquire complex natural language effortlessly without formal instruction.
        concept_slugs:
        - psyc-language-development
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is an algorithm versus a heuristic in problem solving?
      back: An algorithm is a step-by-step rule that guarantees a solution; a heuristic is a fast mental shortcut that is prone to errors.
      concept_slugs:
      - psyc-problem-solving-biases
    - front: What is the difference between phonemes and morphemes?
      back: Phonemes are basic sound units; morphemes are the smallest units that carry semantic meaning.
      concept_slugs:
      - psyc-language-development
- code: '7.0'
  title: Motivation and Emotion
  description: Biological and social motives, drive-reduction, optimal arousal, hunger physiology, emotion theories, and Selye's General Adaptation Syndrome.
  weight: 0.055
  sort_order: 7
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 7.0 (5\u20136%)"
  objectives:
  - code: '7.1'
    title: Analyze motivational theories, homeostasis, hunger mechanisms, and incentive systems
    description: Evaluate drive-reduction and Yerkes-Dodson arousal models, analyze hypothalamic hunger regulation, and contrast intrinsic and extrinsic motivation.
    sort_order: 1
    importance: core
    citation: College Board Objective 7.1
    concepts:
    - slug: psyc-motivation-theories
      name: Theories of Motivation and Arousal
      short_definition: Frameworks explaining behavioral drive, including Hull's drive-reduction, homeostasis, and the Yerkes-Dodson arousal law.
      description: Drive-reduction restores biological homeostasis; optimal arousal dictates that intermediate arousal maximizes complex cognitive task performance.
      citation: OpenStax Psychology 2e, Section 10.1
    - slug: psyc-hunger-physiology
      name: Hypothalamic Hunger Regulation and Incentives
      short_definition: Biological appetite mechanisms mediated by lateral (hunger) and ventromedial (satiety) hypothalamic centers and intrinsic incentives.
      description: The lateral hypothalamus stimulates hunger while the ventromedial nucleus signals satiety, interacting with ghrelin, leptin, and the overjustification effect.
      citation: OpenStax Psychology 2e, Section 10.2
      prerequisites:
      - psyc-motivation-theories
    lessons:
    - title: Theories of Motivation and Motivational Drives
      description: Drive-reduction, Yerkes-Dodson law, Maslow's hierarchy, hypothalamic hunger centers, and the overjustification effect.
      emoji: "\U0001F3AF"
      tags:
      - motivation
      - drives
      - yerkes-dodson
      - hypothalamus
      - maslow
      concept_slugs:
      - psyc-motivation-theories
      - psyc-hunger-physiology
      citation: OpenStax Psychology 2e, Section 10.1 & 10.2
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Core Theories of Human Motivation

            - **Drive-Reduction Theory (Clark Hull):** A physiological need (such as food or water) creates an aroused internal psychological tension state (a **drive**) that motivates the organism to satisfy the need and restore **homeostasis** (internal biological equilibrium).
            - **Optimal Arousal Theory & Yerkes-Dodson Law:** Organisms seek an optimal level of arousal rather than zero arousal. The **Yerkes-Dodson Law** dictates that performance on difficult or complex tasks is best under **moderate-to-low arousal**, whereas simple or well-practiced tasks benefit from **higher arousal**.
            - **Maslow's Hierarchy of Needs:** Needs are organized hierarchically: Physiological $\rightarrow$ Safety $\rightarrow$ Belongingness & Love $\rightarrow$ Esteem $\rightarrow$ **Self-Actualization** (realizing one's fullest unique human potential).

            ### Biological Mechanisms of Hunger

            | Hypothalamic Center | Physiological Function | Effect of Experimental Lesion / Destruction |
            | :--- | :--- | :--- |
            | **Lateral Hypothalamus (LH)** | The **'hunger center'**; triggers feeding behavior when stimulated | Produces **aphagia** (complete refusal to eat, leading to starvation) |
            | **Ventromedial Hypothalamus (VMH)** | The **'satiety center'**; signals fullness and ceases eating | Produces **hyperphagia** (insatiable eating, leading to extreme obesity) |
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: 'Memory Mnemonic: Lateral vs. Ventromedial'
          body: |-
            - **L**ateral hypothalamus brings on the **L**arge appetite (destruction = **L**ate for meals / starvation).
            - **V**entromedial hypothalamus makes you **V**ery **M**oderate (destruction = **V**ery **M**uch overweight).
      - sort_order: 3
        block_type: example
        content:
          title: 'Educational Psychology Case: The Overjustification Effect'
          text: Mark Lepper and colleagues observed preschool children who intrinsically loved drawing with felt-tip markers. When researchers introduced an extrinsic reward (a fancy certificate and ribbon) for drawing, the children later drew significantly less during free play once the rewards ceased. Extrinsic rewards had undermined their **intrinsic motivation**, reframing play as work.
      - sort_order: 4
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Drive-Reduction Cannot Explain All Behaviors'
          body: Drive-reduction theory explains biological survival needs (drinking water when dehydrated), but completely fails to explain behaviors that deliberately increase physiological tension, such as riding roller coasters, exploring dangerous caves, or skydiving (which are explained by **optimal arousal theory**).
      terms:
      - term: Yerkes-Dodson Law
        definition: The empirical principle that performance increases with physiological or mental arousal, but only up to an optimal point, after which performance declines.
        example: A surgeon remaining calm and composed during an intricate 8-hour neurosurgical procedure.
      - term: Overjustification Effect
        definition: The phenomenon in which being rewarded for doing something intrinsically enjoyable diminishes a person's intrinsic motivation to perform that activity.
        example: A passionate amateur baker losing interest in baking after being hired as an industrial pastry chef.
      - term: Ventromedial Hypothalamus
        definition: The nucleus within the hypothalamus that acts as the primary satiety center, signaling an organism to terminate feeding.
        example: A rat with a surgically destroyed ventromedial hypothalamus continuously eating until it quadruples its normal body weight.
      assessment_items:
      - prompt: An experimental neurobiologist surgically destroys the ventromedial hypothalamus of a laboratory rat. What behavioral outcome will immediately manifest?
        interaction_type: single_choice
        response_spec:
          options:
          - Total cessation of feeding leading to severe starvation
          - Excessive overeating resulting in extreme obesity
          - Disruption of circadian REM sleep cycles
          - Inability to regulate core body temperature
        scoring_spec:
          correct_index: 1
        explanation: The ventromedial hypothalamus (VMH) serves as the satiety center of the brain. When it is lesioned or destroyed, the rat no longer perceives signals that it is full, leading to hyperphagia (insatiable overeating) and dramatic obesity.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 10.2
        concept_slugs:
        - psyc-hunger-physiology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: According to the Yerkes-Dodson Law, which physiological arousal level is optimal when an individual is executing a highly complex, intellectually demanding mathematical examination?
        interaction_type: single_choice
        response_spec:
          options:
          - Maximum sympathetic arousal bordering on panic
          - Total autonomic sedation and near sleep
          - A moderate-to-low level of physiological arousal
          - Fluctuating surges of intense adrenaline output
        scoring_spec:
          correct_index: 2
        explanation: The Yerkes-Dodson Law posits an inverted-U relationship between arousal and performance. For complex, novel, or intellectually demanding cognitive tasks, lower-to-moderate levels of arousal yield peak performance by preventing cognitive tunnel vision and anxiety.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 10.1
        concept_slugs:
        - psyc-motivation-theories
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: According to Abraham Maslow's hierarchy of needs, which level of needs must be substantially satisfied before an individual becomes motivated by belongingness and love needs?
        options:
        - Physiological and safety needs
        - Self-actualization needs
        - Esteem and competence needs
        - Cognitive and aesthetic needs
        correct_answer: 0
        explanation: Maslow proposed a pyramid structure where basic physiological needs (food, water) and safety needs must be substantially met before higher-order social belongingness and love motives emerge.
        concept_slugs:
        - psyc-motivation-theories
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: Bilateral lesioning of which hypothalamic nucleus in a laboratory rat causes continuous hyperphagia (overeating) and extreme obesity?
        options:
        - Lateral hypothalamus (LH)
        - Ventromedial hypothalamus (VMH)
        - Suprachiasmatic nucleus (SCN)
        - Preoptic anterior nucleus
        correct_answer: 1
        explanation: The ventromedial hypothalamus (VMH) serves as a primary satiety center; destroying it abolishes satiety signals, leading to uncontrollable overeating and rapid obesity.
        concept_slugs:
        - psyc-hunger-physiology
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What occurs when the lateral hypothalamus is destroyed in an animal?
      back: The animal starves (aphagia) because the hunger-stimulating center is destroyed.
      concept_slugs:
      - psyc-hunger-physiology
    - front: What does the overjustification effect demonstrate?
      back: Extrinsic rewards can reduce an individual's intrinsic motivation for an activity.
      concept_slugs:
      - psyc-hunger-physiology
  - code: '7.2'
    title: Analyze theories of emotion, cognitive appraisal, and Selye's General Adaptation Syndrome
    description: Contrast James-Lange, Cannon-Bard, and Schachter-Singer two-factor models, describe the high/low road emotional circuits, and evaluate Selye's GAS stages.
    sort_order: 2
    importance: core
    citation: College Board Objective 7.2
    concepts:
    - slug: psyc-emotion-theories
      name: Theories of Emotion and Cognitive Appraisal
      short_definition: Classical emotion models (James-Lange, Cannon-Bard, Schachter-Singer two-factor, Zajonc/LeDoux, Lazarus) detailing the sequence of arousal and cognition.
      description: James-Lange posits arousal precedes emotion; Cannon-Bard posits simultaneous occurrence; Schachter-Singer requires cognitive labeling of physiological arousal.
      citation: OpenStax Psychology 2e, Section 10.4
    - slug: psyc-stress-gas
      name: Stress Response and General Adaptation Syndrome
      short_definition: 'Hans Selye''s three-stage biological response to chronic physical or psychological stressors: alarm, resistance, and exhaustion.'
      description: Prolonged resistance drains energy reserves through chronic cortisol elevation, culminating in exhaustion, immunosuppression, and cardiovascular strain.
      citation: OpenStax Psychology 2e, Chapter 14
      prerequisites:
      - psyc-emotion-theories
    lessons:
    - title: Theories of Emotion, Stress, and Selye's GAS
      description: James-Lange vs. Cannon-Bard vs. Schachter-Singer two-factor theory, Zajonc-LeDoux low road, and Selye's General Adaptation Syndrome.
      emoji: "\U0001F3AD"
      tags:
      - emotion
      - james-lange
      - cannon-bard
      - schachter-singer
      - stress
      - selye
      concept_slugs:
      - psyc-emotion-theories
      - psyc-stress-gas
      citation: OpenStax Psychology 2e, Section 10.4 & Chapter 14
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Comparing the Major Theories of Emotion

            | Theory of Emotion | Sequence of Events | Defining Theoretical Principle |
            | :--- | :--- | :--- |
            | **James-Lange Theory** | Stimulus $\rightarrow$ **Physiological Arousal** $\rightarrow$ **Subjective Emotion** | Emotion is our conscious awareness of our bodily physiological responses (*'We feel afraid because our heart races'*). |
            | **Cannon-Bard Theory** | Stimulus $\rightarrow$ **Simultaneous & Independent** Arousal and Emotion | Subcortical thalamic centers send signals to the autonomic system and cerebral cortex at the exact same time. |
            | **Schachter-Singer Two-Factor** | Stimulus $\rightarrow$ **Arousal** $+$ **Cognitive Label** $\rightarrow$ **Emotion** | Emotion requires both generalized physiological arousal and an explanatory cognitive interpretation. |
            | **Zajonc & LeDoux (Low Road)** | Stimulus $\rightarrow$ **Thalamus** $\rightarrow$ **Amygdala** (Bypasses Cortex) | Instantaneous emotional reactions (fear, disgust) occur prior to conscious cognitive appraisal. |
            | **Lazarus Cognitive-Mediational** | Stimulus $\rightarrow$ **Cognitive Appraisal** $\rightarrow$ Emotion & Arousal | An appraisal of personal significance must occur before emotion and bodily arousal take place. |
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Hans Selye's General Adaptation Syndrome (GAS)

            Hans Selye discovered that the human body reacts to severe, prolonged stress through a universal three-stage physiological response:
            1. **Alarm Reaction:** Sudden sympathetic nervous activation. Heart rate accelerates, pupils dilate, and adrenaline/norepinephrine surge to mobilize energy for fight-or-flight.
            2. **Resistance:** Sympathetic arousal remains elevated as the **adrenal cortex** releases **cortisol** (glucocorticoids). The body remains on high alert, successfully adapting to the ongoing stressor while consuming internal reserves.
            3. **Exhaustion:** Prolonged exposure depletes the body's physical and hormonal resources. The immune system collapses, leading to clinical vulnerability, organ damage, depression, and cardiovascular illness.
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: The Schachter-Singer Suproxin Experiment
          body: "Stanley Schachter and Jerome Singer injected participants with adrenaline (under the guise of a vitamin called 'Suproxin'). Those who were **not told** about the drug's physiological side effects adopted the emotion of a confederate in the room\u2014becoming euphoric with a playful confederate or furious with an angry confederate. This proved that **cognitive context labels generalized arousal**."
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Stress Case: Undergraduate Medical School Finals'
          text: 'During exam week, medical students maintain sustained high vigilance powered by elevated cortisol (**Stage 2: Resistance**). The morning after exams conclude, dozens fall severely ill with respiratory infections, migraines, and severe fatigue. Their bodies have entered **Stage 3: Exhaustion**, characterized by acute immunosuppression.'
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: James-Lange vs. Cannon-Bard'
          body: '**James-Lange** requires a sequential bodily reaction *first* (arousal $\rightarrow$ emotion). **Cannon-Bard** asserts physiological changes are too slow to cause fast emotions, meaning bodily arousal and feeling happen *simultaneously*.'
      terms:
      - term: Two-Factor Theory
        definition: The Schachter-Singer theory that to experience emotion, one must be physically aroused and cognitively label the arousal.
        example: Interpreting an elevated heart rate as excitement when receiving an award versus fear when walking down a dark alley.
      - term: General Adaptation Syndrome (GAS)
        definition: 'Selye''s concept of the body''s adaptive response to chronic stress across three progressive phases: alarm, resistance, and exhaustion.'
        example: A soldier in combat experiencing acute alarm, enduring weeks of sustained resistance, and ultimately collapsing from physical exhaustion.
      - term: Facial Feedback Hypothesis
        definition: The tendency of facial muscle states to trigger corresponding feelings such as fear, anger, or happiness.
        example: Holding a pen between one's teeth to force a smiling expression, which subsequently increases ratings of cartoon humor.
      assessment_items:
      - prompt: 'An individual walks past an alley and encounters a snarling bear. Their heart races, and they immediately conclude: ''My heart is pounding, therefore I must be terrified.'' Which theory of emotion does this thought process represent?'
        interaction_type: single_choice
        response_spec:
          options:
          - Cannon-Bard theory
          - Schachter-Singer two-factor theory
          - Lazarus cognitive-mediational theory
          - James-Lange theory
        scoring_spec:
          correct_index: 3
        explanation: The James-Lange theory of emotion asserts that physiological arousal occurs first and that our conscious subjective emotion is the direct perception of that bodily response ('we are afraid because we tremble').
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 10.4
        concept_slugs:
        - psyc-emotion-theories
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A corporate executive experiences intense workplace stress for six consecutive months without relief. In Hans Selye's General Adaptation Syndrome, what characterizes the second stage (Resistance)?
        interaction_type: single_choice
        response_spec:
          options:
          - Sustained elevated arousal and continuous cortisol secretion
          - Immediate sudden sympathetic shock and lowered blood pressure
          - Total bodily collapse and severe immune system breakdown
          - Temporary rebound parasympathetic sleep and muscular atonia
        scoring_spec:
          correct_index: 0
        explanation: In Selye's GAS, the second stage (Resistance) is characterized by sustained physiological arousal, continuous endocrine output of cortisol from the adrenal cortex, and active biological coping to endure the persistent stressor.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Chapter 14
        concept_slugs:
        - psyc-stress-gas
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Which theoretical model of emotion argues that physiological arousal and conscious emotional experience are triggered simultaneously and independently by subcortical thalamic brain centers?
        interaction_type: single_choice
        response_spec:
          options:
          - James-Lange theory
          - Cannon-Bard theory
          - Schachter-Singer two-factor theory
          - Zajonc low-road theory
        scoring_spec:
          correct_index: 1
        explanation: The Cannon-Bard theory argues that bodily physiological responses and conscious feelings occur simultaneously and independently because the thalamus routes incoming sensory information to the sympathetic autonomic system and cerebral cortex at the exact same moment.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 10.4
        concept_slugs:
        - psyc-emotion-theories
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Which classic theory of emotion argues that emotional feelings occur only AFTER we perceive our physiological arousal (e.g., 'we feel afraid because our heart is racing')?
        options:
        - Cannon-Bard theory
        - Schachter-Singer theory
        - James-Lange theory
        - Lazarus appraisal theory
        correct_answer: 2
        explanation: 'The James-Lange theory asserts that physiological arousal precedes and triggers emotional experience: sensory stimuli generate bodily reactions, and the conscious emotion is our awareness of those changes.'
        concept_slugs:
        - psyc-emotion-theories
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: In Hans Selye's General Adaptation Syndrome (GAS), during which second stage does the endocrine system sustain elevated cortisol secretion to cope with prolonged stressors?
        options:
        - Alarm reaction stage
        - Exhaustion stage
        - Baseline recovery stage
        - Resistance stage
        correct_answer: 3
        explanation: In the resistance stage of Selye's GAS, the body adapts to the ongoing stressor; physiological arousal remains elevated and the adrenal cortex releases glucocorticoids (cortisol) to sustain defense.
        concept_slugs:
        - psyc-stress-gas
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What are the three stages of Hans Selye's General Adaptation Syndrome?
      back: 1. Alarm reaction, 2. Resistance, 3. Exhaustion.
      concept_slugs:
      - psyc-stress-gas
    - front: What distinguishes the Schachter-Singer two-factor theory from the James-Lange theory?
      back: Two-factor theory requires both physical arousal AND a cognitive label/interpretation of that arousal.
      concept_slugs:
      - psyc-emotion-theories
- code: '8.0'
  title: Developmental Psychology Across the Lifespan
  description: Prenatal development, infant reflexes, Piaget's cognitive stages, Vygotsky's sociocultural theory, attachment, Erikson's psychosocial stages, and Kohlberg's moral reasoning.
  weight: 0.085
  sort_order: 8
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 8.0 (8\u20139%)"
  objectives:
  - code: '8.1'
    title: Analyze prenatal development, infant reflexes, and Piagetian/Vygotskian cognitive models
    description: Examine teratogenic impacts, neonatal reflexes, Piaget's four developmental stages, assimilation vs. accommodation, and Vygotsky's scaffolding.
    sort_order: 1
    importance: core
    citation: College Board Objective 8.1
    concepts:
    - slug: psyc-prenatal-infant-development
      name: Prenatal Development and Infancy Reflexes
      short_definition: Stages of prenatal growth (germinal, embryonic, fetal), teratogenic vulnerabilities, and neonatal survival reflexes.
      description: The embryonic phase represents the critical period of organogenesis vulnerable to teratogens like alcohol; neonates exhibit rooting, Moro, and grasping reflexes.
      citation: OpenStax Psychology 2e, Section 9.1 & 9.2
    - slug: psyc-cognitive-development-stages
      name: Piagetian and Vygotskian Cognitive Development
      short_definition: Piaget's stages (sensorimotor, preoperational, concrete, formal) and Vygotsky's sociocultural scaffolding model.
      description: Piaget focuses on schema assimilation/accommodation, object permanence, egocentrism, and conservation; Vygotsky highlights the Zone of Proximal Development.
      citation: OpenStax Psychology 2e, Section 9.2
      prerequisites:
      - psyc-prenatal-infant-development
    lessons:
    - title: Cognitive and Motor Development Across Childhood
      description: Teratogens, neonatal reflexes, Piaget's four cognitive stages, object permanence, conservation, and Vygotsky's ZPD.
      emoji: "\U0001F6BC"
      tags:
      - development
      - piaget
      - vygotsky
      - conservation
      - teratogens
      concept_slugs:
      - psyc-prenatal-infant-development
      - psyc-cognitive-development-stages
      citation: OpenStax Psychology 2e, Section 9.1 & 9.2
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Prenatal Growth and Neonatal Reflexes\n\n1. **Germinal Stage (Weeks 1\u20132):** Zygote divides rapidly and implants into the uterine wall.\n2. **Embryonic Stage (Weeks 3\u20138):** Critical period of rapid **organogenesis** (heart, brain, limbs develop). Highly vulnerable to **teratogens** (environmental toxins like alcohol, which causes Fetal Alcohol Spectrum Disorder).\n3. **Fetal Stage (Week 9 to Birth):** Rapid somatic growth, muscular development, and brain myelination.\n\n**Newborn Reflexes:** Innate motor responses present at birth including **rooting** (turning head toward cheek touch to nurse), **Moro** (startle response with arms thrown outward), and **Babinski** (toes splaying upward when the sole is stroked)."
      - sort_order: 2
        block_type: markdown
        content:
          text: "### Jean Piaget's Four Stages of Cognitive Development\n\nChildren construct knowledge through **schemas**, updating them via **assimilation** (interpreting new experiences using existing schemas) and **accommodation** (adapting schemas to incorporate new information):\n\n| Stage | Typical Age | Key Developmental Milestones | Diagnostic Limitations |\n| :--- | :--- | :--- | :--- |\n| **Sensorimotor** | 0\u20132 years | Exploring through senses/motor actions; **Object Permanence** (~8 months); Stranger anxiety | Lacks symbolic mental representation |\n| **Preoperational** | 2\u20137 years | Symbolic play, language expansion, intuitive reasoning | **Egocentrism** (3-mountains task); Animism; Centration; **Lacks Conservation** |\n| **Concrete Operational** | 7\u201311 years | **Conservation** mastery (volume, mass, number); Mathematical reversibility; Hierarchical classification | Cannot perform abstract hypothetical deductive logic |\n| **Formal Operational** | 12+ years |\
            \ **Abstract logic**, hypothetical-deductive reasoning, moral ideals, systemic problem solving | Post-formal cognitive expansion continues into adulthood |"
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Conservation and Centration
          body: 'A preoperational child viewing identical amounts of water poured from a short wide glass into a tall thin beaker insists the tall beaker holds *more* water due to **centration** (focusing on one dimension: height) and an inability to mentally **reverse** the physical transformation.'
      - sort_order: 4
        block_type: example
        content:
          title: 'Educational Case Study: Vygotsky''s Zone of Proximal Development (ZPD)'
          text: 'A 6-year-old struggles to assemble a complex 100-piece puzzle alone. Her teacher introduces **scaffolding**: demonstrating how to find corner border pieces first, then letting the child match edge pieces, and gradually removing assistance as mastery increases. The task lay squarely within the child''s **Zone of Proximal Development**.'
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Assimilation vs. Accommodation'
          body: '**Assimilation** is seeing a zebra and calling it a ''horse'' (fitting the new animal into an existing schema). **Accommodation** is learning the animal has stripes and lives in Africa, thereby creating a brand new ''zebra'' schema.'
      terms:
      - term: Object Permanence
        definition: The cognitive awareness that physical objects continue to exist even when they are obscured from view, heard, or touched.
        example: An infant searching beneath a blanket when a toy ball is hidden under it.
      - term: Conservation
        definition: The Piagetian principle that properties such as mass, volume, and number remain identical despite changes in the physical form or appearance of objects.
        example: Recognizing that squishing a clay ball into a flat pancake does not alter the total quantity of clay.
      - term: Zone of Proximal Development (ZPD)
        definition: Vygotsky's concept of the difference between what a child can accomplish independently versus what they can achieve with skilled adult guidance.
        example: A student reading a 4th-grade book with a teacher's assistance even though their independent reading level is 3rd-grade.
      assessment_items:
      - prompt: A four-year-old child observes a researcher pour liquid from a wide container into a tall, narrow beaker and insists that the beaker now holds more liquid because it is taller. What developmental stage is the child exhibiting?
        interaction_type: single_choice
        response_spec:
          options:
          - Preoperational stage
          - Sensorimotor stage
          - Concrete operational stage
          - Formal operational stage
        scoring_spec:
          correct_index: 0
        explanation: "In Piaget's theory, children in the preoperational stage (ages 2\u20137) lack the principle of conservation. They demonstrate centration\u2014focusing exclusively on the single visual dimension of height while failing to recognize that mass and volume remain conserved."
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 9.2
        concept_slugs:
        - psyc-cognitive-development-stages
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: An infant searches vigorously for a rattle after an adult covers it completely with an opaque dishcloth. What developmental cognitive milestone has this infant achieved?
        interaction_type: single_choice
        response_spec:
          options:
          - Conservation of volume
          - Object permanence
          - Egocentric operational thinking
          - Abstract hypothetico-deductive logic
        scoring_spec:
          correct_index: 1
        explanation: Object permanence is the awareness that objects continue to exist even when they cannot be perceived directly. It emerges during the sensorimotor stage, typically around 8 months of age.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 9.2
        concept_slugs:
        - psyc-cognitive-development-stages
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A toddler who knows the word 'dog' sees a four-legged goat on a farm and shouts 'Dog!' According to Jean Piaget, what cognitive process is the child employing?
        interaction_type: single_choice
        response_spec:
          options:
          - Accommodation
          - Scaffolding
          - Assimilation
          - Centration
        scoring_spec:
          correct_index: 2
        explanation: Assimilation occurs when a child interprets novel environmental experiences in terms of their existing cognitive schemas (in this case, forcing the new goat into the existing four-legged 'dog' schema).
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 9.2
        concept_slugs:
        - psyc-cognitive-development-stages
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Exposure to maternal alcohol consumption during the embryonic stage of prenatal development is most likely to produce which teratogenic outcome?
        interaction_type: single_choice
        response_spec:
          options:
          - Color blindness and loss of retinal foveal cones
          - Sudden onset infantile Tay-Sachs neurodegeneration
          - Hypertrophy of the pituitary somatotropic axis
          - Facial dysmorphology and long-term cognitive impairment
        scoring_spec:
          correct_index: 3
        explanation: Alcohol is a potent teratogen that crosses the placenta. Exposure during the critical embryonic organogenesis window causes Fetal Alcohol Spectrum Disorder (FASD), characterized by flattened philtrum, small eye openings, microcephaly, and permanent intellectual disability.
        difficulty: intermediate
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 9.1
        concept_slugs:
        - psyc-prenatal-infant-development
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: According to Jean Piaget, a child who realizes that pouring water from a wide bowl into a tall, thin cylinder does not alter the total amount of water has attained what cognitive ability?
        options:
        - Conservation
        - Object permanence
        - Egocentrism
        - Abstract logic
        correct_answer: 0
        explanation: Conservation, mastered during Piaget's concrete operational stage (ages 7-11), is the understanding that quantitative physical properties (mass, volume) remain invariant despite perceptual changes in shape.
        concept_slugs:
        - psyc-cognitive-development-stages
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: A newborn infant who turns their head toward a gentle stroke on their cheek and opens their mouth to suck is exhibiting which primitive survival reflex?
        options:
        - Moro reflex
        - Rooting reflex
        - Babinski reflex
        - Palmar grasp reflex
        correct_answer: 1
        explanation: 'The rooting reflex assists the neonate in finding a source of nourishment: touching the cheek causes the infant to orient their mouth toward the stimulus.'
        concept_slugs:
        - psyc-prenatal-infant-development
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the key milestone achieved in Piaget's concrete operational stage?
      back: Conservation (understanding volume/mass remain constant across physical transformations).
      concept_slugs:
