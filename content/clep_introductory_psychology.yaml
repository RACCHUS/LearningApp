  - code: '11.2'
    title: Analyze biomedical therapies, psychopharmacology, brain stimulation, and treatment efficacy
    description: Categorize antipsychotics, antidepressants, and mood stabilizers, evaluate electroconvulsive therapy, and review meta-analytic psychotherapy efficacy.
    sort_order: 2
    importance: core
    citation: College Board Objective 11.2
    concepts:
    - slug: psyc-biomedical-pharmacology
      name: Psychopharmacology and Biomedical Therapies
      short_definition: Pharmacological mechanisms of antipsychotics, SSRI antidepressants, mood-stabilizing lithium, and ECT brain stimulation.
      description: Antipsychotics block dopamine receptors; SSRIs block serotonin reuptake; lithium stabilizes bipolar cycling; ECT delivers controlled seizures for severe depression.
      citation: OpenStax Psychology 2e, Section 16.3
    - slug: psyc-treatment-efficacy-meta-analysis
      name: Evaluating Treatment Outcomes and Therapeutic Alliance
      short_definition: Empirical evaluation of psychotherapy efficacy through meta-analysis and the foundational role of the therapeutic alliance.
      description: Meta-analyses demonstrate that psychotherapy is substantially more effective than no treatment, mediated by empathy, hope, and the therapeutic alliance.
      citation: OpenStax Psychology 2e, Section 16.4
      prerequisites:
      - psyc-biomedical-pharmacology
    lessons:
    - title: Biomedical Therapies, Psychopharmacology, and Treatment Outcomes
      description: Antipsychotics, SSRIs, lithium, electroconvulsive therapy (ECT), tardive dyskinesia, and meta-analytic evidence for psychotherapy.
      emoji: "\U0001F48A"
      tags:
      - pharmacology
      - ssri
      - antipsychotics
      - lithium
      - ect
      - meta-analysis
      concept_slugs:
      - psyc-biomedical-pharmacology
      - psyc-treatment-efficacy-meta-analysis
      citation: OpenStax Psychology 2e, Section 16.3 & 16.4
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Major Psychopharmacological Drug Classes\n\n| Drug Category | Primary Biological Mechanism | Target Clinical Disorders | Common Side Effects & Risks |\n| :--- | :--- | :--- | :--- |\n| **Antipsychotics (Typical)** *(e.g., Thorazine, Haldol)* | Block **dopamine D2 receptors** in limbic pathways | Schizophrenia (positive symptoms: hallucinations, delusions) | **Tardive dyskinesia** (involuntary facial grimacing and tongue protrusion) |\n| **Antipsychotics (Atypical)** *(e.g., Clozaril, Risperdal)* | Target both **dopamine** and **serotonin** receptors | Schizophrenia (positive and negative symptoms) | Metabolic syndrome, substantial weight gain |\n| **Antidepressants (SSRIs)** *(e.g., Prozac, Zoloft, Paxil)* | Selectively block the **reuptake of serotonin**, elevating synaptic concentration | Major Depressive Disorder, GAD, OCD, Panic Disorder | Sexual dysfunction, nausea, delayed onset (2\u20134 weeks) |\n| **Mood Stabilizers** *(e.g., Lithium carbonate)* | Regulates\
            \ glutamate and intracellular neuroprotective cascades | **Bipolar I Disorder** (prevents and treats manic episodes) | Requires regular blood monitoring due to narrow therapeutic window |\n| **Antianxiety Drugs** *(e.g., Xanax, Valium, Ativan)* | Enhance inhibitory neurotransmitter **GABA** activity | Panic disorder, acute anxiety | Sedation, physical dependence, tolerance, severe withdrawal |"
      - sort_order: 2
        block_type: markdown
        content:
          text: "### Brain Stimulation Modalities and Outcome Research\n\n- **Electroconvulsive Therapy (ECT):** A biomedical therapy for severe, treatment-resistant depression in which a brief electrical current is sent through the brain of an anesthetized patient to trigger a controlled seizure. Highly effective for acute suicidal depression; primary side effect is temporary anterograde/retrograde memory loss.\n- **Repetitive Transcranial Magnetic Stimulation (rTMS):** Delivers repeated magnetic pulses to the left prefrontal cortex to stimulate inactive neural circuits without producing seizures or memory loss.\n\n### Evaluating Therapy Outcomes: Meta-Analysis\n\nIn 1952, Hans Eysenck claimed two-thirds of untreated neurotic patients improve on their own through **spontaneous remission**. Subsequent large-scale **meta-analyses** (statistical syntheses of hundreds of randomized controlled trials) conducted by Mary Lee Smith and Gene Glass decisively disproved Eysenck, revealing that **the\
            \ average treated therapy client is better off than 80% of untreated control individuals**. The single strongest predictor of positive outcome across all therapy types is the **therapeutic alliance**\u2014the empathic, collaborative bond between therapist and client."
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: How SSRIs Function at the Synapse
          body: Normally, presynaptic neurons reabsorb excess serotonin from the synaptic cleft through reuptake pumps. **Selective Serotonin Reuptake Inhibitors (SSRIs)** bind to these reuptake transporter proteins, preventing serotonin reabsorption and leaving more serotonin available in the synaptic cleft to stimulate postsynaptic receptors.
      - sort_order: 4
        block_type: example
        content:
          title: 'Clinical Case: Managing Severe Bipolar I Mania'
          text: A 30-year-old musician in a severe manic episode has not slept in four days, is experiencing racing thoughts, and has spent $40,000 on soundboards. Prescribing an SSRI antidepressant would be dangerous, potentially exacerbating the mania into psychosis. The first-line psychiatric pharmacological treatment is **Lithium carbonate**, which stabilizes mood oscillations.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Tardive Dyskinesia Risk'
          body: '**Tardive dyskinesia** is a severe, often irreversible neurological syndrome featuring involuntary movements of the tongue, lips, and extremities resulting from **long-term use of first-generation typical antipsychotic medications** that block dopamine receptors.'
      terms:
      - term: Selective Serotonin Reuptake Inhibitor (SSRI)
        definition: A class of psychotropic antidepressant medications that increase extracellular levels of serotonin by limiting its reabsorption into the presynaptic cell.
        example: Fluoxetine (Prozac) prescribed to treat major depressive episodes and obsessive-compulsive disorder.
      - term: Tardive Dyskinesia
        definition: A neurological condition marked by involuntary, repetitive movements of the mouth, face, and limbs, caused by long-term treatment with typical antipsychotics.
        example: A chronic schizophrenia patient displaying repetitive lip smacking and involuntary facial grimacing.
      - term: Therapeutic Alliance
        definition: The collaborative, trusting relationship and bond established between a client and their therapist, recognized as a primary factor in treatment success.
        example: A patient feeling deeply understood, respected, and supported by their clinical psychologist.
      assessment_items:
      - prompt: Selective serotonin reuptake inhibitors (SSRIs), such as fluoxetine and sertraline, relieve depressive symptoms primarily through which neurochemical mechanism?
        interaction_type: single_choice
        response_spec:
          options:
          - Accelerating the enzymatic destruction of monoamines
          - Stimulating rapid postsynaptic destruction of dopamine D2 receptors
          - Blocking the reabsorption of serotonin into presynaptic terminal buttons
          - Directly converting GABA neurotransmitters into norepinephrine
        scoring_spec:
          correct_index: 2
        explanation: SSRIs function by inhibiting the presynaptic reuptake transporter proteins for serotonin, thereby preventing serotonin from being cleared from the synaptic cleft and increasing its availability to bind to postsynaptic receptors.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 16.3
        concept_slugs:
        - psyc-biomedical-pharmacology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Long-term maintenance treatment with first-generation typical antipsychotic medications carries a substantial risk of producing which irreversible motor syndrome?
        interaction_type: single_choice
        response_spec:
          options:
          - Catatonic stupor
          - Retrograde amnesia
          - Serotonin syndrome
          - Tardive dyskinesia
        scoring_spec:
          correct_index: 3
        explanation: Tardive dyskinesia is a serious, often permanent movement disorder caused by long-term blockade of dopamine receptors by first-generation typical antipsychotics (e.g., haloperidol), manifesting as involuntary twitches of the tongue, jaw, and facial muscles.
        difficulty: intermediate
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 16.3
        concept_slugs:
        - psyc-biomedical-pharmacology
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Large-scale meta-analyses evaluating psychotherapy outcomes (such as research by Smith and Glass) have established which conclusion regarding the efficacy of psychological treatments?
        interaction_type: single_choice
        response_spec:
          options:
          - Treated psychotherapy clients show significantly greater clinical improvement than approximately eighty percent of untreated control individuals.
          - Psychotherapy produces lasting positive behavioral change only when combined with daily maintenance dosages of psychiatric medication.
          - Spontaneous remission occurs at identical rates whether patients receive evidence-based cognitive therapy or no formal clinical treatment.
          - The specific theoretical modality practiced by the clinician accounts for virtually all variance in patient recovery and symptom reduction.
        scoring_spec:
          correct_index: 0
        explanation: 'Meta-analytic reviews synthesizing hundreds of controlled outcome studies demonstrate that psychotherapy is effective: the average treated client is better off than approximately 80% of untreated individuals on waitlists, refuting Eysenck''s spontaneous remission claims.'
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 16.4
        concept_slugs:
        - psyc-treatment-efficacy-meta-analysis
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: Selective serotonin reuptake inhibitors (SSRIs), such as fluoxetine and sertraline, exert their antidepressant effect primarily through which biochemical mechanism?
        options:
        - Directly agonizing postsynaptic dopamine D2 receptors in the striatum
        - Inhibiting the enzymatic breakdown of monoamine oxidase in the synapse
        - Blocking the presynaptic reuptake transporter protein for serotonin
        - Antagonizing central nervous system GABA receptors in the amygdala
        correct_answer: 2
        explanation: SSRIs selectively bind to and inhibit the serotonin transporter (SERT) protein on the presynaptic terminal, prolonging the presence and availability of serotonin in the synaptic cleft.
        concept_slugs:
        - psyc-biomedical-pharmacology
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: In clinical treatment outcome research, what statistical technique combines the quantitative findings across dozens of independent clinical trials into a single summary effect size?
        options:
        - Factor analysis
        - Analysis of variance
        - Multivariate path model
        - Meta-analysis
        correct_answer: 3
        explanation: Meta-analysis mathematically aggregates effect sizes from multiple empirical studies to determine the overall effectiveness and reliability of an intervention across heterogeneous patient samples.
        concept_slugs:
        - psyc-treatment-efficacy-meta-analysis
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: How do SSRIs work at the neuronal synapse?
      back: They block the reuptake of serotonin by the presynaptic neuron, increasing serotonin availability.
      concept_slugs:
      - psyc-biomedical-pharmacology
    - front: What does meta-analysis show regarding the overall efficacy of psychotherapy?
      back: The average therapy client is better off than 80% of untreated individuals.
      concept_slugs:
      - psyc-treatment-efficacy-meta-analysis
- code: '12.0'
  title: Social Psychology
  description: Attribution theory, cognitive dissonance, conformity and compliance, obedience experiments, group dynamics, prejudice, and bystander intervention.
  weight: 0.095
  sort_order: 12
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 12.0 (9\u201310%)"
  objectives:
  - code: '12.1'
    title: Analyze attribution theory, cognitive dissonance, and social influence experiments
    description: Evaluate the fundamental attribution error, explain Festinger's cognitive dissonance, and analyze Asch's conformity and Milgram's obedience experiments.
    sort_order: 1
    importance: core
    citation: College Board Objective 12.1
    concepts:
    - slug: psyc-attribution-dissonance
      name: Attribution Theory and Cognitive Dissonance
      short_definition: How individuals explain causes of behavior (dispositional vs. situational, FAE) and resolve internal conflict between actions and beliefs.
      description: The fundamental attribution error underestimates situational pressures in others; cognitive dissonance drives attitude alignment with behavior.
      citation: OpenStax Psychology 2e, Section 12.1 & 12.2
    - slug: psyc-conformity-obedience
      name: Conformity, Compliance, and Milgram Obedience
      short_definition: Social pressure paradigms including Asch line conformity, normative/informational influence, and Milgram's destructive obedience.
      description: Asch demonstrated visual judgment conformity; Milgram demonstrated that 65% of participants obey legitimate authority commands to deliver lethal shocks.
      citation: OpenStax Psychology 2e, Section 12.3
      prerequisites:
      - psyc-attribution-dissonance
    lessons:
    - title: 'Social Thinking: Attribution, Cognitive Dissonance, and Obedience'
      description: The Fundamental Attribution Error, Festinger's cognitive dissonance, Asch's line studies, and Milgram's 450-volt shock experiments.
      emoji: "\U0001F465"
      tags:
      - social
      - attribution
      - dissonance
      - conformity
      - milgram
      - asch
      concept_slugs:
      - psyc-attribution-dissonance
      - psyc-conformity-obedience
      citation: 'OpenStax Psychology 2e, Chapter 12: Social Psychology'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Social Attribution and Common Attributional Biases

            When observing human conduct, individuals attribute causes to either **dispositional (internal personal traits)** or **situational (external environmental factors)**:
            - **Fundamental Attribution Error (FAE):** The pervasive tendency for observers to underestimate situational influences and overestimate internal dispositional traits when explaining *others'* behavior *(e.g., assuming a cashier who does not smile is an inherently hostile person rather than exhausted)*.
            - **Self-Serving Bias:** The tendency to attribute our own successes to internal disposition ('I aced the exam because I am brilliant') and our failures to external situations ('I failed because the teacher wrote unfair questions').

            ### Leon Festinger's Cognitive Dissonance Theory

            When our actions conflict with our established attitudes, we experience an uncomfortable psychological tension (**cognitive dissonance**). Because we cannot un-do past actions, we resolve dissonance by **aligning our attitudes with our behaviors**.
            *(In Festinger's classic 1959 peg-turning study, participants paid only $1 to lie to the next subject reported genuine enjoyment of the dull task, needing to justify their behavior, whereas those paid $20 felt no dissonance because the money was sufficient external justification.)*
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Classic Social Influence Experiments

            | Landmark Study | Lead Investigator | Experimental Paradigm | Definitive Research Finding |
            | :--- | :--- | :--- | :--- |
            | **Conformity Studies (1955)** | **Solomon Asch** | Participants matched line lengths in a group of confederates giving unanimously wrong answers | ~37% of trials produced conformity; driven by **normative influence** (avoiding rejection) |
            | **Obedience to Authority (1963)** | **Stanley Milgram** | Teachers commanded by an authority figure to administer escalating electrical shocks to a screaming learner | **65% of ordinary participants** obeyed orders to deliver the maximum 450-volt lethal shock |
            | **Stanford Prison Experiment (1971)** | **Philip Zimbardo** | College students randomly assigned to mock guards or prisoners in a simulated basement prison | Deindividuation and institutional roles rapidly overrode personal morality within 6 days |
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: Normative vs. Informational Social Influence
          body: |-
            - **Normative Social Influence:** Conforming to gain social approval or avoid group rejection and embarrassment (e.g., wearing uncomfortable formal clothing to a banquet).
            - **Informational Social Influence:** Conforming because we accept others' opinions as genuine evidence about reality (e.g., following a crowd toward an emergency exit during an alarm).
      - sort_order: 4
        block_type: example
        content:
          title: 'Milgram''s Experimental Variations: Factors Altering Obedience'
          text: |-
            Milgram systematically manipulated variables affecting compliance:
            - **Proximity to Victim:** Obedience dropped to 40% when the learner was in the same room, and to 30% when the teacher had to physically press the learner's hand onto a shock plate.
            - **Proximity to Authority:** Obedience dropped to 21% when the experimenter issued commands via telephone.
            - **Defiant Peer Role Models:** When two confederate teachers rebelled and refused to proceed, participant obedience plummeted to **only 10%**.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: FAE Appears Primarily in Individualistic Cultures'
          body: The **Fundamental Attribution Error** is significantly more pronounced in Western **individualistic cultures** (which emphasize personal autonomy) and is markedly lower in East Asian **collectivist cultures** (which naturally emphasize situational and social context).
      terms:
      - term: Fundamental Attribution Error
        definition: The tendency for observers to underestimate situational factors and overestimate dispositional personality factors when explaining others' behavior.
        example: Assuming a driver who cuts you off is an aggressive jerk, rather than considering they might be rushing to an emergency room.
      - term: Cognitive Dissonance
        definition: The mental discomfort experienced by an individual who holds contradictory beliefs, values, or actions, driving attitude change.
        example: A dedicated cigarette smoker convincing themselves that medical smoking studies are exaggerated to reduce internal guilt.
      - term: Normative Social Influence
        definition: Influence resulting from a person's desire to gain approval or avoid social disapproval and rejection.
        example: Applauding enthusiastically at the end of a dull symphony simply because everyone else in the auditorium stood and cheered.
      assessment_items:
      - prompt: 'When a classmate arrives forty minutes late to a morning seminar, an observer concludes: ''She is chronically lazy, irresponsible, and undisciplined.'' The observer fails to consider that the classmate''s vehicle broke down. What attributional error is demonstrated?'
        interaction_type: single_choice
        response_spec:
          options:
          - Self-serving attribution bias
          - The fundamental attribution error
          - The false consensus effect
          - The representativeness heuristic
        scoring_spec:
          correct_index: 1
        explanation: The fundamental attribution error occurs when observers attribute another person's actions to internal, enduring personality traits (laziness) while completely overlooking environmental situational constraints (traffic, mechanical breakdown).
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 12.1
        concept_slugs:
        - psyc-attribution-dissonance
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In Solomon Asch's landmark 1955 visual line-judgment conformity experiments, what percentage of trials resulted in naive participants conforming to the group's unanimously incorrect visual answer?
        interaction_type: single_choice
        response_spec:
          options:
          - Approximately 5% of trials
          - Approximately 15% of trials
          - Approximately 37% of trials
          - Approximately 95% of trials
        scoring_spec:
          correct_index: 2
        explanation: In Asch's conformity experiments, naive participants conformed to the confederates' unanimously erroneous visual judgments on approximately 37% of all critical trials, demonstrating the power of normative social influence.
        difficulty: intermediate
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 12.3
        concept_slugs:
        - psyc-conformity-obedience
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In Stanley Milgram's original 1963 obedience study at Yale University, what proportion of ordinary adult male participants complied with the experimenter's commands to deliver the maximum 450-volt shock to the learner?
        interaction_type: single_choice
        response_spec:
          options:
          - Less than 2% of participants
          - Approximately 25% of participants
          - Approximately 45% of participants
          - Approximately 65% of participants
        scoring_spec:
          correct_index: 3
        explanation: In Milgram's baseline obedience study, 65% (26 out of 40) of participants administered the final 450-volt electrical shock, despite the learner screaming in agony and subsequently going silent.
        difficulty: beginner
        cognitive_level: recall
        citation: OpenStax Psychology 2e, Section 12.3
        concept_slugs:
        - psyc-conformity-obedience
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Under what condition did participant obedience in Stanley Milgram's shock experiments plummet most dramatically to only 10%?
        interaction_type: single_choice
        response_spec:
          options:
          - When two confederate teachers rebelled and refused to obey
          - When the study was relocated to an off-campus storefront
          - When the learner complained of a chronic mild heart condition
          - When female experimental subjects were tested in place of males
        scoring_spec:
          correct_index: 0
        explanation: Milgram discovered that the presence of defiant peer role models who openly refused to obey orders shattered the perceived legitimacy and authority pressure, causing participant obedience to drop from 65% down to just 10%.
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 12.3
        concept_slugs:
        - psyc-conformity-obedience
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: According to Leon Festinger's cognitive dissonance theory, why did participants in his 1959 experiment who were paid only one dollar to lie about a boring peg-turning task report genuinely liking the task more than those paid twenty dollars?
        interaction_type: single_choice
        response_spec:
          options:
          - The one-dollar subjects received greater operant reinforcement
          - They lacked sufficient external justification, forcing attitude change
          - They possessed higher intrinsic levels of procedural compliance
          - The experimenter utilized double-blind counterconditioning protocols
        scoring_spec:
          correct_index: 1
        explanation: Participants paid $20 had sufficient external justification for lying ('I lied because I got paid twenty dollars'). Participants paid only $1 experienced severe cognitive dissonance ('I lied for a trivial dollar'), forcing them to resolve the dissonance by internally convincing themselves the task was actually interesting.
        difficulty: advanced
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 12.2
        concept_slugs:
        - psyc-attribution-dissonance
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: When an observer witnesses a stranger trip and fall and immediately concludes the person is clumsy (ignoring an uneven sidewalk crack), they are demonstrating what cognitive bias?
        options:
        - The fundamental attribution error
        - The self-serving bias
        - The halo effect bias
        - Cognitive dissonance bias
        correct_answer: 0
        explanation: The fundamental attribution error is the pervasive tendency to overestimate internal dispositional factors and underestimate situational external factors when analyzing other people's behaviors.
        concept_slugs:
        - psyc-attribution-dissonance
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: In Stanley Milgram's classic obedience experiments, which situational factor significantly reduced participants' willingness to administer the highest voltage shocks?
        options:
        - Conducting the experiment at prestigious Yale University rather than a downtown office
        - Observing peer confederate teachers rebel and refuse to obey the experimenter
        - Having the experimenter wear an official gray laboratory coat and stand directly behind the teacher
        - Informing participants that the learner was a fellow volunteer from the community
        correct_answer: 1
        explanation: When two confederate teachers rebelled and refused to continue shocking the learner, participant obedience to the maximum 450-volt level dropped precipitously from 65% to only 10%.
        concept_slugs:
        - psyc-conformity-obedience
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What percentage of participants obeyed orders up to the maximum 450 volts in Milgram's baseline experiment?
      back: 65% of participants.
      concept_slugs:
      - psyc-conformity-obedience
    - front: What is the difference between normative and informational social influence?
      back: Normative influence is conforming to be liked/accepted; informational influence is conforming to be correct based on others' knowledge.
      concept_slugs:
      - psyc-conformity-obedience
  - code: '12.2'
    title: Analyze group dynamics, deindividuation, prejudice, and bystander intervention
    description: "Examine social facilitation, social loafing, group polarization, groupthink, in-group bias, and the Darley-Latan\xE9 bystander effect."
    sort_order: 2
    importance: core
    citation: College Board Objective 12.2
    concepts:
    - slug: psyc-group-dynamics
      name: Group Polarization, Groupthink, and Social Loafing
      short_definition: Collective social phenomena altering individual performance (social facilitation/loafing) and group decisions (polarization/groupthink).
      description: Social loafing reduces individual effort in unmonitored groups; groupthink prioritizes consensus over critical appraisal, risking catastrophic errors.
      citation: OpenStax Psychology 2e, Section 12.4
    - slug: psyc-prejudice-altruism
      name: Prejudice, Ingroup Bias, and the Bystander Effect
      short_definition: Social relations spanning stereotypes, ingroup/outgroup bias, scapegoating, and bystander apathy via diffusion of responsibility.
      description: "Darley and Latan\xE9 proved that emergency intervention decreases as bystander group size increases due to pluralistic ignorance and diffused responsibility."
      citation: OpenStax Psychology 2e, Section 12.5 & 12.6
      prerequisites:
      - psyc-group-dynamics
    lessons:
    - title: Group Influence, Prejudice, and the Bystander Effect
      description: "Social facilitation, social loafing, groupthink, Janis's foreign policy analysis, ingroup bias, and Darley-Latan\xE9 bystander intervention."
      emoji: "\U0001F91D"
      tags:
      - groups
      - groupthink
      - loafing
      - polarization
      - bystander
      - altruism
      concept_slugs:
      - psyc-group-dynamics
      - psyc-prejudice-altruism
      citation: OpenStax Psychology 2e, Section 12.4, 12.5, & 12.6
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Group Dynamics and Individual Performance

            - **Social Facilitation (Norman Triplett):** The presence of others enhances physiological arousal. This improves performance on **simple, well-learned tasks** (e.g., cyclists riding faster in groups), but impairs performance on **complex, unfamiliar tasks** (social impairment).
            - **Social Loafing:** The tendency for people in a collective group to exert less effort when pooling efforts toward a common goal than when individually accountable *(e.g., pulling less hard during a tug-of-war)*.
            - **Deindividuation:** The loss of self-awareness and personal restraint occurring in group situations that foster anonymity and high emotional arousal *(e.g., cyber mob bullying, nighttime riot vandalism)*.
            - **Group Polarization:** The enhancement and strengthening of a group's prevailing inclinations and attitudes following discussion among like-minded individuals.
            - **Groupthink (Irving Janis):** The mode of thinking that occurs when the desire for harmony and consensus in a cohesive decision-making group suppresses realistic dissenting viewpoints *(e.g., the Bay of Pigs invasion failure, NASA Challenger launch disaster)*.
      - sort_order: 2
        block_type: markdown
        content:
          text: |-
            ### Social Relations: Prejudice and Altruism

            | Social Concept | Operational Definition | Real-World Manifestation |
            | :--- | :--- | :--- |
            | **Stereotype** | Generalized cognitive belief about a group of people | Assuming all athletes are poor academic students |
            | **Prejudice** | Unjustified negative attitude toward a specific group | Feeling hostility or suspicion toward outgroup members |
            | **Discrimination** | Unjustified negative behavior or action toward a group | Refusing to lease an apartment based on ethnic background |
            | **Ingroup Bias** | Tendency to favor one's own identified group ('us') | Rating one's own university classmates as more trustworthy |
            | **Outgroup Homogeneity** | Viewing members of outside groups as identical ('they are all alike') | Believing rival political partisans all share identical monolithic thoughts |
      - sort_order: 3
        block_type: callout
        content:
          type: key_concept
          title: "Darley and Latan\xE9's Bystander Effect"
          body: "Spurred by the murder of Kitty Genovese, John Darley and Bibb Latan\xE9 demonstrated that an individual is significantly **less likely to help in an emergency as the number of passive bystanders increases**. This bystander apathy is driven by:\n1. **Diffusion of Responsibility:** Believing someone else will step forward or call emergency services.\n2. **Pluralistic Ignorance:** Looking to other passive observers and concluding that because no one is reacting, the situation must not be a genuine crisis."
      - sort_order: 4
        block_type: example
        content:
          title: 'Laboratory Case Study: The Staged Seizure Experiment'
          text: "Darley and Latan\xE9 placed college students in individual intercom cubicles. During discussion, an audio recording of a fellow student staged an acute epileptic seizure, gasping for medical help. When participants believed they were the **only person** on the intercom, **85% left their room to seek help immediately**. When they believed four other students were listening, **only 31% responded**, demonstrating dramatic diffusion of responsibility."
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Social Facilitation vs. Social Loafing'
          body: '**Social facilitation** occurs when individual efforts are *evaluated* (arousal increases; simple tasks get better). **Social loafing** occurs when individual efforts are *pooled and anonymous* (arousal decreases; effort drops).'
      terms:
      - term: Groupthink
        definition: The tendency of group members to conform, resulting in a narrow, uncritical view of an issue to maintain group cohesiveness.
        example: A presidential cabinet failing to question flawed military invasion plans because dissenting opinions are discouraged.
      - term: Bystander Effect
        definition: The tendency for any given observer to be less likely to provide aid in an emergency if other bystanders are present.
        example: Dozens of commuters watching a person collapse on a subway platform, each assuming another commuter has called 911.
      - term: Deindividuation
        definition: The loss of self-awareness and self-restraint occurring in group situations that foster both physical anonymity and high emotional arousal.
        example: An otherwise peaceful sports fan joining in overturning cars and smashing windows while masked within a championship victory riot.
      assessment_items:
      - prompt: In a crowded urban train terminal, a pedestrian collapses unconscious to the ground. Despite dozens of commuters witnessing the event, several minutes pass before anyone assists or dials emergency dispatch. What social psychological phenomenon is operating?
        interaction_type: single_choice
        response_spec:
          options:
          - The bystander effect and diffusion of responsibility
          - Group polarization toward institutional reliance
          - Social facilitation under high autonomic arousal
          - Hostile cognitive dissonance reduction
        scoring_spec:
          correct_index: 0
        explanation: The bystander effect describes the phenomenon where individuals are less likely to offer help in an emergency when other bystanders are present. It is driven by diffusion of responsibility (each person assumes another witness will act) and pluralistic ignorance.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 12.6
        concept_slugs:
        - psyc-prejudice-altruism
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: An executive committee composed of like-minded directors discusses a controversial new product launch. Rather than critically challenging questionable financial assumptions, members suppress their private doubts to maintain unanimous harmony. What decision-making flaw is evident?
        interaction_type: single_choice
        response_spec:
          options:
          - Social facilitation
          - Groupthink
          - Deindividuation
          - Social loafing
        scoring_spec:
          correct_index: 1
        explanation: Groupthink (identified by Irving Janis) occurs in cohesive, isolated groups where the desire for consensus and harmony overrides the critical, objective appraisal of alternative courses of action.
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 12.4
        concept_slugs:
        - psyc-group-dynamics
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: When four students are assigned a group project with a single shared grade, two members contribute significantly less research effort than they would have if graded individually. What phenomenon accounts for this reduced output?
        interaction_type: single_choice
        response_spec:
          options:
          - Group polarization
          - Deindividuation
          - Social loafing
          - Normative obedience
        scoring_spec:
          correct_index: 2
        explanation: Social loafing is the tendency for individuals to exert less physical or mental effort when their contributions are pooled into a group project where individual accountability and evaluation are diminished.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 12.4
        concept_slugs:
        - psyc-group-dynamics
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: Following a lively ninety-minute discussion among gun control advocates, the participants' attitudes toward enacting strict firearms legislation become substantially more extreme and unified than before the meeting. What group process occurred?
        interaction_type: single_choice
        response_spec:
          options:
          - Deindividuation
          - Social facilitation
          - Cognitive dissonance
          - Group polarization
        scoring_spec:
          correct_index: 3
        explanation: Group polarization describes the tendency for discussions among like-minded individuals to strengthen and amplify the group's preexisting attitudes and shared opinions, making their collective stance significantly more extreme.
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 12.4
        concept_slugs:
        - psyc-group-dynamics
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: "The tragic murder of Kitty Genovese in 1964 stimulated social psychologists John Darley and Bibb Latan\xE9 to study which phenomenon?"
        options:
        - Social loafing in collaborative group tasks
        - Deindividuation in anonymous crowds
        - The bystander effect and diffusion of responsibility
        - Group polarization during deliberations
        correct_answer: 2
        explanation: "Darley and Latan\xE9 investigated the bystander effect: individuals are significantly less likely to intervene in an emergency when other bystanders are present due to diffusion of responsibility."
        concept_slugs:
        - psyc-prejudice-altruism
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: When like-minded group members discuss a contentious topic and their post-discussion viewpoints become substantially more extreme than their initial pre-discussion opinions, what has occurred?
        options:
        - Groupthink tendency
        - Social facilitation
        - Deindividuation effect
        - Group polarization
        correct_answer: 3
        explanation: Group polarization occurs when group deliberation strengthens and intensifies the prevailing shared inclinations of its members, shifting decisions toward a more extreme pole.
        concept_slugs:
        - psyc-group-dynamics
        citation: OpenStax Psychology 2e, CC BY 4.0
    flashcards:
    - front: What is the bystander effect and what drives it?
      back: People are less likely to help when others are present, driven by diffusion of responsibility.
      concept_slugs:
      - psyc-prejudice-altruism
    - front: What is groupthink in collective decision making?
      back: When the desire for group consensus overrides realistic, critical appraisal of alternatives.
      concept_slugs:
      - psyc-group-dynamics
- code: '13.0'
  title: Statistics, Tests, and Measurement
  description: Descriptive statistics (central tendency, variability, normal curve), inferential statistics and statistical significance, correlation coefficients, psychometric reliability and validity, and theories and measurement of intelligence.
  weight: 0.03
  sort_order: 13
  importance: core
  citation: "College Board CLEP Introductory Psychology Domain 13.0 (3\u20134%)"
  objectives:
  - code: '13.1'
    title: Apply descriptive and inferential statistics, psychometric standards, and intelligence theories
    description: Analyze measures of central tendency, variance, normal curve distributions, statistical significance, reliability, validity, and major theoretical models of human intelligence.
    sort_order: 1
    importance: core
    citation: College Board Objective 13.1
    concepts:
    - slug: psyc-descriptive-inferential-statistics
      name: Descriptive and Inferential Statistics
      short_definition: Quantitative tools for summarizing data distributions (central tendency, standard deviation, normal curve) and determining whether observed sample differences reflect true population effects (p < 0.05).
      description: Descriptive statistics characterize datasets using central tendency and dispersion. Inferential statistics use probability theory to test null hypotheses and establish statistical significance.
      citation: OpenStax Psychology 2e, Section 2.3
    - slug: psyc-psychometric-reliability-validity
      name: Psychometric Reliability and Validity
      short_definition: Fundamental measurement criteria evaluating consistency (test-retest, split-half, alternate form, inter-rater reliability) and accuracy (content, criterion/predictive, construct validity).
      description: Reliability reflects score stability and reproducibility across administrations. Validity reflects whether an assessment genuinely measures the underlying construct it was designed to measure.
      citation: OpenStax Psychology 2e, Section 7.5
      prerequisites:
      - psyc-descriptive-inferential-statistics
    - slug: psyc-intelligence-theories-measurement
      name: Theories and Measurement of Intelligence
      short_definition: Theoretical models (Spearman's g, Gardner's multiple intelligences, Sternberg's triarchic theory) and psychometric tests (Stanford-Binet mental age, Wechsler deviation IQ).
      description: Intelligence assessment evolved from early ratio IQ (MA/CA * 100) to modern standardized deviation IQ distributions (mean 100, SD 15), alongside theoretical debates regarding general versus multifaceted cognitive abilities.
      citation: OpenStax Psychology 2e, Section 7.4 & 7.5
      prerequisites:
      - psyc-psychometric-reliability-validity
    lessons:
    - title: Statistical Measures, Psychometric Standards, and Intelligence Assessment
      description: Mastering central tendency, variance, the normal distribution, correlation vs. causation, reliability, validity, and intelligence measurement.
      emoji: "\U0001F4CA"
      tags:
      - statistics
      - measurement
      - reliability
      - validity
      - intelligence
      - psychometrics
      concept_slugs:
      - psyc-descriptive-inferential-statistics
      - psyc-psychometric-reliability-validity
      - psyc-intelligence-theories-measurement
      citation: OpenStax Psychology 2e, Chapter 2 (Research Methods) and Chapter 7 (Thinking and Intelligence)
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Descriptive Statistics: Central Tendency and Variability

            Psychological research relies on **descriptive statistics** to synthesize and organize raw quantitative observations into meaningful summaries. The three fundamental measures of **central tendency** are:

            - **Mean**: The arithmetic average of all scores (sum divided by $N$). The mean is highly sensitive to extreme outliers and skewed data.
            - **Median**: The exact physical midpoint score separating the top 50% from the bottom 50% when values are ranked. The median is the most robust measure in skewed distributions (such as annual income or reaction times).
            - **Mode**: The most frequently occurring score in the dataset. A distribution can be unimodal, bimodal, or multimodal.

            When a distribution is skewed, the mean is pulled farthest toward the extended tail. In a **positively skewed distribution** (skewed right, with a long tail of high scores), `Mode < Median < Mean`. In a **negatively skewed distribution** (skewed left, with a long tail of low scores), `Mean < Median < Mode`.

            Measures of **variability** describe how clustered or dispersed scores are around the center. The **range** is the distance between highest and lowest scores. The **standard deviation (SD, $\sigma$)** calculates the average distance of each data point from the mean. A small standard deviation indicates homogeneous, clustered performance; a large standard deviation indicates heterogeneous, widely dispersed scores.
      - sort_order: 2
        block_type: callout
        content:
          type: warning
          title: 'Cognitive Pitfall: Reliability vs. Validity'
          body: A psychometric test can be completely **reliable** (yielding identical results on every administration) while having **zero validity** (failing to measure what it claims to measure). For example, a scale that consistently adds 15 pounds is reliable, but invalid. However, a test **cannot be valid unless it is first reliable**.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### The Normal Curve and Psychometric Properties

            Many human biological and psychological characteristics conform to a symmetrical, bell-shaped **normal distribution**. In a standard normal curve, the mean, median, and mode are identical, and score dispersion follows the empirical **68-95-99.7 rule**:

            - **68.26%** of all observations fall within $\pm 1$ standard deviation of the mean.
            - **95.44%** fall within $\pm 2$ standard deviations of the mean.
            - **99.74%** fall within $\pm 3$ standard deviations of the mean.

            Scientific test construction demands rigorous validation across both reliability (consistency) and validity (truthfulness/accuracy):

            | Psychometric Property | Specific Evaluation Type | Operational Definition | Clinical / Experimental Example |
            | :--- | :--- | :--- | :--- |
            | **Reliability** | **Test-Retest** | Consistency of scores when the same assessment is taken at two separate time points | Administering a trait extraversion inventory two weeks apart ($r \ge +0.85$) |
            | **Reliability** | **Split-Half** | Internal consistency between odd-numbered and even-numbered items within the test | Correlating score performance across halves of a 100-item math diagnostic exam |
            | **Reliability** | **Inter-Rater** | Level of statistical agreement between independent clinical observers/judges | Two clinical psychologists independently scoring diagnostic interviews for autism |
            | **Validity** | **Content Validity** | Extent to which the items thoroughly sample the entire conceptual domain | A psychology final exam that comprehensively evaluates all 13 textbook chapters |
            | **Validity** | **Predictive (Criterion)** | Capacity of test scores to accurately forecast future relevant performance | High MCAT entrance exam scores predicting success in medical school coursework |
            | **Validity** | **Construct Validity** | Degree to which the test truly measures the theoretical, unobservable psychological attribute | Demonstrating a depression questionnaire correlates with elevated cortisol and clinical despair |
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: Theories of Intelligence and Deviation IQ
          body: 'Early intelligence testing pioneered by Alfred Binet used **mental age** ($MA$). William Stern formulated the ratio IQ: $IQ = (MA / CA) \times 100$. Modern tests like David Wechsler''s **WAIS** and **WISC** abandoned ratio IQ in favor of **deviation IQ**, standardizing performance against representative age cohorts with a fixed mean of 100 and standard deviation of 15. In theory, **Charles Spearman** posited a general cognitive factor ($g$); **Howard Gardner** proposed eight independent multiple intelligences; and **Robert Sternberg** formulated the triarchic theory (analytical, creative, and practical intelligence).'
      - sort_order: 5
        block_type: example
        content:
          title: 'Applied Case Scenario: Standardized Examination Score Interpretation'
          text: |-
            A school psychologist evaluates 1,000 high school students on a newly standardized cognitive reasoning inventory. The exam is normally distributed with a mean ($\mu$) of 100 and a standard deviation ($\sigma$) of 15.

            - **Student A** scores 115 (+1 SD above the mean). By applying the 68-95-99.7 rule, 50% score below the mean and 34.1% fall between the mean and +1 SD, meaning Student A scored higher than approximately 84% of test takers.
            - **Student B** scores 130 (+2 SD above the mean). Scoring higher than approximately 97.5% of test takers, placing Student B in the top 2.5% of the population.
            - When the 1,000 students retake an alternate form 30 days later, the Pearson correlation coefficient between test administrations is $r = +0.94$, demonstrating exceptional test-retest reliability.
      terms:
      - term: Standard Deviation
        definition: A computed measure of how much scores vary around the mean score in a distribution, establishing data dispersion.
        example: On the WAIS intelligence test, a standard deviation of 15 indicates that scores between 85 and 115 represent normal average cognitive performance.
      - term: Statistical Significance
        definition: A statistical criterion indicating that the observed experimental effect or difference is unlikely to have arisen by random chance alone, conventionally set at p < 0.05.
        example: A novel psychotherapy demonstrating symptom reduction with p = 0.01, indicating only a 1% probability of observing such results under the null hypothesis.
      - term: Construct Validity
        definition: The extent to which an operational test or measurement tool accurately captures the underlying theoretical, unobservable psychological attribute it was designed to evaluate.
        example: Demonstrating that an anxiety questionnaire correlates with physiological galvanic skin conductance and validated psychiatric clinical ratings.
      - term: Deviation IQ
        definition: An intelligence score derived statistically by positioning an individual's performance on a normal distribution of age peers, centered at a mean of 100 with a standard deviation of 15.
        example: An adult achieving a WAIS score of 130 performs two standard deviations above the population mean, placing them in the 98th percentile.
      assessment_items:
      - prompt: On a standardized intelligence test with a normal distribution, a mean of 100, and a standard deviation of 15, approximately what percentage of test takers will obtain a score between 85 and 115?
        interaction_type: single_choice
        response_spec:
          options:
          - 34 percent
          - 68 percent
          - 95 percent
          - 99.7 percent
        scoring_spec:
          correct_index: 1
        explanation: According to the empirical 68-95-99.7 rule for a normal bell curve, approximately 68% of all scores fall within one standard deviation of the mean (between -1 SD and +1 SD, or 85 to 115). Approximately 95% fall within two standard deviations (70 to 130), and 99.7% fall within three standard deviations (55 to 145).
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax Psychology 2e, Section 7.5
        concept_slugs:
        - psyc-descriptive-inferential-statistics
        - psyc-intelligence-theories-measurement
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: A clinical researcher develops a new screening tool for generalized anxiety disorder. Administering the assessment to the same cohort on two consecutive weeks yields nearly identical scores (r = +0.92), but the test fails to distinguish individuals with diagnosed anxiety from individuals without anxiety symptoms. Which psychometric statement accurately characterizes this assessment?
        interaction_type: single_choice
        response_spec:
          options:
          - The assessment possesses high predictive validity but low test-retest reliability.
          - The assessment possesses high face validity but low split-half reliability.
          - The assessment possesses low construct validity and low inter-rater reliability.
          - The assessment possesses high test-retest reliability but low construct validity.
        scoring_spec:
          correct_index: 3
        explanation: The correlation of r = +0.92 across consecutive administrations demonstrates high test-retest reliability (consistent measurement over time). However, because the tool fails to discriminate individuals with the target clinical condition from healthy controls, it fails to measure the theoretical psychological construct it claims to assess, reflecting low construct validity.
        difficulty: advanced
        cognitive_level: analysis
        citation: OpenStax Psychology 2e, Section 7.5
        concept_slugs:
        - psyc-psychometric-reliability-validity
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      - prompt: In an experimental drug trial evaluating a novel antidepressant, the researchers obtain a p-value of 0.02 on depressive symptom reduction. What does this inferential statistical finding indicate?
        interaction_type: single_choice
        response_spec:
          options:
          - The experimental drug completely eliminated symptoms in exactly ninety-eight percent of the clinical trial participants.
          - The observed improvement demonstrates an overwhelmingly large clinical treatment effect across all tested demographics.
          - The probability that the experimental compound has no biochemical efficacy in the broader population is exactly two percent.
          - The likelihood of observing a difference of this magnitude by chance alone under the null hypothesis is less than five percent.
        scoring_spec:
          correct_index: 3
        explanation: A p-value of 0.02 is below the conventional alpha threshold of 0.05, indicating statistical significance. This means there is only a 2% probability that the observed difference between the experimental and control groups occurred by chance alone assuming the null hypothesis (no true drug effect) is true. It does not measure effect size, percent of cured patients, or clinical magnitude.
        difficulty: advanced
        cognitive_level: application
        citation: OpenStax Psychology 2e, Section 2.3
        concept_slugs:
        - psyc-descriptive-inferential-statistics
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
      questions:
      - question_text: In a positively skewed distribution of test scores with a few extremely high outlier scores, what is the relative order of the three measures of central tendency?
        options:
        - Mode < Median < Mean
        - Mean < Median < Mode
        - Median < Mean < Mode
        - Mean = Median = Mode
        correct_answer: 0
        explanation: In a positively skewed distribution, extreme high scores pull the mean toward the right tail, resulting in Mode < Median < Mean.
        concept_slugs:
        - psyc-descriptive-inferential-statistics
        citation: OpenStax Psychology 2e, CC BY 4.0
      - question_text: A psychometric exam that yields consistent, stable scores across repeated administrations to the same cohort of students demonstrates what measurement property?
        options:
        - High construct validity
        - High reliability
        - High criterion validity
        - Low standard error mean
        correct_answer: 1
        explanation: Reliability refers to the internal consistency and repeatability of a test's measurement results; a test that gives consistent scores over time has high test-retest reliability.
        concept_slugs:
        - psyc-psychometric-reliability-validity
        citation: OpenStax Psychology 2e, CC BY 4.0
