        content:
          text: |
            ### Irrational Numbers

            At some point in the ancient past, someone discovered that not all numbers are rational numbers. A builder, for instance, may have found that the diagonal of a square with unit sides was not 2 or even $\frac{3}{2},$ but was something else. Or a garment maker might have observed that the ratio of the circumference to the diameter of a roll of cloth was a little bit more than 3, but still not a rational number. Such numbers are said to be *irrational* because they cannot be written as fractions. These numbers make up the set of **irrational numbers**. Irrational numbers cannot be expressed as a fraction of two integers. It is impossible to describe this set of numbers by a single rule except to say that a number is irrational if it is not rational. So we write this as shown.

            $$\{h|h\;\text{is not a rational number}\}$$
      - sort_order: 9
        block_type: markdown
        content:
          text: |
            **Example 3: Differentiating Rational and Irrational Numbers**

            Determine whether each of the following numbers is rational or irrational. If it is rational, determine whether it is a terminating or repeating decimal.

            - ⓐ $\sqrt{25}$
            - ⓑ $\frac{33}{9}$
            - ⓒ $\sqrt{11}$
            - ⓓ $\frac{17}{34}$
            - ⓔ $0.3033033303333\ldots$

            **Solution**

            - ⓐ $\sqrt{25}:$ This can be simplified as $\sqrt{25}=5.$ Therefore, $\sqrt{25}$ is rational.
            - ⓑ $\frac{33}{9}:$ Because it is a fraction of integers, $\frac{33}{9}$ is a rational number. Next, simplify and divide.  $\frac{33}{9}=\frac{\overset{11}{33}}{\underset{3}{9}}=\frac{11}{3}=3.\overline{6}$ So, $\frac{33}{9}$ is rational and a repeating decimal.
            - ⓒ $\sqrt{11}:$ This cannot be simplified any further. Therefore, $\sqrt{11}$ is an irrational number.
            - ⓓ $\frac{17}{34}:$ Because it is a fraction of integers, $\frac{17}{34}$ is a rational number. Simplify and divide.  $\frac{17}{34}=\frac{\overset{1}{17}}{\underset{2}{34}}=\frac{1}{2}=0.5$ So, $\frac{17}{34}$ is rational and a terminating decimal.
            - ⓔ $0.3033033303333\ldots$ is not a terminating decimal. Also note that there is no repeating pattern because the group of 3s increases each time. Therefore it is neither a terminating nor a repeating decimal and, hence, not a rational number. It is an irrational number.
      - sort_order: 10
