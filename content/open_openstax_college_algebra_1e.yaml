            - ⓐ ${(\frac{4}{z^{11}})}^3=\frac{{(4)}^3}{{(z^{11})}^3}=\frac{64}{z^{11\cdot 3}}=\frac{64}{z^{33}}$
            - ⓑ ${(\frac{p}{q^3})}^6=\frac{{(p)}^6}{{(q^3)}^6}=\frac{p^{1\cdot 6}}{q^{3\cdot 6}}=\frac{p^6}{q^{18}}$
            - ⓒ ${(\frac{-1}{t^2})}^{27}=\frac{{(-1)}^{27}}{{(t^2)}^{27}}=\frac{-1}{t^{2\cdot 27}}=\frac{-1}{t^{54}}=-\frac{1}{t^{54}}$
            - ⓓ ${(j^3k^{-2})}^4={(\frac{j^3}{k^2})}^4=\frac{{(j^3)}^4}{{(k^2)}^4}=\frac{j^{3\cdot 4}}{k^{2\cdot 4}}=\frac{j^{12}}{k^8}$
