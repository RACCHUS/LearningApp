          text: "**Example 7: Using Properties of Real Numbers**\n\nUse the properties of real numbers to rewrite and simplify each expression. State which properties apply.\n\n- ⓐ $3\\cdot 6+3\\cdot 4$\n- ⓑ $(5+8)+(-8)$\n- ⓒ $6-(15+9)$\n- ⓓ $\\frac{4}{7}\\cdot (\\frac{2}{3}\\cdot \\frac{7}{4})$\n- ⓔ $100\\cdot [0.75+(-2.38)]$\n\n**Solution**\n\n- ⓐ   \n $\\begin{array}{llll}3\\cdot 6+3\\cdot 4 & = & 3\\cdot (6+4) & \\;\\text{Distributive property.} \\\\ & = & 3\\cdot 10 & \\;\\text{Simplify.} \\\\ & = & 30 & \\;\\text{Simplify.}\\end{array}$\n- ⓑ   \n $\\begin{array}{llll}(5+8)+(-8) & = & 5+[8+(-8)] & \\;\\text{Associative property of addition.} \\\\ & = & 5+0 & \\;\\text{Inverse property of addition.} \\\\ & = & 5 & \\;\\text{Identity property of addition.}\\end{array}$\n- ⓒ   \n $\\begin{array}{llll}6-(15+9) & = & 6+[(-15)+(-9)] & \\;\\text{Distributive property.} \\\\ & = & 6+(-24) & \\;\\text{Simplify.} \\\\ & = & -18 & \\;\\text{Simplify.}\\end{array}$\n- ⓓ   \n $\\begin{array}{llll}\\\
            frac{4}{7}\\cdot (\\frac{2}{3}\\cdot \\frac{7}{4}) & = & \\frac{4}{7}\\cdot (\\frac{7}{4}\\cdot \\frac{2}{3}) & \\;\\text{Commutative property of multiplication.} \\\\ & = & (\\frac{4}{7}\\cdot \\frac{7}{4})\\cdot \\frac{2}{3} & \\;\\text{Associative property of multiplication.} \\\\ & = & 1\\cdot \\frac{2}{3} & \\;\\text{Inverse property of multiplication.} \\\\ & = & \\frac{2}{3} & \\;\\text{Identity property of multiplication.}\\end{array}$\n- ⓔ   \n $\\begin{array}{llll}100\\cdot [0.75+(-2.38)] & = & 100\\cdot 0.75+100\\cdot (-2.38) & \\;\\text{Distributive property.} \\\\ & = & 75+(-238) & \\;\\text{Simplify.} \\\\ & = & -163 & \\;\\text{Simplify.}\\end{array}$\n"
