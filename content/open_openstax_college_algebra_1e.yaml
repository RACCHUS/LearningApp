        block_type: markdown
        content:
          text: "**Example 12: Using Scientific Notation**\n\nPerform the operations and write the answer in scientific notation.\n\n- ⓐ $(8.14\\times {10}^{-7})(6.5\\times {10}^{10})$\n- ⓑ $(4\\times {10}^5)\\div (-1.52\\times {10}^9)$\n- ⓒ $(2.7\\times {10}^5)(6.04\\times {10}^{13})$\n- ⓓ $(1.2\\times {10}^8)\\div (9.6\\times {10}^5)$\n- ⓔ $(3.33\\times {10}^4)(-1.05\\times {10}^7)(5.62\\times {10}^5)$\n\n**Solution**\n\n- ⓐ  \n $\\begin{array}{llll}(8.14\\times {10}^{-7})(6.5\\times {10}^{10}) & = & (8.14\\times 6.5)({10}^{-7}\\times {10}^{10}) & \\begin{array}{l}\\;\\text{Commutative and associative} \\\\ \\;\\text{properties of multiplication}\\end{array} \\\\ & = & (52.91)({10}^3) & \\;\\text{Product rule of exponents} \\\\ & = & 5.291\\times {10}^4 & \\;\\text{Scientific notation}\\end{array}$\n- ⓑ  \n $\\begin{array}{llll}(4\\times {10}^5)\\div (-1.52\\times {10}^9) & = & (\\frac{4}{-1.52})(\\frac{{10}^5}{{10}^9}) & \\begin{array}{l}\\;\\text{Commutative and associative} \\\\ \\\
            ;\\text{properties of multiplication}\\end{array} \\\\ & \\approx & (-2.63)({10}^{-4}) & \\;\\text{Quotient rule of exponents} \\\\ & = & -2.63\\times {10}^{-4} & \\;\\text{Scientific notation}\\end{array}$\n- ⓒ  \n $\\begin{array}{llll}(2.7\\times {10}^5)(6.04\\times {10}^{13}) & = & (2.7\\times 6.04)({10}^5\\times {10}^{13}) & \\begin{array}{l}\\;\\text{Commutative and associative} \\\\ \\;\\text{properties of multiplication}\\end{array} \\\\ & = & (16.308)({10}^{18}) & \\;\\text{Product rule of exponents} \\\\ & = & 1.6308\\times {10}^{19} & \\;\\text{Scientific notation}\\end{array}$\n- ⓓ  \n $\\begin{array}{llll}(1.2\\times {10}^8)\\div (9.6\\times {10}^5) & = & (\\frac{1.2}{9.6})(\\frac{{10}^8}{{10}^5}) & \\begin{array}{l}\\;\\text{Commutative and associative} \\\\ \\;\\text{properties of multiplication}\\end{array} \\\\ & = & (0.125)({10}^3) & \\;\\text{Quotient rule of exponents} \\\\ & = & 1.25\\times {10}^2 & \\;\\text{Scientific notation}\\end{array}$\n- ⓔ  \n $\\\
            begin{array}{lll}(3.33\\times {10}^4)(-1.05\\times {10}^7)(5.62\\times {10}^5) & = & [3.33\\times (-1.05)\\times 5.62]({10}^4\\times {10}^7\\times {10}^5) \\\\ & \\approx & (-19.65)({10}^{16}) \\\\ & = & -1.965\\times {10}^{17}\\end{array}$\n"
