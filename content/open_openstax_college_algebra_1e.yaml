            **Example 10: Evaluating Algebraic Expressions**

            Evaluate each expression for the given values.

            - ⓐ $x+5$ for $x=-5$
            - ⓑ $\frac{t}{2t-1}$ for $t=10$
            - ⓒ $\frac{4}{3}\pi r^3$ for $r=5$
            - ⓓ $a+ab+b$ for $a=11,b=-8$
            - ⓔ $\sqrt{2m^3n^2}$ for $m=2,n=3$

            **Solution**

            - ⓐ Substitute $-5$ for $x.$  $\begin{array}{lll}x+5 & = & (-5)+5 \\ & = & 0\end{array}$
            - ⓑ Substitute 10 for $t.$  $\begin{array}{lll}\frac{t}{2t-1} & = & \frac{(10)}{2(10)-1} \\ & = & \frac{10}{20-1} \\ & = & \frac{10}{19}\end{array}$
            - ⓒ Substitute 5 for $r.$  $\begin{array}{lll}\frac{4}{3}\pi r^3 & = & \frac{4}{3}\pi {(5)}^3 \\ & = & \frac{4}{3}\pi (125) \\ & = & \frac{500}{3}\pi \end{array}$
            - ⓓ Substitute 11 for $a$ and –8 for $b.$  $\begin{array}{lll}a+ab+b & = & (11)+(11)(-8)+(-8) \\ & = & 11-88-8 \\ & = & -85\end{array}$
            - ⓔ Substitute 2 for $m$ and 3 for $n.$  $\begin{array}{lll}\sqrt{2m^3n^2} & = & \sqrt{2{(2)}^3{(3)}^2} \\ & = & \sqrt{2(8)(9)} \\ & = & \sqrt{144} \\ & = & 12\end{array}$
