            $$\begin{array}{llll}P & = & L+W+L+W & \\ P & = & L+L+W+W & \;\text{Commutative property of addition} \\ P & = & 2L+2W & \;\text{Simplify} \\ P & = & 2(L+W) & \;\text{Distributive property}\end{array}$$
