            **Example 9: Evaluating an Algebraic Expression at Different Values**

            Evaluate the expression $2x-7$ for each value for *x.*

            - ⓐ $x=0$
            - ⓑ $x=1$
            - ⓒ $x=\frac{1}{2}$
            - ⓓ $x=-4$

            **Solution**

            - ⓐ Substitute 0 for $x.$  $\begin{array}{lll}2x-7 & = & 2(0)-7 \\ & = & 0-7 \\ & = & -7\end{array}$
            - ⓑSubstitute 1 for $x.$  $\begin{array}{lll}2x-7 & = & 2(1)-7 \\ & = & 2-7 \\ & = & -5\end{array}$
            - ⓒ Substitute $\frac{1}{2}$ for $x.$  $\begin{array}{lll}2x-7 & = & 2(\frac{1}{2})-7 \\ & = & 1-7 \\ & = & -6\end{array}$
            - ⓓSubstitute $-4$ for $x.$  $\begin{array}{lll}2x-7 & = & 2(-4)-7 \\ & = & -8-7 \\ & = & -15\end{array}$
