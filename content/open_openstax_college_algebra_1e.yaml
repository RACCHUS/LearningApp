    source_release_id: openstax-college-algebra-1e
    concepts:
    - slug: open-openstax-college-algebra-1e-1-6
      name: Rational Expressions
      short_definition: Simplify rational expressions; Multiply rational expressions; Divide rational expressions; Add and subtract rational expressions; Simplify complex rational expressions.
      citation: College Algebra (OpenStax), Section 1.6, https://openstax.org/books/college-algebra/pages/1-6-rational-expressions, CC BY 4.0
      source_release_id: openstax-college-algebra-1e
    lessons:
    - title: 1.6 Rational Expressions
      description: Simplify rational expressions; Multiply rational expressions; Divide rational expressions; Add and subtract rational expressions; Simplify complex rational expressions.
      emoji: 📘
      tags:
      - open-textbook
      - openstax
      - cc-by-4.0
      - algebra
      - math
      - unreviewed
      citation: College Algebra (OpenStax), Section 1.6, https://openstax.org/books/college-algebra/pages/1-6-rational-expressions, CC BY 4.0
      source_release_id: openstax-college-algebra-1e
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |
            ### In this section, you will:

            - Simplify rational expressions.
            - Multiply rational expressions.
            - Divide rational expressions.
            - Add and subtract rational expressions.
            - Simplify complex rational expressions.
      - sort_order: 2
        block_type: markdown
        content:
          text: |
            A pastry shop has fixed costs of $\text{\textdollar }280$ per week and variable costs of $\text{\textdollar }9$ per box of pastries. The shop’s costs per week in terms of $x,$ the number of boxes made, is $280+9x.$ We can divide the costs per week by the number of boxes made to determine the cost per box of pastries.

            $$\frac{280+9x}{x}$$

            Notice that the result is a polynomial expression divided by a second polynomial expression. In this section, we will explore quotients of polynomial expressions.
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Simplifying Rational Expressions

            The quotient of two polynomial expressions is called a **rational expression**. We can apply the properties of fractions to rational expressions, such as simplifying the expressions by canceling common factors from the numerator and the denominator. To do this, we first need to factor both the numerator and denominator. Let’s start with the rational expression shown.

            $$\frac{x^2+8x+16}{x^2+11x+28}$$

            We can factor the numerator and denominator to rewrite the expression.

            $$\frac{{(x+4)}^2}{(x+4)(x+7)}$$

            Then we can simplify that expression by canceling the common factor $(x+4).$

            $$\frac{x+4}{x+7}$$
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given a rational expression, simplify it.**

            - Factor the numerator and denominator.
            - Cancel any common factors.
      - sort_order: 5
        block_type: markdown
        content:
          text: |
            **Example 1: Simplifying Rational Expressions**

            Simplify $\frac{x^2-9}{x^2+4x+3}.$

            **Solution**

            $$\begin{array}{lllll}\frac{(x+3)(x-3)}{(x+3)(x+1)} & & & & \text{Factor the numerator and the denominator}. \\ \frac{x-3}{x+1} & & & & \text{Cancel common factor }(x+3).\end{array}$$
      - sort_order: 6
        block_type: callout
        content:
          type: key_concept
          title: Q&A
          body: |
            **Can the $x^2$ term be cancelled in Example 1?**

            *No. A factor is an expression that is multiplied by another expression. The $x^2$ term is not a factor of the numerator or the denominator.*
      - sort_order: 7
        block_type: practice_prompt
        content:
          prompt: Simplify $\frac{x-6}{x^2-36}.$
          answer: $\frac{1}{x+6}$
          explanation: Answer from the book's answer key.
      - sort_order: 8
        block_type: markdown
        content:
          text: |
            ### Multiplying Rational Expressions

            Multiplication of rational expressions works the same way as multiplication of any other fractions. We multiply the numerators to find the numerator of the product, and then multiply the denominators to find the denominator of the product. Before multiplying, it is helpful to factor the numerators and denominators just as we did when simplifying rational expressions. We are often able to simplify the product of rational expressions.
      - sort_order: 9
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given two rational expressions, multiply them.**

            - Factor the numerator and denominator.
            - Multiply the numerators.
            - Multiply the denominators.
            - Simplify.
      - sort_order: 10
        block_type: markdown
        content:
          text: |
            **Example 2: Multiplying Rational Expressions**

            Multiply the rational expressions and show the product in simplest form:

            $$\frac{x^2+4x-5}{3x+18}\cdot \frac{2x-1}{x+5}$$

            **Solution**

            $$\begin{array}{lllll}\frac{(x+5)(x-1)}{3(x+6)}\cdot \frac{(2x-1)}{(x+5)} & & & & \text{Factor the numerator and denominator}. \\ \frac{(x+5)(x-1)(2x-1)}{3(x+6)(x+5)} & & & & \text{Multiply numerators and denominators}. \\ \frac{(x+5)(x-1)(2x-1)}{3(x+6)(x+5)} & & & & \text{Cancel common factors to simplify}. \\ \frac{(x-1)(2x-1)}{3(x+6)} & & & & \end{array}$$
      - sort_order: 11
        block_type: practice_prompt
        content:
          prompt: |
            Multiply the rational expressions and show the product in simplest form:

            $$\frac{x^2+11x+30}{x^2+5x+6}\cdot \frac{x^2+7x+12}{x^2+8x+16}$$
          answer: $\frac{(x+5)(x+6)}{(x+2)(x+4)}$
          explanation: Answer from the book's answer key.
      - sort_order: 12
        block_type: markdown
        content:
          text: |
            ### Dividing Rational Expressions

            Division of rational expressions works the same way as division of other fractions. To divide a rational expression by another rational expression, multiply the first expression by the reciprocal of the second. Using this approach, we would rewrite $\frac{1}{x}\div \frac{x^2}{3}$ as the product $\frac{1}{x}\cdot \frac{3}{x^2}.$ Once the division expression has been rewritten as a multiplication expression, we can multiply as we did before.

            $$\frac{1}{x}\cdot \frac{3}{x^2}=\frac{3}{x^3}$$
      - sort_order: 13
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given two rational expressions, divide them.**

            - Rewrite as the first rational expression multiplied by the reciprocal of the second.
            - Factor the numerators and denominators.
            - Multiply the numerators.
            - Multiply the denominators.
            - Simplify.
      - sort_order: 14
        block_type: markdown
        content:
          text: |
            **Example 3: Dividing Rational Expressions**

            Divide the rational expressions and express the quotient in simplest form:

            $$\frac{2x^2+x-6}{x^2-1}\div \frac{x^2-4}{x^2+2x+1}$$

            **Solution**

            $$\begin{array}{ll}\frac{2x^2+x-6}{x^2-1}\cdot \frac{x^2+2x+1}{x^2-4} & \;\text{Rewrite as multiplication.} \\ \frac{(2x-3)(x+2)}{(x+1)(x-1)}\cdot \frac{{(x+1)}^2}{(x+2)(x-2)} & \;\text{Factor.} \\ \frac{(2x-3)(x+2){(x+1)}^2}{(x+1)(x-1)(x+2)(x-2)} & \;\text{Multiply.} \\ \frac{(2x-3)(x+1)}{(x-1)(x-2)} & \;\text{Cancel common factors to simplify.}\end{array}$$
      - sort_order: 15
        block_type: practice_prompt
        content:
          prompt: |
            Divide the rational expressions and express the quotient in simplest form:

            $$\frac{9x^2-16}{3x^2+17x-28}\div \frac{3x^2-2x-8}{x^2+5x-14}$$
          answer: $1$
          explanation: Answer from the book's answer key.
      - sort_order: 16
        block_type: markdown
        content:
          text: |
            ### Adding and Subtracting Rational Expressions

            Adding and subtracting rational expressions works just like adding and subtracting numerical fractions. To add fractions, we need to find a common denominator. Let’s look at an example of fraction addition.

            $$\begin{array}{lll}\frac{5}{24}+\frac{1}{40} & = & \frac{25}{120}+\frac{3}{120} \\ & = & \frac{28}{120} \\ & = & \frac{7}{30}\end{array}$$

            We have to rewrite the fractions so they share a common denominator before we are able to add. We must do the same thing when adding or subtracting rational expressions.

            The easiest common denominator to use will be the **least common denominator**, or LCD. The LCD is the smallest multiple that the denominators have in common. To find the LCD of two rational expressions, we factor the expressions and multiply all of the distinct factors. For instance, if the factored denominators were $(x+3)(x+4)$ and $(x+4)(x+5),$ then the LCD would be $(x+3)(x+4)(x+5).$

            Once we find the LCD, we need to multiply each expression by the form of 1 that will change the denominator to the LCD. We would need to multiply the expression with a denominator of $(x+3)(x+4)$ by $\frac{x+5}{x+5}$ and the expression with a denominator of $(x+4)(x+5)$ by $\frac{x+3}{x+3}.$
      - sort_order: 17
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given two rational expressions, add or subtract them.**

            - Factor the numerator and denominator.
            - Find the LCD of the expressions.
            - Multiply the expressions by a form of 1 that changes the denominators to the LCD.
            - Add or subtract the numerators.
            - Simplify.
      - sort_order: 18
        block_type: markdown
        content:
          text: |
            **Example 4: Adding Rational Expressions**

            Add the rational expressions:

            $$\frac{5}{x}+\frac{6}{y}$$

            **Solution**

            First, we have to find the LCD. In this case, the LCD will be $xy.$ We then multiply each expression by the appropriate form of 1 to obtain $xy$ as the denominator for each fraction.

            $$\begin{array}{l}\frac{5}{x}\cdot \frac{y}{y}+\frac{6}{y}\cdot \frac{x}{x} \\ \frac{5y}{xy}+\frac{6x}{xy}\end{array}$$

            Now that the expressions have the same denominator, we simply add the numerators to find the sum.

            $$\frac{6x+5y}{xy}$$
      - sort_order: 19
        block_type: markdown
        content:
          text: |
            **Example 5: Subtracting Rational Expressions**

            Subtract the rational expressions:

            $$\frac{6}{x^2+4x+4}-\frac{2}{x^2-4}$$

            **Solution**

            $$\begin{array}{ll}\frac{6}{{(x+2)}^2}-\frac{2}{(x+2)(x-2)} & \;\text{Factor}. \\ \frac{6}{{(x+2)}^2}\cdot \frac{x-2}{x-2}-\frac{2}{(x+2)(x-2)}\cdot \frac{x+2}{x+2} & \;\text{Multiply each fraction to get LCD as denominator}. \\ \frac{6(x-2)}{{(x+2)}^2(x-2)}-\frac{2(x+2)}{{(x+2)}^2(x-2)} & \;\text{Multiply}. \\ \frac{6x-12-(2x+4)}{{(x+2)}^2(x-2)} & \;\text{Apply distributive property}. \\ \frac{4x-16}{{(x+2)}^2(x-2)} & \;\text{Subtract}. \\ \frac{4(x-4)}{{(x+2)}^2(x-2)} & \;\text{Simplify}.\end{array}$$
      - sort_order: 20
        block_type: callout
        content:
          type: key_concept
          title: Q&A
          body: |
            **Do we have to use the LCD to add or subtract rational expressions?**

            *No. Any common denominator will work, but it is easiest to use the LCD.*
      - sort_order: 21
        block_type: practice_prompt
        content:
          prompt: 'Subtract the rational expressions: $\frac{3}{x+5}-\frac{1}{x-3}.$'
          answer: $\frac{2(x-7)}{(x+5)(x-3)}$
          explanation: Answer from the book's answer key.
      - sort_order: 22
        block_type: markdown
        content:
          text: |
            ### Simplifying Complex Rational Expressions

            A complex rational expression is a rational expression that contains additional rational expressions in the numerator, the denominator, or both. We can simplify complex rational expressions by rewriting the numerator and denominator as single rational expressions and dividing. The complex rational expression $\frac{a}{\frac{1}{b}+c}$ can be simplified by rewriting the numerator as the fraction $\frac{a}{1}$ and combining the expressions in the denominator as $\frac{1+bc}{b}.$ We can then rewrite the expression as a multiplication problem using the reciprocal of the denominator. We get $\frac{a}{1}\cdot \frac{b}{1+bc},$ which is equal to $\frac{ab}{1+bc}.$
      - sort_order: 23
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            **Given a complex rational expression, simplify it.**

            - Combine the expressions in the numerator into a single rational expression by adding or subtracting.
            - Combine the expressions in the denominator into a single rational expression by adding or subtracting.
            - Rewrite as the numerator divided by the denominator.
            - Rewrite as multiplication.
            - Multiply.
            - Simplify.
      - sort_order: 24
        block_type: markdown
        content:
          text: |
            **Example 6: Simplifying Complex Rational Expressions**

            Simplify: $\frac{y+\frac{1}{x}}{\frac{x}{y}}$ .

            **Solution**

            Begin by combining the expressions in the numerator into one expression.

            $$\begin{array}{ll}y\cdot \frac{x}{x}+\frac{1}{x} & \; \text{Multiply by }\frac{x}{x}\;\text{to get LCD as denominator}. \\ \frac{xy}{x}+\frac{1}{x} & \\ \frac{xy+1}{x} & \; \text{Add numerators}.\end{array}$$

            Now the numerator is a single rational expression and the denominator is a single rational expression.

            $$\frac{\frac{xy+1}{x}}{\frac{x}{y}}$$

            We can rewrite this as division, and then multiplication.

            $$\begin{array}{ll}\frac{xy+1}{x}\div \frac{x}{y} & \\ \frac{xy+1}{x}\cdot \frac{y}{x} & \;\text{Rewrite as multiplication}\text{.} \\ \frac{y(xy+1)}{x^2} & \;\text{Multiply}\text{.}\end{array}$$
      - sort_order: 25
        block_type: practice_prompt
        content:
          prompt: 'Simplify: $\frac{\frac{x}{y}-\frac{y}{x}}{y}$'
          answer: $\frac{x^2-y^2}{xy^2}$
          explanation: Answer from the book's answer key.
      - sort_order: 26
        block_type: callout
        content:
          type: key_concept
          title: Q&A
          body: |
            **Can a complex rational expression always be simplified?**

            *Yes. We can always rewrite a complex rational expression as a simplified rational expression.*
      - sort_order: 27
        block_type: callout
        content:
          type: key_concept
          title: Media
          body: |
            Access these online resources for additional instruction and practice with rational expressions.

            - Simplify Rational Expressions
            - Multiply and Divide Rational Expressions
            - Add and Subtract Rational Expressions
            - Simplify a Complex Fraction
      - sort_order: 28
        block_type: markdown
        content:
          text: |
            How can you use factoring to simplify rational expressions?

            How do you use the LCD to combine two rational expressions?

            Tell whether the following statement is true or false and explain why: You only need to find the LCD when adding or subtracting rational expressions.

            For the following exercises, simplify the rational expressions.

            $\frac{x^2-16}{x^2-5x+4}$

            $\frac{y^2+10y+25}{y^2+11y+30}$

            $\frac{6a^2-24a+24}{6a^2-24}$

            $\frac{9b^2+18b+9}{3b+3}$

            $\frac{m-12}{m^2-144}$

            $\frac{2x^2+7x-4}{4x^2+2x-2}$

            $\frac{6x^2+5x-4}{3x^2+19x+20}$

            $\frac{a^2+9a+18}{a^2+3a-18}$

            $\frac{3c^2+25c-18}{3c^2-23c+14}$

            $\frac{12n^2-29n-8}{28n^2-5n-3}$

            For the following exercises, multiply the rational expressions and express the product in simplest form.

            $\frac{x^2-x-6}{2x^2+x-6}\cdot \frac{2x^2+7x-15}{x^2-9}$

            $\frac{c^2+2c-24}{c^2+12c+36}\cdot \frac{c^2-10c+24}{c^2-8c+16}$

            $\frac{2d^2+9d-35}{d^2+10d+21}\cdot \frac{3d^2+2d-21}{3d^2+14d-49}$

            $\frac{10h^2-9h-9}{2h^2-19h+24}\cdot \frac{h^2-16h+64}{5h^2-37h-24}$

            $\frac{6b^2+13b+6}{4b^2-9}\cdot \frac{6b^2+31b-30}{18b^2-3b-10}$

            $\frac{2d^2+15d+25}{4d^2-25}\cdot \frac{2d^2-15d+25}{25d^2-1}$

            $\frac{6x^2-5x-50}{15x^2-44x-20}\cdot \frac{20x^2-7x-6}{2x^2+9x+10}$

            $\frac{t^2-1}{t^2+4t+3}\cdot \frac{t^2+2t-15}{t^2-4t+3}$

            $\frac{2n^2-n-15}{6n^2+13n-5}\cdot \frac{12n^2-13n+3}{4n^2-15n+9}$

            $\frac{36x^2-25}{6x^2+65x+50}\cdot \frac{3x^2+32x+20}{18x^2+27x+10}$

            For the following exercises, divide the rational expressions.

            $\frac{3y^2-7y-6}{2y^2-3y-9}\div \frac{y^2+y-2}{2y^2+y-3}$

            $\frac{6p^2+p-12}{8p^2+18p+9}\div \frac{6p^2-11p+4}{2p^2+11p-6}$

            $\frac{q^2-9}{q^2+6q+9}\div \frac{q^2-2q-3}{q^2+2q-3}$

            $\frac{18d^2+77d-18}{27d^2-15d+2}\div \frac{3d^2+29d-44}{9d^2-15d+4}$

            $\frac{16x^2+18x-55}{32x^2-36x-11}\div \frac{2x^2+17x+30}{4x^2+25x+6}$

            $\frac{144b^2-25}{72b^2-6b-10}\div \frac{18b^2-21b+5}{36b^2-18b-10}$

            $\frac{16a^2-24a+9}{4a^2+17a-15}\div \frac{16a^2-9}{4a^2+11a+6}$

            $\frac{22y^2+59y+10}{12y^2+28y-5}\div \frac{11y^2+46y+8}{24y^2-10y+1}$

            $\frac{9x^2+3x-20}{3x^2-7x+4}\div \frac{6x^2+4x-10}{x^2-2x+1}$

            For the following exercises, add and subtract the rational expressions, and then simplify.

            $\frac{4}{x}+\frac{10}{y}$

            $\frac{12}{2q}-\frac{6}{3p}$

            $\frac{4}{a+1}+\frac{5}{a-3}$

            $\frac{c+2}{3}-\frac{c-4}{4}$

            $\frac{y+3}{y-2}+\frac{y-3}{y+1}$

            $\frac{x-1}{x+1}-\frac{2x+3}{2x+1}$

            $\frac{3z}{z+1}+\frac{2z+5}{z-2}$

            $\frac{4p}{p+1}-\frac{p+1}{4p}$

            $\frac{x}{x+1}+\frac{y}{y+1}$

            For the following exercises, simplify the rational expression.

            $\frac{\frac{6}{y}-\frac{4}{x}}{y}$

            $\frac{\frac{2}{a}+\frac{7}{b}}{b}$

            $\frac{\frac{x}{4}-\frac{p}{8}}{p}$

            $\frac{\frac{3}{a}+\frac{b}{6}}{\frac{2b}{3a}}$

            $\frac{\frac{3}{x+1}+\frac{2}{x-1}}{\frac{x-1}{x+1}}$

            $\frac{\frac{a}{b}-\frac{b}{a}}{\frac{a+b}{ab}}$

            $\frac{\frac{2x}{3}+\frac{4x}{7}}{\frac{x}{2}}$

            $\frac{\frac{2c}{c+2}+\frac{c-1}{c+1}}{\frac{2c+1}{c+1}}$

            $\frac{\frac{x}{y}-\frac{y}{x}}{\frac{x}{y}+\frac{y}{x}}$

            Brenda is placing tile on her bathroom floor. The area of the floor is $15x^2-8x-7$ ft^2. The area of one tile is $x^2-2x+1{\text{ft}}^2.$ To find the number of tiles needed, simplify the rational expression: $\frac{15x^2-8x-7}{x^2-2x+1}.$

            The area of Sandy’s yard is $25x^2-625$ ft^2. A patch of sod has an area of $x^2-10x+25$ ft^2. Divide the two areas and simplify to find how many pieces of sod Sandy needs to cover her yard.

            Aaron wants to mulch his garden. His garden is $x^2+18x+81$ ft^2. One bag of mulch covers $x^2-81$ ft^2. Divide the expressions and simplify to find how many bags of mulch Aaron needs to mulch his garden.

            For the following exercises, perform the given operations and simplify.

            $\frac{x^2+x-6}{x^2-2x-3}\cdot \frac{2x^2-3x-9}{x^2-x-2}\div \frac{10x^2+27x+18}{x^2+2x+1}$

            $\frac{\frac{3y^2-10y+3}{3y^2+5y-2}\cdot \frac{2y^2-3y-20}{2y^2-y-15}}{y-4}$

            $\frac{\frac{4a+1}{2a-3}+\frac{2a-3}{2a+3}}{\frac{4a^2+9}{a}}$

