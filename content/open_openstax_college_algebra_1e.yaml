            ### Formulas

            An **equation** is a mathematical statement indicating that two expressions are equal. The expressions can be numerical or algebraic. The equation is not inherently true or false, but only a proposition. The values that make the equation true, the solutions, are found using the properties of real numbers and other results. For example, the equation $2x+1=7$ has the solution of 3  because when we substitute 3 for $x$ in the equation, we obtain the true statement $2(3)+1=7.$

            A **formula** is an equation expressing a relationship between constant and variable quantities. Very often, the equation is a means of finding the value of one quantity (often a single variable) in terms of another or other quantities. One of the most common examples is the formula for finding the area $A$ of a circle in terms of the radius $r$ of the circle: $A=\pi r^2.$ For any value of $r,$ the area $A$ can be found by evaluating the expression $\pi r^2.$
      - sort_order: 40
        block_type: markdown
        content:
          text: |
            **Example 11: Using a Formula**

            A right circular cylinder with radius $r$ and height $h$ has the surface area $S$ (in square units) given by the formula $S=2\pi r(r+h).$ See Figure 3. Find the surface area of a cylinder with radius 6 in. and height 9 in. Leave the answer in terms of $\pi .$

            *(Figure in the original section: Right circular cylinder.)*

            **Solution**

            Evaluate the expression $2\pi r(r+h)$ for $r=6$ and $h=9.$

            $$\begin{array}{lll}S & = & 2\pi r(r+h) \\ & = & 2\pi (6)[(6)+(9)] \\ & = & 2\pi (6)(15) \\ & = & 180\pi \end{array}$$

            The surface area is $180\pi$ square inches.
