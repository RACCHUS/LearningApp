      terms:
      - term: algebraic expression
        definition: constants and variables combined using addition, subtraction, multiplication, and division
      - term: base
        definition: in exponential notation, the expression that is being multiplied
      - term: constant
        definition: a quantity that does not change value
      - term: equation
        definition: a mathematical statement indicating that two expressions are equal
      - term: exponent
        definition: in exponential notation, the raised number or variable that indicates how many times the base is being multiplied
      - term: exponential notation
        definition: a shorthand method of writing products of the same factor
      - term: formula
        definition: an equation expressing a relationship between constant and variable quantities
      - term: irrational numbers
        definition: the set of all numbers that are not rational; they cannot be written as either a terminating or repeating decimal; they cannot be expressed as a fraction of two integers
      - term: order of operations
        definition: a set of rules governing how mathematical expressions are to be evaluated, assigning priorities to operations
      - term: real number line
        definition: a horizontal line used to represent the real numbers. An arbitrary fixed point is chosen to represent 0; positive numbers lie to the right of 0 and negative numbers to the left.
