          text: |
            **Example 1: Writing Integers as Rational Numbers**

            Write each of the following as a rational number.

            - ⓐ7
            - ⓑ0
            - ⓒ–8

            **Solution**

            Write a fraction with the integer in the numerator and 1 in the denominator.

            - ⓐ $7=\frac{7}{1}$
            - ⓑ $0=\frac{0}{1}$
            - ⓒ $-8=-\frac{8}{1}$
