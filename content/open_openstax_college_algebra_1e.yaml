            ### Sets of Numbers as Subsets

            Beginning with the natural numbers, we have expanded each set to form a larger set, meaning that there is a subset relationship between the sets of numbers we have encountered so far. These relationships become more obvious when seen as a diagram, such as Figure 2.

            *(Figure in the original section: Sets of numbersN: the set of natural numbersW: the set of whole numbersI: the set of integersQ: the set of rational numbersQ´: the set of irrational numbers.)*
      - sort_order: 15
        block_type: callout
        content:
          type: key_concept
          title: Sets of Numbers
          body: |
            The set of **natural numbers** includes the numbers used for counting: $\{1,2,3,...\}.$

            The set of **whole numbers** is the set of natural numbers plus zero: $\{0,1,2,3,...\}.$

            The set of **integers** adds the negative natural numbers to the set of whole numbers: $\{...,-3,-2,-1,0,1,2,3,...\}.$

            The set of **rational numbers** includes fractions written as $\{\frac{m}{n}\;|m\;\text{and }n\;\text{are integers and }n\ne 0\}.$

            The set of **irrational numbers** is the set of numbers that are not rational, are nonrepeating, and are nonterminating: $\{h|h\;\text{is not a rational number}\}.$
