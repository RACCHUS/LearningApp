      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |
            ### In this section, you will:

            - Use the product rule of exponents.
            - Use the quotient rule of exponents.
            - Use the power rule of exponents.
            - Use the zero exponent rule of exponents.
            - Use the negative rule of exponents.
            - Find the power of a product and a quotient.
            - Simplify exponential expressions.
            - Use scientific notation.
      - sort_order: 2
        block_type: markdown
        content:
          text: |
            Mathematicians, scientists, and economists commonly encounter very large and very small numbers. But it may not be obvious how common such figures are in everyday life. For instance, a pixel is the smallest unit of light that can be perceived and recorded by a digital camera. A particular camera might record an image that is 2,048 pixels by 1,536 pixels, which is a very high resolution picture. It can also perceive a color depth (gradations in colors) of up to 48 bits per frame, and can shoot the equivalent of 24 frames per second. The maximum possible number of bits of information used to film a one-hour (3,600-second) digital film is then an extremely large number.

            Using a calculator, we enter $2,048\times 1,536\times 48\times 24\times 3,600$ and press ENTER. The calculator displays 1.304596316E13. What does this mean? The “E13” portion of the result represents the exponent 13 of ten, so there are a maximum of approximately $1.3\times {10}^{13}$ bits of data in that one-hour film. In this section, we review rules of exponents first and then apply them to calculations involving very large or small numbers.
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Using the Product Rule of Exponents

            Consider the product $x^3\cdot x^4.$ Both terms have the same base, *x*, but they are raised to different exponents. Expand each expression, and then rewrite the resulting expression.

            $$\begin{array}{lll}x^3\cdot x^4 & = & \overset{3\;\text{factors}}{\overset{}{x\cdot x\cdot x}}\cdot \overset{4\;\text{factors}}{\overset{}{x\cdot x\cdot x\cdot x}} \\ & = & \overset{7\;\text{factors}}{\overset{}{x\cdot x\cdot x\cdot x\cdot x\cdot x\cdot x}} \\ & = & x^7\end{array}$$

            The result is that $x^3\cdot x^4=x^{3+4}=x^7.$

            Notice that the exponent of the product is the sum of the exponents of the terms. In other words, when multiplying exponential expressions with the same base, we write the result with the common base and add the exponents. This is the *product rule of exponents.*

            $$a^m\cdot a^n=a^{m+n}$$

            Now consider an example with real numbers.

            $$2^3\cdot 2^4=2^{3+4}=2^7$$

            We can always check that this is true by simplifying each exponential expression. We find that $2^3$ is 8, $2^4$ is 16, and $2^7$ is 128. The product $8\cdot 16$ equals 128, so the relationship is true. We can use the product rule of exponents to simplify expressions that are a product of two numbers or expressions with the same base but different exponents.
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: The Product Rule of Exponents
          body: |
            For any real number $a$ and natural numbers $m$ and $n,$ the product rule of exponents states that

            $$a^m\cdot a^n=a^{m+n}$$
      - sort_order: 5
        block_type: markdown
        content:
          text: |
            **Example 1: Using the Product Rule**

            Write each of the following products with a single base. Do not simplify further.

            - ⓐ $t^5\cdot t^3$
            - ⓑ ${(-3)}^5\cdot (-3)$
            - ⓒ $x^2\cdot x^5\cdot x^3$

            **Solution**

            Use the product rule to simplify each expression.

            - ⓐ $t^5\cdot t^3=t^{5+3}=t^8$
            - ⓑ ${(-3)}^5\cdot (-3)={(-3)}^5\cdot {(-3)}^1={(-3)}^{5+1}={(-3)}^6$
            - ⓒ $x^2\cdot x^5\cdot x^3$

            At first, it may appear that we cannot simplify a product of three factors. However, using the associative property of multiplication, begin by simplifying the first two.

            $$x^2\cdot x^5\cdot x^3=(x^2\cdot x^5)\cdot x^3=(x^{2+5})\cdot x^3=x^7\cdot x^3=x^{7+3}=x^{10}$$

            Notice we get the same result by adding the three exponents in one step.

            $$x^2\cdot x^5\cdot x^3=x^{2+5+3}=x^{10}$$
      - sort_order: 6
        block_type: practice_prompt
        content:
          prompt: |
            Write each of the following products with a single base. Do not simplify further.

            - ⓐ $k^6\cdot k^9$
            - ⓑ ${(\frac{2}{y})}^4\cdot (\frac{2}{y})$
            - ⓒ $t^3\cdot t^6\cdot t^5$
          answer: |
            - ⓐ $k^{15}$
            - ⓑ ${(\frac{2}{y})}^5$
            - ⓒ $t^{14}$
          explanation: Answer from the book's answer key.
      - sort_order: 7
        block_type: markdown
        content:
          text: |
            ### Using the Quotient Rule of Exponents

            The *quotient rule of exponents* allows us to simplify an expression that divides two numbers with the same base but different exponents. In a similar way to the product rule, we can simplify an expression such as $\frac{y^m}{y^n},$ where $m>n.$ Consider the example $\frac{y^9}{y^5}.$ Perform the division by canceling common factors.

            $$\begin{array}{lll}\frac{y^9}{y^5} & = & \frac{y\cdot y\cdot y\cdot y\cdot y\cdot y\cdot y\cdot y\cdot y}{y\cdot y\cdot y\cdot y\cdot y} \\ & = & \frac{y\cdot y\cdot y\cdot y\cdot y\cdot y\cdot y\cdot y\cdot y}{y\cdot y\cdot y\cdot y\cdot y} \\ & = & \frac{y\cdot y\cdot y\cdot y}{1} \\ & = & y^4\end{array}$$

            Notice that the exponent of the quotient is the difference between the exponents of the divisor and dividend.

            $$\frac{a^m}{a^n}=a^{m-n}$$

            In other words, when dividing exponential expressions with the same base, we write the result with the common base and subtract the exponents.

            $$\frac{y^9}{y^5}=y^{9-5}=y^4$$

            For the time being, we must be aware of the condition $m>n.$ Otherwise, the difference $m-n$ could be zero or negative. Those possibilities will be explored shortly. Also, instead of qualifying variables as nonzero each time, we will simplify matters and assume from here on that all variables represent nonzero real numbers.
      - sort_order: 8
        block_type: callout
        content:
          type: key_concept
          title: The Quotient Rule of Exponents
          body: |
            For any real number $a$ and natural numbers $m$ and $n,$ such that $m>n,$ the quotient rule of exponents states that

            $$\frac{a^m}{a^n}=a^{m-n}$$
      - sort_order: 9
        block_type: markdown
        content:
          text: |
            **Example 2: Using the Quotient Rule**

            Write each of the following products with a single base. Do not simplify further.

            - ⓐ $\frac{{(-2)}^{14}}{{(-2)}^9}$
            - ⓑ $\frac{t^{23}}{t^{15}}$
            - ⓒ $\frac{{(z\sqrt{2})}^5}{z\sqrt{2}}$

            **Solution**

            Use the quotient rule to simplify each expression.

            - ⓐ $\frac{{(-2)}^{14}}{{(-2)}^9}={(-2)}^{14-9}={(-2)}^5$
            - ⓑ $\frac{t^{23}}{t^{15}}=t^{23-15}=t^8$
            - ⓒ $\frac{{(z\sqrt{2})}^5}{z\sqrt{2}}={(z\sqrt{2})}^{5-1}={(z\sqrt{2})}^4$
      - sort_order: 10
        block_type: practice_prompt
        content:
          prompt: |
            Write each of the following products with a single base. Do not simplify further.

            - ⓐ $\frac{s^{75}}{s^{68}}$
            - ⓑ $\frac{{(-3)}^6}{-3}$
            - ⓒ $\frac{{(ef^2)}^5}{{(ef^2)}^3}$
          answer: |
            - ⓐ $s^7$
            - ⓑ ${(-3)}^5$
            - ⓒ ${(ef^2)}^2$
          explanation: Answer from the book's answer key.
      - sort_order: 11
        block_type: markdown
        content:
          text: |
            ### Using the Power Rule of Exponents

            Suppose an exponential expression is raised to some power. Can we simplify the result? Yes. To do this, we use the *power rule of exponents*. Consider the expression ${(x^2)}^3.$ The expression inside the parentheses is multiplied twice because it has an exponent of 2. Then the result is multiplied three times because the entire expression has an exponent of 3.

            $$\begin{array}{lll}{(x^2)}^3 & = & \overset{3\;\text{factors}}{\overset{}{(x^2)\cdot (x^2)\cdot (x^2)}} \\ & = & \overset{3\;\text{factors}}{\overset{}{(\overset{2\;\text{factors}}{\overbrace{x\cdot x}})\cdot (\overset{2\;\text{factors}}{\overbrace{x\cdot x}})\cdot (\overset{2\;\text{factors}}{\overbrace{x\cdot x}})}} \\ & = & x\cdot x\cdot x\cdot x\cdot x\cdot x \\ & = & x^6\end{array}$$

            The exponent of the answer is the product of the exponents: ${(x^2)}^3=x^{2\cdot 3}=x^6.$ In other words, when raising an exponential expression to a power, we write the result with the common base and the product of the exponents.

            $${(a^m)}^n=a^{m\cdot n}$$

            Be careful to distinguish between uses of the product rule and the power rule. When using the product rule, different terms with the same bases are raised to exponents. In this case, you add the exponents. When using the power rule, a term in exponential notation is raised to a power. In this case, you multiply the exponents.

            $$\begin{array}{lllllllllll} & & \text{Product Rule} & & & & & \;\text{Power Rule} & & \\ 5^3\cdot 5^4 & = & 5^{3+4} & = & 5^7 & \;\text{but}\; & \; {(5^3)}^4 & = & 5^{3\cdot 4} & = & 5^{12} \\ x^5\cdot x^2 & = & x^{5+2} & = & x^7 & \;\text{but}\; & {(x^5)}^2 & = & x^{5\cdot 2} & = & x^{10} \\ {(3a)}^7\cdot {(3a)}^{10} & = & {(3a)}^{7+10} & = & {(3a)}^{17} & \;\text{but}\; & {({(3a)}^7)}^{10} & = & {(3a)}^{7\cdot 10} & = & {(3a)}^{70}\end{array}$$
      - sort_order: 12
        block_type: callout
        content:
          type: key_concept
          title: The Power Rule of Exponents
          body: |
            For any real number $a$ and positive integers $m$ and $n,$ the power rule of exponents states that

            $${(a^m)}^n=a^{m\cdot n}$$
      - sort_order: 13
        block_type: markdown
        content:
          text: |
            **Example 3: Using the Power Rule**

            Write each of the following products with a single base. Do not simplify further.

            - ⓐ ${(x^2)}^7$
            - ⓑ ${({(2t)}^5)}^3$
            - ⓒ ${({(-3)}^5)}^{11}$

            **Solution**

            Use the power rule to simplify each expression.

            - ⓐ ${(x^2)}^7=x^{2\cdot 7}=x^{14}$
            - ⓑ ${({(2t)}^5)}^3={(2t)}^{5\cdot 3}={(2t)}^{15}$
            - ⓒ ${({(-3)}^5)}^{11}={(-3)}^{5\cdot 11}={(-3)}^{55}$
      - sort_order: 14
        block_type: practice_prompt
        content:
          prompt: |
            Write each of the following products with a single base. Do not simplify further.

            - ⓐ ${({(3y)}^8)}^3$
            - ⓑ ${(t^5)}^7$
            - ⓒ ${({(-g)}^4)}^4$
          answer: |
            - ⓐ ${(3y)}^{24}$
            - ⓑ $t^{35}$
            - ⓒ ${(-g)}^{16}$
          explanation: Answer from the book's answer key.
      - sort_order: 15
        block_type: markdown
        content:
          text: |
            ### Using the Zero Exponent Rule of Exponents

            Return to the quotient rule. We made the condition that $m>n$ so that the difference $m-n$ would never be zero or negative. What would happen if $m=n?$ In this case, we would use the *zero exponent rule of exponents* to simplify the expression to 1. To see how this is done, let us begin with an example.

            $$\frac{t^8}{t^8}=\frac{t^8}{t^8}=1$$

            If we were to simplify the original expression using the quotient rule, we would have

            $$\frac{t^8}{t^8}=t^{8-8}=t^0$$

            If we equate the two answers, the result is $t^0=1.$ This is true for any nonzero real number, or any variable representing a real number.

            $$a^0=1$$

            The sole exception is the expression $0^0.$ This appears later in more advanced courses, but for now, we will consider the value to be undefined.
      - sort_order: 16
        block_type: callout
        content:
          type: key_concept
          title: The Zero Exponent Rule of Exponents
          body: |
            For any nonzero real number $a,$ the zero exponent rule of exponents states that

            $$a^0=1$$
      - sort_order: 17
        block_type: markdown
        content:
          text: "**Example 4: Using the Zero Exponent Rule**\n\nSimplify each expression using the zero exponent rule of exponents.\n\n- ⓐ $\\frac{c^3}{c^3}$\n- ⓑ $\\frac{-3x^5}{x^5}$\n- ⓒ $\\frac{{(j^2k)}^4}{(j^2k)\\cdot {(j^2k)}^3}$\n- ⓓ $\\frac{5{(rs^2)}^2}{{(rs^2)}^2}$\n\n**Solution**\n\nUse the zero exponent and other rules to simplify each expression.\n\nⓐ   \n $\\begin{array}{lll}\\frac{c^3}{c^3} & = & c^{3-3} \\\\ & = & c^0 \\\\ & = & 1\\end{array}$\n\nⓑ   \n $\\begin{array}{lll}\\frac{-3x^5}{x^5} & = & -3\\cdot \\frac{x^5}{x^5} \\\\ & = & -3\\cdot x^{5-5} \\\\ & = & -3\\cdot x^0 \\\\ & = & -3\\cdot 1 \\\\ & = & -3\\end{array}$\n\nⓒ   \n $\\begin{array}{llll}\\frac{{(j^2k)}^4}{(j^2k)\\cdot {(j^2k)}^3} & = & \\frac{{(j^2k)}^4}{{(j^2k)}^{1+3}} & \\;\\text{Use the product rule in the denominator}. \\\\ & = & \\frac{{(j^2k)}^4}{{(j^2k)}^4} & \\;\\text{Simplify}. \\\\ & = & {(j^2k)}^{4-4} & \\;\\text{Use the quotient rule}. \\\\ & = & {(j^2k)}^0 & \\;\\text{Simplify}. \\\\ & = & 1 & \\\
            end{array}$\n\nⓓ   \n $\\begin{array}{llll}\\frac{5{(rs^2)}^2}{{(rs^2)}^2} & = & 5{(rs^2)}^{2-2} & \\;\\text{Use the quotient rule}. \\\\ & = & 5{(rs^2)}^0 & \\;\\text{Simplify}. \\\\ & = & 5\\cdot 1 & \\;\\text{Use the zero exponent rule}. \\\\ & = & 5 & \\;\\text{Simplify}.\\end{array}$\n"
      - sort_order: 18
        block_type: practice_prompt
        content:
          prompt: |
            Simplify each expression using the zero exponent rule of exponents.

            - ⓐ $\frac{t^7}{t^7}$
            - ⓑ $\frac{{(de^2)}^{11}}{2{(de^2)}^{11}}$
            - ⓒ $\frac{w^4\cdot w^2}{w^6}$
