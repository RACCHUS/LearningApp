        lessons:
          - title: "Find and Fix a Broken Home Network Link"
            description: "Trace a home network, find the broken connection, and choose the right first repair."
            emoji: "🔌"
            tags: ["networking", "troubleshooting", "digital-literacy", "simulation-pilot"]
            citation: "LearningApp simulation pilot draft"
            concept_slugs:
              - "net-home-network-path"
              - "net-physical-link-repair"
            blocks:
              - sort_order: 1
                block_type: "markdown"
                content:
                  body: "A home network is a chain. The **modem** connects to the internet, the **router** connects to the modem, and **each device has its own link** to the router. When only one device cannot connect, start with that device's own link."
              - sort_order: 2
                block_type: "simulation"
                content:
                  simulation_id: "networking-basics"
                  simulation_version: "1.0.0"
                  title: "Practice: diagnose a broken connection"
                  body: "**Scenario.** Internet → modem → router are all connected and the router is online. The router has two separate links: one to a **laptop** and one to a **printer**. The printer works. The laptop cannot connect, and its Ethernet cable to the router is loose.\n\nWork through these three steps, then answer the practice questions at the end of the lesson:\n\n1. Which connection is broken?\n2. What should you check first?\n3. Why is that the right first step?"
              - sort_order: 3
                block_type: "callout"
                content:
                  variant: "info"
                  title: "Rule of thumb"
                  text: "Fix the physical link before changing settings. A password change or a new screen cannot reconnect a loose cable."
            terms:
              - term: "Router"
                definition: "The device that connects each home device to the modem and passes traffic between them."
                example: "A laptop and a printer each have their own link to the router."
                emoji: "📶"
              - term: "Ethernet cable"
                definition: "A physical cable that carries network traffic between two devices."
                example: "The cable between the router and the laptop."
                emoji: "🔌"
            questions:
              - question_text: "The router is online and the printer works, but the laptop cannot connect. Which connection is broken?"
                options:
                  - "Between the modem and the router"
                  - "Between the router and the laptop"
                  - "Between the router and the printer"
                correct_answer: 1
                type: "mcq"
                explanation: "Only the laptop fails while the router and printer work, so the problem is the laptop's own link to the router."
                concept_slugs: ["net-home-network-path"]
              - question_text: "The laptop's Ethernet cable to the router is loose. What should you check first?"
                options:
                  - "Reconnect the laptop's loose Ethernet cable"
                  - "Restart the router and modem to reconnect"
                  - "Change the laptop's network settings first"
                correct_answer: 0
                type: "mcq"
                explanation: "Reseat the loose cable first, then check whether the laptop reconnects."
                concept_slugs: ["net-physical-link-repair"]
              - question_text: "Why is reconnecting the laptop's loose Ethernet cable the right first step?"
                options:
                  - "Restarting the router repairs the loose cable."
                  - "Changing settings repairs the loose cable."
                  - "The cable carries network traffic to the laptop."
                correct_answer: 2
                type: "mcq"
                explanation: "The cable is the physical path for the laptop's traffic. Restarting the router or changing settings cannot repair a loose cable."
                concept_slugs: ["net-physical-link-repair"]
