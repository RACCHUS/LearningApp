- id: xl-ho-1-1-b
  objective: SPREADSHEET-1.1
  interaction_type: single_choice
  prompt: Cells D3, D4, D5, D6 and D7 contain 10, 1, 20, 2 and 30. Which formula adds only D3, D5 and D7?
  response_spec:
    options:
    - =SUM(D3:D7)
    - =SUM(D3,D5,D7)
    - =D3:D7
    - =SUM(D3+D7)
  scoring_spec:
    correct_index: 1
  explanation: Commas list separate cells, so =SUM(D3,D5,D7) gives 10 + 20 + 30 = 60. A colon makes a range, so =SUM(D3:D7) also adds D4 and D6 (63). =D3:D7 is not a valid single value, and =SUM(D3+D7) leaves out D5.
  difficulty: intermediate
  cognitive_level: application
  citation: 'Microsoft Support: Basic tasks in Excel; SUM function (alignment only; original item)'
  verify:
    spreadsheet:
      cells:
        D3: 10
        D4: 1
        D5: 20
        D6: 2
        D7: 30
      target: 60
      formulas:
      - =SUM(D3:D7)
      - =SUM(D3,D5,D7)
      - =D3:D7
      - =SUM(D3+D7)
  review:
    reviewer_kind: ai
    reviewer_model: claude-sonnet-5-5
    reviewer_ref: ai-review:claude-sonnet-5-5
    reviewer_qualification: 'AI review checklist v1 (HELD_OUT_CHECKS_DESIGN.md); separate model from the author; solved independently with its own code; scanned the lessons for copies. Rights: original item, Microsoft Support cited as reference only. Evidence: content/held_out/reviews/open_openstax_prealgebra_1e_ch6_and_excel_fundamentals/'
    reviewed_on: '2026-11-24'
    review_status: approved
    rights_review_status: approved
