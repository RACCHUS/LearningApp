  objective: SPREADSHEET-1.1
  interaction_type: single_choice
  prompt: Which of these is a valid cell reference?
  response_spec:
    options:
    - 12B
    - B-12
    - BB
    - B12
  scoring_spec:
    correct_index: 3
  explanation: A cell reference is the column letter(s) followed by the row number, as in B12. 12B has them in the wrong order, B-12 has an extra sign, and BB has no row.
