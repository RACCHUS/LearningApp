          answer: 50%
          explanation: Answer from the book's answer key.
      - sort_order: 41
        block_type: markdown
        content:
          text: Finding the **percent decrease** is very similar to finding the percent increase, but now the amount of decrease is the difference between the original amount and the final amount. Then we find what percent the amount of decrease is of the original amount.
      - sort_order: 42
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            - Step 1.  Find the amount of decrease.$\text{decrease}=\text{original amount}-\text{new amount}$
            - Step 2.  Find the percent decrease as a percent of the original amount.
      - sort_order: 43
        block_type: markdown
        content:
          text: |
            **Example 6.24**

            The average price of a gallon of gas in one city in June $2014$ was $\text{\textdollar 3.71}.$ The average price in that city in July was $\text{\textdollar 3.64}.$ Find the percent decrease.

            **Solution**

            | What are you asked to find? | the percent decrease |
            | --- | --- |
            | Choose a variable to represent it. | Let $p=$ percent. |
            | Find the amount of decrease. |  |
            | Find the percent of decrease. | The decrease is what percent of the original amount? |
            | Translate to an equation. |  |
            | Divide both sides by 3.71. |  |
            | Round to the nearest thousandth. |  |
            | Convert to percent form. |  |
            | Write a complete sentence. | The price of gas decreased 1.9%. |
