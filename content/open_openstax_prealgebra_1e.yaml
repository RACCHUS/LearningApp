      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Be Prepared 6.5
          body: "Before you get started, take this readiness quiz.\n\n- Simplify: $\\frac{\\frac{1}{3}}{4}.$  \n If you missed this problem, review Example 4.44.\n- Solve: $\\frac{x}{4}=20.$  \n If you missed this problem, review Example 4.99.\n- Write as a rate: Sale rode his bike $24$ miles in $2$ hours.   \n If you missed this problem, review Example 5.63.\n"
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Use the Definition of Proportion

            In the section on Ratios and Rates we saw some ways they are used in our daily lives. When two ratios or rates are equal, the equation relating them is called a **proportion**.
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: Proportion
          body: |
            A proportion is an equation of the form $\frac{a}{b}=\frac{c}{d},$ where $b\ne 0,d\ne 0.$

            The proportion states two ratios or rates are equal. The proportion is read $\text{“}a$ is to $b,$ as $c$ is to $d\text{”.}$
      - sort_order: 5
        block_type: markdown
        content:
          text: |
            The equation $\frac{1}{2}=\frac{4}{8}$ is a proportion because the two fractions are equal. The proportion $\frac{1}{2}=\frac{4}{8}$ is read $\text{“}1$ is to $2$ as $4$ is to $8\text{”.}$

            If we compare quantities with units, we have to be sure we are comparing them in the right order. For example, in the proportion $\frac{\text{20 students}}{\text{1 teacher}}=\frac{\text{60 students}}{\text{3 teachers}}$ we compare the number of students to the number of teachers. We put students in the numerators and teachers in the denominators.
      - sort_order: 6
        block_type: markdown
        content:
          text: |
            **Example 6.40**

            Write each sentence as a proportion:

            - ⓐ$\;3$ is to $7$ as $15$ is to $35.$
            - ⓑ$\;5$ hits in $8$ at bats is the same as $30$ hits in $48$ at-bats.
            - ⓒ$\;\text{\textdollar 1.50}$ for $6$ ounces is equivalent to $\text{\textdollar 2.25}$ for $9$ ounces.

            **Solution**

            | ⓐ |  |
            | --- | --- |
            |  | 3 is to 7 as 15 is to 35. |
            | Write as a proportion. | $\frac{3}{7}=\frac{15}{35}$ |

            | ⓑ |  |
            | --- | --- |
            |  | 5 hits in 8 at-bats is the same as 30 hits in 48 at-bats. |
            | Write each fraction to compare hits to at-bats. | $\frac{\text{hits}}{\text{at-bats}}=\frac{\text{hits}}{\text{at-bats}}$ |
            | Write as a proportion. | $\frac{5}{8}=\frac{30}{48}$ |

            | ⓒ |  |
            | --- | --- |
            |  | $1.50 for 6 ounces is equivalent to $2.25 for 9 ounces. |
            | Write each fraction to compare dollars to ounces. | $\frac{\text{\textdollar}}{\text{ounces}}=\frac{\text{\textdollar}}{\text{ounces}}$ |
            | Write as a proportion. | $\frac{1.50}{6}=\frac{2.25}{9}$ |
      - sort_order: 7
        block_type: practice_prompt
        content:
          prompt: |
            Write each sentence as a proportion:

            - ⓐ$\;5$ is to $9$ as $20$ is to $36.$
            - ⓑ$\;7$ hits in $11$ at-bats is the same as $28$ hits in $44$ at-bats.
            - ⓒ$\;\text{\textdollar 2.50}$ for $8$ ounces is equivalent to $\text{\textdollar 3.75}$ for $12$ ounces.
          answer: |
            - ⓐ$\;\frac{5}{9}=\frac{20}{36}\;$
            - ⓑ$\;\frac{7}{11}=\frac{28}{44}\;$
            - ⓒ$\frac{2.50}{8}=\frac{3.75}{12}\;$
          explanation: Answer from the book's answer key.
      - sort_order: 8
        block_type: practice_prompt
        content:
          prompt: |
            Write each sentence as a proportion:

            - ⓐ$\;6$ is to $7$ as $36$ is to $42.$
            - ⓑ$\;8$ adults for $36$ children is the same as $12$ adults for $54$ children.
            - ⓒ$\;\text{\textdollar 3.75}$ for $6$ ounces is equivalent to $\text{\textdollar 2.50}$ for $4$ ounces.
          answer: |
            - ⓐ$\;\frac{6}{7}=\frac{36}{42}$
            - ⓑ$\;\frac{8}{36}=\frac{12}{54}$
            - ⓒ$\frac{3.75}{6}=\frac{2.50}{4}$
          explanation: Answer from the book's answer key.
      - sort_order: 9
        block_type: markdown
        content:
          text: |
            Look at the proportions $\frac{1}{2}=\frac{4}{8}$ and $\frac{2}{3}=\frac{6}{9}.$ From our work with equivalent fractions we know these equations are true. But how do we know if an equation is a proportion with equivalent fractions if it contains fractions with larger numbers?

            To determine if a proportion is true, we find the **cross products** of each proportion. To find the cross products, we multiply each denominator with the opposite numerator (diagonally across the equal sign). The results are called a cross products because of the cross formed. The cross products of a proportion are equal.
      - sort_order: 10
        block_type: callout
        content:
          type: key_concept
          title: Cross Products of a Proportion
          body: For any proportion of the form $\frac{a}{b}=\frac{c}{d},$ where $b\ne 0,d\ne 0,$ its cross products are equal.
      - sort_order: 11
        block_type: markdown
        content:
          text: Cross products can be used to test whether a proportion is true. To test whether an equation makes a proportion, we find the cross products. If they are the equal, we have a proportion.
      - sort_order: 12
        block_type: markdown
        content:
          text: |
            **Example 6.41**

            Determine whether each equation is a proportion:

            - ⓐ$\;\frac{4}{9}=\frac{12}{28}$
            - ⓑ$\frac{17.5}{37.5}=\frac{7}{15}$

            **Solution**

            To determine if the equation is a proportion, we find the cross products. If they are equal, the equation is a proportion.

            | ⓐ |  |
            | --- | --- |
            |  |  |
            | Find the cross products. | $28\cdot 4=112\;9\cdot 12=108$ |

            Since the cross products are not equal, $28\cdot 4\ne 9\cdot 12,$ the equation is not a proportion.

            | ⓑ |  |
            | --- | --- |
            |  |  |
            | Find the cross products. | $15\cdot 17.5=262.5\;37.5\cdot 7=262.5$ |

            Since the cross products are equal, $15\cdot 17.5=37.5\cdot 7,$ the equation is a proportion.
      - sort_order: 13
        block_type: practice_prompt
        content:
          prompt: |
            Determine whether each equation is a proportion:

            - ⓐ$\;\frac{7}{9}=\frac{54}{72}$
            - ⓑ$\frac{24.5}{45.5}=\frac{7}{13}$
          answer: |
            - ⓐ no
            - ⓑ yes
          explanation: Answer from the book's answer key.
      - sort_order: 14
        block_type: practice_prompt
        content:
          prompt: |
            Determine whether each equation is a proportion:

            - ⓐ$\;\frac{8}{9}=\frac{56}{73}\;$
            - ⓑ$\;\frac{28.5}{52.5}=\frac{8}{15}$
          answer: |
            - ⓐ no
            - ⓑ no
          explanation: Answer from the book's answer key.
      - sort_order: 15
        block_type: markdown
        content:
          text: |
            ### Solve Proportions

            To solve a proportion containing a variable, we remember that the proportion is an equation. All of the techniques we have used so far to solve equations still apply. In the next example, we will solve a proportion by multiplying by the **Least Common Denominator** (LCD) using the **Multiplication Property of Equality**.
      - sort_order: 16
        block_type: markdown
        content:
          text: |
            **Example 6.42**

            Solve: $\frac{x}{63}=\frac{4}{7}.$

            **Solution**

            |  |  |  |
            | --- | --- | --- |
            | To isolate $x$, multiply both sides by the LCD, 63. |  |  |
            | Simplify. |  |  |
            | Divide the common factors. |  |  |
            | Check: To check our answer, we substitute into the original proportion. |  |  |
            |  |  |  |
            |  |  |  |
            | Show common factors. |  |  |
            | Simplify. |  |  |
      - sort_order: 17
        block_type: practice_prompt
        content:
          prompt: 'Solve the proportion: $\frac{n}{84}=\frac{11}{12}.$'
          answer: '77'
          explanation: Answer from the book's answer key.
      - sort_order: 18
        block_type: practice_prompt
        content:
          prompt: 'Solve the proportion: $\frac{y}{96}=\frac{13}{12}.$'
          answer: '104'
          explanation: Answer from the book's answer key.
      - sort_order: 19
        block_type: markdown
        content:
          text: |
            When the variable is in a denominator, we’ll use the fact that the **cross products** of a proportion are equal to solve the proportions.

            We can find the cross products of the proportion and then set them equal. Then we solve the resulting equation using our familiar techniques.
      - sort_order: 20
        block_type: markdown
        content:
          text: |
            **Example 6.43**

            Solve: $\frac{144}{a}=\frac{9}{4}.$

            **Solution**

            Notice that the variable is in the denominator, so we will solve by finding the cross products and setting them equal.

            |  |  |  |
            | --- | --- | --- |
            | Find the cross products and set them equal. |  |  |
            | Simplify. |  |  |
            | Divide both sides by 9. |  |  |
            | Simplify. |  |  |
            | Check your answer. |  |  |
            |  |  |  |
