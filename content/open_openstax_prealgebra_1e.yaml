          text: |
            ### In this section, you will:

            - Use the simple interest formula
            - Solve simple interest applications
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Be Prepared 6.4
          body: "Before you get started, take this readiness quiz.\n\n- Solve $0.6y=45.$  \n If you missed this problem, review Example 5.43.\n- Solve $\\frac{n}{1.45}=4.6.$  \n If you missed this problem, review Example 5.44.\n"
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Use the Simple Interest Formula

            Do you know that banks pay you to let them keep your money? The money you put in the bank is called the **principal**, $P,$ and the bank pays you **interest**, $I.$ The interest is computed as a certain percent of the principal; called the **rate of interest**, $r.$ The rate of interest is usually expressed as a percent per year, and is calculated by using the decimal equivalent of the percent. The variable for time, $t,$ represents the number of years the money is left in the account.
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: Simple Interest
          body: |
            If an amount of money, $P,$ the principal, is invested for a period of $t$ years at an annual interest rate $r,$ the amount of interest, $I,$ earned is

            $$I=Prt\;$$

            where

            $$\begin{array}{lll}I & = & \text{interest} \\ P & = & \text{principal} \\ r & = & \text{rate} \\ t & = & \text{time}\end{array}$$

            Interest earned according to this formula is called **simple interest**.
      - sort_order: 5
        block_type: markdown
        content:
          text: The formula we use to calculate simple interest is $I=Prt.$ To use the simple interest formula we substitute in the values for variables that are given, and then solve for the unknown variable. It may be helpful to organize the information by listing all four variables and filling in the given information.
      - sort_order: 6
        block_type: markdown
        content:
          text: |
            **Example 6.33**

            Find the simple interest earned after $3$ years on $\text{\textdollar 500}$ at an interest rate of $\text{6\%.}$

            **Solution**

            Organize the given information in a list.

            $\begin{array}{lll}I & = & ? \\ P & = & \text{\textdollar 500} \\ r & = & \text{6\%} \\ t & = & \text{3 years}\end{array}$

            We will use the simple interest formula to find the interest.

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information. Remember to write the percent in decimal form. | $I=(500)(0.06)(3)$ |
            | Simplify. | $I=90$ |
            | Check your answer. Is $90 a reasonable interest earned on $500 in 3 years? |  |
            | In 3 years the money earned 18%. If we rounded to 20%, the interest would have been 500(0.20) or $100. Yes, $90 is reasonable. |  |
            | Write a complete sentence that answers the question. | The simple interest is $90. |
      - sort_order: 7
        block_type: practice_prompt
        content:
          prompt: Find the simple interest earned after $4$ years on $\text{\textdollar 800}$ at an interest rate of $\text{5\%.}$
          answer: $160
          explanation: Answer from the book's answer key.
      - sort_order: 8
        block_type: practice_prompt
        content:
          prompt: Find the simple interest earned after $2$ years on $\text{\textdollar 700}$ at an interest rate of $\text{4\%.}$
          answer: $56
          explanation: Answer from the book's answer key.
      - sort_order: 9
        block_type: markdown
        content:
          text: In the next example, we will use the simple interest formula to find the principal.
      - sort_order: 10
        block_type: markdown
        content:
          text: |
            **Example 6.34**

            Find the principal invested if $\text{\textdollar 178}$ interest was earned in $2$ years at an interest rate of $\text{4\%.}$

            **Solution**

            Organize the given information in a list.

            $\begin{array}{lll}I & = & \text{\textdollar 178} \\ P & = & ? \\ r & = & \text{4\%} \\ t & = & \text{2 years}\end{array}$

            We will use the simple interest formula to find the principal.

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information. | $178=P(0.04)(2)$ |
            | Divide. | $\frac{178}{0.08}=\frac{0.08P}{0.08}$ |
            | Simplify. | $2,225=P$ |
            | Check your answer. Is it reasonable that $2,225 would earn $178 in 2 years? |  |
            | $I=Prt$ |  |
            | $178\overset{?}{=}2,225(0.04)(2)$ |  |
            | $178=178✓$ |  |
            | Write a complete sentence that answers the question. | The principal is $2,225. |
      - sort_order: 11
        block_type: practice_prompt
        content:
          prompt: Find the principal invested if $\text{\textdollar 495}$ interest was earned in $3$ years at an interest rate of $\text{6\%.}$
          answer: $2,750
          explanation: Answer from the book's answer key.
      - sort_order: 12
        block_type: practice_prompt
        content:
          prompt: Find the principal invested if $\text{\textdollar 1,246}$ interest was earned in $5$ years at an interest rate of $\text{7\%}.$
          answer: $3,560
          explanation: Answer from the book's answer key.
      - sort_order: 13
        block_type: markdown
        content:
          text: Now we will solve for the rate of interest.
      - sort_order: 14
        block_type: markdown
        content:
          text: |
            **Example 6.35**

            Find the rate if a principal of $\text{\textdollar 8,200}$ earned $\text{\textdollar 3,772}$ interest in $4$ years.

            **Solution**

            Organize the given information.

            $\begin{array}{lll}I & = & \text{\textdollar 3,772} \\ P & = & \text{\textdollar 8,200} \\ r & = & ? \\ t & = & \text{4 years}\end{array}$

            We will use the simple interest formula to find the rate.

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information. | $3,772=8,200r(4)$ |
            | Multiply. | $3,772=32,800r$ |
            | Divide. | $\frac{3,772}{32,800}=\frac{32,800r}{32,800}$ |
            | Simplify. | $0.115=r$ |
            | Write as a percent. | $\text{11.5\%}=r$ |
            | Check your answer. Is 11.5% a reasonable rate if $3,772 was earned in 4 years? |  |
            | $I=Prt$ |  |
            | $3,772\overset{?}{=}8,200(0.115)(4)$ |  |
            | $3,772=3,772✓$ |  |
            | Write a complete sentence that answers the question. | The rate was 11.5%. |
      - sort_order: 15
        block_type: practice_prompt
        content:
          prompt: Find the rate if a principal of $\text{\textdollar 5,000}$ earned $\text{\textdollar 1,350}$ interest in $6$ years.
          answer: 4.5%
          explanation: Answer from the book's answer key.
      - sort_order: 16
        block_type: practice_prompt
        content:
          prompt: Find the rate if a principal of $\text{\textdollar 9,000}$ earned $\text{\textdollar 1,755}$ interest in $3$ years.
          answer: 6.5%
          explanation: Answer from the book's answer key.
      - sort_order: 17
        block_type: markdown
        content:
          text: |
            ### Solve Simple Interest Applications

            Applications with **simple interest** usually involve either investing money or borrowing money. To solve these applications, we continue to use the same strategy for applications that we have used earlier in this chapter. The only difference is that in place of translating to get an equation, we can use the simple interest formula.

            We will start by solving a simple interest application to find the interest.
      - sort_order: 18
        block_type: markdown
        content:
          text: |
            **Example 6.36**

            Nathaly deposited $\text{\textdollar 12,500}$ in her bank account where it will earn $\text{4\%}$ interest. How much interest will Nathaly earn in $5$ years?

            **Solution**

            We are asked to find the Interest, $I.$

            Organize the given information in a list.

            $\begin{array}{lll}I & = & ? \\ P & = & \text{\textdollar 12,500} \\ r & = & \text{4\%} \\ t & = & \text{5 years}\end{array}$

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information. | $I=(12,500)(0.04)(5)$ |
            | Simplify. | $I=2,500$ |
            | Check your answer. Is $2,500 a reasonable interest on $12,500 over 5 years? |  |
            | At 4% interest per year, in 5 years the interest would be 20% of the principal. Is 20% of $12,500 equal to $2,500? Yes. |  |
            | Write a complete sentence that answers the question. | The interest is $2,500. |
      - sort_order: 19
        block_type: practice_prompt
        content:
          prompt: Areli invested a principal of $\text{\textdollar 950}$ in her bank account with interest rate $\text{3\%.}$ How much interest did she earn in $5$ years?
          answer: $142.50
          explanation: Answer from the book's answer key.
      - sort_order: 20
        block_type: practice_prompt
        content:
          prompt: Susana invested a principal of $\text{\textdollar 36,000}$ in her bank account with interest rate $\text{6.5\%}.$ How much interest did she earn in $3$ years?
          answer: $7,020
          explanation: Answer from the book's answer key.
      - sort_order: 21
        block_type: markdown
        content:
          text: There may be times when you know the amount of interest earned on a given **principal** over a certain length of time, but you don't know the rate. For instance, this might happen when family members lend or borrow money among themselves instead of dealing with a bank. In the next example, we'll show how to solve for the rate.
      - sort_order: 22
        block_type: markdown
        content:
          text: |
            **Example 6.37**

            Loren lent his brother $\text{\textdollar 3,000}$ to help him buy a car. In $\text{4 years}$ his brother paid him back the $\text{\textdollar 3,000}$ plus $\text{\textdollar 660}$ in interest. What was the rate of interest?

            **Solution**

            We are asked to find the rate of interest, $r.$

            Organize the given information.

            $\begin{array}{lll}I & = & 660 \\ P & = & \text{\textdollar 3,000} \\ r & = & ? \\ t & = & \text{4 years}\end{array}$

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information. | $660=(3,000)r(4)$ |
            | Multiply. | $660=(12,000)r$ |
            | Divide. | $\frac{660}{12,000}=\frac{(12,000)r}{12,000}$ |
            | Simplify. | $0.055=r$ |
            | Change to percent form. | $\text{5.5\%}=r$ |
            | Check your answer. Is 5.5% a reasonable interest rate to pay your brother? |  |
            | $I=Prt$ |  |
            | $660\overset{?}{=}(3,000)(0.055)(4)$ |  |
            | $660=660✓$ |  |
            | Write a complete sentence that answers the question. | The rate of interest was 5.5%. |
      - sort_order: 23
        block_type: practice_prompt
        content:
          prompt: Jim lent his sister $\text{\textdollar 5,000}$ to help her buy a house. In $3$ years, she paid him the $\text{\textdollar 5,000},$ plus $\text{\textdollar 900}$ interest. What was the rate of interest?
          answer: 6%
          explanation: Answer from the book's answer key.
      - sort_order: 24
        block_type: practice_prompt
        content:
          prompt: Hang borrowed $\text{\textdollar 7,500}$ from her parents to pay her tuition. In $5$ years, she paid them $\text{\textdollar 1,500}$ interest in addition to the $\text{\textdollar 7,500}$ she borrowed. What was the rate of interest?
          answer: 4%
          explanation: Answer from the book's answer key.
      - sort_order: 25
        block_type: markdown
        content:
          text: There may be times when you take a loan for a large purchase and the amount of the principal is not clear. This might happen, for instance, in making a car purchase when the dealer adds the cost of a warranty to the price of the car. In the next example, we will solve a **simple interest** application for the principal.
      - sort_order: 26
        block_type: markdown
        content:
          text: |
            **Example 6.38**

            Eduardo noticed that his new car loan papers stated that with an interest rate of $\text{7.5\%},$ he would pay $\text{\textdollar 6,596.25}$ in interest over $5$ years. How much did he borrow to pay for his car?

            **Solution**

            We are asked to find the principal, $P.$

            Organize the given information.

            $\begin{array}{lll}I & = & 6,596.25 \\ P & = & ? \\ r & = & \text{7.5\%} \\ t & = & \text{5 years}\end{array}$

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information. | $6,596.25=P(0.075)(5)$ |
            | Multiply. | $6,596.25=0.375P$ |
            | Divide. | $\frac{6,596.25}{0.375}=\frac{0.375P}{0.375}$ |
            | Simplify. | $17,590=P$ |
            | Check your answer. Is $17,590 a reasonable amount to borrow to buy a car? |  |
            | $I=Prt$ |  |
            | $6,596.25\overset{?}{=}(17,590)(0.075)(5)$ |  |
            | $6,596.25=6,596.25✓$ |  |
            | Write a complete sentence that answers the question. | The amount borrowed was $17,590. |
      - sort_order: 27
        block_type: practice_prompt
        content:
          prompt: Sean's new car loan statement said he would pay $\text{\textdollar 4,866.25}$ in interest from an interest rate of $\text{8.5\%}$ over $5$ years. How much did he borrow to buy his new car?
          answer: $11,450
          explanation: Answer from the book's answer key.
      - sort_order: 28
        block_type: practice_prompt
        content:
          prompt: In $5$ years, Gloria's bank account earned $\text{\textdollar 2,400}$ interest at $\text{5\%.}$ How much had she deposited in the account?
          answer: $9,600
          explanation: Answer from the book's answer key.
      - sort_order: 29
        block_type: markdown
        content:
          text: In the **simple interest** formula, the rate of interest is given as an annual rate, the rate for one year. So the units of time must be in years. If the time is given in months, we convert it to years.
      - sort_order: 30
        block_type: markdown
        content:
          text: |
            **Example 6.39**

            Caroline got $\text{\textdollar 900}$ as graduation gifts and invested it in a $\text{10-month}$ certificate of deposit that earned $\text{2.1\%}$ interest. How much interest did this investment earn?

            **Solution**

            We are asked to find the interest, $I.$

            Organize the given information.

            $\begin{array}{lll}I & = & ? \\ P & = & \text{\textdollar 900} \\ r & = & \text{2.1\%} \\ t & = & \text{10 months}\end{array}$

            | Write the formula. | $I=Prt$ |
            | --- | --- |
            | Substitute the given information, converting 10 months to $\frac{10}{12}$ of a year. | $I=\text{\textdollar}900(0.021)(\frac{10}{12})$ |
            | Multiply. | $I=15.75$ |
            | Check your answer. Is $15.75 a reasonable amount of interest? |  |
            | If Caroline had invested the $900 for a full year at 2% interest, the amount of interest would have been $18. Yes, $15.75 is reasonable. |  |
            | Write a complete sentence that answers the question. | The interest earned was $15.75. |
      - sort_order: 31
