      - arithmetic
      - percent
      - unreviewed
      citation: Prealgebra (OpenStax), Section 6.3, https://openstax.org/books/prealgebra/pages/6-3-solve-sales-tax-commission-and-discount-applications, CC BY 4.0
      source_release_id: openstax-prealgebra-1e
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |
            ### In this section, you will:

            - Solve sales tax applications
            - Solve commission applications
            - Solve discount applications
            - Solve mark-up applications
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Be Prepared 6.3
          body: "Before you get started, take this readiness quiz.\n\n- Solve $0.0875(720)$ through multiplication.  \n If you missed this problem, review Example 5.17.\n- Solve $12.96\\div 0.04$ through division.  \n If you missed this problem, review Example 5.22.\n"
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Solve Sales Tax Applications

            Sales tax and commissions are applications of percent in our everyday lives. To solve these applications, we will follow the same strategy we used in the section on decimal operations. We show it again here for easy reference.
      - sort_order: 4
        block_type: callout
        content:
          type: key_concept
          title: How To
          body: |
            - Step 1.   Identify what you are asked to find and choose a variable to represent it.
            - Step 2.   Write a sentence that gives the information to find it.
            - Step 3.   Translate the sentence into an equation.
            - Step 4.   Solve the equation using good algebra techniques.
            - Step 5.   Check the answer in the problem and make sure it makes sense.
            - Step 6.   Write a complete sentence that answers the question.
      - sort_order: 5
        block_type: markdown
        content:
          text: |
            Remember that whatever the application, once we write the sentence with the given information (Step 2), we can translate it to a percent equation and then solve it.

            Do you pay a tax when you shop in your city or state? In many parts of the United States, **sales tax** is added to the purchase price of an item. See Figure 6.7. The sales tax is determined by computing a percent of the purchase price.

            To find the sales tax multiply the purchase price by the sales tax rate. Remember to convert the sales tax rate from a percent to a decimal number. Once the sales tax is calculated, it is added to the purchase price. The result is the total cost—this is what the customer pays.

            _(Figure in the original section: The sales tax is calculated as a percent of the purchase price.)_
      - sort_order: 6
        block_type: callout
        content:
          type: key_concept
          title: Sales Tax
          body: |
            The **sales tax** is a percent of the purchase price.

            $$\begin{array}{lll}\text{Sales Tax} & = & \text{Tax Rate}\cdot \text{Purchase Price} \\ \text{Total Cost} & = & \text{Purchase Price}+\text{Sales Tax}\end{array}$$
      - sort_order: 7
        block_type: markdown
        content:
          text: |
            **Example 6.25**

            Cathy bought a bicycle in Washington, where the sales tax rate was $\text{6.5\%}$ of the purchase price. What was

            - ⓐ the sales tax and
            - ⓑ the total cost of a bicycle if the purchase price of the bicycle was $\text{\textdollar 392}?$

            **Solution**

            | ⓐ |  |
            | --- | --- |
            | Identify what you are asked to find. | What is the sales tax? |
            | Choose a variable to represent it. | Let $t=$ sales tax. |
            | Write a sentence that gives the information to find it. | The sales tax is 6.5% of the purchase price. |
            | Translate into an equation. (Remember to change the percent to a decimal). |  |
            | Simplify. |  |
            | Check: Is this answer reasonable? |  |
            | Yes, because the sales tax amount is less than 10% of the purchase price. |  |
            | Write a complete sentence that answers the question. | The sales tax is $25.48. |

            | ⓑ |  |
            | --- | --- |
            | Identify what you are asked to find. | What is the total cost of the bicycle? |
            | Choose a variable to represent it. | Let $c=$ total cost of bicycle. |
            | Write a sentence that gives the information to find it. | The total cost is the purchase price plus the sales tax. |
            | Translate into an equation. |  |
            | Simplify. |  |
            | Check: Is this answer reasonable? |  |
            | Yes, because the total cost is a little more than the purchase price. |  |
            | Write a complete sentence that answers the question. | The total cost of the bicycle is $417.48. |
      - sort_order: 8
        block_type: practice_prompt
        content:
          prompt: 'Find ⓐ the sales tax and ⓑ the total cost: Alexandra bought a television set for $\text{\textdollar 724}$ in Boston, where the sales tax rate was $\text{6.25\%}$ of the purchase price.'
          answer: |
            - ⓐ $45.25
            - ⓑ $769.25
          explanation: Answer from the book's answer key.
      - sort_order: 9
        block_type: practice_prompt
        content:
          prompt: 'Find ⓐ the sales tax and ⓑ the total cost: Kim bought a winter coat for $\text{\textdollar 250}$ in St. Louis, where the sales tax rate was $\text{8.2\%}$ of the purchase price.'
          answer: |
            - ⓐ $20.50
            - ⓑ $270.50
          explanation: Answer from the book's answer key.
      - sort_order: 10
        block_type: markdown
        content:
          text: |
            **Example 6.26**

            Evelyn bought a new smartphone for $\text{\textdollar 499}$ plus tax. She was surprised when she got the receipt and saw that the tax was $\text{\textdollar 42.42}.$ What was the sales tax rate for this purchase?

            **Solution**

            | Identify what you are asked to find. | What is the sales tax rate? |
            | --- | --- |
            | Choose a variable to represent it. | Let $r=$ sales tax. |
            | Write a sentence that gives the information to find it. | What percent of the price is the sales tax? |
            | Translate into an equation. |  |
            | Divide. |  |
            | Simplify. |  |
            | Check. Is this answer reasonable? |  |
            | Yes, because 8.5% is close to 10%.     10% of $500 is $50, which is close to $42.42. |  |
            | Write a complete sentence that answers the question. | The sales tax rate is 8.5%. |
      - sort_order: 11
        block_type: practice_prompt
        content:
          prompt: Diego bought a new car for $\text{\textdollar 26,525}.$ He was surprised that the dealer then added $\text{\textdollar 2,387.25}.$ What was the sales tax rate for this purchase?
          answer: 9%
          explanation: Answer from the book's answer key.
      - sort_order: 12
        block_type: practice_prompt
        content:
          prompt: What is the sales tax rate if a $\text{\textdollar 7,594}$ purchase will have $\text{\textdollar 569.55}$ of sales tax added to it?
          answer: 7.5%
          explanation: Answer from the book's answer key.
      - sort_order: 13
        block_type: markdown
        content:
          text: |
            ### Solve Commission Applications

            Sales people often receive a **commission**, or percent of total sales, for their sales. Their income may be just the commission they earn, or it may be their commission added to their hourly wages or salary. The commission they earn is calculated as a certain percent of the price of each item they sell. That percent is called the **rate of commission**.
      - sort_order: 14
        block_type: callout
        content:
          type: key_concept
          title: Commission
          body: |
            A commission is a percentage of total sales as determined by the rate of commission.

            $$\text{commission}=\text{rate of commission}\cdot \text{total sales}$$
      - sort_order: 15
        block_type: markdown
        content:
          text: To find the commission on a sale, multiply the rate of commission by the total sales. Just as we did for computing sales tax, remember to first convert the rate of commission from a percent to a decimal.
      - sort_order: 16
        block_type: markdown
        content:
          text: |
            **Example 6.27**

            Helene is a realtor. She receives $\text{3\%}$ commission when she sells a house. How much commission will she receive for selling a house that costs $\text{\textdollar 260,000}?$

            **Solution**

            | Identify what you are asked to find. | What is the commission? |
            | --- | --- |
            | Choose a variable to represent it. | Let $c=$ the commission. |
            | Write a sentence that gives the information to find it. | The commission is 3% of the price. |
            | Translate into an equation. |  |
            | Simplify. |  |
            | Change to percent form. |  |
            | Check. Is this answer reasonable? |  |
            | Yes. 1% of $260,000 is $2,600, and $7,800 is three times $2,600. |  |
            | Write a complete sentence that answers the question. | Helene will receive a commission of $7,800. |
      - sort_order: 17
        block_type: practice_prompt
        content:
          prompt: Bob is a travel agent. He receives $\text{7\%}$ commission when he books a cruise for a customer. How much commission will he receive for booking a $\text{\textdollar 3,900}$ cruise?
          answer: $273
          explanation: Answer from the book's answer key.
      - sort_order: 18
        block_type: practice_prompt
        content:
          prompt: Fernando receives $\text{18\%}$ commission when he makes a computer sale. How much commission will he receive for selling a computer for $\text{\textdollar 2,190}?$
          answer: $394.20
          explanation: Answer from the book's answer key.
      - sort_order: 19
        block_type: markdown
        content:
          text: |
            **Example 6.28**

            Rikki earned $\text{\textdollar 87}$ commission when she sold a $\text{\textdollar 1,450}$ stove. What rate of commission did she get?

            **Solution**

            | Identify what you are asked to find. | What is the rate of commission? |
            | --- | --- |
            | Choose a variable to represent it. | Let $r=$ the rate of commission. |
            | Write a sentence that gives the information to find it. | The commission is what percent of the sale? |
            | Translate into an equation. |  |
            | Divide. |  |
            | Simplify. |  |
            | Change to percent form. |  |
            | Check if this answer is reasonable. |  |
            | Yes. A 10% commission would have been $145.     The 6% commission, $87, is a little more than half of that. |  |
            | Write a complete sentence that answers the question. | The commission was 6% of the price of the stove. |
      - sort_order: 20
        block_type: practice_prompt
        content:
          prompt: Homer received $\text{\textdollar 1,140}$ commission when he sold a car for $\text{\textdollar 28,500}.$ What rate of commission did he get?
          answer: 4%
          explanation: Answer from the book's answer key.
      - sort_order: 21
        block_type: practice_prompt
        content:
          prompt: Bernice earned $\text{\textdollar 451}$ commission when she sold an $\text{\textdollar 8,200}$ living room set. What rate of commission did she get?
          answer: 5.5%
          explanation: Answer from the book's answer key.
      - sort_order: 22
        block_type: markdown
        content:
          text: |
            ### Solve Discount Applications

            Applications of discount are very common in retail settings Figure 6.8. When you buy an item on sale, the **original price** of the item has been reduced by some dollar amount. The **discount rate**, usually given as a percent, is used to determine the amount of the discount. To determine the **amount of discount**, we multiply the discount rate by the original price. We summarize the discount model in the box below.

            _(Figure in the original section: Applications of discounts are common in everyday life. (credit: Charleston's TheDigitel, Flickr).)_
      - sort_order: 23
        block_type: callout
        content:
          type: key_concept
          title: Discount
          body: |
            An amount of **discount** is a percent off the original price.

            $$\begin{array}{lll}\text{amount of discount} & = & \text{discount rate}\cdot \text{original price} \\ \text{sale price} & = & \text{original price}-\text{discount}\end{array}$$
      - sort_order: 24
        block_type: markdown
        content:
          text: The sale price should always be less than the original price. In some cases, the amount of discount is a fixed dollar amount. Then we just find the sale price by subtracting the amount of discount from the original price.
      - sort_order: 25
        block_type: markdown
        content:
          text: |
            **Example 6.29**

            Jason bought a pair of sunglasses that were on sale for $\text{\textdollar 10}$ off. The original price of the sunglasses was $\text{\textdollar 39}.$ What was the sale price of the sunglasses?

            **Solution**

            | Identify what you are asked to find. | What is the sale price? |
            | --- | --- |
            | Choose a variable to represent it. | Let $s=$ the sale price. |
            | Write a sentence that gives the information to find it. | The sale price is the original price minus the discount. |
            | Translate into an equation. |  |
            | Simplify. |  |
            | Check if this answer is reasonable. |  |
            | Yes. The sale price, $29, is less than the original price, $39. |  |
            | Write a complete sentence that answers the question. | The sale price of the sunglasses was $29. |
      - sort_order: 26
        block_type: practice_prompt
        content:
          prompt: Marta bought a dishwasher that was on sale for $\text{\textdollar 75}$ off. The original price of the dishwasher was $\text{\textdollar 525}.$ What was the sale price of the dishwasher?
          answer: $450
          explanation: Answer from the book's answer key.
      - sort_order: 27
        block_type: practice_prompt
        content:
          prompt: Orlando bought a pair of shoes that was on sale for $\text{\textdollar 30}$ off. The original price of the shoes was $\text{\textdollar 112}.$ What was the sale price of the shoes?
          answer: $82
          explanation: Answer from the book's answer key.
      - sort_order: 28
        block_type: markdown
        content:
          text: In Example 6.29, the amount of discount was a set amount, $\text{\textdollar 10}.$ In Example 6.30 the discount is given as a percent of the original price.
      - sort_order: 29
        block_type: markdown
        content:
          text: "**Example 6.30**\n\nElise bought a dress that was discounted $\\text{35\\%}$ off of the original price of $\\text{\\textdollar 140}.$ What was ⓐ the amount of discount and ⓑ the sale price of the dress?\n\n**Solution**\n\nⓐ Before beginning, you may find it helpful to organize the information in a list.  \n Original price = $140  \n Discount rate = 35%  \n Amount of discount = ?\n\n| Identify what you are asked to find. | What is the amount of discount? |\n| --- | --- |\n| Choose a variable to represent it. | Let $d=$ the amount of discount. |\n| Write a sentence that gives the information to find it. | The discount is 35% of the original price. |\n| Translate into an equation. |  |\n| Simplify. |  |\n| Check if this answer is reasonable. |  |\n| Yes. A $49 discount is reasonable for a $140 dress. |  |\n| Write a complete sentence that answers the question. | The amount of discount was $49. |\n\nⓑ  \n Original price = $140  \n Amount of discount = $49  \n Sale price = ?\n\
            \n| Identify what you are asked to find. | What is the sale price of the dress? |\n| --- | --- |\n| Choose a variable to represent it. | Let $s=$ the sale price. |\n| Write a sentence that gives the information to find it. | The sale price is the original price minus the discount. |\n| Translate into an equation. |  |\n| Simplify. |  |\n| Check if this answer is reasonable. |  |\n| Yes. The sale price, $91, is less than the original price, $140. |  |\n| Write a complete sentence that answers the question. | The sale price of the dress was $91. |\n"
      - sort_order: 30
        block_type: practice_prompt
        content:
          prompt: 'Find ⓐ the amount of discount and ⓑ the sale price: Sergio bought a belt that was discounted $\text{40\%}$ from an original price of $\text{\textdollar 29}.$'
          answer: |
            - ⓐ $11.60
            - ⓑ $17.40
          explanation: Answer from the book's answer key.
      - sort_order: 31
        block_type: practice_prompt
        content:
          prompt: 'Find ⓐ the amount of discount and ⓑ the sale price: Oscar bought a barbecue grill that was discounted $\text{65\%}$ from an original price of $\text{\textdollar 395}.$'
          answer: |
            - ⓐ $256.75
            - ⓑ $138.25
          explanation: Answer from the book's answer key.
      - sort_order: 32
        block_type: markdown
        content:
          text: There may be times when you buy something on sale and want to know the discount rate. The next example will show this case.
      - sort_order: 33
        block_type: markdown
        content:
          text: "**Example 6.31**\n\nJeannette bought a swimsuit at a sale price of $\\text{\\textdollar 13.95}.$ The original price of the swimsuit was $\\text{\\textdollar 31}.$ Find the ⓐ amount of discount and ⓑ discount rate.\n\n**Solution**\n\nⓐ Before beginning, you may find it helpful to organize the information in a list.  \n Original price = $31  \n Amount of discount = ?  \n Sale price = $13.95\n\n| Identify what you are asked to find. | What is the amount of discount? |\n| --- | --- |\n| Choose a variable to represent it. | Let $d=$ the amount of discount. |\n| Write a sentence that gives the information to find it. | The discount is the original price minus the sale price. |\n| Translate into an equation. |  |\n| Simplify. |  |\n| Check if this answer is reasonable. |  |\n| Yes. The $17.05 discount is less than the original price. |  |\n| Write a complete sentence that answers the question. | The amount of discount was $17.05. |\n\nⓑ Before beginning, you may find it helpful\
            \ to organize the information in a list.  \n Original price = $31  \n Amount of discount = $17.05  \n Discount rate = ?\n\n| Identify what you are asked to find. | What is the discount rate? |\n| --- | --- |\n| Choose a variable to represent it. | Let $r=$ the discount rate. |\n| Write a sentence that gives the information to find it. | The discount is what percent of the original price? |\n| Translate into an equation. |  |\n| Divide. |  |\n| Simplify. |  |\n| Check if this answer is reasonable. |  |\n| The rate of discount was a little more than 50% and the amount of discount is a little more than half of $31. |  |\n| Write a complete sentence that answers the question. | The rate of discount was 55%. |\n"
      - sort_order: 34
        block_type: practice_prompt
        content:
          prompt: 'Find ⓐ the amount of discount and ⓑ the discount rate: Lena bought a kitchen table at the sale price of $\text{\textdollar 375.20}.$ The original price of the table was $\text{\textdollar 560}.$'
          answer: |
            - ⓐ $184.80
            - ⓑ 33%
          explanation: Answer from the book's answer key.
      - sort_order: 35
        block_type: practice_prompt
        content:
          prompt: 'Find ⓐ the amount of discount and ⓑ the discount rate: Nick bought a multi-room air conditioner at a sale price of $\text{\textdollar 340}.$ The original price of the air conditioner was $\text{\textdollar 400}.$'
          answer: |
            - ⓐ $60
            - ⓑ 15%
          explanation: Answer from the book's answer key.
      - sort_order: 36
        block_type: markdown
        content:
          text: |
            ### Solve Mark-up Applications

            Applications of mark-up are very common in retail settings. The price a retailer pays for an item is called the **wholesale price**. The retailer then adds a **mark-up** to the wholesale price to get the **list price**, the price he sells the item for. The mark-up is usually calculated as a percent of the wholesale price. The percent is called the **mark-up rate**. To determine the amount of mark-up, multiply the mark-up rate by the wholesale price. We summarize the mark-up model in the box below.
      - sort_order: 37
        block_type: callout
        content:
          type: key_concept
          title: Mark-up
          body: |
            The mark-up is the amount added to the wholesale price.

            $$\begin{array}{lll}\text{amount of mark-up} & = & \text{mark-up rate}\cdot \text{wholesale price} \\ \text{list price} & = & \text{wholesale price}+\text{mark up}\end{array}$$
      - sort_order: 38
        block_type: markdown
        content:
          text: The list price should always be more than the wholesale price.
      - sort_order: 39
        block_type: markdown
        content:
          text: |
            **Example 6.32**

            Adam's art gallery bought a photograph at the wholesale price of $\text{\textdollar 250}.$ Adam marked the price up $\text{40\%}.$ Find the ⓐ amount of mark-up and ⓑ the list price of the photograph.

            **Solution**

            | ⓐ |  |
            | --- | --- |
            | Identify what you are asked to find. | What is the amount of mark-up? |
            | Choose a variable to represent it. | Let $m=$ the amount of each mark-up. |
            | Write a sentence that gives the information to find it. | The mark-up is 40% of the wholesale price. |
            | Translate into an equation. |  |
            | Simplify. |  |
            | Check if this answer is reasonable. |  |
            | Yes. The markup rate is less than 50% and $100 is less than half of $250. |  |
            | Write a complete sentence that answers the question. | The mark-up on the photograph was $100. |

            | ⓑ |  |
            | --- | --- |
            | Identify what you are asked to find. | What is the list price? |
            | Choose a variable to represent it. | Let $p=$ the list price. |
            | Write a sentence that gives the information to find it. | The list price is the wholesale price plus the mark-up. |
            | Translate into an equation. |  |
            | Simplify. |  |
            | Check if this answer is reasonable. |  |
            | Yes. The list price, $350, is more than the wholesale price, $250. |  |
            | Write a complete sentence that answers the question. | The list price of the photograph was $350. |
      - sort_order: 40
        block_type: practice_prompt
        content:
