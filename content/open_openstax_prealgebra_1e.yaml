            | $\text{\textdollar}577.08$ | $\text{\textdollar 4580}$ |  | $\text{2}$ |

            | Interest | Principal | Rate | Time (years) |
            | --- | --- | --- | --- |
            | $\text{\textdollar}528.12$ | $\text{\textdollar 3260}$ |  | $\text{3}$ |

            In the following exercises, solve the problem using the simple interest formula.

            Find the simple interest earned after $5$ years on $\text{\textdollar 600}$ at an interest rate of $\text{3\%.}$

            Find the simple interest earned after $4$ years on $\text{\textdollar 900}$ at an interest rate of $\text{6\%.}$

            Find the simple interest earned after $2$ years on $\text{\textdollar 8,950}$ at an interest rate of $\text{3.24\%}.$

            Find the simple interest earned after $3$ years on $\text{\textdollar 6,510}$ at an interest rate of $\text{2.85\%}.$

            Find the simple interest earned after $8$ years on $\text{\textdollar 15,500}$ at an interest rate of $\text{11.425\%}.$

            Find the simple interest earned after $6$ years on $\text{\textdollar 23,900}$ at an interest rate of $\text{12.175\%}.$

            Find the principal invested if $\text{\textdollar 656}$ interest was earned in $5$ years at an interest rate of $\text{4\%}.$

            Find the principal invested if $\text{\textdollar 177}$ interest was earned in $2$ years at an interest rate of $\text{3\%}.$

            Find the principal invested if $\text{\textdollar 70.95}$ interest was earned in $3$ years at an interest rate of $\text{2.75\%.}$

