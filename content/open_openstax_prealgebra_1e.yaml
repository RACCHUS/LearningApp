          text: |
            **Translate and Solve Basic Percent Equations**

            In the following exercises, translate and solve.

            What number is $\text{45\%}$ of $120?$

            What number is $\text{65\%}$ of $100?$

            What number is $\text{24\%}$ of $112?$

            What number is $\text{36\%}$ of $124?$

            $\text{250\%}$ of $65$ is what number?

            $\text{150\%}$ of $90$ is what number?

            $\text{800\%}$ of $2,250$ is what number?

            $\text{600\%}$ of $1,740$ is what number?

            $28$ is $\text{25\%}$ of what number?

            $36$ is $\text{25\%}$ of what number?

            $81$ is $\text{75\%}$ of what number?

            $93$ is $\text{75\%}$ of what number?

            $\text{8.2\%}$ of what number is $\text{\textdollar 2.87}?$

            $\text{6.4\%}$ of what number is $\text{\textdollar 2.88}?$

            $\text{11.5\%}$ of what number is $\text{\textdollar 108.10}?$

            $\text{12.3\%}$ of what number is $\text{\textdollar 92.25}?$

            What percent of $260$ is $78?$

            What percent of $215$ is $86?$

            What percent of $1,500$ is $540?$

            What percent of $1,800$ is $846?$

            $30$ is what percent of $20?$

            $50$ is what percent of $40?$

            $840$ is what percent of $480?$

            $790$ is what percent of $395?$

            **Solve Applications of Percents**

            In the following exercises, solve the applications of percents.

            Geneva treated her parents to dinner at their favorite restaurant. The bill was $\text{\textdollar 74.25}.$ She wants to leave $\text{16\%}$ of the total bill as a tip. How much should the tip be?

            When Hiro and his co-workers had lunch at a restaurant the bill was $\text{\textdollar 90.50}.$ They want to leave $\text{18\%}$ of the total bill as a tip. How much should the tip be?

            Trong has $\text{12\%}$ of each paycheck automatically deposited to his savings account. His last paycheck was $\text{\textdollar 2,165}.$ How much money was deposited to Trong's savings account?

            Cherise deposits $\text{8\%}$ of each paycheck into her retirement account. Her last paycheck was $\text{\textdollar 1,485}.$ How much did Cherise deposit into her retirement account?

            One serving of oatmeal has $8$ grams of fiber, which is $\text{33\%}$ of the recommended daily amount. What is the total recommended daily amount of fiber?

            One serving of trail mix has $67$ grams of carbohydrates, which is $\text{22\%}$ of the recommended daily amount. What is the total recommended daily amount of carbohydrates?

            A bacon cheeseburger at a popular fast food restaurant contains $2,070$ milligrams (mg) of sodium, which is $\text{86\%}$ of the recommended daily amount. What is the total recommended daily amount of sodium?

            A grilled chicken salad at a popular fast food restaurant contains $650$ milligrams (mg) of sodium, which is $\text{27\%}$ of the recommended daily amount. What is the total recommended daily amount of sodium?

            The nutrition fact sheet at a fast food restaurant says the fish sandwich has $380$ calories, and $171$ calories are from fat. What percent of the total calories is from fat?

            The nutrition fact sheet at a fast food restaurant says a small portion of chicken nuggets has $190$ calories, and $114$ calories are from fat. What percent of the total calories is from fat?

            Emma gets paid $\text{\textdollar 3,000}$ per month. She pays $\text{\textdollar 750}$ a month for rent. What percent of her monthly pay goes to rent?

            Dimple gets paid $\text{\textdollar 3,200}$ per month. She pays $\text{\textdollar 960}$ a month for rent. What percent of her monthly pay goes to rent?

            **Find Percent Increase and Percent Decrease**

            In the following exercises, find the percent increase or percent decrease.

            Tamanika got a raise in her hourly pay, from $\text{\textdollar 15.50}$ to $\text{\textdollar 17.55}.$ Find the percent increase.

            Ayodele got a raise in her hourly pay, from $\text{\textdollar 24.50}$ to $\text{\textdollar 25.48}.$ Find the percent increase.

            Annual student fees at the University of California rose from about $\text{\textdollar 4,000}$ in $2000$ to about $\text{\textdollar 9,000}$ in $2014.$ Find the percent increase.

            The price of a share of one stock rose from $\text{\textdollar 12.50}$ to $\text{\textdollar 50}.$ Find the percent increase.

            According to Time magazine $(\text{7/19/2011})$ annual global seafood consumption rose from $22$ pounds per person in $1960$ to $38$ pounds per person today. Find the percent increase. (Round to the nearest tenth of a percent.)

            In one month, the median home price in the Northeast rose from $\text{\textdollar 225,400}$ to $\text{\textdollar 241,500}.$ Find the percent increase. (Round to the nearest tenth of a percent.)

            A grocery store reduced the price of a loaf of bread from $\text{\textdollar 2.80}$ to $\text{\textdollar 2.73}.$ Find the percent decrease.

            The price of a share of one stock fell from $\text{\textdollar 8.75}$ to $\text{\textdollar 8.54}.$ Find the percent decrease.

            Hernando's salary was $\text{\textdollar 49,500}$ last year. This year his salary was cut to $\text{\textdollar 44,055}.$ Find the percent decrease.

            From $2000$ to $2010,$ the population of Detroit fell from about $951,000$ to about $714,000.$ Find the percent decrease. (Round to the nearest tenth of a percent.)

            In one month, the median home price in the West fell from $\text{\textdollar 203,400}$ to $\text{\textdollar 192,300}.$ Find the percent decrease. (Round to the nearest tenth of a percent.)

            Sales of video games and consoles fell from $\text{\textdollar 1,150}$ million to $\text{\textdollar 1,030}$ million in one year. Find the percent decrease. (Round to the nearest tenth of a percent.)

            **Tipping** At the campus coffee cart, a medium coffee costs $\text{\textdollar 1.65}.$ MaryAnne brings $\text{\textdollar 2.00}$ with her when she buys a cup of coffee and leaves the change as a tip. What percent tip does she leave?

            **Late Fees** Alison was late paying her credit card bill of $\text{\textdollar 249}.$ She was charged a $\text{5\%}$ late fee. What was the amount of the late fee?

            Without solving the problem $“44$ is $\text{80\%}$ of what number”, think about what the solution might be. Should it be a number that is greater than $44$ or less than $44?$ Explain your reasoning.

            Without solving the problem “What is $\text{20\%}$ of $300?”$ think about what the solution might be. Should it be a number that is greater than $300$ or less than $300?$ Explain your reasoning.

            After returning from vacation, Alex said he should have packed $\text{50\%}$ fewer shorts and $\text{200\%}$ more shirts. Explain what Alex meant.

            Because of road construction in one city, commuters were advised to plan their Monday morning commute to take $\text{150\%}$ of their usual commuting time. Explain what this means.

            ⓐ After completing the exercises, use this checklist to evaluate your mastery of the objectives of this section.

