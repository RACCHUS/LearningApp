      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Be Prepared 6.2
          body: "Before you get started, take this readiness quiz.\n\n- Translate and solve: $\\frac{3}{4}$ of $x$ is $24.$  \n If you missed this problem, review Example 4.105.\n- Simplify: $(4.5)(2.38).$  \n If you missed this problem, review Example 5.15.\n- Solve: $3.5=0.7n.$  \n If you missed this problem, review Example 5.43.\n"
      - sort_order: 3
        block_type: markdown
        content:
          text: |
            ### Translate and Solve Basic Percent Equations

            We will solve percent equations by using the methods we used to solve equations with fractions or decimals. In the past, you may have solved percent problems by setting them up as proportions. That was the best method available when you did not have the tools of algebra. Now as a prealgebra student, you can translate word sentences into algebraic equations, and then solve the equations.

            We'll look at a common application of percent—tips to a server at a restaurant—to see how to set up a basic percent application.

            When Aolani and her friends ate dinner at a restaurant, the bill came to $\text{\textdollar 80}.$ They wanted to leave a $\text{20\%}$ tip. What amount would the tip be?

            To solve this, we want to find what *amount* is $\text{20\%}$ of $\text{\textdollar 80}.$ The $\text{\textdollar 80}$ is called the *base*. The amount of the tip would be $0.20(80),$ or $\text{\textdollar 16}$ See Figure 6.6. To find the amount of the tip, we multiplied the percent by the base.

            _(Figure in the original section: A $\text{20\%}$ tip for an $\text{\textdollar 80}$ restaurant bill comes out to $\text{\textdollar 16}$.)_

            In the next examples, we will find the amount. We must be sure to change the given percent to a decimal when we translate the words into an equation.
      - sort_order: 4
        block_type: markdown
        content:
          text: |
            **Example 6.14**

            What number is $\text{35\%}$ of $90?$

            **Solution**

            | Translate into algebra. Let $n=\;$the number. |  |
            | --- | --- |
            | Multiply. |  |
            |  | $31.5$ is $35\%$ of $90$ |
      - sort_order: 5
        block_type: practice_prompt
        content:
          prompt: What number is $\text{45\%}$ of $80?$
          answer: '36'
          explanation: Answer from the book's answer key.
      - sort_order: 6
        block_type: practice_prompt
        content:
          prompt: What number is $\text{55\%}$ of $60?$
          answer: '33'
          explanation: Answer from the book's answer key.
      - sort_order: 7
        block_type: markdown
        content:
          text: |
            **Example 6.15**

            $\text{125\%}$ of $28$ is what number?

            **Solution**

            | Translate into algebra. Let $a\;=\;$the number. |  |
            | --- | --- |
            | Multiply. |  |
            |  | $125\%$ of $28$ is $35$. |

            Remember that a percent over $100$ is a number greater than $1.$ We found that $\text{125\%}$ of $28$ is $35,$ which is greater than $28.$
      - sort_order: 8
        block_type: practice_prompt
        content:
          prompt: $\text{150\%}$ of $78$ is what number?
          answer: '117'
          explanation: Answer from the book's answer key.
      - sort_order: 9
        block_type: practice_prompt
        content:
          prompt: $\text{175\%}$ of $72$ is what number?
          answer: '126'
          explanation: Answer from the book's answer key.
      - sort_order: 10
        block_type: markdown
        content:
          text: In the next examples, we are asked to find the base.
      - sort_order: 11
        block_type: markdown
        content:
          text: |
            **Example 6.16**

            Translate and solve: $36$ is $\text{75\%}$ of what number?

            **Solution**

            | Translate. Let $b=$ the number. |  |
            | --- | --- |
            | Divide both sides by 0.75. |  |
            | Simplify. |  |
      - sort_order: 12
        block_type: practice_prompt
        content:
          prompt: $17$ is $\text{25\%}$ of what number?
          answer: '68'
          explanation: Answer from the book's answer key.
      - sort_order: 13
        block_type: practice_prompt
        content:
          prompt: $40$ is $\text{62.5\%}$ of what number?
          answer: '64'
          explanation: Answer from the book's answer key.
      - sort_order: 14
        block_type: markdown
        content:
          text: |
            **Example 6.17**

            $\text{6.5\%}$ of what number is $\text{\textdollar 1.17}?$

            **Solution**

            | Translate. Let $b=$ the number. |  |
            | --- | --- |
            | Divide both sides by 0.065. |  |
