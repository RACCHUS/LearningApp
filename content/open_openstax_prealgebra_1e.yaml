    source_release_id: openstax-prealgebra-1e
    concepts:
    - slug: open-openstax-prealgebra-1e-6-3
      name: Solve Sales Tax, Commission, and Discount Applications
      short_definition: Solve sales tax applications; Solve commission applications; Solve discount applications; Solve mark-up applications.
      citation: Prealgebra (OpenStax), Section 6.3, https://openstax.org/books/prealgebra/pages/6-3-solve-sales-tax-commission-and-discount-applications, CC BY 4.0
      source_release_id: openstax-prealgebra-1e
    lessons:
    - title: 6.3 Solve Sales Tax, Commission, and Discount Applications
      description: Solve sales tax applications; Solve commission applications; Solve discount applications; Solve mark-up applications.
      emoji: 📘
      tags:
      - open-textbook
      - openstax
      - cc-by-4.0
      - prealgebra
