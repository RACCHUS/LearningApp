- id: xl-pr-1-1-b
  objective: SPREADSHEET-1.1
  citation: Microsoft Support - SUM function (reference only; original item)
  interaction_type: single_choice
  prompt: In the Budget worksheet, C2 through C9 hold the eight amounts. Which formula gives the same total as =SUM(C2:C9)?
  response_spec:
    options:
    - =C2+C9
    - =SUM(C2:C5)+SUM(C6:C9)
    - =SUM(C2,C9)
    - =SUM(C3:C9)
  scoring_spec:
    correct_index: 1
  explanation: C2:C5 and C6:C9 together cover every cell from C2 to C9 exactly once, so their sums add up to the same total. =C2+C9 and =SUM(C2,C9) add only two cells, and C3:C9 leaves out C2.
  difficulty: intermediate
  cognitive_level: analysis
  verify:
    spreadsheet:
      cells: *id001
      value_of: =SUM(C2:C9)
      formulas:
      - =C2+C9
      - =SUM(C2:C5)+SUM(C6:C9)
      - =SUM(C2,C9)
      - =SUM(C3:C9)
  review:
