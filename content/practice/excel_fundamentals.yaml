- id: xl-pr-1-1-a
  objective: SPREADSHEET-1.1
  citation: Microsoft Support - SUM function (reference only; original item)
  interaction_type: single_choice
  prompt: In the Budget worksheet, C2 through C9 hold 20, 30, 40, 50, 60, 70, 80 and 90. What value does =SUM(C2:C5) show?
  response_spec:
    options:
    - '90'
    - '200'
    - '140'
    - '440'
  scoring_spec:
    correct_index: 2
  explanation: 'C2:C5 covers C2, C3, C4 and C5: 20 + 30 + 40 + 50 = 140. 90 adds only the two end cells, and 440 is the whole column.'
  difficulty: beginner
  cognitive_level: application
  verify:
    spreadsheet:
      cells: &id001
        C2: 20
        C3: 30
        C4: 40
        C5: 50
        C6: 60
        C7: 70
        C8: 80
        C9: 90
      value_of: =SUM(C2:C5)
      formulas:
      - =90
      - =200
      - =140
      - =440
