  interaction_type: single_choice
  prompt: Write $\sqrt{48}$ in simplest radical form.
  response_spec:
    options:
    - $2\sqrt{12}$
    - $4\sqrt{3}$
    - $3\sqrt{4}$
    - $16\sqrt{3}$
  scoring_spec:
    correct_index: 1
  explanation: $48 = 16 \cdot 3$ and $16$ is the largest perfect-square factor, so $\sqrt{48} = \sqrt{16}\sqrt{3} = 4\sqrt{3}$. $2\sqrt{12}$ has the same value but isn't simplest form, because $12$ still has the square factor $4$.
  difficulty: intermediate
  cognitive_level: application
