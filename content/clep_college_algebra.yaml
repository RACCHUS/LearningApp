  - code: '3.2'
    title: Perform algebraic operations on functions and evaluate and compose composite
      functions
    description: Compute sum, difference, product, and quotient of functions, evaluate
      composite functions (f o g)(x), and determine the domain of composite functions.
    sort_order: 2
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 3.4: Composition of Functions'
    concepts:
    - slug: alg-function-arithmetic
      name: Function Arithmetic Operations
      short_definition: Rules defining (f + g)(x), (f - g)(x), (fg)(x), and (f/g)(x).
      description: Functions can be combined algebraically; the domain of the combined
        function is the intersection of their individual domains, with g(x) != 0 for
        quotients.
      citation: OpenStax College Algebra 1e, Section 3.4
    - slug: alg-function-composition
      name: Composition of Functions
      short_definition: The operation (f o g)(x) = f(g(x)) applying function f to
        the output of function g.
      description: The inner function g is evaluated first, and its output becomes
        the input for the outer function f.
      citation: OpenStax College Algebra 1e, Section 3.4
      prerequisites:
      - alg-function-arithmetic
    - slug: alg-composition-domain
      name: Domain of Composite Functions
      short_definition: The set of all x in the domain of g such that g(x) is in the
        domain of f.
      description: 'Requires two conditions: x must be in Domain(g), and the resulting
        value g(x) must be in Domain(f).'
      citation: OpenStax College Algebra 1e, Section 3.4
      prerequisites:
      - alg-function-composition
    lessons:
    - title: Operations and Composition of Functions
      description: Algebraic combination of functions (sum, difference, product, quotient)
        and evaluation and domain of composite functions.
      emoji: 🔗
      tags:
      - composition
      - composite-functions
      - operations
      concept_slugs:
      - alg-function-arithmetic
      - alg-function-composition
      - alg-composition-domain
      citation: OpenStax College Algebra 1e, Section 3.4
      terms:
      - term: Composite Function
        definition: A function (f o g)(x) defined by f(g(x)), where the output of
          function g serves as the input to function f.
      - term: Inner Function
        definition: In f(g(x)), the function g that operates directly on input x first.
      - term: Outer Function
        definition: In f(g(x)), the function f that operates on the output of g(x).
      - term: Domain of Composition
        definition: The set of all x such that x is in the domain of g AND g(x) is
          in the domain of f.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Function Operations and Composite Functions

            Given two functions $f$ and $g$, we can create new functions through standard algebraic operations:

            - **Sum**: $(f + g)(x) = f(x) + g(x)$
            - **Difference**: $(f - g)(x) = f(x) - g(x)$
            - **Product**: $(f \cdot g)(x) = f(x) \cdot g(x)$
            - **Quotient**: $\left(\frac{f}{g}\right)(x) = \frac{f(x)}{g(x)}$ ($g(x) \neq 0$)

            ### Composition of Functions

            The **composition** of function $f$ with function $g$, denoted $(f \circ g)(x)$, is defined as:

            $$(f \circ g)(x) = f(g(x))$$

            In this process, $x$ is first input into $g$ to yield $g(x)$, which is then input into $f$. Crucially, function composition is **not commutative**: in general, $(f \circ g)(x) \neq (g \circ f)(x)$.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Two-Step Domain Rule for $(f \circ g)(x)$
          body: |-
            To find the domain of $(f \circ g)(x)$:
            1. Find the domain of the **inner function** $g(x)$.
            2. Find where the output $g(x)$ is permitted in the domain of the **outer function** $f(u)$.
            3. Take the intersection of both conditions.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Step-by-Step Evaluation of $(f \circ g)(c)$

            | Step | Action | Example: $f(u) = 2u + 1$, $g(x) = x^2 - 3$, evaluate $(f \circ g)(4)$ |
            | :--- | :--- | :--- |
            | **1. Evaluate Inner** | Calculate $g(c)$ | $g(4) = 4^2 - 3 = 16 - 3 = 13$ |
            | **2. Substitute to Outer** | Calculate $f(g(c))$ | $f(13) = 2(13) + 1 = 26 + 1 = 27$ |
            | **3. Reverse Composition** | Calculate $(g \circ f)(4)$ | $f(4) = 2(4)+1 = 9 \implies g(9) = 9^2 - 3 = 78$ |
            | **Conclusion** | Verify Non-commutativity | $(f \circ g)(4) = 27 \neq 78 = (g \circ f)(4)$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Multi-Stage Commercial Discounts and Taxes

            A computer retailer offers a promotional $\$50$ instant coupon on a new laptop. In addition, an educational storewide discount reduces the price by $10\%$. Let $x$ be the original laptop price. We define the two pricing functions:

            $$C(x) = x - 50\quad\text{and}\quad D(x) = 0.90x$$

            If the store applies the $10\%$ discount *first* and then applies the $\$50$ coupon, the customer pays $(C \circ D)(x) = C(D(x)) = 0.90x - 50$. If the coupon is applied *first* and then the discount, the customer pays $(D \circ C)(x) = D(C(x)) = 0.90(x - 50) = 0.90x - 45$. Comparing the compositions shows that applying the coupon first costs the buyer $\$5$ more because the $10\%$ discount is applied to a smaller base.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Function Composition Pitfalls
          body: |-
            1. **Multiplying instead of composing**: $(f \circ g)(x) \neq f(x) \cdot g(x)$. Composition feeds one function inside the other; multiplication multiplies their outputs.
            2. **Ignoring inner function domain**: If $f(x) = x^2$ and $g(x) = \sqrt{x}$, the composition $f(g(x)) = (\sqrt{x})^2 = x$. Although $x$ alone has domain $(-\infty, \infty)$, the domain of $f \circ g$ remains $[0, \infty)$ because the inner function requires $x \geq 0$.
      assessment_items:
      - id: alg-sim-composition-evaluate-at-point
        prompt: If $f(x) = 2x^2 - 1$ and $g(x) = 3x - 4$, what is the value of $(f
          \circ g)(2)$?
        interaction_type: single_choice
        response_spec:
          options:
          - '13'
          - '17'
          - '3'
          - '7'
        scoring_spec:
          correct_index: 3
        explanation: 'Evaluate the inner function first at x = 2: g(2) = 3(2) - 4
          = 6 - 4 = 2. Now substitute this output into the outer function f: f(g(2))
          = f(2) = 2(2)^2 - 1 = 2(4) - 1 = 8 - 1 = 7.'
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 3.4
        concept_slugs:
        - alg-function-composition
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-composition-formula-g-of-f
        prompt: Given $f(x) = x^2 + 1$ and $g(x) = \frac{1}{x - 2}$, what is the algebraic
          formula for $(g \circ f)(x)$?
        interaction_type: single_choice
        response_spec:
          options:
          - \frac{1}{x^2 - 1}
          - \frac{1}{x^2 + 1} - 2
          - \frac{x^2 + 1}{x - 2}
          - \frac{1}{(x - 2)^2 + 1}
        scoring_spec:
          correct_index: 0
        explanation: 'By definition, (g o f)(x) = g(f(x)). Substitute f(x) into g:
          g(x^2 + 1) = 1 / [(x^2 + 1) - 2] = 1 / (x^2 - 1).'
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.4
        concept_slugs:
        - alg-function-composition
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-composition-domain-sqrt-linear
        prompt: What is the domain of $(f \circ g)(x)$ where $f(x) = \sqrt{x}$ and
          $g(x) = 2x - 6$?
        interaction_type: single_choice
        response_spec:
          options:
          - '[0, \infty)'
          - '[3, \infty)'
          - (-\infty, 3]
          - (3, \infty)
        scoring_spec:
          correct_index: 1
        explanation: 'For (f o g)(x) = f(g(x)) = sqrt(2x - 6), two conditions must
          hold: (1) x is in the domain of g(x) = 2x - 6, which is all real numbers;
          (2) g(x) must be in the domain of f(u) = sqrt(u), which requires u >= 0
          => 2x - 6 >= 0 => 2x >= 6 => x >= 3. In interval notation, this is [3, infinity).'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 3.4
        concept_slugs:
        - alg-composition-domain
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      questions:
      - id: alg-fmt-evaluate-composition
        question_text: If $f(x) = x + 3$ and $g(x) = x^2$, what is the value of the
          composite function $(f \circ g)(2)$?
        options:
        - '25'
        - '10'
        - '7'
        - '13'
        correct_answer: 2
        explanation: 'Evaluate the inner function first: g(2) = 2^2 = 4. Now evaluate
          the outer function: f(g(2)) = f(4) = 4 + 3 = 7.'
        concept_slugs:
        - alg-function-composition
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-composition-not-commutative
        question_text: Is function composition $(f \circ g)(x)$ commutative in general?
        options:
        - Yes, composition is commutative for all pairs of functions
        - Yes, but only when both functions have identical domain restrictions
        - No, but only when functions contain rational exponents
        - No, (f o g)(x) does not generally equal (g o f)(x)
        correct_answer: 3
        explanation: Function composition is not commutative; the order of application
          matters. In general, f(g(x)) != g(f(x)).
        concept_slugs:
        - alg-function-composition
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What does (f o g)(x) represent?
      back: 'f(g(x)): the function f evaluated at the output of function g.'
      concept_slugs:
      - alg-function-composition
    - front: 'Is function composition commutative: does (f o g)(x) always equal (g
        o f)(x)?'
      back: No, in general (f o g)(x) != (g o f)(x).
      concept_slugs:
      - alg-function-composition
    - front: How do you find the domain of (f o g)(x)?
      back: Find values of x in the domain of g such that g(x) lies within the domain
        of f.
      concept_slugs:
      - alg-composition-domain
  - code: '3.3'
    title: Analyze function graphs, determine intercepts, test symmetry, and identify
      extrema
    description: Find x- and y-intercepts algebraically, determine even/odd function
      symmetry, and identify local extrema and intervals of increase and decrease.
    sort_order: 3
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 3.3: Rates of Change and Behavior
      of Graphs'
    concepts:
    - slug: alg-function-intercepts
      name: Intercepts of Functions
      short_definition: Algebraic determination of y-intercept f(0) and x-intercepts
        f(x) = 0.
      description: The y-intercept is where graph crosses the y-axis (at most one
        for functions); x-intercepts are real zeros of the function.
      citation: OpenStax College Algebra 1e, Section 3.3
    - slug: alg-function-symmetry
      name: Even and Odd Function Symmetry
      short_definition: Even functions f(-x) = f(x) have y-axis symmetry; odd functions
        f(-x) = -f(x) have origin symmetry.
      description: Tested algebraically by replacing x with -x and simplifying. Most
        functions are neither even nor odd.
      citation: OpenStax College Algebra 1e, Section 3.3
      prerequisites:
      - alg-function-intercepts
    - slug: alg-extrema-intervals
      name: Extrema and Increasing/Decreasing Intervals
      short_definition: Identifying local maxima, local minima, and intervals where
        f(x) rises or falls.
      description: A function is increasing on an interval if f(a) < f(b) whenever
        a < b, and decreasing if f(a) > f(b).
      citation: OpenStax College Algebra 1e, Section 3.3
      prerequisites:
      - alg-function-intercepts
    lessons:
    - title: Graphical Behavior, Intercepts, and Symmetry
      description: Determination of intercepts, even/odd symmetry analysis, local
        extrema, and intervals of increase and decrease.
      emoji: 📉
      tags:
      - symmetry
      - intercepts
      - even-odd
      - extrema
      concept_slugs:
      - alg-function-intercepts
      - alg-function-symmetry
      - alg-extrema-intervals
      citation: OpenStax College Algebra 1e, Section 3.3
      terms:
      - term: x-intercept (Zero)
        definition: A real number c such that f(c) = 0, where the graph crosses or
          touches the x-axis.
      - term: y-intercept
        definition: The point (0, f(0)) where the graph crosses the vertical y-axis.
      - term: Even Function
        definition: A function satisfying f(-x) = f(x) for all x in its domain, exhibiting
          symmetry across the y-axis.
      - term: Odd Function
        definition: A function satisfying f(-x) = -f(x) for all x in its domain, exhibiting
          180-degree rotational symmetry about the origin.
      - term: Local Maximum
        definition: A point (c, f(c)) where f(c) >= f(x) for all x in an open neighborhood
          around c.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Intercepts of Functions

            The points where a function's graph intersects the coordinate axes are foundational features:

            - **$y$-intercept**: Set $x = 0$ and evaluate $f(0)$. A function can have **at most one** $y$-intercept (by the Vertical Line Test).
            - **$x$-intercepts (Zeros)**: Set $f(x) = 0$ and solve for all real values of $x$. A function may have zero, one, or multiple $x$-intercepts.

            ### Symmetry of Functions: Even vs. Odd

            To test whether a function is even, odd, or neither, evaluate $f(-x)$ algebraically:

            1. **Even Function**: $f(-x) = f(x)$ for all $x$. The graph has **reflectional symmetry across the $y$-axis** (e.g. $f(x) = x^2, \cos(x), |x|$).
            2. **Odd Function**: $f(-x) = -f(x)$ for all $x$. The graph has **rotational symmetry of $180^\circ$ about the origin** (e.g. $f(x) = x^3, \sin(x), 1/x$).
            3. **Neither**: If $f(-x) \neq f(x)$ and $f(-x) \neq -f(x)$, the function has neither symmetry.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Testing Even vs. Odd Algebraically
          body: |-
            Always replace every $x$ with $(-x)$ and simplify carefully with parentheses:
            • If the expression returns to original $f(x) \implies$ **Even**.
            • If every single sign is negated to $-f(x) \implies$ **Odd**.
            • If some signs change and others do not $\implies$ **Neither**.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Symmetry Comparison Table

            | Classification | Algebraic Identity | Geometric Symmetry | Canonical Example |
            | :--- | :--- | :--- | :--- |
            | **Even** | $f(-x) = f(x)$ | Symmetric across $y$-axis | $f(x) = x^4 - 2x^2 + 5$ |
            | **Odd** | $f(-x) = -f(x)$ | Symmetric about origin $(0, 0)$ | $f(x) = x^5 - 4x$ |
            | **Neither** | $f(-x) \neq \pm f(x)$ | Asymmetric / general | $f(x) = x^2 + 3x - 4$ |
            | **Increasing** | $x_1 < x_2 \implies f(x_1) < f(x_2)$ | Graph rises from left to right | Linear with $m > 0$ |
            | **Decreasing** | $x_1 < x_2 \implies f(x_1) > f(x_2)$ | Graph falls from left to right | Linear with $m < 0$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Optimization and Parabolic Vertex

            A civil engineering contractor analyzes the structural load capacity of an arched pedestrian bridge. The vertical clearance $y$ in meters above ground as a function of horizontal distance $x$ across the 20-meter span is modeled by:

            $$y(x) = -0.05x^2 + x$$

            The $x$-intercepts represent the bridge foundation anchor points at ground level: $-0.05x(x - 20) = 0 \implies x = 0$ and $x = 20$ meters. By parabolic symmetry, the maximum clearance occurs exactly halfway between the intercepts at $x = 10$ meters. Evaluating $y(10) = -0.05(10)^2 + 10 = -5 + 10 = 5$ meters gives the bridge's maximum clearance.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Symmetry Misconceptions
          body: |-
            1. **Even/Odd is not like integer numbers**: An integer is either even or odd. Functions are usually NEITHER even nor odd!
            2. **Origin vs x-axis symmetry**: A function can NEVER have symmetry across the $x$-axis (except the zero function $y = 0$), because any non-zero point $(x, y)$ reflected to $(x, -y)$ would violate the Vertical Line Test.
      assessment_items:
      - id: alg-sim-even-odd-quartic-polynomial
        prompt: Determine whether the function $f(x) = 3x^4 - 2x^2 + 5$ is even, odd,
          or neither.
        interaction_type: single_choice
        response_spec:
          options:
          - Odd function
          - Neither even nor odd
          - Even function
          - Both even and odd
        scoring_spec:
          correct_index: 2
        explanation: 'Substitute (-x) for x: f(-x) = 3(-x)^4 - 2(-x)^2 + 5. Since
          (-x)^4 = x^4 and (-x)^2 = x^2, this simplifies to 3x^4 - 2x^2 + 5 = f(x).
          Because f(-x) = f(x) for all x, the function is even (and symmetric across
          the y-axis).'
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.3
        concept_slugs:
        - alg-function-symmetry
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-quadratic-intercepts
        prompt: What are all $x$-intercepts and the $y$-intercept of the quadratic
          function $f(x) = x^2 - 6x + 8$?
        interaction_type: single_choice
        response_spec:
          options:
          - x-intercepts at (-2, 0) and (-4, 0); y-intercept at (0, 8)
          - x-intercepts at (2, 0) and (4, 0); y-intercept at (0, -8)
          - x-intercepts at (1, 0) and (8, 0); y-intercept at (0, 8)
          - x-intercepts at (2, 0) and (4, 0); y-intercept at (0, 8)
        scoring_spec:
          correct_index: 3
        explanation: 'For x-intercepts, set f(x) = 0: x^2 - 6x + 8 = 0 => (x - 2)(x
          - 4) = 0 => x = 2 and x = 4, yielding points (2, 0) and (4, 0). For the
          y-intercept, set x = 0: f(0) = 0^2 - 6(0) + 8 = 8, yielding point (0, 8).'
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 3.3
        concept_slugs:
        - alg-function-intercepts
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-even-odd-cubic-polynomial
        prompt: Determine whether the function $g(x) = 2x^3 - 5x$ is even, odd, or
          neither.
        interaction_type: single_choice
        response_spec:
          options:
          - Odd function
          - Even function
          - Neither even nor odd
          - Linear function
        scoring_spec:
          correct_index: 0
        explanation: Compute g(-x) = 2(-x)^3 - 5(-x) = 2(-x^3) + 5x = -2x^3 + 5x =
          -(2x^3 - 5x) = -g(x). Because g(-x) = -g(x) for all x, the function is odd
          (symmetric about the origin).
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.3
        concept_slugs:
