      short_definition: Product, quotient, and power rules expanding and condensing
        logarithmic expressions.
      description: 'Rules: log_b(xy) = log_b(x) + log_b(y), log_b(x/y) = log_b(x)
        - log_b(y), and log_b(x^k) = k * log_b(x).'
      citation: OpenStax College Algebra 1e, Section 6.5
      prerequisites:
      - alg-log-definition
    - slug: alg-change-of-base
      name: Change-of-Base Formula
      short_definition: Formula log_b(x) = log_a(x) / log_a(b) converting logarithms
        to any convenient base such as 10 or e.
      description: Allows evaluation of logarithms of arbitrary base using common
        logarithms (log) or natural logarithms (ln).
      citation: OpenStax College Algebra 1e, Section 6.5
      prerequisites:
      - alg-log-properties
    lessons:
    - title: Logarithmic Expressions and Properties
      description: Equivalence between exponential and logarithmic forms, the laws
        of logarithms (product, quotient, power), and the change-of-base formula.
      emoji: 📈
      tags:
      - logarithms
      - properties
      - change-of-base
      concept_slugs:
      - alg-log-definition
      - alg-log-properties
      - alg-change-of-base
      citation: OpenStax College Algebra 1e, Sections 6.3 & 6.5
      terms:
      - term: Logarithm
        definition: 'The exponent to which a specified base must be raised to yield
          a given number: y = log_b(x) <=> b^y = x.'
      - term: Common Logarithm
        definition: A logarithm with base 10, typically written simply as log(x).
      - term: Natural Logarithm
        definition: A logarithm with base e (Euler's number ~ 2.71828), written as
          ln(x).
      - term: Change of Base Formula
        definition: An identity stating log_b(x) = ln(x) / ln(b) = log(x) / log(b).
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Definition of a Logarithm

            For any base $b > 0$ with $b \neq 1$, and any positive argument $x > 0$, the logarithmic equation is defined by its exponential equivalence:

            $$y = \log_b(x) \iff b^y = x$$

            Because logarithms are exponents, each law of exponents has an exact counterpart in the **laws of logarithms**:

            - **Product Property**: $\log_b(M \cdot N) = \log_b(M) + \log_b(N)$
            - **Quotient Property**: $\log_b\left(\frac{M}{N}\right) = \log_b(M) - \log_b(N)$
            - **Power Property**: $\log_b(M^p) = p \log_b(M)$
            - **Identity Properties**: $\log_b(b) = 1$ and $\log_b(1) = 0$
            - **Inverse Properties**: $\log_b(b^x) = x$ and $b^{\log_b(x)} = x$ ($x > 0$)
            - **Change-of-Base Formula**: $\log_b(M) = \frac{\log_c(M)}{\log_c(b)} = \frac{\ln(M)}{\ln(b)} = \frac{\log(M)}{\log(b)}$
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Expanding vs. Condensing
          body: '**Expanding** breaks a single logarithm of a complex product/quotient
            into a sum and difference of simpler logarithms. **Condensing** combines
            multiple logarithmic terms into a single logarithm using product, quotient,
            and power rules.'
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Exponent Laws vs. Logarithm Laws Correspondence

            | Exponent Rule | Corresponding Logarithm Rule | Example |
            | :--- | :--- | :--- |
            | $b^m \cdot b^n = b^{m+n}$ | $\log_b(MN) = \log_b(M) + \log_b(N)$ | $\log_2(8 \cdot 4) = \log_2(8) + \log_2(4) = 3 + 2 = 5$ |
            | $\frac{b^m}{b^n} = b^{m-n}$ | $\log_b(M/N) = \log_b(M) - \log_b(N)$ | $\log_3(81/9) = \log_3(81) - \log_3(9) = 4 - 2 = 2$ |
            | $(b^m)^p = b^{mp}$ | $\log_b(M^p) = p \log_b(M)$ | $\log_{10}(100^4) = 4 \log_{10}(100) = 4(2) = 8$ |
            | $b^0 = 1$ | $\log_b(1) = 0$ | $\ln(1) = 0$ |
            | $b^1 = b$ | $\log_b(b) = 1$ | $\log_5(5) = 1$ |
            | Arbitrary Base | $\log_b(x) = \frac{\ln x}{\ln b}$ | $\log_2(10) = \frac{\ln 10}{\ln 2} \approx \frac{2.3026}{0.6931} \approx 3.3219$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Sound Intensity and Decibel Measurement

            A classic real-world model using logarithmic scaling is the measurement of sound loudness in decibels ($dB$). Loudness $L$ is modeled by $L = 10 \log_{10}\left(\frac{I}{I_0}\right)$, where $I$ is the physical sound intensity (in watts per square meter) and $I_0 = 10^{-12}\text{ W/m}^2$ is the threshold of human hearing. If a busy street has intensity $I_1 = 10^{-5}\text{ W/m}^2$ and a jet engine has intensity $I_2 = 10^{2}\text{ W/m}^2$, we evaluate the decibel difference using the quotient property of logarithms:

            $$L_2 - L_1 = 10 \log_{10}\left(\frac{I_2}{I_0}\right) - 10 \log_{10}\left(\frac{I_1}{I_0}\right) = 10 \log_{10}\left(\frac{I_2}{I_1}\right)$$

            Substituting values gives $10 \log_{10}\left(\frac{10^2}{10^{-5}}\right) = 10 \log_{10}(10^7) = 10(7) = 70\text{ dB}$ difference.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Logarithm Pitfalls
          body: |-
            1. **Log of a sum**: $\log_b(x + y) \neq \log_b(x) + \log_b(y)$. The sum of logs is the log of a **product**.
            2. **Quotient of logs**: $\frac{\log_b(x)}{\log_b(y)} \neq \log_b(x - y)$ and does NOT equal $\log_b(x/y)$. Note that $\frac{\log_b(x)}{\log_b(y)} = \log_y(x)$ by the change-of-base formula.
            3. **Negative arguments**: The domain of $\log_b(x)$ requires $x > 0$. Expressions like $\log_2(-4)$ or $\ln(0)$ are undefined over the real numbers.
      assessment_items:
      - id: alg-sim-expand-logarithm-quotient-product
        prompt: Which of the following expressions represents the expanded form of
          $\log_2\left(\frac{x^3 \sqrt{y}}{z^4}\right)$ for all positive real numbers
          $x, y, z$?
        interaction_type: single_choice
        response_spec:
          options:
          - 3\log_2(x) + \frac{1}{2}\log_2(y) - 4\log_2(z)
          - 3\log_2(x) + 2\log_2(y) - 4\log_2(z)
          - \frac{3\log_2(x) \cdot \frac{1}{2}\log_2(y)}{4\log_2(z)}
          - 3\log_2(x) - \frac{1}{2}\log_2(y) - 4\log_2(z)
        scoring_spec:
          correct_index: 0
        explanation: 'Apply the quotient rule: log_2(x^3 sqrt(y)) - log_2(z^4). Next
          apply the product rule to the numerator: log_2(x^3) + log_2(y^(1/2)) - log_2(z^4).
          Finally apply the power rule to bring exponents to the front: 3 log_2(x)
          + (1/2) log_2(y) - 4 log_2(z).'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 6.5
        concept_slugs:
        - alg-log-properties
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '1.0'
      - id: alg-sim-condense-natural-logarithms
        prompt: Condense the expression $2\ln(x) - \frac{1}{3}\ln(y) + \ln(z)$ into
          a single logarithm with coefficient 1 for positive real numbers $x, y, z$.
        interaction_type: single_choice
        response_spec:
          options:
          - \ln\left(\frac{x^2 \sqrt[3]{y}}{z}\right)
          - \ln\left(\frac{x^2 z}{\sqrt[3]{y}}\right)
          - \ln\left(\frac{2x z}{\frac{1}{3}y}\right)
          - \ln\left(x^2 - \sqrt[3]{y} + z\right)
        scoring_spec:
          correct_index: 1
        explanation: 'First apply the power rule to move coefficients into exponents:
          ln(x^2) - ln(y^(1/3)) + ln(z). Next group positive terms: ln(x^2) + ln(z)
          = ln(x^2 z). Finally apply the quotient rule for the subtracted term: ln[(x^2
          z) / y^(1/3)] = ln[(x^2 z) / cbrt(y)].'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 6.5
        concept_slugs:
        - alg-log-properties
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '1.0'
      - id: alg-sim-evaluate-mixed-logarithms
        prompt: Evaluate the exact numerical value of the expression $\log_3(81) -
          \log_2\left(\frac{1}{8}\right) + \ln(e^5)$.
        interaction_type: single_choice
        response_spec:
          options:
          - '6'
          - '8'
          - '12'
          - '4'
        scoring_spec:
          correct_index: 2
        explanation: 'Evaluate each term individually: log_3(81) = 4 because 3^4 =
          81; log_2(1/8) = -3 because 2^(-3) = 1/8; ln(e^5) = 5 because ln and e are
          inverse operations. Substituting back gives: 4 - (-3) + 5 = 4 + 3 + 5 =
          12.'
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 6.3
        concept_slugs:
        - alg-log-definition
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '1.0'
      questions:
      - id: alg-fmt-evaluate-log-base-4
        question_text: What is the exact numerical value of the logarithm $\log_4(64)$?
        options:
        - '3'
        - '16'
        - '4'
        - '12'
        correct_answer: 0
        explanation: By definition, y = log_4(64) <=> 4^y = 64. Since 4^3 = 64, the
          value of log_4(64) is 3.
        concept_slugs:
        - alg-log-definition
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-log-power-property
        question_text: According to the power property of logarithms, which expression
          is equivalent to $\log_b(x^5)$ for $x > 0$?
        options:
        - (\log_b x)^5
        - 5\log_b(x)
        - \log_b(5x)
        - \log_b(x) + 5
        correct_answer: 1
        explanation: The power property of logarithms states that log_b(M^p) = p *
          log_b(M). Bringing the exponent to the front gives 5 log_b(x).
        concept_slugs:
        - alg-log-properties
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What is the equivalent exponential form of y = log_b(x)?
      back: b^y = x (where b > 0, b != 1, and x > 0).
      concept_slugs:
      - alg-log-definition
    - front: 'What does the product rule of logarithms state: log_b(MN)?'
      back: log_b(M) + log_b(N).
      concept_slugs:
      - alg-log-properties
    - front: What is the change-of-base formula for log_b(x)?
      back: log_b(x) = ln(x) / ln(b) = log(x) / log(b).
      concept_slugs:
      - alg-change-of-base
- code: '2.0'
  title: Equations and inequalities
  description: Linear, quadratic, radical, rational, absolute value, exponential,
    and logarithmic equations; inequalities and systems.
  weight: 0.25
  sort_order: 2
  importance: core
  citation: College Board CLEP College Algebra Domain 2.0 (25%); OpenStax College
    Algebra 1e Chapters 2, 6, & 7
  objectives:
  - code: '2.1'
    title: Solve linear equations, formulate real-world linear models, and solve linear
      inequalities
    description: Solve multi-step linear equations in one variable, apply slope-intercept
      models to practical scenarios, and express linear inequality solutions in interval
      notation.
    sort_order: 1
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 2.1: Linear Equations; Section
      2.2: Linear Models; Section 2.7: Linear Inequalities'
    concepts:
    - slug: alg-linear-equations
      name: Solving Linear Equations in One Variable
      short_definition: Algebraic methods for solving equations of the form ax + b
        = c using inverse operations.
      description: Clearing denominators with the LCD, expanding parentheses with
        the distributive property, collecting like terms, and isolating the variable.
      citation: OpenStax College Algebra 1e, Section 2.1
    - slug: alg-linear-models
      name: Linear Applications and Rate Models
      short_definition: Translating verbal descriptions into linear equations y =
        mx + b where m represents constant rate of change and b represents initial
        value.
      description: Formulating models for cost, revenue, distance-rate-time, and mixture
        problems.
      citation: OpenStax College Algebra 1e, Section 2.2
      prerequisites:
      - alg-linear-equations
    - slug: alg-linear-inequalities
      name: Linear Inequalities and Interval Notation
      short_definition: Solving single and compound linear inequalities and representing
        solution sets in interval notation.
      description: Remembering to reverse inequality direction when multiplying or
        dividing by a negative number. Representing solutions using parentheses and
        brackets.
      citation: OpenStax College Algebra 1e, Section 2.7
      prerequisites:
      - alg-linear-equations
    lessons:
    - title: Linear Equations, Applications, and Inequalities
      description: Techniques for solving multi-step linear equations, building linear
        rate models, and solving compound inequalities in interval notation.
      emoji: 📏
      tags:
      - linear-equations
      - inequalities
      - applications
      concept_slugs:
      - alg-linear-equations
      - alg-linear-models
      - alg-linear-inequalities
      citation: OpenStax College Algebra 1e, Sections 2.1, 2.2, & 2.7
      terms:
      - term: Linear Equation
        definition: An equation in which the highest power of the variable is 1, in
          standard form ax + b = 0 with a != 0.
      - term: Identity Equation
        definition: An equation that is true for all values in the domain, having
          infinitely many real solutions.
      - term: Contradiction Equation
        definition: An equation that is never true for any value, having no solution
          (empty set).
      - term: Interval Notation
        definition: A standard mathematical notation using brackets [ ] for included
          endpoints and parentheses ( ) for excluded endpoints to represent intervals
          of numbers.
      - term: Inequality Reversal Rule
        definition: The algebraic principle stating that multiplying or dividing both
          sides of an inequality by a negative quantity reverses the direction of
          the inequality sign.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Solving Linear Equations in One Variable

            A **linear equation in one variable** can be written in the form $ax + b = c$, where $a, b, c$ are real numbers and $a \neq 0$. Solving linear equations follows a clear systematic protocol:

            1. **Clear fractions**: Multiply every term on both sides by the least common denominator (LCD).
            2. **Simplify each side**: Distribute across parentheses and combine like terms.
            3. **Isolate variable terms**: Use addition/subtraction to place all variable terms on one side and constant terms on the other.
            4. **Isolate the variable**: Divide or multiply by the variable's coefficient.
            5. **Classify outcome**: A unique solution ($x = k$, conditional); true statement ($0 = 0$, identity / infinitely many solutions); or false statement ($0 = 7$, contradiction / no solution).

            ### Linear Inequalities and Interval Notation

            Solving linear inequalities follows identical addition and subtraction properties as equations. However, the **fundamental inequality rule** dictates: *multiplying or dividing both sides of an inequality by a negative number reverses the inequality symbol* ($<$ becomes $>$, and $\leq$ becomes $\geq$).
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Inequality Symbol Reversal
          body: 'Whenever you multiply or divide both sides of an inequality by a
            negative real number, you MUST flip the direction of the inequality: $-2x
            < 10 \implies x > -5$.'
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Interval Notation and Inequality Representations

            | Inequality | Interval Notation | Number Line Representation |
            | :--- | :--- | :--- |
            | $x > a$ | $(a, \infty)$ | Open circle at $a$, shaded right toward $+\infty$ |
            | $x \geq a$ | $[a, \infty)$ | Closed circle at $a$, shaded right toward $+\infty$ |
            | $x < b$ | $(-\infty, b)$ | Open circle at $b$, shaded left toward $-\infty$ |
            | $x \leq b$ | $(-\infty, b]$ | Closed circle at $b$, shaded left toward $-\infty$ |
            | $a < x < b$ | $(a, b)$ | Open circles at $a$ and $b$, segment between shaded |
            | $a \leq x \leq b$ | $[a, b]$ | Closed circles at $a$ and $b$, segment between shaded |
            | $x < a$ or $x \geq b$ | $(-\infty, a) \cup [b, \infty)$ | Disjoint union of two rays |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Linear Cost-Volume-Profit Decision Model

            A commercial print shop produces customized academic study manuals. The fixed overhead costs (facility lease, machinery depreciation) are $\$1,800$ per month, while the variable cost to print and bind each manual is $\$4.50$. The business sells each manual for $\$12.00$. We formulate the monthly profit model $P(x)$ as revenue minus total cost:

            $$P(x) = R(x) - C(x) = 12.00x - (4.50x + 1800) = 7.50x - 1800$$

            To find the break-even production volume (where profit is zero), we set $P(x) = 0$:

            $$7.50x - 1800 = 0 \implies 7.50x = 1800 \implies x = \frac{1800}{7.50} = 240\text{ manuals}$$

            If the print shop wants a minimum monthly profit of at least $\$1,200$, we set up the linear inequality $7.50x - 1800 \geq 1200 \implies 7.50x \geq 3000 \implies x \geq 400$ manuals.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Linear Equation Pitfalls
          body: |-
            1. **Distributing negative signs**: In an expression like $5 - (2x - 3)$, the negative sign must distribute to BOTH terms: $5 - 2x + 3 = 8 - 2x$.
            2. **Fraction multiplication**: When clearing fractions by multiplying by the LCD, ensure that EVERY single term on both sides is multiplied by the LCD, including constant terms with denominator 1.
      assessment_items:
      - id: alg-sim-linear-equation-with-fractions
        prompt: Solve the linear equation $\frac{2x - 3}{4} - \frac{x + 1}{6} = 2$
          for $x$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = \frac{27}{4}
          - x = \frac{29}{4}
          - x = \frac{31}{4}
          - x = \frac{35}{4}
        scoring_spec:
          correct_index: 3
        explanation: 'Multiply the entire equation by the LCD of 4 and 6, which is
          12: 12 * [(2x - 3)/4] - 12 * [(x + 1)/6] = 12 * 2. This simplifies to 3(2x
          - 3) - 2(x + 1) = 24. Distribute: 6x - 9 - 2x - 2 = 24. Combine like terms:
          4x - 11 = 24. Add 11 to both sides: 4x = 35. Divide by 4: x = 35/4.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 2.1
        concept_slugs:
        - alg-linear-equations
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-compound-inequality-interval
        prompt: What is the solution set in interval notation for the compound inequality
          $-3 \leq 2x - 7 < 5$?
        interaction_type: single_choice
        response_spec:
          options:
          - '[2, 6)'
          - '[-2, 6)'
          - (2, 6]
          - '[-3, 5)'
        scoring_spec:
          correct_index: 0
        explanation: 'Add 7 to all three parts: -3 + 7 <= 2x < 5 + 7, which gives
          4 <= 2x < 12. Divide all three parts by 2: 2 <= x < 6. In interval notation,
          the inclusive lower bound is marked with a bracket [2, and the strict upper
          bound is marked with a parenthesis 6), yielding [2, 6).'
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 2.7
        concept_slugs:
        - alg-linear-inequalities
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-rideshare-linear-budget-inequality
        prompt: A rideshare service charges a flat reservation fee of $\$3.50$ plus
          $\$2.25$ per mile traveled. A traveler has a strict maximum budget of $\$26.00$.
          What is the maximum integer number of whole miles the traveler can travel?
        interaction_type: single_choice
        response_spec:
          options:
          - 9 miles
          - 10 miles
          - 11 miles
          - 12 miles
        scoring_spec:
          correct_index: 1
        explanation: 'Let m be the number of miles. The linear cost model is C(m)
          = 3.50 + 2.25m <= 26.00. Subtract 3.50 from both sides: 2.25m <= 22.50.
          Divide by 2.25: m <= 10. Thus, the traveler can travel a maximum of 10 whole
          miles without exceeding the budget.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 2.2
        concept_slugs:
        - alg-linear-models
        - alg-linear-inequalities
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      questions:
      - id: alg-fmt-solve-two-step-linear-equation
        question_text: Solve the linear equation $4x - 7 = 13$ for $x$.
        options:
        - x = 1.5
        - x = 20
        - x = 5
        - x = -5
        correct_answer: 2
        explanation: 'Add 7 to both sides: 4x = 20. Divide both sides by 4: x = 5.'
        concept_slugs:
        - alg-linear-equations
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-inequality-sign-flip
        question_text: When solving the inequality $-3x \leq 12$, what is the correct
          resulting inequality?
        options:
        - x \leq -4
        - x \geq 4
        - x \leq 4
        - x \geq -4
        correct_answer: 3
        explanation: 'Dividing both sides of an inequality by a negative number reverses
          the inequality direction: -3x / (-3) >= 12 / (-3) => x >= -4.'
        concept_slugs:
        - alg-linear-inequalities
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What happens to an inequality sign when both sides are multiplied or
        divided by a negative number?
      back: The direction of the inequality sign is reversed (< becomes >, <= becomes
        >=).
      concept_slugs:
      - alg-linear-inequalities
    - front: How do you clear fractions when solving a linear equation?
      back: Multiply every term on both sides of the equation by the Least Common
        Denominator (LCD).
      concept_slugs:
      - alg-linear-equations
    - front: What does an outcome of 0 = 5 mean when solving a linear equation?
      back: The equation is a contradiction and has no solution (the solution set
        is the empty set).
      concept_slugs:
      - alg-linear-equations
  - code: '2.2'
    title: Solve quadratic equations by multiple methods and analyze roots using the
      discriminant
    description: Solve quadratic equations by factoring, completing the square, and
      the quadratic formula, and determine the nature of solutions using the discriminant
      Delta = b^2 - 4ac.
    sort_order: 2
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 2.5: Quadratic Equations'
    concepts:
    - slug: alg-quadratic-methods
      name: Solving Quadratic Equations
      short_definition: Factoring, square root property, completing the square, and
        the quadratic formula.
      description: Methods to solve ax^2 + bx + c = 0. The quadratic formula x = (-b
        ± sqrt(b^2 - 4ac)) / (2a) solves any quadratic equation.
      citation: OpenStax College Algebra 1e, Section 2.5
    - slug: alg-discriminant-nature
      name: The Discriminant and Nature of Solutions
      short_definition: Using Delta = b^2 - 4ac to determine whether solutions are
        two real, one repeated real, or two complex conjugate roots.
      description: 'If Delta > 0: two distinct real roots; if Delta = 0: one repeated
        real root; if Delta < 0: two complex conjugate non-real roots.'
      citation: OpenStax College Algebra 1e, Section 2.5
      prerequisites:
      - alg-quadratic-methods
    - slug: alg-quadratic-projectile-model
      name: Quadratic Applications and Projectile Motion
      short_definition: Kinematic projectile height models h(t) = -1/2 g t^2 + v_0
        t + h_0 and parabolic optimization.
      description: Solving for time of flight (roots), maximum height (vertex), and
        ground impact.
      citation: OpenStax College Algebra 1e, Section 2.5
      prerequisites:
      - alg-quadratic-methods
    lessons:
    - title: Quadratic Equations and Discriminant Analysis
      description: Comprehensive methods for solving quadratic equations (factoring,
        completing the square, quadratic formula) and discriminant analysis.
      emoji: 🎯
      tags:
      - quadratics
      - quadratic-formula
      - discriminant
      concept_slugs:
      - alg-quadratic-methods
      - alg-discriminant-nature
      - alg-quadratic-projectile-model
      citation: OpenStax College Algebra 1e, Section 2.5
      terms:
      - term: Quadratic Equation
        definition: A second-degree polynomial equation written in standard form ax^2
          + bx + c = 0 with a != 0.
      - term: Zero-Product Property
        definition: If AB = 0 for real or complex numbers A and B, then A = 0, B =
          0, or both equal zero.
      - term: Quadratic Formula
        definition: The universal solution x = (-b ± sqrt(b^2 - 4ac)) / (2a) for ax^2
          + bx + c = 0.
      - term: Discriminant
        definition: The algebraic quantity Delta = b^2 - 4ac under the square root
          in the quadratic formula indicating the number and nature of roots.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Solving Quadratic Equations: The Core Methods

            A **quadratic equation** in standard form is $ax^2 + bx + c = 0$ with $a \neq 0$. Four fundamental methods exist for finding its solutions (roots or zeros):

            1. **Factoring**: If $ax^2 + bx + c = (px + q)(rx + s) = 0$, the zero-product property yields $px + q = 0$ or $rx + s = 0$.
            2. **Square Root Property**: If $(x - h)^2 = k$, then $x - h = \pm \sqrt{k} \implies x = h \pm \sqrt{k}$.
            3. **Completing the Square**: Divide by $a$, move the constant term to the right, and add $\left(\frac{b}{2a}\right)^2$ to both sides.
            4. **The Quadratic Formula**: Universally solves any quadratic equation:

            $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

            ### The Discriminant and the Nature of Roots

            The radicand expression $\Delta = b^2 - 4ac$ is the **discriminant**. It completely characterizes the nature of the solutions without having to solve the equation.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Discriminant Root Diagnostic
          body: |-
            • $\Delta > 0$: Two distinct real solutions (graph crosses $x$-axis twice).
            • $\Delta = 0$: Exactly one repeated real solution (parabola vertex touches $x$-axis).
            • $\Delta < 0$: Two complex conjugate non-real solutions (graph has no $x$-intercepts).
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Discriminant Classification Summary

            | Value of $\Delta = b^2 - 4ac$ | Algebraic Nature of Roots | Parabolic Graph Interaction |
            | :--- | :--- | :--- |
            | $\Delta > 0$, perfect square | Two distinct rational roots | Two rational $x$-intercepts |
            | $\Delta > 0$, not a square | Two distinct irrational roots | Two irrational $x$-intercepts |
            | $\Delta = 0$ | One repeated rational root (multiplicity 2) | Exactly one tangent $x$-intercept (vertex) |
            | $\Delta < 0$ | Two complex conjugate roots: $u \pm vi$ | Zero real $x$-intercepts (entirely above/below axis) |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Projectile Motion and Impact Time

            A physics model tracks the trajectory of a projectile launched upward from the roof of an academic building. The height $h(t)$ in feet after $t$ seconds is modeled by the quadratic equation:

            $$h(t) = -16t^2 + 48t + 64$$

            To find when the projectile impacts the ground, we set height $h(t) = 0$:

            $$-16t^2 + 48t + 64 = 0$$

            Factoring out the greatest common factor $-16$ gives $-16(t^2 - 3t - 4) = 0$. Factoring the quadratic trinomial yields $-16(t - 4)(t + 1) = 0$. The mathematical roots are $t = 4$ and $t = -1$. Because time elapsed after launch must be non-negative ($t \geq 0$), the physical impact occurs at exactly $t = 4$ seconds.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Quadratic Formula Pitfalls
          body: |-
            1. **Sign of $-b$**: If $b = -6$, then $-b = -(-6) = +6$. Forgetting to negate a negative $b$ is the single most frequent algebraic error.
            2. **Division by $2a$**: The division by $2a$ spans the ENTIRE numerator $(-b \pm \sqrt{\Delta})$, not just the radical term.
            3. **Calculation of $-4ac$**: When $c$ is negative (e.g. $a=2, c=-3$), $-4ac = -4(2)(-3) = +24$. The sign becomes positive.
      assessment_items:
      - id: alg-sim-quadratic-by-factoring
        prompt: Find all real solutions to the quadratic equation $2x^2 - 5x - 3 =
          0$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = -3 and x = \frac{1}{2}
          - x = 3 and x = -\frac{1}{2}
          - x = -3 and x = -\frac{1}{2}
          - x = 3 and x = \frac{1}{2}
        scoring_spec:
          correct_index: 1
        explanation: 'Factor the quadratic trinomial using the ac method: a*c = 2*(-3)
          = -6. Find two numbers multiplying to -6 and summing to -5: these are -6
          and 1. Rewrite: 2x^2 - 6x + x - 3 = 2x(x - 3) + 1(x - 3) = (2x + 1)(x -
          3) = 0. Setting each factor to 0 gives 2x + 1 = 0 => x = -1/2, and x - 3
          = 0 => x = 3.'
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 2.5
        concept_slugs:
        - alg-quadratic-methods
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-discriminant-repeated-root-k
        prompt: For what real value of $k$ does the quadratic equation $x^2 - 6x +
          k = 0$ have exactly one repeated real solution?
        interaction_type: single_choice
        response_spec:
          options:
          - k = -9
          - k = 36
          - k = 9
          - k = 3
        scoring_spec:
          correct_index: 2
        explanation: 'A quadratic equation has exactly one repeated real root when
          its discriminant Delta = b^2 - 4ac equals zero. Here a = 1, b = -6, and
          c = k. Compute: Delta = (-6)^2 - 4(1)(k) = 36 - 4k = 0. Solving gives 4k
          = 36 => k = 9.'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 2.5
        concept_slugs:
        - alg-discriminant-nature
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-projectile-quadratic-model
        prompt: A toy rocket launched from ground level follows the height trajectory
          $h(t) = -16t^2 + 80t$ where $h(t)$ is in feet and $t$ is in seconds. At
          what positive time $t$ will the rocket hit the ground?
        interaction_type: single_choice
        response_spec:
          options:
          - t = 5 seconds
          - t = 2.5 seconds
          - t = 10 seconds
          - t = 16 seconds
        scoring_spec:
          correct_index: 0
        explanation: 'Set the height equal to 0 for ground level: -16t^2 + 80t = 0.
          Factor out -16t: -16t(t - 5) = 0. The solutions are t = 0 (launch) and t
          = 5 (landing). Thus, the rocket returns to the ground at t = 5 seconds.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 2.5
        concept_slugs:
        - alg-quadratic-projectile-model
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      questions:
      - id: alg-fmt-zero-discriminant-meaning
        question_text: What does a discriminant value of $\Delta = b^2 - 4ac = 0$
          indicate about the solutions of a quadratic equation?
        options:
        - The equation has exactly one repeated real solution
        - The equation has two distinct irrational real solutions
        - The equation has two complex conjugate non-real solutions
        - The equation has no mathematical solutions whatsoever
        correct_answer: 0
        explanation: When Delta = 0, the plus-or-minus radical term becomes 0, leaving
          x = -b / (2a) as a single repeated real root of multiplicity 2. (It is rational
          only when a and b are rational.)
        concept_slugs:
        - alg-discriminant-nature
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-difference-of-squares-roots
        question_text: What are all real roots of the quadratic equation $x^2 - 9
          = 0$?
        options:
        - x = 3 only
        - x = 3 and x = -3
        - x = 9 and x = -9
        - x = 0 and x = 9
        correct_answer: 1
        explanation: 'Using the square root property: x^2 = 9 => x = ±sqrt(9) = ±3.
          Thus the roots are x = 3 and x = -3.'
        concept_slugs:
        - alg-quadratic-methods
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What is the quadratic formula used to solve ax^2 + bx + c = 0?
      back: x = (-b ± sqrt(b^2 - 4ac)) / (2a)
      concept_slugs:
      - alg-quadratic-methods
    - front: What does a negative discriminant (b^2 - 4ac < 0) tell you about the
        solutions of a quadratic equation?
      back: The equation has two complex conjugate non-real solutions and no real
        x-intercepts.
      concept_slugs:
      - alg-discriminant-nature
    - front: When does a quadratic equation have exactly one repeated real solution?
      back: When its discriminant Delta = b^2 - 4ac is exactly equal to zero.
      concept_slugs:
      - alg-discriminant-nature
  - code: '2.3'
    title: Solve radical, rational, and absolute value equations and eliminate extraneous
      solutions
    description: Isolate radicals and powers, clear rational denominators with LCD,
      branch absolute value equations, and rigorously verify candidate roots against
      domain restrictions.
    sort_order: 3
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 2.6: Other Types of Equations'
    concepts:
    - slug: alg-radical-equations
      name: Solving Radical Equations
      short_definition: Techniques isolating radicals and raising both sides to powers
        to eliminate roots.
      description: Squaring both sides can introduce extraneous solutions; all candidate
        roots must be tested in the original equation.
      citation: OpenStax College Algebra 1e, Section 2.6
    - slug: alg-rational-equations
      name: Solving Rational Equations
      short_definition: Multiplying by the LCD to convert rational equations to polynomial
        equations.
      description: Any candidate root that makes an original denominator zero is an
        extraneous solution and must be discarded.
      citation: OpenStax College Algebra 1e, Section 2.6
      prerequisites:
      - alg-radical-equations
    - slug: alg-abs-equations
      name: Solving Absolute Value Equations
      short_definition: Splitting |ax + b| = c into dual linear equations ax + b =
        c or ax + b = -c.
      description: If c < 0, there is no real solution because absolute value is non-negative.
      citation: OpenStax College Algebra 1e, Section 2.6
      prerequisites:
      - alg-radical-equations
    lessons:
    - title: Radical, Rational, and Absolute Value Equations
      description: Procedures for solving radical, rational, and absolute value equations
        while identifying and rejecting extraneous solutions.
      emoji: 🔍
      tags:
      - radical-equations
      - rational-equations
      - extraneous-solutions
      concept_slugs:
      - alg-radical-equations
      - alg-rational-equations
      - alg-abs-equations
      citation: OpenStax College Algebra 1e, Section 2.6
      terms:
      - term: Extraneous Solution
        definition: A solution that emerges through valid algebraic operations (like
          squaring both sides or multiplying by an LCD) but does not satisfy the original
          equation.
      - term: Radical Equation
        definition: An equation in which the variable appears under a radical sign
          or with a rational exponent.
      - term: Rational Equation
        definition: An equation containing one or more rational expressions with variables
          in denominators.
      - term: Absolute Value Branching
        definition: The procedure of replacing |u| = c with the dual system u = c
          or u = -c (for c >= 0).
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Radical Equations and Extraneous Solutions

            A **radical equation** contains a variable within a radicand. The standard solution procedure involves:

            1. **Isolate the radical**: Rearrange terms so that a single radical term sits alone on one side: $\sqrt{P(x)} = Q(x)$.
            2. **Eliminate the radical**: Raise both sides to the power equal to the index (e.g. square both sides if index is 2).
            3. **Solve the resulting polynomial equation**.
            4. **MANDATORY: Check for extraneous solutions**: Squaring is not a one-to-one operation ($(-3)^2 = 3^2$, but $-3 \neq 3$). Therefore, candidate roots can be false artifacts.

            ### Absolute Value Equations

            For any algebraic expression $u$ and real constant $c$:
            - If $c < 0$, $|u| = c$ has **no solution** (empty set $\emptyset$).
            - If $c = 0$, $|u| = 0 \iff u = 0$.
            - If $c > 0$, $|u| = c \iff u = c$ or $u = -c$.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: The Danger of Squaring Both Sides
          body: Whenever you square both sides of an equation, you MUST substitute
            all candidate values back into the ORIGINAL un-squared equation. Extraneous
            solutions appear frequently on the CLEP exam.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Equation Type and Solution Protocols

            | Equation Category | Primary Algebraic Move | Potential Pitfall / Invalidation |
            | :--- | :--- | :--- |
            | **Radical** $\sqrt{ax+b} = cx+d$ | Isolate radical, square both sides | Squaring introduces extraneous roots; test every root |
            | **Rational** $\frac{P(x)}{Q(x)} = R(x)$ | Multiply by LCD of all denominators | Zero denominator ($Q(r) = 0$) makes candidate root invalid |
            | **Absolute Value** $|ax+b| = c$ ($c>0$) | Branch into $ax+b = c$ or $ax+b = -c$ | Overlooking sign branches or setting equal to negative |
            | **Variable RHS** $|ax+b| = cx+d$ | Branch into $\pm$, test both branches | Right side $cx+d$ must be $\geq 0$ for solution to be valid |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Shared Work Rate Modeling

            In civil project management, two construction crews are assigned to pave an access road. Crew A working alone takes $x$ days, while Crew B working alone takes $x + 5$ days. Working simultaneously, both crews complete the road in $6$ days. We formulate the rational rate equation:

            $$\frac{1}{x} + \frac{1}{x + 5} = \frac{1}{6}$$

            Multiplying by the LCD $6x(x + 5)$ yields $6(x + 5) + 6x = x(x + 5)$, which expands to $12x + 30 = x^2 + 5x$. Rearranging into standard quadratic form gives $x^2 - 7x - 30 = 0$. Factoring produces $(x - 10)(x + 3) = 0$. The roots are $x = 10$ and $x = -3$. Since days cannot be negative, $x = -3$ is rejected, concluding that Crew A takes $10$ days alone.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Extraneous Root Errors
          body: |-
            1. **Failing to isolate before squaring**: In $\sqrt{x + 2} - x = 4$, squaring both sides immediately as $(x + 2) + x^2 = 16$ is algebraically FALSE. You must isolate: $\sqrt{x + 2} = x + 4$ before squaring.
            2. **Absolute value with negative target**: $|2x - 3| = -5$ has **no real solution**. Writing $2x - 3 = -5$ and solving produces an invalid answer.
      assessment_items:
      - id: alg-sim-radical-equation-extraneous-root
        prompt: Find all real solutions to the radical equation $\sqrt{2x + 7} - x
          = 2$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = 1 and x = -3
          - x = 1 only
          - x = -3 only
          - No real solution
        scoring_spec:
          correct_index: 1
        explanation: 'Isolate the radical: sqrt(2x + 7) = x + 2. Square both sides:
          2x + 7 = (x + 2)^2 = x^2 + 4x + 4. Rearrange into standard quadratic form:
          x^2 + 2x - 3 = 0. Factor: (x + 3)(x - 1) = 0, giving candidate roots x =
          1 and x = -3. CHECK in original equation: For x = 1: sqrt(2(1) + 7) - 1
          = sqrt(9) - 1 = 3 - 1 = 2 (TRUE). For x = -3: sqrt(2(-3) + 7) - (-3) = sqrt(1)
          + 3 = 1 + 3 = 4 != 2 (EXTRANEOUS). Thus x = 1 is the sole valid solution.'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 2.6
        concept_slugs:
        - alg-radical-equations
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-rational-equation-extraneous-root
        prompt: Solve the rational equation $\frac{x}{x - 2} + \frac{1}{x - 4} = \frac{2}{(x
          - 2)(x - 4)}$ for $x$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = 4 only
          - x = -1 and x = 4
          - x = -1 only
          - No real solution
        scoring_spec:
          correct_index: 2
        explanation: 'Domain restrictions are x != 2 and x != 4 to prevent division
          by zero. Multiply both sides by the LCD (x - 2)(x - 4): x(x - 4) + 1(x -
          2) = 2. Expand and simplify: x^2 - 4x + x - 2 = 2 => x^2 - 3x - 4 = 0. Factor:
          (x - 4)(x + 1) = 0, giving candidate roots x = 4 and x = -1. Because x =
          4 makes denominators zero in the original equation, it is extraneous. Substituting
          x = -1: (-1)/(-3) + 1/(-5) = 1/3 - 1/5 = 2/15, and 2/[(-3)(-5)] = 2/15.
          Therefore, x = -1 is the unique valid real solution.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 2.6
        concept_slugs:
        - alg-rational-equations
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-absolute-value-equation-linear-rhs
        prompt: Find all real solutions to the absolute value equation $|3x - 5| =
          2x + 10$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = 15 only
          - x = -1 only
          - No real solution
          - x = 15 and x = -1
        scoring_spec:
          correct_index: 3
        explanation: 'Split into two linear branches: Branch 1: 3x - 5 = 2x + 10 =>
          x = 15. Check: |3(15) - 5| = |40| = 40; 2(15) + 10 = 40 (Valid). Branch
          2: 3x - 5 = -(2x + 10) = -2x - 10 => 5x = -5 => x = -1. Check: |3(-1) -
          5| = |-8| = 8; 2(-1) + 10 = 8 (Valid). Both solutions are valid.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 2.6
        concept_slugs:
        - alg-abs-equations
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      questions:
      - id: alg-fmt-radical-equation-check-solutions
        question_text: Why must candidate solutions to radical equations always be
          checked in the original un-squared equation?
        options:
        - Radical roots can only be calculated with approximate decimal precision
        - Quadratic factoring introduces false positive roots into every polynomial
        - Squaring both sides is not a one-to-one operation and can introduce extraneous
          solutions
        - Radical expressions cannot be simplified over integer coefficients
        correct_answer: 2
        explanation: Because (-k)^2 = k^2, squaring both sides can create roots that
          satisfy the squared equation but not the original radical equation (extraneous
          roots).
        concept_slugs:
        - alg-radical-equations
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-absolute-value-equals-negative
        question_text: What is the solution set to the absolute value equation $|2x
          + 1| = -7$?
        options:
        - x = -4 and x = 3
        - x = -4 only
        - x = 3 only
        - No solution (empty set)
        correct_answer: 3
        explanation: The absolute value of any real expression is non-negative (|u|
          >= 0). It can never equal -7, so the equation has no solution.
        concept_slugs:
        - alg-abs-equations
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What is an extraneous solution in algebraic equations?
      back: A solution that arises through valid steps (such as squaring both sides)
        that does not satisfy the original equation.
      concept_slugs:
      - alg-radical-equations
    - front: Why must you check candidate roots of rational equations?
      back: Because candidate roots may cause a denominator in the original equation
        to equal zero (division by zero).
      concept_slugs:
      - alg-rational-equations
    - front: What is the solution to |2x - 7| = -4?
      back: No solution (empty set), because an absolute value cannot equal a negative
        number.
      concept_slugs:
      - alg-abs-equations
  - code: '2.4'
    title: Solve systems of linear and non-linear equations in two variables
    description: Apply substitution and elimination methods to linear systems, classify
      systems by consistency and dependence, and solve non-linear systems.
    sort_order: 4
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 7.1: Systems of Linear Equations
      (Two Variables); Section 7.3: Systems of Nonlinear Equations'
    concepts:
    - slug: alg-linear-systems
      name: Linear Systems in Two Variables
      short_definition: Solving pairs of linear equations a1 x + b1 y = c1 and a2
        x + b2 y = c2 using substitution and elimination.
      description: Finding the simultaneous point of intersection (x, y) that satisfies
        both linear equations.
      citation: OpenStax College Algebra 1e, Section 7.1
    - slug: alg-system-classification
      name: 'Classification: Consistent, Inconsistent, and Dependent Systems'
      short_definition: Determining whether a system has one unique solution, no solution
        (parallel lines), or infinitely many solutions (coincident lines).
      description: 'Consistent independent: unique point; Inconsistent: parallel lines,
        no solution; Consistent dependent: identical line, infinitely many solutions.'
      citation: OpenStax College Algebra 1e, Section 7.1
      prerequisites:
      - alg-linear-systems
    - slug: alg-nonlinear-systems
      name: Nonlinear Systems of Equations
      short_definition: Solving systems where one or more equations are quadratic
        or higher order.
      description: Typically solved by substituting a linear expression into a quadratic
        equation to find points of intersection between lines and parabolas or circles.
      citation: OpenStax College Algebra 1e, Section 7.3
      prerequisites:
      - alg-linear-systems
    lessons:
    - title: Systems of Linear and Non-Linear Equations
      description: Analytical methods for solving 2x2 linear and non-linear systems
        using substitution and elimination, with geometric classifications.
      emoji: 🔄
      tags:
      - systems-of-equations
      - elimination
      - substitution
      concept_slugs:
      - alg-linear-systems
      - alg-system-classification
      - alg-nonlinear-systems
      citation: OpenStax College Algebra 1e, Sections 7.1 & 7.3
      terms:
      - term: System of Equations
        definition: A set of two or more equations containing the same set of variables.
      - term: Substitution Method
        definition: An algebraic method solving one equation for a variable and substituting
          that expression into the other equation.
      - term: Elimination (Addition) Method
        definition: Multiplying equations by strategic constants so that adding equations
          eliminates one variable.
      - term: Inconsistent System
        definition: A system of equations with no common solution, geometrically representing
          parallel lines.
      - term: Dependent System
        definition: A system of equations with infinitely many solutions, geometrically
          representing the exact same line.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: "### Solving $2 \\times 2$ Linear Systems\n\nA linear system in two\
            \ variables consists of two equations: $a_1 x + b_1 y = c_1$ and $a_2\
            \ x + b_2 y = c_2$. The two primary algebraic techniques are:\n\n1. **Substitution**:\
            \ Solve one equation for either $x$ or $y$ in terms of the other, substitute\
            \ that expression into the remaining equation, solve the single-variable\
            \ result, and back-substitute.\n2. **Elimination (Addition)**: Multiply\
            \ one or both equations by non-zero constants so that the coefficients\
            \ of one variable become additive opposites. Add the equations to eliminate\
            \ that variable, solve, and back-substitute.\n\n### System Classifications\n\
            \n- **Consistent and Independent**: Exactly **one unique solution** $(x,\
            \ y)$. Lines intersect at one point.\n- **Inconsistent**: **No solution**\
            \ ($\text{lines are parallel}$, identical slopes, different $y$-intercepts).\
            \ Algebraic result: false statement like $0 = 12$.\n- **Consistent and\
            \ Dependent**: **Infinitely many solutions** (coincident lines, identical\
            \ slopes and $y$-intercepts). Algebraic result: true statement like $0\
            \ = 0$."
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Parallel Lines Criterion
          body: Two lines are parallel (yielding an inconsistent system with 0 solutions)
            if and only if they have the exact same slope ($m_1 = m_2$) but different
            $y$-intercepts ($b_1 \neq b_2$).
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Classification Matrix for $2 \times 2$ Linear Systems

            | Classification | Number of Solutions | Geometric Relationship | Algebraic Indicator |
            | :--- | :--- | :--- | :--- |
            | **Independent** | Exactly One $(x, y)$ | Intersecting lines | Unique coordinates obtained |
            | **Inconsistent** | Zero (Empty set $\emptyset$) | Parallel lines ($m_1 = m_2, b_1 \neq b_2$) | Contradiction: $0 = k$ ($k \neq 0$) |
            | **Dependent** | Infinitely Many | Coincident identical lines | Identity: $0 = 0$ |
            | **Nonlinear (Line & Parabola)** | $0, 1$, or $2$ Points | Secant, tangent, or disjoint line | Quadratic discriminant $\Delta > 0, = 0, < 0$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Supply and Demand Market Equilibrium

            In microeconomics, the market equilibrium price $P$ and quantity $Q$ occur at the intersection of linear supply and demand equations. Suppose the market supply and demand functions for a consumer tech device are given by:

            $$\begin{cases} P = 2Q + 10 & \text{(Supply curve)} \\ P = -3Q + 60 & \text{(Demand curve)} \end{cases}$$

            Since both equations are solved for $P$, we equate the right-hand sides using substitution: $2Q + 10 = -3Q + 60$. Adding $3Q$ to both sides yields $5Q + 10 = 60$. Subtracting $10$ gives $5Q = 50 \implies Q = 10$ units. Substituting $Q = 10$ into either equation gives $P = 2(10) + 10 = \$30$. The unique equilibrium occurs at $(Q, P) = (10, 30)$.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common System Solving Pitfalls
          body: |-
            1. **Incomplete solutions**: Solving for $x$ and forgetting to calculate $y$. A solution to a 2-variable system is always an ordered pair $(x, y)$.
            2. **Multiplication errors in elimination**: Forgetting to multiply the constant term on the right side of the equation when multiplying by a factor.
      assessment_items:
      - id: alg-sim-linear-system-sum-of-solution
        prompt: 'Solve the linear system of equations: $3x + 2y = 12$ and $5x - 4y
          = -2$. What is the value of $x + y$?'
        interaction_type: single_choice
        response_spec:
          options:
          - '5'
          - '6'
          - '4'
          - '7'
        scoring_spec:
          correct_index: 0
        explanation: 'Use elimination by multiplying the first equation by 2: 2(3x
          + 2y) = 2(12) => 6x + 4y = 24. Add this to the second equation: (6x + 4y)
          + (5x - 4y) = 24 + (-2) => 11x = 22 => x = 2. Substitute x = 2 into the
          first equation: 3(2) + 2y = 12 => 6 + 2y = 12 => 2y = 6 => y = 3. The ordered
          pair is (2, 3), and x + y = 2 + 3 = 5.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 7.1
        concept_slugs:
        - alg-linear-systems
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-inconsistent-system-parameter
        prompt: For what real value of $k$ will the system of equations $2x - 3y =
          8$ and $4x - 6y = k$ be inconsistent (have no solution)?
        interaction_type: single_choice
        response_spec:
          options:
          - k = 16 only
          - Any real number k \neq 16
          - k = -16 only
          - Any real number k \neq 8
        scoring_spec:
          correct_index: 1
        explanation: 'Multiply the first equation by 2: 4x - 6y = 16. The second equation
          is 4x - 6y = k. If k = 16, the two equations are identical (dependent system
          with infinitely many solutions). If k != 16, the lines have identical slopes
          but different y-intercepts (parallel lines, inconsistent system with no
          solution).'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 7.1
        concept_slugs:
        - alg-system-classification
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-line-parabola-intersection
        prompt: Find all points of intersection between the line $y = 2x - 1$ and
          the parabola $y = x^2 - 4$.
        interaction_type: single_choice
        response_spec:
          options:
          - (3, 5) only
          - (-1, -3) only
          - (3, 5) and (-1, -3)
          - (2, 3) and (-2, 0)
        scoring_spec:
          correct_index: 2
        explanation: 'Equate the expressions for y: x^2 - 4 = 2x - 1. Rearrange into
          standard form: x^2 - 2x - 3 = 0. Factor: (x - 3)(x + 1) = 0 => x = 3 or
          x = -1. For x = 3: y = 2(3) - 1 = 5, giving point (3, 5). For x = -1: y
          = 2(-1) - 1 = -3, giving point (-1, -3). The points of intersection are
          (3, 5) and (-1, -3).'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 7.3
        concept_slugs:
        - alg-nonlinear-systems
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      questions:
      - id: alg-fmt-inconsistent-system-graph
        question_text: Graphically, what does an inconsistent linear system in two
          variables represent?
        options:
        - Two distinct parallel lines that never intersect
        - Two perpendicular lines that intersect at right angles
        - Two coincident lines that share every point in common
        - A line tangent to a circle at a single point
        correct_answer: 0
        explanation: An inconsistent system has zero solutions. In two dimensions,
          this corresponds to two distinct parallel lines with equal slopes and different
          intercepts.
        concept_slugs:
        - alg-system-classification
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-elimination-simple-system
        question_text: In the linear system $x + y = 6$ and $x - y = 2$, what is the
          value of $x$?
        options:
        - x = 2
        - x = 4
        - x = 3
        - x = 5
        correct_answer: 1
        explanation: 'Add the two equations together using elimination: (x + y) +
          (x - y) = 6 + 2 => 2x = 8 => x = 4.'
        concept_slugs:
        - alg-linear-systems
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What characterizes an inconsistent linear system in two variables?
      back: The equations represent parallel lines with the same slope but different
        intercepts; there is no solution (empty set).
      concept_slugs:
      - alg-system-classification
    - front: What characterizes a dependent linear system in two variables?
      back: The equations represent the exact same line; there are infinitely many
        solutions.
      concept_slugs:
      - alg-system-classification
    - front: How do you solve a system consisting of a linear equation and a quadratic
        equation?
      back: Solve the linear equation for one variable and substitute that expression
        into the quadratic equation.
      concept_slugs:
      - alg-nonlinear-systems
  - code: '2.5'
    title: Solve exponential and logarithmic equations and formulate growth and decay
      models
    description: Solve equations using the one-to-one properties of exponents and
      logarithms, apply natural logarithms to unlike bases, and model continuous compound
      interest and radioactive decay.
    sort_order: 5
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 6.6: Exponential and Logarithmic
      Equations; Section 6.7: Exponential and Logarithmic Models'
    concepts:
    - slug: alg-exponential-equations
      name: Solving Exponential Equations
      short_definition: Techniques for solving b^u = b^v and a^u = c using logarithms.
      description: If bases match, equate exponents. If bases differ, take the natural
        logarithm of both sides and isolate the variable.
      citation: OpenStax College Algebra 1e, Section 6.6
    - slug: alg-logarithmic-equations
      name: Solving Logarithmic Equations
      short_definition: Using condensing properties and converting to exponential
        form to solve equations with log terms.
      description: Condense multiple log terms into a single log, convert to exponential
        form, and reject any solution yielding a non-positive argument.
      citation: OpenStax College Algebra 1e, Section 6.6
      prerequisites:
      - alg-exponential-equations
    - slug: alg-growth-decay-models
      name: Exponential Growth, Decay, and Compound Interest
      short_definition: Continuous compounding A = P e^(rt) and exponential decay
        N(t) = N0 e^(-kt) models.
      description: Calculating doubling time, half-life, and interest growth using
        natural logarithms.
      citation: OpenStax College Algebra 1e, Section 6.7
      prerequisites:
      - alg-exponential-equations
    lessons:
    - title: Exponential and Logarithmic Equations and Models
      description: Systematic protocols for solving exponential and logarithmic equations,
        with applied models for continuous interest, growth, and half-life.
      emoji: 🌱
      tags:
      - exponential-equations
      - log-equations
      - growth-decay
      concept_slugs:
      - alg-exponential-equations
      - alg-logarithmic-equations
      - alg-growth-decay-models
      citation: OpenStax College Algebra 1e, Sections 6.6 & 6.7
      terms:
      - term: One-to-One Property of Exponents
        definition: If b^u = b^v for b > 0 and b != 1, then u = v.
      - term: One-to-One Property of Logarithms
        definition: If log_b(u) = log_b(v) for b > 0, b != 1, and u, v > 0, then u
          = v.
      - term: Continuous Compound Interest
        definition: The interest model A(t) = P e^(rt) where P is principal, r is
          annual rate, and t is time in years.
      - term: Half-Life
        definition: 'The time required for half of the atoms of a radioactive substance
          to disintegrate: t_half = ln(2) / k.'
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Solving Exponential Equations

            Exponential equations feature variables in exponents. Two primary scenarios arise:

            1. **Bases can be expressed identically**: Rewrite both sides with a common base and equate exponents using the one-to-one property:
            $$b^{f(x)} = b^{g(x)} \implies f(x) = g(x)$$
            2. **Bases cannot be made identical** (e.g. $3^x = 20$): Isolate the exponential expression, take the natural logarithm ($\ln$) of both sides, bring down the exponent using the power rule, and solve:
            $$\ln(3^x) = \ln(20) \implies x \ln(3) = \ln(20) \implies x = \frac{\ln(20)}{\ln(3)}$$

            ### Solving Logarithmic Equations

            1. Use logarithmic properties (product, quotient, power) to **condense** all logarithmic expressions into a single logarithm: $\log_b(M) = c$.
            2. Convert to **exponential form**: $M = b^c$.
            3. Solve for the variable.
            4. **CHECK for extraneous solutions**: Discard any candidate root that makes the argument of any original logarithm $\leq 0$.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Logarithmic Domain Checking is Mandatory
          body: Because $\log_b(x)$ is defined ONLY for $x > 0$, any candidate algebraic
            solution that produces a negative argument or zero in an original logarithm
            is extraneous and MUST be eliminated.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Exponential and Logarithmic Model Formulas

            | Model Type | Mathematical Equation | Key Variables / Parameters |
            | :--- | :--- | :--- |
            | **Continuous Growth** | $A(t) = A_0 e^{kt}$ ($k > 0$) | $A_0 = \text{initial value}, k = \text{continuous growth rate}$ |
            | **Continuous Decay** | $N(t) = N_0 e^{-kt}$ ($k > 0$) | $N_0 = \text{initial quantity}, k = \text{decay constant}$ |
            | **Doubling Time** | $t_{\text{double}} = \frac{\ln 2}{k}$ | Time required for quantity to double |
            | **Half-Life** | $t_{\text{half}} = \frac{\ln 2}{k}$ | Time required for quantity to decay to $50\%$ |
            | **Discrete Compound** | $A(t) = P\left(1 + \frac{r}{n}\right)^{nt}$ | $n = \text{compounding periods per year}$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Financial Doubling Time Model

            An investor deposits $\$5,000$ into a high-yield retirement bond earning an annual interest rate of $6\%$ compounded continuously. The accumulated value after $t$ years is modeled by $A(t) = 5000 e^{0.06t}$. To calculate the exact time required for the investment to double to $\$10,000$, we set $A(t) = 10000$:

            $$10000 = 5000 e^{0.06t} \implies 2 = e^{0.06t}$$

            Taking the natural logarithm of both sides gives $\ln(2) = \ln(e^{0.06t}) = 0.06t$. Dividing by $0.06$ yields:

            $$t = \frac{\ln(2)}{0.06} \approx \frac{0.6931}{0.06} \approx 11.55\text{ years}$$

            This classic rule illustrates how exponential growth equations reduce directly to logarithmic ratios.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Exponential Pitfalls
          body: |-
            1. **Multiplying base before exponent**: In $3 \cdot 2^x = 24$, you CANNOT multiply $3 \cdot 2 = 6^x$. You must first divide by 3: $2^x = 8 \implies x = 3$.
            2. **Confusing continuous vs discrete models**: Continuous compounding uses base $e$ ($A = P e^{rt}$); discrete compounding uses $(1 + r/n)^{nt}$. Do not interchange them.
      assessment_items:
      - id: alg-sim-exponential-equation-common-base
        prompt: Solve the exponential equation $4^{2x - 1} = 8^{x + 2}$ for $x$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = 5
          - x = 6
          - x = 7
          - x = 8
        scoring_spec:
          correct_index: 3
        explanation: 'Express both bases as powers of 2: 4 = 2^2 and 8 = 2^3. Rewrite:
          (2^2)^(2x - 1) = (2^3)^(x + 2) => 2^(4x - 2) = 2^(3x + 6). By the one-to-one
          property of exponents, equate the powers: 4x - 2 = 3x + 6. Subtract 3x and
          add 2: x = 8.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 6.6
        concept_slugs:
        - alg-exponential-equations
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-logarithmic-equation-domain-check
        prompt: Solve the logarithmic equation $\log_2(x) + \log_2(x - 3) = 2$ for
          $x$.
        interaction_type: single_choice
        response_spec:
          options:
          - x = 4 only
          - x = 4 and x = -1
          - x = 2 only
          - x = -1 only
        scoring_spec:
          correct_index: 0
        explanation: 'Apply the product rule of logarithms: log_2[x(x - 3)] = 2. Convert
          to equivalent exponential form: x(x - 3) = 2^2 = 4. Expand and rearrange:
          x^2 - 3x - 4 = 0. Factor: (x - 4)(x + 1) = 0 => candidate roots x = 4 and
          x = -1. Check in original equation: x = 4 produces log_2(4) + log_2(1) =
          2 + 0 = 2 (Valid). For x = -1, log_2(-1) is undefined (extraneous). Therefore,
          x = 4 is the sole valid solution.'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 6.6
        concept_slugs:
        - alg-logarithmic-equations
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      - id: alg-sim-radioactive-decay-continuous-model
        prompt: An initial sample of $200$ grams of a radioactive isotope decays according
          to the model $A(t) = 200 e^{-0.035t}$, where $t$ is in years. Which expression
          gives the half-life of the isotope in years?
        interaction_type: single_choice
        response_spec:
          options:
          - \frac{200}{\ln 2}
          - \frac{\ln 2}{0.035}
          - \frac{0.035}{\ln 2}
          - \frac{\ln 0.5}{-200}
        scoring_spec:
          correct_index: 1
        explanation: 'Half-life occurs when the amount remaining is half the initial
          value: 100 = 200 e^(-0.035t) => 0.5 = e^(-0.035t). Take the natural log
          of both sides: ln(0.5) = -0.035t. Since ln(0.5) = ln(1/2) = -ln(2), we have
          -ln(2) = -0.035t => t = ln(2) / 0.035.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 6.7
        concept_slugs:
        - alg-growth-decay-models
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '2.0'
      questions:
      - id: alg-fmt-exponential-equation-common-base
        question_text: Solve the exponential equation $2^{x + 1} = 16$ for $x$.
        options:
        - x = 4
        - x = 7
        - x = 3
        - x = 8
        correct_answer: 2
        explanation: 'Express 16 as a power of 2: 2^(x + 1) = 2^4. By the one-to-one
          property of exponents, x + 1 = 4 => x = 3.'
        concept_slugs:
        - alg-exponential-equations
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-continuous-compound-interest-formula
        question_text: What is the standard continuous compound interest formula for
          accumulated amount $A$?
        options:
        - A = P(1 + r)^t
        - A = P r t
        - A = P \ln(rt)
        - A = P e^{rt}
        correct_answer: 3
        explanation: Continuous compound interest is modeled by A = P e^(rt), where
          P is principal, r is the annual interest rate, and t is time in years.
        concept_slugs:
        - alg-growth-decay-models
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: How do you solve an exponential equation with different bases that cannot
        be rewritten as common powers (e.g. 5^x = 12)?
      back: 'Take the natural logarithm (ln) of both sides, bring down the exponent
        using the power rule, and solve for x: x = ln(12) / ln(5).'
      concept_slugs:
      - alg-exponential-equations
    - front: Why must solutions to logarithmic equations be checked for extraneous
        roots?
      back: Because the domain of a logarithm is strictly positive numbers (arguments
        > 0); any root resulting in log of zero or a negative number is invalid.
      concept_slugs:
      - alg-logarithmic-equations
    - front: What is the continuous compounding formula?
      back: A = P e^(rt), where P is principal, r is annual rate, and t is time in
        years.
      concept_slugs:
      - alg-growth-decay-models
- code: '3.0'
  title: Functions and their properties
  description: Definition, evaluation, domain, range, operations, composition, graphs,
    transformations, inverses, and asymptotes of functions.
  weight: 0.3
  sort_order: 3
  importance: core
  citation: College Board CLEP College Algebra Domain 3.0 (30%); OpenStax College
    Algebra 1e Chapters 3, 4, & 5
  objectives:
  - code: '3.1'
    title: Evaluate functions and determine their algebraic domain and range in interval
      notation
    description: Distinguish functions using the vertical line test, evaluate functions
      for algebraic arguments, and identify domain restrictions from formulas.
    sort_order: 1
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 3.1: Functions and Function Notation;
      Section 3.2: Domain and Range'
    concepts:
    - slug: alg-function-definition
      name: Definition of a Function
      short_definition: A relation pairing each input x in the domain with exactly
        one output y in the range.
      description: 'Verified graphically using the Vertical Line Test: no vertical
        line may intersect the graph in more than one point.'
      citation: OpenStax College Algebra 1e, Section 3.1
    - slug: alg-domain-algebraic
      name: Algebraic Determination of Domain
      short_definition: Finding all real numbers for which a function's formula is
        mathematically defined.
      description: 'Rules: Denominators cannot equal zero; radicands of even roots
        must be non-negative (>= 0); arguments of logarithms must be strictly positive
        (> 0).'
      citation: OpenStax College Algebra 1e, Section 3.2
      prerequisites:
      - alg-function-definition
    - slug: alg-range-intervals
      name: Determination of Range
      short_definition: The set of all possible resulting output values y produced
        by a function across its domain.
      description: Determined by examining graph behavior, vertices of parabolas,
        or inverse function domains.
      citation: OpenStax College Algebra 1e, Section 3.2
      prerequisites:
      - alg-domain-algebraic
    lessons:
    - title: Functions, Domain, Range, and Evaluation
      description: Core definition of a function, evaluation of expressions, vertical
        line test, and algebraic domain determination.
      emoji: 📊
      tags:
      - functions
      - domain
      - range
      concept_slugs:
      - alg-function-definition
      - alg-domain-algebraic
      - alg-range-intervals
      citation: OpenStax College Algebra 1e, Sections 3.1 & 3.2
      terms:
      - term: Function
        definition: A rule that assigns to each element x in a set (domain) exactly
          one element f(x) in a second set (range).
      - term: Domain
        definition: The set of all permissible input values for which a function produces
          a real output.
      - term: Range
        definition: The set of all actual output values produced by a function.
      - term: Vertical Line Test
        definition: A visual test stating that a curve in the coordinate plane represents
          a function if and only if no vertical line intersects the curve more than
          once.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Mathematical Nature of Functions

            A **function** $f$ from a set $X$ to a set $Y$ is a relation that associates each element $x \in X$ with **exactly one** element $y = f(x) \in Y$. Graphically, this single-output rule is verified by the **Vertical Line Test**: if every vertical line $x = c$ intersects a graph at most once, the graph represents a function.

            ### Determining Algebraic Domains

            When a function is defined by a formula with real coefficients, its **implied domain** consists of all real numbers for which the formula produces a real number. Three primary restrictions govern domain analysis:

            1. **Fractions**: Denominators cannot equal zero. For $f(x) = \frac{P(x)}{Q(x)}$, set $Q(x) \neq 0$.
            2. **Even Roots**: Radicands of even roots must be non-negative. For $f(x) = \sqrt[2k]{g(x)}$, set $g(x) \geq 0$.
            3. **Logarithms**: Arguments of logarithmic functions must be strictly positive. For $f(x) = \log_b(h(x))$, set $h(x) > 0$.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Even Roots vs. Odd Roots Domain Rule
          body: Radicands of **even roots** ($\sqrt{x}, \sqrt[4]{x}$) must be $\geq
            0$. However, **odd roots** ($\sqrt[3]{x}, \sqrt[5]{x}$) are defined for
            ALL real numbers, positive, zero, and negative. The domain of $\sqrt[3]{x}$
            is $(-\infty, \infty)$.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Domain and Range Restrictions by Parent Function

            | Parent Function | Mathematical Formula | Implied Domain | Implied Range |
            | :--- | :--- | :--- | :--- |
            | Linear | $f(x) = mx + b$ ($m \neq 0$) | $(-\infty, \infty)$ | $(-\infty, \infty)$ |
            | Quadratic | $f(x) = x^2$ | $(-\infty, \infty)$ | $[0, \infty)$ |
            | Absolute Value | $f(x) = |x|$ | $(-\infty, \infty)$ | $[0, \infty)$ |
            | Square Root | $f(x) = \sqrt{x}$ | $[0, \infty)$ | $[0, \infty)$ |
            | Cube Root | $f(x) = \sqrt[3]{x}$ | $(-\infty, \infty)$ | $(-\infty, \infty)$ |
            | Reciprocal | $f(x) = 1/x$ | $(-\infty, 0) \cup (0, \infty)$ | $(-\infty, 0) \cup (0, \infty)$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Economic Demand and Feasible Domain

            A manufacturing firm models its monthly revenue $R(p)$ as a quadratic function of unit price $p$ (in dollars):

            $$R(p) = -5p^2 + 300p$$

            While the purely algebraic domain of a polynomial is all real numbers $(-\infty, \infty)$, real-world physical and financial constraints require both price $p \geq 0$ and revenue $R(p) \geq 0$. Factoring yields $R(p) = -5p(p - 60) \geq 0$. The revenue is zero at $p = 0$ and $p = 60$, and strictly positive between them. Therefore, the **practical business domain** of the model is the closed interval $[0, 60]$ dollars.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Function Evaluation Errors
          body: |-
            1. **Evaluating $f(x + h)$**: In $f(x) = x^2 - 3$, evaluating $f(x + h)$ requires replacing every $x$ with $(x + h)$: $f(x + h) = (x + h)^2 - 3 = x^2 + 2xh + h^2 - 3$. It does NOT equal $f(x) + h = x^2 - 3 + h$.
            2. **Radical in denominator**: In $f(x) = \frac{1}{\sqrt{x - 4}}$, the condition is $x - 4 > 0$ (strict inequality), NOT $x - 4 \geq 0$, because the denominator cannot be zero.
      assessment_items:
      - id: alg-sim-domain-sqrt-over-linear
        prompt: What is the domain of the function $f(x) = \frac{\sqrt{x - 2}}{x -
          5}$ expressed in interval notation?
        interaction_type: single_choice
        response_spec:
          options:
          - '[2, 5) \cup (5, \infty)'
          - '[2, 5) \cup [5, \infty)'
          - (2, 5) \cup (5, \infty)
          - '[2, 5) \cup (5, 10]'
        scoring_spec:
          correct_index: 0
        explanation: 'Two conditions must be met: (1) The radicand under the square
          root must be non-negative: x - 2 >= 0 => x >= 2. (2) The denominator cannot
          equal zero: x - 5 != 0 => x != 5. Combining both conditions gives all real
          numbers greater than or equal to 2 except 5: [2, 5) U (5, infinity).'
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.2
        concept_slugs:
        - alg-domain-algebraic
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
