        - (-4, 7)
        - (4, 7)
        - (7, -4)
        correct_answer: 1
        explanation: For an odd function, f(-x) = -f(x). If f(4) = -7, then f(-4)
          = -f(4) = -(-7) = 7, giving the point (-4, 7).
