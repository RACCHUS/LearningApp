          domain_code: '3.0'
      - id: alg-sim-difference-quotient-quadratic
        prompt: Given the function $f(x) = 2x^2 - 3x + 1$, evaluate the difference
          quotient $\frac{f(x + h) - f(x)}{h}$ for $h \neq 0$.
        interaction_type: single_choice
        response_spec:
          options:
          - 4x - 3 + h
          - 4x - 3 + 2h
          - 4x + 2h
          - 2h - 3
        scoring_spec:
          correct_index: 1
        explanation: 'Compute f(x + h) = 2(x + h)^2 - 3(x + h) + 1 = 2(x^2 + 2xh +
          h^2) - 3x - 3h + 1 = 2x^2 + 4xh + 2h^2 - 3x - 3h + 1. Subtract f(x): f(x
          + h) - f(x) = [2x^2 + 4xh + 2h^2 - 3x - 3h + 1] - [2x^2 - 3x + 1] = 4xh
          + 2h^2 - 3h. Divide by h: (4xh + 2h^2 - 3h) / h = 4x - 3 + 2h.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 3.1
        concept_slugs:
