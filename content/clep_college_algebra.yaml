      questions:
      - id: alg-fmt-evaluate-factorial
        question_text: What is the numerical value of $5!$ (five factorial)?
        options:
        - '24'
        - '60'
        - '120'
        - '720'
        correct_answer: 2
        explanation: By definition, 5! = 5 * 4 * 3 * 2 * 1 = 120.
        concept_slugs:
        - alg-factorials-permutations
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-combination-vs-permutation
        question_text: When selecting a 4-person committee from 10 volunteers, which
          counting method is appropriate and why?
        options:
        - Permutations, because committee members have distinct names
        - Factorials only, because all 10 volunteers are assigned roles
        - Powers of 10, because the pool size is 10 volunteers
        - Combinations, because the order of selection within the committee does not
          matter
        correct_answer: 3
        explanation: A committee without designated ranks or offices is an un-ordered
          subset. Therefore, combinations C(10, 4) must be used.
        concept_slugs:
        - alg-combinations
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What is the key difference between a permutation and a combination?
      back: In a permutation, ORDER MATTERS (P(n, r) = n!/(n-r)!); in a combination,
        ORDER DOES NOT MATTER (C(n, r) = n!/[r!(n-r)!]).
      concept_slugs:
      - alg-factorials-permutations
      - alg-combinations
    - front: What is the value of 0! by definition?
      back: 0! = 1.
      concept_slugs:
      - alg-factorials-permutations
    - front: In the expansion of (a + b)^n using the Binomial Theorem, what is the
        formula for the (k + 1)-th term?
      back: C(n, k) * a^(n - k) * b^k
      concept_slugs:
