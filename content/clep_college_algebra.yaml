      - id: alg-sim-ordered-medal-permutations
        prompt: In a regional track meet with 10 competitors, how many different ways
          can the 1st, 2nd, and 3rd place medals be awarded?
        interaction_type: single_choice
        response_spec:
          options:
          - '120'
          - '720'
          - '240'
          - '1000'
        scoring_spec:
          correct_index: 1
        explanation: Because medal positions represent distinct rankings (1st, 2nd,
          3rd), order matters, so this is a permutation P(10, 3) = 10! / (10 - 3)!
          = 10! / 7! = 10 * 9 * 8 = 720 ways.
        difficulty: beginner
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 9.5
