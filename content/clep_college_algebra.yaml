          domain_code: '4.0'
      - id: alg-sim-binomial-expansion-coefficient
        prompt: Find the numerical coefficient of the $x^3$ term in the binomial expansion
          of $(2x - 1)^5$.
        interaction_type: single_choice
        response_spec:
          options:
          - '80'
          - '-80'
          - '40'
          - '-40'
        scoring_spec:
          correct_index: 0
        explanation: 'In (a + b)^5 with a = 2x and b = -1, the general term is C(5,
          k) a^(5 - k) b^k. To obtain x^3, we need a^3 = (2x)^3, which means 5 - k
          = 3 => k = 2. Compute the term: C(5, 2) * (2x)^3 * (-1)^2 = [5! / (2! 3!)]
          * (8x^3) * (1) = 10 * 8x^3 = 80x^3. The coefficient is 80.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 9.6
        concept_slugs:
