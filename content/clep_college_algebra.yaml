  - code: '3.4'
    title: Apply vertical and horizontal shifts, reflections, and scaling transformations
    description: Transform parent functions using g(x) = a f(b(x - h)) + k, identifying
      vertical/horizontal shifts, reflections across axes, and stretches/compressions.
    sort_order: 4
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 3.5: Transformation of Functions'
    concepts:
    - slug: alg-shifts
      name: Vertical and Horizontal Shifts
      short_definition: Translations f(x) + k shifting vertically and f(x - h) shifting
        horizontally.
      description: Adding k shifts up (k>0) or down (k<0); subtracting h inside the
        function shifts right (h>0) or left (h<0).
      citation: OpenStax College Algebra 1e, Section 3.5
    - slug: alg-reflections
      name: Reflections Across Axes
      short_definition: -f(x) reflects across the x-axis; f(-x) reflects across the
        y-axis.
      description: Negating the outside negates y-coordinates; negating the inside
        negates x-coordinates.
      citation: OpenStax College Algebra 1e, Section 3.5
      prerequisites:
      - alg-shifts
    - slug: alg-stretches-compressions
      name: Vertical and Horizontal Stretches and Compressions
      short_definition: Scaling transformations a f(x) and f(b x).
      description: '|a| > 1 stretches vertically; 0 < |a| < 1 compresses vertically.
        |b| > 1 compresses horizontally; 0 < |b| < 1 stretches horizontally.'
      citation: OpenStax College Algebra 1e, Section 3.5
      prerequisites:
      - alg-reflections
    lessons:
    - title: Transformations of Parent Functions
      description: 'Rigorous rules for transforming parent functions: vertical and
        horizontal translations, reflections, and non-rigid scalings.'
      emoji: 🔀
      tags:
      - transformations
      - shifts
      - reflections
      - stretches
      concept_slugs:
      - alg-shifts
      - alg-reflections
      - alg-stretches-compressions
      citation: OpenStax College Algebra 1e, Section 3.5
      terms:
      - term: Parent Function
        definition: The simplest function in a family of functions that preserves
          the shape of the family (e.g. y = x^2, y = |x|).
      - term: Rigid Transformation
        definition: A transformation that changes only the position of the graph without
          changing its size or shape (translations and reflections).
      - term: Non-Rigid Transformation
        definition: A transformation that distorts the shape of the graph by stretching
          or compressing it vertically or horizontally.
      - term: Horizontal Shift
        definition: Replacing x with (x - h) in f(x), which shifts the graph right
          by h units if h > 0, and left if h < 0.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### The Anatomy of Function Transformations

            Starting from a basic parent function $y = f(x)$, any transformed function can be expressed in general form as:

            $$g(x) = a \cdot f(b(x - h)) + k$$

            Each parameter controls a specific geometric alteration of the graph:

            - **$k$ (Vertical Shift)**: Shifts the graph up if $k > 0$ and down if $k < 0$.
            - **$h$ (Horizontal Shift)**: Shifts the graph right if $h > 0$ (i.e. $x - h$) and left if $h < 0$ (i.e. $x + |h|$).
            - **$a$ (Vertical Scaling / Reflection)**: If $a < 0$, reflects the graph across the **$x$-axis**. Stretches vertically if $|a| > 1$; compresses vertically if $0 < |a| < 1$.
            - **$b$ (Horizontal Scaling / Reflection)**: If $b < 0$, reflects the graph across the **$y$-axis**. Compresses horizontally by factor $\frac{1}{|b|}$ if $|b| > 1$; stretches horizontally if $0 < |b| < 1$.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: The Horizontal Shift Sign Counter-Intuition
          body: |-
            Transformations applied **inside** the function with $x$ act counter-intuitively:
            • $f(x - 3)$ shifts **RIGHT** 3 units.
            • $f(x + 3)$ shifts **LEFT** 3 units.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Coordinate Transformation Mapping Rule

            | Transformation | Algebraic Expression | Coordinate Mapping $(x, y) \mapsto$ |
            | :--- | :--- | :--- |
            | Vertical shift up $k$ | $f(x) + k$ | $(x, y + k)$ |
            | Horizontal shift right $h$ | $f(x - h)$ | $(x + h, y)$ |
            | Reflection across $x$-axis | $-f(x)$ | $(x, -y)$ |
            | Reflection across $y$-axis | $f(-x)$ | $(-x, y)$ |
            | Vertical stretch by factor $a$ | $a f(x)$ ($a > 1$) | $(x, a y)$ |
            | Horizontal compression by $b$ | $f(bx)$ ($b > 1$) | $(x/b, y)$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Sound Wave Amplitude and Phase Shift Modeling

            In audio signal processing, an acoustic sound wave pulse modeled by a parent envelope function $f(t)$ is passed through an audio amplifier and delay filter. The amplifier doubles the output signal intensity, inverts the signal phase (reflection across the time axis), delays the pulse by $4$ milliseconds, and raises the baseline voltage by $1.5$ volts. Using our transformation parameters, we construct the resulting output wave function $V(t)$:

            $$V(t) = -2 \cdot f(t - 4) + 1.5$$

            Here $a = -2$ (vertical stretch by 2 and reflection across $t$-axis), $h = 4$ (horizontal shift right by 4 ms delay), and $k = 1.5$ (vertical shift up by 1.5 V).
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Transformation Pitfalls
          body: |-
            1. **Order of transformations**: When multiple transformations occur, follow the standard order: (1) horizontal shift, (2) horizontal scaling/reflection, (3) vertical scaling/reflection, (4) vertical shift.
            2. **Factoring the inside**: In $f(2x - 6)$, the horizontal shift is NOT 6! You must factor out 2: $f(2(x - 3))$, which reveals a horizontal compression by 2 and a shift right by 3 units.
      assessment_items:
      - id: alg-sim-parent-quadratic-transformation-sequence
        prompt: Which sequence of geometric transformations transforms the graph of
          the parent function $f(x) = x^2$ into the graph of $g(x) = -(x + 4)^2 -
          5$?
        interaction_type: single_choice
        response_spec:
          options:
          - Shift right 4 units, reflect across the x-axis, shift up 5 units
          - Shift left 4 units, reflect across the x-axis, shift down 5 units
          - Shift left 4 units, reflect across the y-axis, shift down 5 units
          - Shift right 4 units, reflect across the y-axis, shift down 5 units
        scoring_spec:
          correct_index: 1
        explanation: 'Examining g(x) = -(x + 4)^2 - 5: (1) Replacing x with (x + 4)
          shifts the graph left 4 units. (2) The negative sign in front of the square
          reflects the graph across the x-axis. (3) Subtracting 5 shifts the graph
          down 5 units.'
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.5
        concept_slugs:
        - alg-shifts
        - alg-reflections
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-point-under-combined-transformation
        prompt: If the point $(3, 8)$ lies on the graph of $y = f(x)$, what point
          must lie on the graph of $y = 2f(x - 1) + 3$?
        interaction_type: single_choice
        response_spec:
          options:
          - (2, 19)
          - (4, 11)
          - (4, 19)
          - (2, 13)
        scoring_spec:
          correct_index: 2
        explanation: 'Using coordinate mapping: The replacement (x - 1) shifts x coordinates
          to the right by 1, so the new x is 3 + 1 = 4. The vertical operations multiply
          y by 2 and add 3, so the new y is 2(8) + 3 = 16 + 3 = 19. The resulting
          point is (4, 19).'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 3.5
        concept_slugs:
        - alg-shifts
        - alg-stretches-compressions
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-reflect-and-shift-square-root
        prompt: Write the equation of the function $g(x)$ resulting from reflecting
          the parent square root function $f(x) = \sqrt{x}$ across the $y$-axis and
          shifting it up $2$ units.
        interaction_type: single_choice
        response_spec:
          options:
          - g(x) = -\sqrt{x} + 2
          - g(x) = \sqrt{x + 2}
          - g(x) = -\sqrt{x - 2}
          - g(x) = \sqrt{-x} + 2
        scoring_spec:
          correct_index: 3
        explanation: 'Reflecting across the y-axis requires replacing x with -x inside
          the radical: sqrt(-x). Shifting up 2 units adds 2 outside the radical: sqrt(-x)
          + 2.'
        difficulty: intermediate
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.5
        concept_slugs:
        - alg-reflections
        - alg-shifts
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      questions:
      - id: alg-fmt-horizontal-shift
        question_text: What geometric shift does the transformation $g(x) = f(x -
          5)$ represent relative to $f(x)$?
        options:
        - Horizontal shift to the left by 5 units
        - Vertical shift up by 5 units
        - Horizontal shift to the right by 5 units
        - Vertical shift down by 5 units
        correct_answer: 2
        explanation: Replacing x with (x - h) where h = 5 shifts the graph horizontally
          to the right by 5 units.
        concept_slugs:
        - alg-shifts
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-reflection-across-x-axis
        question_text: How does the graph of $y = -f(x)$ compare geometrically to
          the graph of $y = f(x)$?
        options:
        - It is reflected across the y-axis
        - It is reflected across the diagonal line y = x
        - It is shifted downward by 1 unit
        - It is reflected across the x-axis
        correct_answer: 3
        explanation: Negating the outside of a function negates all y-coordinates,
          which geometrically reflects the graph across the horizontal x-axis.
        concept_slugs:
        - alg-reflections
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What is the effect of replacing x with (x - h) in f(x) when h > 0?
      back: The graph shifts horizontally to the RIGHT by h units.
      concept_slugs:
      - alg-shifts
    - front: What is the difference between -f(x) and f(-x)?
      back: -f(x) reflects the graph across the x-axis; f(-x) reflects the graph across
        the y-axis.
      concept_slugs:
      - alg-reflections
    - front: What transformation does 3f(x) produce on the graph of f(x)?
      back: A vertical stretch by a factor of 3 (all y-values are multiplied by 3).
      concept_slugs:
      - alg-stretches-compressions
  - code: '3.5'
    title: Determine one-to-one status, verify inverse functions, and find inverse
      equations
    description: Apply the horizontal line test for one-to-one functions, algebraically
      find inverse formulas f^(-1)(x), and verify inverse properties via composition.
    sort_order: 5
    importance: core
    citation: 'OpenStax College Algebra 1e, Section 3.7: Inverse Functions'
    concepts:
    - slug: alg-one-to-one-functions
      name: One-to-One Functions and Horizontal Line Test
      short_definition: A function is one-to-one if each output y corresponds to exactly
        one input x.
      description: 'Verified graphically by the Horizontal Line Test: no horizontal
        line may intersect the graph more than once.'
      citation: OpenStax College Algebra 1e, Section 3.7
    - slug: alg-inverse-algebraic
      name: Algebraic Determination of Inverse Functions
      short_definition: Finding f^(-1)(x) by replacing f(x) with y, swapping x and
        y, and solving for y.
      description: The domain of f equals the range of f^(-1), and the range of f
        equals the domain of f^(-1).
      citation: OpenStax College Algebra 1e, Section 3.7
      prerequisites:
      - alg-one-to-one-functions
    - slug: alg-inverse-verification
      name: Verification of Inverses via Composition
      short_definition: Two functions f and g are inverses if and only if f(g(x))
        = x and g(f(x)) = x.
      description: The graphs of inverse functions are reflections of each other across
        the line y = x.
      citation: OpenStax College Algebra 1e, Section 3.7
      prerequisites:
      - alg-inverse-algebraic
    lessons:
    - title: Inverse Functions and One-to-One Criteria
      description: One-to-one function criteria, the horizontal line test, algebraic
        methods for finding inverse functions, and composition verification.
      emoji: 🪞
      tags:
      - inverse-functions
      - one-to-one
      - horizontal-line-test
      concept_slugs:
      - alg-one-to-one-functions
      - alg-inverse-algebraic
      - alg-inverse-verification
      citation: OpenStax College Algebra 1e, Section 3.7
      terms:
      - term: One-to-One Function
        definition: 'A function where no two distinct inputs produce the same output:
          if f(a) = f(b), then a = b.'
      - term: Horizontal Line Test
        definition: A visual test stating that a function has an inverse if and only
          if no horizontal line intersects its graph more than once.
      - term: Inverse Function
        definition: 'A function denoted f^(-1) that undoes the action of f: f(f^(-1)(x))
          = x and f^(-1)(f(x)) = x.'
      - term: Line of Reflection y = x
        definition: The diagonal line across which the graph of a function and its
          inverse are symmetric.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### One-to-One Functions and Invertibility

            A function $f$ has an **inverse function**, denoted $f^{-1}$, if and only if it is **one-to-one (injective)**: each $y$-value in the range corresponds to exactly one $x$-value in the domain. Graphically, a function is one-to-one if it passes the **Horizontal Line Test**: no horizontal line intersects the graph at more than one point.

            ### Systematic Procedure to Find $f^{-1}(x)$

            1. Verify that $f$ is one-to-one (restrict domain if necessary, as with parabolas $x \geq 0$).
            2. Replace $f(x)$ with $y$: $y = f(x)$.
            3. **Interchange variables**: Swap $x$ and $y$ ($x = f(y)$).
            4. **Solve for $y$** in terms of $x$.
            5. Replace $y$ with $f^{-1}(x)$.
            6. Verify using composition: $(f \circ f^{-1})(x) = x$ and $(f^{-1} \circ f)(x) = x$.
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: The Notation $f^{-1}(x)$ is NOT an Exponent
          body: Do not confuse $f^{-1}(x)$ with a reciprocal exponent! $f^{-1}(x)
            \neq \frac{1}{f(x)}$. For example, if $f(x) = 2x + 1$, then $f^{-1}(x)
            = \frac{x - 1}{2}$, whereas $\frac{1}{f(x)} = \frac{1}{2x + 1}$.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Function and Inverse Relationship Properties

            | Property | Function $f$ | Inverse Function $f^{-1}$ |
            | :--- | :--- | :--- |
            | **Domain** | $\text{Domain}(f)$ | Equal to $\text{Range}(f)$ |
            | **Range** | $\text{Range}(f)$ | Equal to $\text{Domain}(f)$ |
            | **Ordered Pair** | $(a, b)$ on graph | $(b, a)$ on graph |
            | **Symmetry** | Reflected across line $y = x$ | Reflected across line $y = x$ |
            | **Composition Identity** | $(f \circ f^{-1})(x) = x$ | $(f^{-1} \circ f)(x) = x$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Temperature Conversion Inverse Functions

            A meteorological laboratory converts temperature readings between Celsius ($C$) and Fahrenheit ($F$). The standard conversion formula is $F(C) = \frac{9}{5}C + 32$. To find the inverse function giving Celsius as a function of Fahrenheit, we solve for $C$:

            $$F - 32 = \frac{9}{5}C \implies C(F) = \frac{5}{9}(F - 32)$$

            Verifying via composition:

            $$C(F(C)) = \frac{5}{9}\left(\left(\frac{9}{5}C + 32\right) - 32\right) = \frac{5}{9}\left(\frac{9}{5}C\right) = C$$

            This confirms that $C(F)$ is the exact mathematical inverse of $F(C)$.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Inverse Function Pitfalls
          body: |-
            1. **Inverting non-one-to-one functions**: Quadratic functions like $f(x) = x^2$ do NOT have an inverse on $(-\infty, \infty)$ because they fail the horizontal line test. The domain must be restricted (e.g. $x \geq 0$) to make the function one-to-one.
            2. **Rational algebra in swapping**: When solving for $y$ in $x = \frac{ay + b}{cy + d}$, you must cross-multiply, collect all terms with $y$ on one side, factor out $y$, and divide.
      assessment_items:
      - id: alg-sim-inverse-of-rational-function
        prompt: Find the inverse function $f^{-1}(x)$ for the one-to-one rational
          function $f(x) = \frac{2x + 1}{x - 3}$ for $x \neq 3$.
        interaction_type: single_choice
        response_spec:
          options:
          - f^{-1}(x) = \frac{3x + 1}{x - 2}
          - f^{-1}(x) = \frac{x - 3}{2x + 1}
          - f^{-1}(x) = \frac{3x - 1}{x + 2}
          - f^{-1}(x) = \frac{2x - 1}{x + 3}
        scoring_spec:
          correct_index: 0
        explanation: 'Write as y = (2x + 1)/(x - 3). Interchange x and y: x = (2y
          + 1)/(y - 3). Multiply both sides by (y - 3): x(y - 3) = 2y + 1 => xy -
          3x = 2y + 1. Collect y terms on one side: xy - 2y = 3x + 1. Factor out y:
          y(x - 2) = 3x + 1. Divide by (x - 2): y = (3x + 1)/(x - 2). Thus f^(-1)(x)
          = (3x + 1)/(x - 2).'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 3.7
        concept_slugs:
        - alg-inverse-algebraic
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-quadratic-inverse-domain-restriction
        prompt: What domain restriction must be placed on the quadratic function $f(x)
          = (x - 2)^2 + 3$ so that its inverse $f^{-1}(x)$ exists as a function?
        interaction_type: single_choice
        response_spec:
          options:
          - x \geq -2
          - x \geq 2
          - x \leq 3
          - All real numbers x
        scoring_spec:
          correct_index: 1
        explanation: A parabola fails the horizontal line test on its full domain
          (-infinity, infinity). To make it one-to-one, we restrict the domain to
          values on one side of its vertex (x = 2). Restricting to x >= 2 (or x <=
          2) makes the function strictly increasing (or decreasing) and therefore
          one-to-one.
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 3.7
        concept_slugs:
        - alg-one-to-one-functions
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-inverse-of-linear-function
        prompt: If $f(x) = 4x - 7$, which of the following is the inverse function
          $f^{-1}(x)$?
        interaction_type: single_choice
        response_spec:
          options:
          - f^{-1}(x) = \frac{1}{4x - 7}
          - f^{-1}(x) = \frac{x - 7}{4}
          - f^{-1}(x) = \frac{x + 7}{4}
          - f^{-1}(x) = 4x + 7
        scoring_spec:
          correct_index: 2
        explanation: 'Set y = 4x - 7. Swap variables: x = 4y - 7. Solve for y: x +
          7 = 4y => y = (x + 7)/4. Therefore f^(-1)(x) = (x + 7)/4.'
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 3.7
        concept_slugs:
        - alg-inverse-algebraic
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      questions:
      - id: alg-fmt-horizontal-line-test
        question_text: Which geometric test verifies whether a function has an inverse
          that is also a function?
        options:
        - Horizontal Line Test
        - Vertical Line Test
        - First Derivative Test
        - Symmetry Axis Test
        correct_answer: 0
        explanation: The Horizontal Line Test verifies whether a function is one-to-one.
          If no horizontal line crosses the graph more than once, its inverse is a
          valid function.
        concept_slugs:
        - alg-one-to-one-functions
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-inverse-function-value
        question_text: If $f(2) = 9$ for a one-to-one function $f$, what is the value
          of $f^{-1}(9)$?
        options:
        - \frac{1}{9}
        - '2'
        - \frac{1}{2}
        - '-9'
        correct_answer: 1
        explanation: By definition of an inverse function, if f(a) = b, then f^(-1)(b)
          = a. Since f(2) = 9, f^(-1)(9) = 2.
        concept_slugs:
        - alg-inverse-algebraic
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: What does the Horizontal Line Test verify?
      back: Whether a function is one-to-one, which determines if its inverse is also
        a function.
      concept_slugs:
      - alg-one-to-one-functions
    - front: What is the relationship between the graphs of f(x) and f^(-1)(x)?
      back: They are reflections of each other across the diagonal line y = x.
      concept_slugs:
      - alg-inverse-verification
    - front: What is the domain of f^(-1)(x) in terms of f(x)?
      back: The domain of f^(-1) is the RANGE of f.
      concept_slugs:
      - alg-inverse-algebraic
  - code: '3.6'
    title: Analyze rational functions, identify vertical and horizontal asymptotes,
