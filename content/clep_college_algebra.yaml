      description: After simplifying, real zeros of the denominator correspond to
        vertical asymptotes x = c.
      citation: OpenStax College Algebra 1e, Section 5.6
    - slug: alg-horizontal-asymptotes
      name: Horizontal and Slant Asymptotes
      short_definition: Horizontal lines y = L describing end behavior as x -> ±infinity
        based on numerator and denominator degrees.
      description: 'Rules: deg(num) < deg(den) => y = 0; deg(num) = deg(den) => y
        = an/bd; deg(num) = deg(den) + 1 => slant asymptote found by polynomial division.'
      citation: OpenStax College Algebra 1e, Section 5.6
      prerequisites:
      - alg-vertical-asymptotes
    - slug: alg-rational-end-behavior
      name: End Behavior of Rational Functions
      short_definition: Analysis of function values as x approaches positive or negative
        infinity.
      description: Governed entirely by the ratio of leading terms of the numerator
        and denominator polynomials.
      citation: OpenStax College Algebra 1e, Section 5.6
      prerequisites:
      - alg-horizontal-asymptotes
    lessons:
    - title: Rational Functions and Asymptotic Behavior
      description: Determining vertical asymptotes, removable holes, horizontal asymptotes
        by degree comparison, slant asymptotes, and end behavior.
      emoji: 📐
      tags:
      - rational-functions
      - asymptotes
      - end-behavior
      concept_slugs:
      - alg-vertical-asymptotes
      - alg-horizontal-asymptotes
      - alg-rational-end-behavior
      citation: OpenStax College Algebra 1e, Section 5.6
      terms:
      - term: Vertical Asymptote
        definition: A vertical line x = c where the function values approach +infinity
          or -infinity as x approaches c.
      - term: Horizontal Asymptote
        definition: A horizontal line y = L that the graph approaches as x approaches
          +infinity or -infinity.
      - term: Removable Discontinuity (Hole)
        definition: A point (c, L) where a rational function is undefined because
          a common factor (x - c) cancels from both numerator and denominator.
      - term: Slant (Oblique) Asymptote
        definition: A non-horizontal linear asymptote y = mx + b occurring when the
          degree of the numerator is exactly 1 greater than the degree of the denominator.
      blocks:
      - sort_order: 1
        block_type: markdown
        content:
          text: |-
            ### Vertical Asymptotes vs. Removable Holes

            For a rational function $f(x) = \frac{P(x)}{Q(x)}$ factored completely:

            1. **Removable Hole**: If a factor $(x - c)$ appears in **both** numerator and denominator, canceling it leaves a hole at $x = c$. The $y$-coordinate is found by evaluating the simplified expression at $x = c$.
            2. **Vertical Asymptote**: If $(x - c)$ is a factor of the denominator that does **not** cancel completely, the line $x = c$ is a **vertical asymptote** ($f(x) \to \pm\infty$ as $x \to c$).

            ### Horizontal and Slant Asymptotes: Degree Rules

            Let $n = \text{degree}(P)$ and $d = \text{degree}(Q)$, with leading terms $a_n x^n$ and $b_d x^d$:

            - **Case 1 ($n < d$)**: The denominator grows faster. The **horizontal asymptote is $y = 0$** ($x$-axis).
            - **Case 2 ($n = d$)**: Degrees are equal. The **horizontal asymptote is $y = \frac{a_n}{b_d}$** (ratio of leading coefficients).
            - **Case 3 ($n = d + 1$)**: Degree of numerator is exactly 1 higher. There is **no horizontal asymptote**, but there is a **slant (oblique) asymptote** $y = mx + b$, found by polynomial division.
            - **Case 4 ($n > d + 1$)**: No horizontal or slant asymptote (end behavior resembles a polynomial curve).
      - sort_order: 2
        block_type: callout
        content:
          type: key_concept
          title: Crossing Asymptotes Rule
          body: A graph can **NEVER** cross a vertical asymptote, because the function
            is undefined there ($x = c$ is outside the domain). However, a graph **CAN**
            cross a horizontal or slant asymptote, which only governs end behavior
            as $x \to \pm\infty$.
      - sort_order: 3
        block_type: markdown
        content:
          text: |-
            ### Asymptote Determination Hierarchy

            | Degree Relationship | Asymptote Type | Equation Formula | Example |
            | :--- | :--- | :--- | :--- |
            | $\text{deg}(P) < \text{deg}(Q)$ | Horizontal Asymptote | $y = 0$ | $f(x) = \frac{3x + 1}{x^2 - 4} \implies y = 0$ |
            | $\text{deg}(P) = \text{deg}(Q)$ | Horizontal Asymptote | $y = \frac{a_n}{b_d}$ | $f(x) = \frac{6x^2 - 1}{2x^2 + 5} \implies y = 3$ |
            | $\text{deg}(P) = \text{deg}(Q) + 1$ | Slant (Oblique) Asymptote | $y = \text{Quotient}(x)$ | $f(x) = \frac{2x^2 + 3x}{x - 1} \implies y = 2x + 5$ |
            | Denominator root (non-canceled) | Vertical Asymptote | $x = c$ | $f(x) = \frac{1}{x - 4} \implies x = 4$ |
            | Common factor canceled | Removable Discontinuity | Hole at $(c, L)$ | $f(x) = \frac{(x-2)(x+3)}{x-2} \implies (2, 5)$ |
      - sort_order: 4
        block_type: markdown
        content:
          text: |-
            ### Applied Problem: Average Manufacturing Cost Model

            An industrial manufacturing facility produces custom mechanical components. The total monthly cost $C(x)$ (in dollars) to manufacture $x$ units is given by $C(x) = 15000 + 45x$, where $\$15,000$ is fixed overhead and $\$45$ is unit variable cost. The **average cost per unit** $\bar{C}(x)$ is the rational function:

            $$\bar{C}(x) = \frac{C(x)}{x} = \frac{15000 + 45x}{x} = \frac{15000}{x} + 45$$

            Here $\text{degree}(15000 + 45x) = 1$ and $\text{degree}(x) = 1$. The horizontal asymptote is $y = \frac{45}{1} = 45$. As production volume increases indefinitely ($x \to \infty$), the fixed overhead per unit $\frac{15000}{x} \to 0$, meaning the average unit cost approaches a minimum asymptotic floor of $\$45$.
      - sort_order: 5
        block_type: callout
        content:
          type: warning
          title: Common Rational Function Pitfalls
          body: |-
            1. **Declaring a hole as a vertical asymptote**: In $f(x) = \frac{x^2 - 9}{x - 3} = \frac{(x-3)(x+3)}{x-3}$, the factor $(x - 3)$ cancels completely. There is NO vertical asymptote at $x = 3$; instead, there is a removable hole at $(3, 6)$.
            2. **Ignoring the remainder in slant asymptotes**: When finding a slant asymptote via long division, the slant asymptote is strictly the linear quotient $y = mx + b$; discard the fractional remainder.
      assessment_items:
      - id: alg-sim-rational-function-asymptotes-and-holes
        prompt: Identify all vertical asymptotes and holes for the rational function
          $f(x) = \frac{x^2 - 4}{x^2 - x - 2}$.
        interaction_type: single_choice
        response_spec:
          options:
          - Vertical asymptotes at x = 2 and x = -1; no holes
          - Vertical asymptote at x = 2; hole at x = -1
          - Vertical asymptote at x = -2; hole at x = 2
          - Vertical asymptote at x = -1; hole at x = 2
        scoring_spec:
          correct_index: 3
        explanation: 'Factor numerator and denominator completely: f(x) = [(x - 2)(x
          + 2)] / [(x - 2)(x + 1)]. The common factor (x - 2) cancels, creating a
          removable discontinuity (hole) at x = 2. The remaining factor in the denominator
          is (x + 1), which produces a vertical asymptote at x = -1.'
        difficulty: intermediate
        cognitive_level: analysis
        citation: OpenStax College Algebra 1e, Section 5.6
        concept_slugs:
        - alg-vertical-asymptotes
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-horizontal-asymptote-equal-degree
        prompt: Find the horizontal asymptote of the rational function $f(x) = \frac{6x^2
          - 5x + 1}{2x^2 + 7}$.
        interaction_type: single_choice
        response_spec:
          options:
          - y = 3
          - y = 0
          - y = 7
          - y = 2
        scoring_spec:
          correct_index: 0
        explanation: 'Compare the degrees of numerator and denominator: degree of
          numerator is 2, and degree of denominator is 2. Because the degrees are
          equal, the horizontal asymptote is the ratio of their leading coefficients:
          y = 6/2 = 3.'
        difficulty: beginner
        cognitive_level: comprehension
        citation: OpenStax College Algebra 1e, Section 5.6
        concept_slugs:
        - alg-horizontal-asymptotes
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      - id: alg-sim-slant-asymptote
        prompt: Find the slant (oblique) asymptote of the rational function $f(x)
          = \frac{2x^2 + 5x - 3}{x + 1}$.
        interaction_type: single_choice
        response_spec:
          options:
          - y = 2x
          - y = 2x + 3
          - y = 2x + 5
          - y = 2x - 3
        scoring_spec:
          correct_index: 1
        explanation: 'Perform polynomial division (or synthetic division with -1):
          (2x^2 + 5x - 3) / (x + 1). Dividing gives 2x + 3 with a remainder of -6.
          As x approaches infinity, the remainder -6/(x + 1) approaches 0. Therefore,
          the slant asymptote is the linear quotient y = 2x + 3.'
        difficulty: intermediate
        cognitive_level: application
        citation: OpenStax College Algebra 1e, Section 5.6
        concept_slugs:
        - alg-horizontal-asymptotes
        metadata:
          bank: simulation_exam
          item_role: summative_simulation
          is_protected: true
          exposure: timed_exam_only
          domain_code: '3.0'
      questions:
      - id: alg-fmt-horizontal-asymptote-equal-degree
        question_text: What is the horizontal asymptote of the rational function $f(x)
          = \frac{4x - 1}{2x + 5}$?
        options:
        - y = 0
        - y = -\frac{5}{2}
        - y = 2
        - y = 4
        correct_answer: 2
        explanation: 'Because the numerator and denominator have the same degree (degree
          1), the horizontal asymptote is the ratio of their leading coefficients:
          y = 4/2 = 2.'
        concept_slugs:
        - alg-horizontal-asymptotes
        citation: OpenStax College Algebra 1e, CC BY 4.0
      - id: alg-fmt-horizontal-asymptote-lower-degree
        question_text: What is the horizontal asymptote of the rational function $f(x)
          = \frac{7x + 2}{x^2 - 9}$?
        options:
        - y = 7
        - y = 3
        - No horizontal asymptote
        - y = 0
        correct_answer: 3
        explanation: Because the degree of the numerator (1) is strictly less than
          the degree of the denominator (2), the horizontal asymptote is y = 0 (the
          x-axis).
        concept_slugs:
        - alg-horizontal-asymptotes
        citation: OpenStax College Algebra 1e, CC BY 4.0
    flashcards:
    - front: How do you distinguish between a vertical asymptote and a hole in a rational
        function?
      back: A hole occurs where a common factor cancels from both numerator and denominator;
        a vertical asymptote occurs where a denominator factor does not cancel.
      concept_slugs:
      - alg-vertical-asymptotes
    - front: What is the horizontal asymptote rule when degree of numerator equals
        degree of denominator?
      back: The horizontal asymptote is y = (leading coefficient of numerator) / (leading
        coefficient of denominator).
      concept_slugs:
      - alg-horizontal-asymptotes
    - front: When does a rational function have a slant (oblique) asymptote?
      back: When the degree of the numerator is exactly 1 greater than the degree
        of the denominator.
      concept_slugs:
      - alg-horizontal-asymptotes
- code: '4.0'
  title: Number systems and operations
  description: Real number properties, complex numbers and operations, arithmetic
    and geometric sequences/series, and the Binomial Theorem.
