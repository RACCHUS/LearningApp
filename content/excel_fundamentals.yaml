        lessons:
          - title: "Budget Totals in Excel"
            description: "Use the real Excel application to organize eight sample transactions and calculate their total."
            emoji: "📊"
            tags: ["spreadsheet", "excel", "guided-practice", "budget", "software-learning"]
            source_release_id: "microsoft-excel-support-2026-11"
            citation: "Microsoft Support — Basic tasks in Excel; SUM function"
            concept_slugs:
              - "spreadsheet-cell-reference"
              - "spreadsheet-range-summation"
            blocks:
              - sort_order: 1
                block_type: "markdown"
                content:
                  text: "In a spreadsheet, column letters and row numbers identify cells. A formula begins with = and can reference values stored elsewhere. Follow these instructions while working in the real Microsoft Excel application. No simulation or connected account is required."
              - sort_order: 2
                block_type: "markdown"
                content:
                  text: |
                    Open a new workbook in Excel, rename the worksheet **Budget** and type in these eight sample transactions, starting in cell A1. The data is made up, so don't use real business records.

                    | Date | Category | Amount |
                    |---|---|---|
                    | 2026-01-05 | Office supplies | 20 |
                    | 2026-01-06 | Printing | 30 |
                    | 2026-01-07 | Travel | 40 |
                    | 2026-01-08 | Software | 50 |
                    | 2026-01-09 | Shipping | 60 |
                    | 2026-01-10 | Utilities | 70 |
                    | 2026-01-11 | Equipment | 80 |
                    | 2026-01-12 | Maintenance | 90 |

                    The headings go in row 1, so the eight amounts are in C2 through C9. In C10, write a formula that totals them. Keep the amounts as typed numbers, and save the workbook in .xlsx format.
              - sort_order: 3
                block_type: "callout"
                content:
                  type: "info"
                  title: "Accessibility and privacy"
                  body: "Use the text instructions or the app's reading assistance. The practice data is synthetic; do not substitute real business records. Independent workbook uploading and verified grading remain disabled until the safe ingestion worker and evidence gates are implemented."
              - sort_order: 4
                block_type: "practice_prompt"
                metadata:
                  practice_type: "excel_workbook_upload"
                content:
                  prompt: "Open the real Excel application and calculate the total of the eight numeric transaction cells without replacing the formula with a typed number. How would you check that your formula covers every row exactly once?"
                  exercise_id: "excel-budget-total-v1"
                  answer: "In C10, enter =SUM(C2:C9). The total is 440. To check the range, click C10: Excel outlines the cells the formula uses, and the outline should start at the first amount (C2) and end at the last (C9). Then change one amount, for example C2 from 20 to 25: the total should become 445. Change it back afterwards."
              - sort_order: 5
                block_type: "simulation"
                content:
                  simulation_id: "excel-budget-total-v1"
                  simulation_version: "1.0.0"
                  title: "Interactive Practice: Budget Workbook"
                  body: "Use the real Excel application to complete the Budget worksheet total. The optional preview demonstrates sample rubric checks only; learner file uploads and verified skill awards remain disabled."
            terms:
              - term: "Workbook"
                definition: "A file that contains one or more spreadsheet worksheets."
                example: "An .xlsx file can contain a Budget worksheet."
              - term: "Cell reference"
                definition: "A column-and-row address used to refer to a particular spreadsheet cell."
                example: "C2 refers to a cell in the third column and second row."
              - term: "Range"
                definition: "A group of worksheet cells designated by their addresses."
                example: "C2:C9 identifies eight cells in column C."
            concepts:
              - concept_text: "Formulas refer to cells instead of repeating typed values, so calculations can update when the underlying numbers change."
                example_text: "A business budget total can reference the eight transaction rows instead of manually typing the total."
                key_points:
                  - "Cell references work across many spreadsheet applications."
                  - "A range identifies which rows a calculation should include."
                  - "A verified result needs both the correct data and the correct formula."
            questions:
              - id: "excel-cell-address-meaning"
                question_text: "What does the spreadsheet address C2 identify?"
                options:
                  - "Column C, row 2"
                  - "Row C, column 2"
                  - "The second worksheet"
                  - "A formula with two inputs"
                correct_answer: 0
                type: "mcq"
                explanation: "The letter represents the column and the number represents the row."
                concept_slugs: ["spreadsheet-cell-reference"]
                citation: "Microsoft Support — Basic tasks in Excel"
              - id: "excel-formula-vs-typed-total"
                question_text: "Why is a formula that references transaction cells preferable to typing a fixed total?"
                options:
                  - "It changes the data automatically without permission"
                  - "It recalculates from the referenced values when they change"
                  - "It prevents anyone from editing the worksheet"
                  - "It converts the workbook into a different file type"
                correct_answer: 1
                type: "mcq"
                explanation: "A formula recomputes from its cell references; a typed total is not connected to its inputs."
                concept_slugs: ["spreadsheet-range-summation"]
                citation: "Microsoft Support — SUM function"
              - id: "excel-sum-formula-for-range"
                question_text: "Which formula adds every value from C2 through C9?"
                options:
                  - "=SUM(C2,C9)"
                  - "=C2:C9"
                  - "=SUM(C2:C9)"
                  - "=SUM(C2-C9)"
                correct_answer: 2
                type: "mcq"
                explanation: "A colon makes a range, so C2:C9 means every cell from C2 to C9. A comma lists separate cells, so =SUM(C2,C9) adds only two of them."
                concept_slugs: ["spreadsheet-range-summation"]
                citation: "Microsoft Support — SUM function"
              - id: "excel-range-cell-count"
                question_text: "How many cells does the range C2:C9 contain?"
                options:
                  - "2"
                  - "7"
                  - "9"
                  - "8"
                correct_answer: 3
                type: "mcq"
                explanation: "Rows 2 through 9 are eight rows in a single column: 9 - 2 + 1 = 8."
                concept_slugs: ["spreadsheet-cell-reference", "spreadsheet-range-summation"]
                citation: "Microsoft Support — Basic tasks in Excel"
              - id: "excel-range-missing-last-row"
                question_text: "The amounts are in C2 through C9, but C10 contains =SUM(C2:C8). What is wrong?"
                options:
                  - "The total leaves out the amount in C9"
                  - "The total counts C2 twice"
                  - "SUM cannot be used in column C"
                  - "The formula should start with SUM, not ="
                correct_answer: 0
                type: "mcq"
                explanation: "The range stops at C8, so the last transaction is not included. A range must start at the first value and end at the last."
                concept_slugs: ["spreadsheet-range-summation"]
                citation: "Microsoft Support — SUM function"
              - id: "excel-typed-total-goes-stale"
                question_text: "Someone types 440 into C10 instead of a formula. What happens when C4 changes from 40 to 45?"
                options:
                  - "C10 updates to 445"
                  - "C10 still shows 440, which is now wrong"
                  - "Excel shows an error in C10"
                  - "C4 changes back to 40"
                correct_answer: 1
                type: "mcq"
                explanation: "A typed number is not connected to the cells above it, so it does not update. A formula such as =SUM(C2:C9) would show 445."
                concept_slugs: ["spreadsheet-range-summation"]
                citation: "Microsoft Support — SUM function"
