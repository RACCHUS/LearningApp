selection_note: 'Pilot P1, re-pointed 2026-11-26. The first pilot (Modern States) could not be mapped because its site refuses automated reading. This book is free without sign-in, aligned closely enough that an independently reviewed objective mapping already exists (data/concept_mappings/), and needs no account, so it can be the best free route. LearningApp also imports some of its sections as lessons; the catalog entry is the whole book read on its own site, and both appear side by side.'
