  plan v1.2 §8.1; D-13 reconciliation). match: exact, partial, prerequisite, supplementary or unrelated; depth compares
  the source section with the objective. Concepts are never merged on title alone: CLEP keeps its own concepts,
  and this file records where each objective''s content lives in the open textbook. Check: python tool/verify_concept_mappings.py'
