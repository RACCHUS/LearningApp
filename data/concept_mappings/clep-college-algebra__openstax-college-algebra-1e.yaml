  imported_manifest: open_openstax_college_algebra_1e.yaml
method: Section titles from the pinned archive's table of contents; topic coverage checked by term counts in each
  section's text (for example 'symmetr' in 3.3 vs 3.5), then read. The CLEP manifest's citations were corrected
  to match (2026-11-25).
